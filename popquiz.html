<link rel="stylesheet" href="ui.css">
<style>
/* Pop Quiz look: one classroom. A chalkboard on top, a wooden floor with a rug, classmates seated in a circle, and the
   pencil in the middle. The board, floor and characters keep their own colors in every theme (they are objects, not
   surfaces); cards, buttons and text follow the site theme. --chalk is the handwriting used on the board and in bubbles. */
:root{--chalk:"Patrick Hand","Comic Sans MS","Segoe Print",cursive}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px;min-height:36px;margin:0 0 10px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--mute);font-size:14px;font-weight:600;padding:6px 10px 6px 6px;border-radius:10px}
.back:hover{color:var(--text);background:var(--raised)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:9px 16px;font-weight:600;font-size:14.5px;border:1px solid var(--line2);background:var(--surface);text-decoration:none;transition:background .15s}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.wide{width:100%}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.card{margin:0 0 14px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font:700 15px/1.2 var(--sans)}
.card p{margin:0 0 12px;color:var(--mute);font-size:14px}
.card p:last-child{margin-bottom:0}
.card ol{margin:0;padding-left:20px;color:var(--mute);font-size:14px}.card ol li{margin:0 0 4px}
.err{margin:8px 0 0;color:var(--bad,#c0392b);font-size:13.5px}
.empty{color:var(--faint);font-size:14px;text-align:center;padding:6px 0;margin:0}
.join{display:flex;gap:8px}
.join input{flex:1;min-width:0;padding:9px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--bg);font-size:16px;font-weight:700;letter-spacing:4px;text-transform:uppercase;text-align:center}
.join input::placeholder{letter-spacing:0;font-weight:500;text-transform:none;color:var(--faint)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);text-align:left;width:100%}
.row:hover{border-color:var(--accent-line)}
.row .w{flex:1;min-width:0}.row b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .w>span{display:block;font-size:12.5px;color:var(--mute)}
.pill{flex:none;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.opt{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:14px;font-weight:600}
.opt>span:first-child{flex:1}
.opt select{padding:7px 10px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);font-size:14px;max-width:60%}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:6px 13px;font-weight:700;font-size:13.5px}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.sw{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.sw:checked{background:var(--accent)}.sw:checked::after{transform:translateX(18px)}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 0}

/* ---- chalkboard ---- */
.board{position:relative;margin:0 0 20px;padding:16px 16px 18px;border-radius:10px;color:#f4f1e6;border:7px solid #8a6238;text-align:center;min-height:132px;display:flex;flex-direction:column;justify-content:center;gap:6px;
 background:radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.07),transparent 60%),linear-gradient(175deg,rgba(255,255,255,.035) 0 30%,transparent 30% 62%,rgba(255,255,255,.03) 62%),#234d3c;
 box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),inset 0 0 46px rgba(0,0,0,.3),0 2px 0 #6c4a26,0 10px 18px -10px rgba(0,0,0,.45);font-family:var(--chalk)}
/* the chalk tray, with two sticks of chalk and the eraser */
.board::after{content:"";position:absolute;left:10px;right:10px;bottom:-15px;height:9px;border-radius:2px 2px 5px 5px;
 background:linear-gradient(#fff,#fff) 14% 0/26px 4px no-repeat,linear-gradient(#f6b9c6,#f6b9c6) 24% 0/18px 4px no-repeat,linear-gradient(#5b4a3a 0 45%,#d8cdbb 45%) 84% 0/34px 7px no-repeat,linear-gradient(#a37645,#7d5730)}
.board h1{font:400 44px/1 var(--chalk);margin:0;letter-spacing:.5px;text-shadow:0 0 1px rgba(255,255,255,.5)}
.board .q{font:400 27px/1.12 var(--chalk);margin:0;text-wrap:balance;text-shadow:0 0 1px rgba(255,255,255,.45)}
.board .n{font-size:17px;line-height:1.2;color:#c3dccd}
.board .said{display:flex;flex-wrap:wrap;gap:2px 12px;justify-content:center;font-size:18px;line-height:1.2;color:#dfe9dd}
.board .said span{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.55);text-decoration-thickness:1.5px}
.board .big{font:400 32px/1.1 var(--chalk);margin:0}
.board .code{font:400 58px/1 var(--chalk);letter-spacing:12px;padding-left:12px;margin:0}
.board .cbtn{align-self:center;margin-top:4px;font:400 17px/1 var(--chalk);color:#f4f1e6;background:none;border:1.5px dashed rgba(244,241,230,.6);border-radius:9px;padding:6px 14px}
.board .cbtn:hover{background:rgba(255,255,255,.08)}
.board .mini{position:absolute;right:8px;bottom:-4px;width:38px;height:55px;transform:rotate(9deg);pointer-events:none}

/* ---- answer box ---- */
.dock{display:flex;gap:8px;margin:0 0 6px}
.dock input{flex:1;min-width:0;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);font-size:16px}
.dock.mine input{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-line)}
.dock input.shake{animation:shake .3s 1;border-color:var(--bad,#c0392b)}
.hint{margin:0 0 10px;text-align:center;color:var(--mute);font-size:13.5px;min-height:20px}
.hint.mine{color:var(--accent);font-weight:700}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---- the classroom floor ---- */
.room{--fl:#e0c294;--fl2:#d6b584;--gap:rgba(96,62,22,.2);--rug:#2f6a55;--rug2:#efe2bf;--rug3:#c9553c;position:relative;max-width:430px;margin:0 auto 16px;aspect-ratio:1/1.04;border-radius:26px;
 background:radial-gradient(circle closest-side at 50% var(--cy,49%),var(--rug3) 0 5%,var(--rug2) 5.5% 9%,var(--rug) 9.5% 37%,var(--rug2) 37.5% 41%,var(--rug) 41.5% 47%,transparent 48%),
  repeating-linear-gradient(90deg,transparent 0 47px,var(--gap) 47px 48px),repeating-linear-gradient(0deg,var(--fl) 0 64px,var(--fl2) 64px 128px);
 box-shadow:inset 0 0 0 5px rgba(96,62,22,.22),inset 0 0 70px rgba(70,40,10,.25)}
:root[data-theme="dark"] .room{--fl:#54402c;--fl2:#4a3826;--gap:rgba(0,0,0,.3);--rug:#1f4c3d;--rug2:#a3987a;--rug3:#8c3b2a}
/* a classmate: head (their picture), shoulders, a desk in front, name and lives under it */
.stu{position:absolute;width:88px;margin:-56px 0 0 -44px;display:flex;flex-direction:column;align-items:center;transform:scale(var(--sc,1));transform-origin:44px 56px;transition:left .5s var(--ease),top .5s var(--ease)}
.stu .in{display:flex;flex-direction:column;align-items:center}
/* the pixel classmate: 18 x 21 pixels shown at 4 px each. Two idle frames (the head drops one pixel) and a blink */
.fig{position:relative;width:72px;height:84px}
.spr{display:block;width:72px;height:84px;overflow:visible;filter:drop-shadow(0 3px 0 rgba(60,35,10,.22))}
.spr .up{animation:idle 1.1s steps(1) infinite;animation-delay:var(--d,0s)}
.spr .e0{transform-box:fill-box;transform-origin:50% 100%;animation:blink 3.7s steps(1) infinite;animation-delay:var(--d,0s)}
.spr .e1,.spr .m1,.spr .sw{display:none}
.stu.hot .m0,.stu.ouch .m0,.stu.ouch .e0,.stu.out .e0{display:none}
.stu.hot .m1,.stu.ouch .m1,.stu.hot .sw,.stu.ouch .e1,.stu.out .e1{display:block}
.stu.turn .up{animation-duration:.5s}
.stu.hot .up{animation-duration:.22s}
.stu.hot .sw{animation:drip .6s steps(3) infinite}
.stu.out .up{animation:none;transform:translateY(4px)}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}
@keyframes blink{0%,100%{transform:scaleY(1)}94%{transform:scaleY(.5)}}
.board.home{padding-left:50px;padding-right:50px}
.stu .nm{display:flex;align-items:center;gap:4px;max-width:96px;margin-top:2px;padding:1px 8px 1px 2px;border-radius:99px;background:rgba(255,253,246,.92);color:#33312e;font:700 11.5px/1.5 var(--sans);white-space:nowrap}
.stu .nm>:first-child{flex:none}
.stu .nm i{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.stu.me .nm{background:var(--accent);color:var(--accent-ink)}
.stu .hp{height:13px;font-size:11px;line-height:13px;letter-spacing:1.5px;color:#d8402c;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.stu .hp i{font-style:normal;color:rgba(60,35,10,.28);text-shadow:none}
.stu::before{content:"";position:absolute;left:50%;top:52px;width:104px;height:46px;margin-left:-52px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,246,196,.95),rgba(255,246,196,0));opacity:0;transition:opacity .3s;z-index:-1}
.stu.turn::before{opacity:1}
.stu.out{filter:grayscale(.85)}
.stu.out .in{opacity:.72}
.stu.ouch .fig{animation:jump .42s ease-out 2}
.stu.win .fig{animation:cheer .5s steps(2) infinite}
@keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.stu.win .fig::before{content:"\2605";position:absolute;left:50%;top:-30px;margin-left:-15px;width:30px;font-size:30px;line-height:1;color:#f6c443;text-shadow:0 2px 0 #b9831c;animation:star 1s ease-in-out infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(4px);opacity:0}}
@keyframes jump{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-13px) rotate(-7deg)}70%{transform:translateY(0) rotate(5deg)}}
@keyframes star{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-5px) rotate(8deg)}}
/* speech bubble: live typing, then the answer */
.bub{position:absolute;left:50%;bottom:calc(100% - 3px);transform:translateX(-50%);max-width:150px;padding:3px 10px 4px;border-radius:13px;background:#fffdf4;color:#33312e;font:400 17px/1.15 var(--chalk);white-space:nowrap;box-shadow:0 2px 0 rgba(60,35,10,.28);z-index:3}
.bub span{display:block;overflow:hidden;text-overflow:ellipsis}
.bub::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#fffdf4;border-bottom:0}
.bub:empty{display:none}
.bub.ok{background:#dff3e4;color:#17603c}.bub.ok::after{border-top-color:#dff3e4}
.bub.ok{animation:said 2.8s forwards}
@keyframes said{0%,78%{opacity:1}100%{opacity:0}}
.room.many{aspect-ratio:1/1.26}
.bub.no{background:#fde2dc;color:#a52a14}.bub.no::after{border-top-color:#fde2dc}
.stu.L .bub{left:4px;transform:none}.stu.L .bub::after{left:34px}
.stu.R .bub{left:auto;right:4px;transform:none}.stu.R .bub::after{left:auto;right:28px}

/* ---- the pencil ---- */
.pen{--pb:#f6c443;position:absolute;left:50%;top:47%;width:calc(52px*var(--sc,1));height:calc(75px*var(--sc,1));margin:calc(-50px*var(--sc,1)) 0 0 calc(-26px*var(--sc,1));z-index:200;pointer-events:none;transition:left .5s cubic-bezier(.45,1.5,.5,1),top .5s cubic-bezier(.45,1.5,.5,1)}
.pen svg{position:relative;display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 92%;filter:drop-shadow(0 3px 0 rgba(60,35,10,.25))}
.pen .bd{fill:var(--pb);transition:fill .7s}
.pen .f,.pen .st,.pen .zz,.pen .a,.pen .mk{display:none}
.pen[data-m="0"] .f0,.pen[data-m="1"] .f1,.pen[data-m="2"] .f2,.pen[data-m="3"] .f3,.pen[data-m="z"] .fz,.pen[data-m="3"] .st,.pen[data-m="z"] .zz,
.pen[data-m="0"] .a0,.pen[data-m="z"] .a0,.pen[data-m="1"] .a1,.pen[data-m="2"] .a1,.pen[data-m="3"] .a3,.pen[data-m="2"] .mk,.pen[data-m="3"] .mk{display:block}
.pen[data-m="1"]{--pb:#f6b03a}.pen[data-m="2"]{--pb:#f0812f}.pen[data-m="3"]{--pb:#e2412b}
.pen[data-m="0"] svg{animation:bob 1.7s ease-in-out infinite}
.pen[data-m="1"] svg{animation:tap .7s ease-in-out infinite}
.pen[data-m="2"] svg{animation:stomp .34s ease-in-out infinite}
.pen[data-m="3"] svg{animation:rage .1s linear infinite}
.pen[data-m="z"] svg{transform:translateY(16px) rotate(78deg);animation:none}
.pen .st{animation:steam .6s steps(3) infinite}.pen .st.b{animation-delay:.3s}
.pen .zz{animation:zz 2.4s steps(2) infinite}
.pen .a3{animation:fists .2s steps(1) infinite}
.pen .mk{animation:mark .5s steps(1) infinite}
/* the heat under an angry pencil */
.pen::before{content:"";position:absolute;left:-45%;right:-45%;top:20%;bottom:-25%;border-radius:50%;opacity:0;background:radial-gradient(closest-side,rgba(240,129,47,.6),rgba(240,129,47,0))}
.pen[data-m="2"]::before{animation:heat .7s ease-in-out infinite}
.pen[data-m="3"]::before{background:radial-gradient(closest-side,rgba(226,45,30,.75),rgba(226,45,30,0));animation:heat .4s ease-in-out infinite}
@keyframes heat{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
@keyframes fists{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes mark{0%,100%{opacity:1}50%{opacity:.35}}
.pen.hop svg{animation:hop .5s ease-out 1}
.pen.poke svg{transform-origin:50% 55%;animation:jab .3s ease-in 4}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(3deg)}}
@keyframes tap{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-2px)}}
@keyframes stomp{0%,100%{transform:translateY(0) scale(1.2,1.06)}50%{transform:translateY(-9px) scale(1.08,1.2)}}
@keyframes rage{0%{transform:translate(-3px,0) rotate(-6deg) scale(1.34)}50%{transform:translate(3px,-2px) rotate(6deg) scale(1.34)}100%{transform:translate(-3px,0) rotate(-6deg) scale(1.34)}}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-20px) rotate(10deg)}}
@keyframes jab{0%,100%{transform:rotate(var(--rot,0deg)) translateY(0) scale(1.25)}50%{transform:rotate(var(--rot,0deg)) translateY(26px) scale(1.25)}}
@keyframes steam{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-3px);opacity:0}}
@keyframes zz{0%,100%{opacity:.3;transform:translate(0,0)}50%{opacity:1;transform:translate(1px,-1px)}}

/* ---- almost out of time: a red edge that pulses, faster at the end; a soft white blink when a life is lost ---- */
.vig{position:fixed;inset:0;pointer-events:none;z-index:250;opacity:0;background:radial-gradient(ellipse at center,rgba(214,40,24,0) 55%,rgba(214,40,24,.5) 100%);box-shadow:inset 0 0 110px 26px rgba(214,40,24,.55)}
body.d1 .vig{animation:vig1 1s ease-in-out infinite}
body.d2 .vig{animation:vig2 .44s ease-in-out infinite}
body:not(.myturn) .vig{filter:opacity(.5)}
@keyframes vig1{0%,100%{opacity:.06}50%{opacity:.42}}
@keyframes vig2{0%,100%{opacity:.35}50%{opacity:1}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:251;background:#fff;opacity:0}
.flash.on{animation:flash .55s ease-out 1}
@keyframes flash{0%{opacity:0}14%{opacity:.32}100%{opacity:0}}
:root[data-theme="dark"] .flash.on{animation-name:flashd}
@keyframes flashd{0%{opacity:0}14%{opacity:.24}100%{opacity:0}}
.room.thud{animation:thud .3s linear 1}
@keyframes thud{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}}

/* ---- a laptop or a desktop: the classroom fills the window, the board and the answer box sit beside it ---- */
@media (min-width:900px) and (min-height:520px){
 main{max-width:900px}
 main:not(.in) #view{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
 main:not(.in) #view>*{margin:0}
 main:not(.in) #view>:only-child,main:not(.in) #view>:nth-child(3){grid-column:1/-1}
 main.in{max-width:none;height:100vh;height:100dvh;display:grid;grid-template-columns:clamp(340px,31vw,470px) minmax(0,1fr);gap:18px;padding:14px 16px}

}

<script>
// Pop Quiz (Nov 14): a live turn game for 1 to 10 classmates. The board shows a "name one" prompt with many right answers
// (site/popquiz/prompts.json); the pencil sits on one desk at a time; that player types an answer nobody has said yet and
// the pencil hops on. When its hidden fuse runs out it pokes whoever has it: one life gone. Last one with a life wins.
// Nothing is stored in the cloud: rooms live only in Realtime broadcast (live.js). The host's page runs the clock and
// checks the answers; it sends the whole room state on every change and every 2 s, and another player takes over when
// the host goes quiet. With ?local=1 on localhost the messages go through BroadcastChannel (tests, no network).
const Q=new URLSearchParams(location.search);
const LOCALNET=Q.get('local')==='1'&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const HB=3000,KEEP=2000,MAXP=10,LOBBY='popquiz:lobby';
// fuse: 15 to 26 s, hidden; a pass always leaves the next desk at least 8 s; 2.8 s to look at a poke; a host silent for 6 s is replaced
let HOST_LOST=6000,FUSE_MIN=15000,FUSE_MAX=26000,PASS_MIN=8000,PAUSE=2800;
if(LOCALNET&&+Q.get('fuse')){FUSE_MIN=FUSE_MAX=+Q.get('fuse');PASS_MIN=Math.min(PASS_MIN,FUSE_MIN);PAUSE=700;HOST_LOST=3500}   // tests only
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>Date.now();
function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms||2200)}
const rid=n=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<n;i++)s+=a[Math.random()*a.length|0];return s};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

let CLOUD=null,DATA={courses:{}},ME=null,room='',S=null,isHost=false;
let lastState=0,deadline=0,joinAt=0,lastHb=0,lastPush=0,lastBeacon=0,resumeAt=0,deck=[],typing={},seen={},left=new Set(),rooms={},shown=0,sig='',lastType=0,wasTurn=false;
const T=()=>'popquiz:'+room;

// ---- messages: Realtime broadcast, or BroadcastChannel in local tests ----
const Net={ch:{},
 open(topic,on,onOpen){if(LOCALNET){if(this.ch[topic])return;const bc=new BroadcastChannel(topic);bc.onmessage=e=>on(e.data||{});this.ch[topic]=bc;if(onOpen)setTimeout(onOpen,0)}else if(window.Live&&CLOUD)Live.listen(CLOUD,topic,on,onOpen)},
 send(topic,d){if(LOCALNET){const bc=this.ch[topic];if(bc)bc.postMessage(d)}else if(window.Live&&CLOUD)Live.ping(topic,d)}};

// ---- answers ----
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/β/g,'beta').replace(/α/g,'alpha').replace(/[^a-z0-9]/g,'');
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=[];for(let j=0;j<=n;j++)p[j]=j;
 for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
// index of the answer a typed text means, or -1. Exact spelling first; then one slip (6+ letters) or two (10+), if only one answer is that close
function match(p,text){const t=norm(text);if(!t)return -1;
 for(let i=0;i<p.a.length;i++)if(p.a[i].some(x=>norm(x)===t))return i;
 const tol=t.length>=10?2:t.length>=6?1:0;if(!tol)return -1;
 let best=9,at=-1,tie=false;
 p.a.forEach((al,i)=>{const d=Math.min(...al.map(x=>{const k=norm(x);return k.length>=6?lev(t,k):9}));if(d<best){best=d;at=i;tie=false}else if(d===best&&d<9)tie=true});
 return best<=tol&&!tie?at:-1}
const prompt=id=>{for(const c in DATA.courses){const p=DATA.courses[c].prompts.find(x=>x.id===id);if(p)return p}return null};
const courseIds=()=>Object.keys(DATA.courses);

// ---- people ----
function clean(p){if(!p||typeof p!=='object')return null;const id=String(p.id||'');if(!/^[A-Z]{10}$/.test(id))return null;
 const av=/^x:[a-z0-9]{1,12}:[0-7]$/.test(p.av||'')?p.av:'g',url=/^https:\/\//.test(p.url||'')?String(p.url).slice(0,300):'';
 return {id,name:String(p.name||'Classmate').slice(0,24),av,url}}
const player=id=>S?S.players.find(p=>p.id===id):null;
const first=n=>String(n||'').split(' ')[0]||'Someone';
const alive=()=>S.players.filter(p=>p.lives>0);
function nextAlive(id){const n=S.players.length,i=Math.max(0,S.players.findIndex(p=>p.id===id));for(let k=1;k<=n;k++){const q=S.players[(i+k)%n];if(q.lives>0)return q.id}return ''}

// ---- host: owns the clock and the rules ----
const fuse=()=>FUSE_MIN+Math.random()*(FUSE_MAX-FUSE_MIN);
function push(keep){if(!keep)S.seq++;S.left=Math.max(0,deadline-now());lastPush=now();Net.send(T(),{t:'state',s:S});draw()}
function newPrompt(){const c=DATA.courses[S.opts.course]||DATA.courses[courseIds()[0]];if(!deck.length)deck=shuffle(c.prompts.map(p=>p.id).filter(id=>id!==S.pid));S.pid=deck.pop();S.used=[]}
function stamp(o){o.at=S.seq+1;S.last=o}
function hostSeen(p){p=clean(p);if(!p||!S)return;seen[p.id]=now();
 if(!player(p.id)&&S.phase==='lobby'&&S.players.length<MAXP){S.players.push(Object.assign(p,{lives:0,n:0}));push()}}
function hostStart(){if(S.phase!=='lobby'||!S.players.length)return;
 S.players.forEach(p=>{p.lives=S.opts.lives;p.n=0;p.gone=0;seen[p.id]=now()});
 S.n0=S.players.length;S.phase='play';S.winner='';S.last=null;deck=[];S.pid='';newPrompt();
 S.turn=S.players[Math.random()*S.players.length|0].id;deadline=now()+fuse();push()}
function hostAnswer(id,x){if(!S||S.phase!=='play'||!S.turn||id!==S.turn)return;const p=prompt(S.pid),pl=player(id);if(!p||!pl)return;
 const i=match(p,x),text=String(x).slice(0,40);
 if(i<0)stamp({k:'bad',id,x:text});
 else if(S.used.includes(i))stamp({k:'dup',id,x:p.a[i][0]});
 else{S.used.push(i);pl.n=(pl.n||0)+1;stamp({k:'ok',id,x:p.a[i][0]});S.turn=nextAlive(id);deadline=Math.max(deadline,now()+PASS_MIN);
  if(S.used.length>=p.a.length){S.last.full=1;newPrompt()}}
 push()}
function over(){const a=alive();if(a.length<=(S.n0>1?1:0)){S.phase='over';S.turn='';S.winner=a[0]?a[0].id:'';return true}return false}
function hostPoke(){const pl=player(S.turn),p=prompt(S.pid);if(!pl)return;pl.lives=Math.max(0,pl.lives-1);
 const miss=p?shuffle(p.a.map((a,i)=>i).filter(i=>!S.used.includes(i))).slice(0,3).map(i=>p.a[i][0]):[];
 stamp({k:'poke',id:pl.id,miss});S.turn='';if(!over())resumeAt=now()+PAUSE;push()}
function hostResume(){const from=S.last&&S.last.k==='poke'?S.last.id:(S.players[0]||{}).id;newPrompt();S.turn=nextAlive(from);deadline=now()+fuse();push()}
function hostGone(id){const p=player(id);if(!p||id===ME.id)return;
 if(S.phase==='play'){if(!p.lives)return;p.lives=0;p.gone=1;if(!over()&&S.turn===id){S.turn=nextAlive(id);deadline=Math.max(deadline,now()+PASS_MIN)}}
 else S.players=S.players.filter(q=>q.id!==id);
 push()}
function hostAgain(){if(S.phase!=='over')return;S.phase='lobby';S.turn='';S.pid='';S.used=[];S.last=null;S.winner='';
 S.players=S.players.filter(p=>!p.gone);S.players.forEach(p=>{p.lives=0;seen[p.id]=now()});push()}
function hostTick(){const t=now();
 S.players.slice().forEach(p=>{if(p.id===ME.id)return;const age=t-(seen[p.id]||0);
  if(S.phase==='lobby'&&age>10000)hostGone(p.id);else if(S.phase==='play'&&p.lives>0&&age>20000)hostGone(p.id)});
 if(S.phase==='play'){if(S.turn&&t>=deadline)hostPoke();else if(!S.turn&&t>=resumeAt)hostResume()}
 if(t-lastPush>=KEEP)push(true);
 if(S.phase==='lobby'&&S.opts.open&&t-lastBeacon>=HB){lastBeacon=t;Net.send(LOBBY,{t:'room',code:room,host:ME.name,n:S.players.length})}}
// the host went quiet: the remaining players take over in id order, each waiting a little longer than the one before
function claim(){isHost=true;const old=S.host;S.host=ME.id;S.seq+=1000;deck=[];
 S.players.forEach(p=>seen[p.id]=now());
 if(S.phase==='play'){if(S.turn)deadline=Math.max(deadline,now()+PASS_MIN);else resumeAt=now()+800}
 if(left.has(old))hostGone(old);else if(S.phase==='lobby')seen[old]=now()-4000;
 left.forEach(id=>hostGone(id));left.clear();push()}

// ---- everyone ----
function onState(s){if(!s||typeof s!=='object'||s.v!==1||!Array.isArray(s.players))return;
 if(isHost){if(s.host===ME.id)return;if(s.seq>S.seq||(s.seq===S.seq&&s.host<ME.id))isHost=false;else{push(true);return}}
 else if(S&&(s.seq<S.seq||(s.seq===S.seq&&s.host!==S.host&&s.host>S.host)))return;
 const moved=!S||S.turn!==s.turn||S.pid!==s.pid;S=s;lastState=now();
 const d=now()+(+s.left||0);if(moved||Math.abs(d-deadline)>600)deadline=d;if(moved)typing={};draw()}
function onMsg(m){if(!m||typeof m!=='object')return;
 if(m.t==='state')onState(m.s);
 else if(m.t==='hb'){if(isHost)hostSeen(m.p)}
 else if(m.t==='ans'){if(isHost)hostAnswer(String(m.id||''),String(m.x||''))}
 else if(m.t==='type'){if(S&&m.id===S.turn){typing={id:m.id,x:String(m.x||'').slice(0,40)};drawSay()}}
 else if(m.t==='leave'){const id=String(m.id||'');if(isHost)hostGone(id);else{left.add(id);if(S&&id===S.host)lastState=Math.min(lastState,now()-HOST_LOST)}}}
function hello(){lastHb=now();Net.send(T(),{t:'hb',p:ME})}
function tick(){if(!room)return;const t=now();
 if(isHost)hostTick();
 else{if(t-lastHb>=HB)hello();
  if(S){const late=t-lastState,order=S.players.filter(p=>p.id!==S.host&&!p.gone).map(p=>p.id).sort(),r=order.indexOf(ME.id);
   if(r>=0&&late>HOST_LOST+r*2000)claim();else if(r<0&&late>15000&&S.phase!=='closed'){S.phase='closed';draw()}}
  else if(t-joinAt>4000&&shown!==-1){shown=-1;draw()}}
 drawFuse()}
function enter(code,host){room=code;joinAt=now();
 try{history.replaceState(null,'','popquiz.html?r='+code+(LOCALNET?'&local=1&name='+encodeURIComponent(ME.name):''))}catch(e){}
 Net.open(T(),onMsg,()=>{if(!isHost)hello();else if(S)push(true)});
 if(host){isHost=true;seen[ME.id]=now();
  S={v:1,seq:0,host:ME.id,phase:'lobby',opts:{lives:3,course:courseIds()[0]||'',open:true},players:[Object.assign({},ME,{lives:0,n:0})],turn:'',pid:'',used:[],left:0,last:null,winner:'',n0:0};push()}
 else{hello();draw()}}
function answer(x){x=String(x||'').trim();if(!x||!S||S.turn!==ME.id)return;typing={};
 if(isHost)hostAnswer(ME.id,x);else Net.send(T(),{t:'ans',id:ME.id,x})}

// ---- drawing ----
// The art is pixel art kept as text: each sprite is rows of letters, one letter per pixel, and px() turns the rows into
// SVG rectangles. To change a drawing, edit its rows; to use real sprite sheets later, replace student() and PEN.
const INK='#33312e',OUT='#3a2a22',SHIRTS=['#6f9fd8','#e58f7f','#7fbf8d','#c39be0','#e3b84f','#6cc3c0','#e391bb','#98a6e6','#d39a6a','#93c96c'];
function px(rows,pal,y0){let o='';rows.forEach((r,y)=>{for(let x=0;x<r.length;){const c=r[x];let n=1;while(r[x+n]===c)n++;if(pal[c])o+='<rect x="'+x+'" y="'+(y+(y0||0))+'" width="'+n+'" height="1" fill="'+pal[c]+'"/>';x+=n}});return o}
const bit=(x,y,w,h,f)=>'<rect x="'+x+'" y="'+y+'" width="'+(w||1)+'" height="'+(h||1)+'" fill="'+f+'"/>';
// a classmate at a desk, 18 x 21: head (S skin, s shade, B blush), then one of five haircuts on top (H hair, h its edge)
const HEAD=['..................','.....OOOOOOOO.....','....OSSSSSSSSO....','...OSSSSSSSSSSO...','...OSSSSSSSSSSO...','...OSSSSSSSSSSO...','...OSSSSSSSSSSO...','...OSSSSSSSSSSO...','...OSBSSSSSSBSO...','...OsSSSSSSSSsO...','....OssssssssO....','.....OOOOOOOO.....'];
const HAIR=[
 ['..................','.....hhhhhhhh.....','....hHHHHHHHHh....','...hHHHHHHHHHHh...','...hHHHHHHHHHHh...','...hHHHH....HHh...','...hH........Hh...'],
 ['..................','.....hhhhhhhh.....','....hHHHHHHHHh....','...hHHHHHHHHHHh...','..hHHHHHHHHHHHHh..','..hHHHHHHHHHHHHh..','..hHH........HHh..','..hHH........HHh..','..hHH........HHh..','..hHH........HHh..','..hHH........HHh..','..hHH........HHh..','..hHh........hHh..','...h..........h...'],
 ['..................','.....hhhhhhhh.....','....hHHHHHHHHh....','...hHHHHHHHHHHh...','..hHHHHHHHHHHHHh..','..hHHHHH..HHHHHh..','..hHH........HHh..','..hHH........HHh..','..hHH........HHh..','..hHH........HHh..','...hh........hh...'],
 ['.....H..HH..H.....','....hHHHHHHHHh....','...hHHHHHHHHHHh...','...hHHHHHHHHHHh...','...hHHHHHHHHHHh...','...hH.H.HH.H.Hh...'],
 ['.......hHHh.......','.....hhHHHHhh.....','....hHHHHHHHHh....','...hHHHHHHHHHHh...','...hHHHHHHHHHHh...','...hHHH....HHHh...','...hH........Hh...','...h..........h...']];
const HAIRC=['#2b2320','#3d2a1e','#1f1f2b','#5a3a22','#2b2320','#7a4a2a'],SKIN=[['#f3c9a0','#dba77c'],['#e8b48a','#cc9468'],['#d79f73','#b98256'],['#c68a5e','#a87045']];
const BODYPX=['....OCCCWWCCCO....','...OCCCCCCCCCCO...','...OCCCCCCCCCCO...'];
const DESKPX=['.OOOOOOOOOOOOOOOO.','OTTSSTTPPPPTTSSTTO','OTTTTTTPllPTTTTTTO','OttttttttttttttttO','.OOOOOOOOOOOOOOOO.','..OL..........LO..'];
const hash=s=>{let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h};
// how a classmate looks comes from their id, so everyone in the room sees the same character
function student(id,shirt){const h=hash(id),sk=SKIN[(h>>>7)%SKIN.length];
 return '<svg class="spr" viewBox="0 0 18 21" shape-rendering="crispEdges" aria-hidden="true">'+px(BODYPX,{O:OUT,C:shirt,W:'#fff'},12)+bit(5,14,1,1,'rgba(0,0,0,.2)')+bit(12,14,1,1,'rgba(0,0,0,.2)')+
  '<g class="up">'+px(HEAD,{O:OUT,S:sk[0],s:sk[1],B:'rgba(232,105,95,.5)'})+px(HAIR[h%HAIR.length],{H:HAIRC[(h>>>3)%HAIRC.length],h:'#17110f'})+
  '<g class="e0">'+bit(6,6,1,2,'#2a211d')+bit(11,6,1,2,'#2a211d')+'</g>'+
  '<g class="e1">'+bit(5,6,1,1,'#2a211d')+bit(6,7,1,1,'#2a211d')+bit(5,8,1,1,'#2a211d')+bit(12,6,1,1,'#2a211d')+bit(11,7,1,1,'#2a211d')+bit(12,8,1,1,'#2a211d')+'</g>'+
  '<g class="m0">'+bit(8,9,2,1,'#9c4a3a')+'</g><g class="m1">'+bit(8,9,2,2,'#5a1f1a')+'</g><g class="sw">'+bit(15,4,1,2,'#7cc4f2')+'</g></g>'+
  px(DESKPX,{O:OUT,T:'#d7a065',t:'#a66f3a',S:sk[0],P:'#fffdf4',l:'#b9bec9',L:'#8a5a2c'},15)+'</svg>'}
// the pencil, 13 x 19: eraser, metal band, body (its color is the temper), wood and tip; then a face and arms per mood
const PENPX=['...OOOOOOO...','..OPPPPPPPO..','..OPPPPPPPO..','..OMMMMMMMO..','..OmMmMmMmO..','..O.......O..','..O.......O..','..O.......O..','..O.......O..','..O.......O..','..O.......O..','..O.......O..','..O.......O..','..OWWWWWWWO..','...OWWWWWO...','....OWWWO....','....OGGGO....','.....OGO.....','......O......'];
const PEN=(()=>{const I=INK,W='#fffdf4',D='#4a1410';
 return '<svg viewBox="0 0 13 19" shape-rendering="crispEdges">'+
  '<g class="st">'+bit(0,1,2,2,'#fff')+'</g><g class="st b">'+bit(11,1,2,2,'#fff')+'</g>'+
  '<g class="zz">'+bit(10,-3,3,1,I)+bit(11,-2,1,1,I)+bit(10,-1,3,1,I)+'</g>'+
  '<g class="mk">'+bit(11,3,1,3,'#e2412b')+bit(10,4,3,1,'#e2412b')+'</g>'+
  '<rect class="bd" x="3" y="5" width="7" height="8"/>'+bit(3,5,1,8,'rgba(255,255,255,.32)')+bit(9,5,1,8,'rgba(0,0,0,.13)')+px(PENPX,{O:OUT,P:'#f29bb0',M:'#c9ced8',m:'#8f95a3',W:'#edd2a4',G:'#3b3b44'})+
  '<g class="a a0">'+bit(1,9,1,2,I)+bit(1,11,1,1,W)+bit(11,9,1,2,I)+bit(11,11,1,1,W)+'</g>'+
  '<g class="a a1">'+bit(1,9,1,1,I)+bit(0,10,1,1,I)+bit(1,11,1,1,W)+bit(11,9,1,1,I)+bit(12,10,1,1,I)+bit(11,11,1,1,W)+'</g>'+
  '<g class="a a3">'+bit(1,9,1,1,I)+bit(0,8,1,1,I)+bit(0,6,1,2,W)+bit(11,9,1,1,I)+bit(12,8,1,1,I)+bit(12,6,1,2,W)+'</g>'+
  '<g class="f f0">'+bit(4,7,1,2,I)+bit(8,7,1,2,I)+bit(3,9,1,1,'rgba(242,120,150,.7)')+bit(9,9,1,1,'rgba(242,120,150,.7)')+bit(4,10,1,1,I)+bit(8,10,1,1,I)+bit(5,11,3,1,I)+'</g>'+
  '<g class="f f1">'+bit(4,8,1,1,I)+bit(8,8,1,1,I)+bit(3,6,3,1,I)+bit(7,6,3,1,I)+bit(5,11,3,1,I)+'</g>'+
  '<g class="f f2">'+bit(4,8,1,1,I)+bit(8,8,1,1,I)+bit(3,6,2,1,I)+bit(5,7,1,1,I)+bit(8,6,2,1,I)+bit(7,7,1,1,I)+bit(5,10,3,1,I)+bit(4,11,1,1,I)+bit(8,11,1,1,I)+'</g>'+
  '<g class="f f3">'+bit(3,7,2,2,'#fff')+bit(8,7,2,2,'#fff')+bit(4,8,1,1,I)+bit(8,8,1,1,I)+bit(3,5,1,1,I)+bit(4,6,2,1,I)+bit(9,5,1,1,I)+bit(7,6,2,1,I)+bit(4,10,5,2,D)+bit(4,10,1,1,'#fff')+bit(6,10,1,1,'#fff')+bit(8,10,1,1,'#fff')+'</g>'+
  '<g class="f fz">'+bit(3,8,3,1,I)+bit(7,8,3,1,I)+bit(6,10,1,1,I)+'</g></svg>'})();
const CX=50,RX=36;let CY=49,RY=33;
// the room can be a phone-sized square or most of a laptop window: characters grow with it, and a tall wide room keeps
// the top desk's speech bubble inside the window
function fit(){const r=$('room');if(!S||r.hidden)return;const n=S.players.length,f=Math.max(1,Math.min(1.7,Math.min(r.clientWidth,r.clientHeight)/360)),big=f>1.2;
 CY=big?52:49;RY=big?30:33;r.style.setProperty('--cy',CY+'%');r.style.setProperty('--sc',((n<=5?1:n<=7?.9:n<=8?.84:.78)*f).toFixed(3))}
function show(on){$('room').hidden=!on;$('main').classList.toggle('in',on)}
// seats go round the rug; you always sit at the bottom
function seats(){const n=S.players.length,mi=Math.max(0,S.players.findIndex(p=>p.id===ME.id)),o={};
 S.players.forEach((p,i)=>{const a=Math.PI/2+(i-mi)*2*Math.PI/n;o[p.id]={x:CX+RX*Math.cos(a),y:CY+RY*Math.sin(a),i}});return o}
const hearts=(n,max)=>{let h='';for(let i=0;i<max;i++)h+=i<n?'♥':'<i>♥</i>';return '<span class="hp" role="img" aria-label="'+n+(n===1?' life':' lives')+'">'+h+'</span>'};
function sayOf(p){const l=S.last;
 if(S.turn===p.id&&typing.id===p.id&&typing.x)return ['',typing.x];
 if(l&&l.id===p.id){if(l.k==='ok')return ['ok','✓ '+l.x];if(l.k==='dup'&&S.turn===p.id)return ['no','Already said: '+l.x];if(l.k==='bad'&&S.turn===p.id)return ['no','✗ '+l.x];if(l.k==='poke'&&!S.turn&&S.phase==='play')return ['no','Ouch!']}
 if(S.turn===p.id)return ['','…'];
 return ['',p.gone?'left':'']}
function drawSay(){if(!S)return;S.players.forEach(p=>{const e=document.querySelector('.stu[data-id="'+p.id+'"] .bub');if(!e)return;const s=sayOf(p),k='bub'+(s[0]?' '+s[0]:'');
 if(e.className!==k)e.className=k;if(e.textContent!==s[1])e.innerHTML=s[1]?'<span>'+esc(s[1])+'</span>':''})}
function seatsHtml(){const play=S.phase!=='lobby',mx=S.opts.lives,st=seats();
 return S.players.map((p,i)=>{const s=st[p.id];return '<div class="stu'+(p.id===ME.id?' me':'')+(S.turn===p.id?' turn':'')+(play&&!p.lives&&S.winner!==p.id?' out':'')+(S.phase==='over'&&S.winner===p.id&&S.n0>1?' win':'')+(s.x<30?' L':s.x>70?' R':'')+
  '" data-id="'+p.id+'" style="left:'+s.x.toFixed(2)+'%;top:'+s.y.toFixed(2)+'%;z-index:'+Math.round(s.y)+';--d:-'+(i*.37%1.1).toFixed(2)+'s"><div class="bub"></div><div class="in"><div class="fig">'+student(p.id,SHIRTS[i%SHIRTS.length])+
  '</div><b class="nm">'+Profile.html({av:p.av,url:p.url,name:p.name},17)+'<i>'+esc(first(p.name))+(p.id===S.host?' · host':'')+'</i></b>'+(play?hearts(p.lives,mx):'<span class="hp"></span>')+'</div></div>'}).join('')}
// where the pencil stands: asleep on the rug in the lobby, in front of the desk whose turn it is, right at the desk for a poke
function movePencil(){const pen=$('pencil');if(!S||$('room').hidden)return;const st=seats();let x=CX,y=CY,m='z',s=null,k=0;
 if(S.phase==='play'){s=st[S.turn||(S.last&&S.last.k==='poke'?S.last.id:'')];k=S.turn?.42:.62;m=S.turn?pen.dataset.m==='z'?'0':pen.dataset.m:'3'}
 else if(S.phase==='over'){s=st[S.winner];k=.5;m='0'}
 if(s){x=CX+(s.x-CX)*k;y=CY+(s.y-CY)*k}
 const at=x.toFixed(1)+','+y.toFixed(1);
 if(at!==pen.dataset.at){if(pen.dataset.at&&m!=='z'){pen.classList.remove('hop');void pen.offsetWidth;pen.classList.add('hop')}pen.dataset.at=at;pen.style.left=x+'%';pen.style.top=y+'%';pen.style.zIndex=Math.round(y)+1}
 if(pen.dataset.m!==m)pen.dataset.m=m;
 if(s){const r=$('room'),dx=(s.x-x)*r.clientWidth,dy=(s.y-y)*r.clientHeight;pen.style.setProperty('--rot',(Math.atan2(dy,dx)*180/Math.PI-90).toFixed(0)+'deg')}}
// the hidden fuse shows only in the pencil's temper and in the classmate starting to sweat
function drawFuse(){const on=!!(S&&S.phase==='play'&&S.turn),c=document.body.classList;let m='';
 if(on){const l=deadline-now(),pen=$('pencil'),d=document.querySelector('.stu.turn');m=l>11000?'0':l>7000?'1':l>3500?'2':'3';
  if(pen.dataset.m!==m)pen.dataset.m=m;if(d)d.classList.toggle('hot',l<5000);
  if(m==='3'&&now()-(drawFuse.t||0)>440){drawFuse.t=now();sfx('tap')}}
 c.toggle('d1',m==='2');c.toggle('d2',m==='3');c.toggle('myturn',on&&S.turn===ME.id)}
const MINI='<span class="mini pen" data-m="0" style="position:absolute;left:auto;top:auto;margin:0;transition:none">'+PEN+'</span>';
function boardHtml(){
 if(!room)return '<h1>Pop Quiz</h1><div class="n">Name one before the pencil pokes you.</div>'+MINI;
 if(!S||S.phase==='closed')return '<p class="big">Room '+esc(room)+'</p>';
 const p=prompt(S.pid),l=S.last;
 if(S.phase==='lobby')return '<div class="n">Room code</div><p class="code">'+esc(room)+'</p><button class="cbtn" id="copy" type="button">Copy invite link</button>';
 if(S.phase==='over'){const w=player(S.winner);return '<p class="big">'+(S.n0>1?(w?esc(first(w.name))+' wins!':'Nobody is left!'):'Practice over')+'</p>'+(l&&l.miss&&l.miss.length?'<div class="n">Could have said: '+esc(l.miss.join(', '))+'</div>':'')+'<div class="n">Class dismissed.</div>'}
 if(!S.turn&&l&&l.k==='poke'){const w=player(l.id);return '<p class="big">Poke! '+esc(w?first(w.name):'Someone')+' ran out of time</p>'+(l.miss&&l.miss.length?'<div class="n">Could have said: '+esc(l.miss.join(', '))+'</div>':'')}
 if(!p)return '<p class="big">Get ready…</p>';
 return '<p class="q">'+esc(p.q)+'</p>'+(S.used.length?'<div class="said">'+S.used.map(i=>'<span>'+esc(p.a[i][0])+'</span>').join('')+'</div>':'')+'<div class="n">'+S.used.length+' of '+p.a.length+' said</div>'}
function homeHtml(){const list=Object.keys(rooms).filter(c=>now()-rooms[c].at<9000);
 return '<div class="card"><button class="btn primary wide" id="host" type="button">Host a room</button>'+
  '<form class="join" id="joinf" style="margin-top:10px"><input id="code" maxlength="4" placeholder="Room code" aria-label="Room code" autocomplete="off" autocapitalize="characters"><button class="btn" type="submit">Join</button></form><p class="err" id="jerr" hidden></p></div>'+
  '<div class="card"><h2>Open rooms</h2><div class="list" id="rooms">'+(list.length?list.map(c=>'<button class="row" type="button" data-room="'+esc(c)+'"><span class="w"><b>'+esc(rooms[c].host)+'’s room</b><span>'+rooms[c].n+(rooms[c].n===1?' classmate':' classmates')+' waiting</span></span><span class="pill">Join</span></button>').join(''):'<p class="empty">No open rooms right now. Host one and share the code.</p>')+'</div></div>'+
  '<div class="card"><h2>How to play</h2><ol><li>The board asks for something with many right answers.</li><li>When the pencil comes to your desk, type one nobody has said yet. It moves on to the next desk.</li><li>The longer it waits, the angrier it gets. Too slow and it pokes you: one life gone. Last one with a life wins.</li></ol></div>'}
function lobbyHtml(){const host=S.host===ME.id,inRoom=!!player(ME.id),h=player(S.host),n=S.players.length,cs=courseIds();
 if(!host)return '<div class="card"><p class="empty">'+(inRoom?'Waiting for '+esc(h?first(h.name):'the host')+' to start…':n>=MAXP?'This room is full.':'Taking a seat…')+'</p></div>';
 return '<div class="card">'+
  (cs.length>1?'<label class="opt"><span>Prompts from</span><select id="ocourse">'+cs.map(c=>'<option value="'+esc(c)+'"'+(c===S.opts.course?' selected':'')+'>'+esc(DATA.courses[c].title)+'</option>').join('')+'</select></label>':'<div class="opt"><span>Prompts from</span><span>'+esc((DATA.courses[S.opts.course]||{}).title||'')+'</span></div>')+
  '<div class="opt"><span>Lives</span><span class="seg" role="group" aria-label="Lives">'+[1,2,3].map(k=>'<button type="button" data-lives="'+k+'" aria-pressed="'+(S.opts.lives===k)+'">'+k+'</button>').join('')+'</span></div>'+
  '<label class="opt"><span>Show in Open rooms</span><input class="sw" type="checkbox" id="oopen"'+(S.opts.open?' checked':'')+'></label>'+
  '<button class="btn primary wide" id="start" type="button">'+(n>1?'Start with '+n+' players':'Start solo practice')+'</button></div>'}
function overHtml(){const host=S.host===ME.id,rank=S.players.slice().sort((a,b)=>(b.id===S.winner)-(a.id===S.winner)||b.lives-a.lives||(b.n||0)-(a.n||0));
 return '<div class="card"><h2>Results</h2><div class="res">'+rank.map(p=>'<div>'+Profile.html({av:p.av,url:p.url,name:p.name},28)+'<b>'+esc(p.name)+(p.id===S.winner&&S.n0>1?' (winner)':'')+'</b><span>'+(p.n||0)+((p.n||0)===1?' answer':' answers')+'</span></div>').join('')+'</div>'+
  '<div class="acts">'+(host?'<button class="btn primary" id="again" type="button">Play again</button>':'<span class="empty">Waiting for the host to start another round…</span>')+'</div></div>'}
const sfx=k=>{try{if(window.Sfx&&Sfx[k])Sfx[k]()}catch(e){}};
function setBoard(){const b=boardHtml();if(b!==draw.b){draw.b=b;$('board').innerHTML=b;$('board').classList.toggle('home',!room)}}
function draw(){const v=$('view'),inRoom=!!room;
 $('leave').hidden=!inRoom;
 if(!ME){show(false);$('dock').hidden=$('hint').hidden=true;return}
 if(!inRoom){show(false);$('dock').hidden=$('hint').hidden=true;setBoard();const a=document.activeElement;if(a&&a.id==='code'&&sig==='home')return drawRooms();sig='home';v.hidden=false;v.innerHTML=homeHtml();return}
 if(!S||S.phase==='closed'){show(false);$('dock').hidden=$('hint').hidden=true;v.hidden=false;sig='';setBoard();
  v.innerHTML='<div class="card"><p class="empty">'+(S?'This room has closed.':shown===-1?'No room with the code '+esc(room)+' is open right now.':'Looking for room '+esc(room)+'…')+'</p>'+(S||shown===-1?'<div class="acts"><button class="btn primary" id="home" type="button">Back to Pop Quiz</button></div>':'')+'</div>';return}
 const play=S.phase==='play',mine=play&&S.turn===ME.id,me=player(ME.id),n=S.players.length;
 // cards (lobby, results): rebuilt only when something they show has changed, so open selects and focus survive the 2 s keepalive
 const vs=S.phase+'|'+S.host+'|'+S.players.map(p=>p.id+p.lives+(p.n||0)).join(',')+'|'+JSON.stringify(S.opts)+'|'+S.winner;
 if(vs!==draw.vs){draw.vs=vs;v.hidden=play;v.innerHTML=play?'':S.phase==='lobby'?lobbyHtml():overHtml()}
 setBoard();
 const r=$('room');show(true);r.classList.toggle('many',n>8);fit();
 const ds=CY+'|'+S.phase+'|'+S.turn+'|'+S.host+'|'+S.winner+'|'+S.opts.lives+'|'+S.players.map(p=>p.id+p.lives+(p.gone||0)+p.name+p.av).join(',');
 if(ds!==draw.ds){draw.ds=ds;$('seats').innerHTML=seatsHtml()}
 drawSay();movePencil();
 // sounds and one-time moves
 if(draw.ph&&draw.ph!==S.phase)sfx(S.phase==='play'?'go':S.phase==='over'?(S.winner?'fanfare':'over'):'');
 if(S.phase==='lobby'&&draw.n&&n>draw.n)sfx('join');
 draw.ph=S.phase;draw.n=n;
 const l=S.last;if(l&&l.at!==shown){shown=l.at;
  if(l.k==='ok')sfx('tap');
  if(l.k==='poke'){sfx('wrong');const pen=$('pencil'),d=document.querySelector('.stu[data-id="'+l.id+'"]');
   setTimeout(()=>{pen.classList.remove('hop','poke');void pen.offsetWidth;pen.classList.add('poke');if(d){d.classList.remove('ouch');void d.offsetWidth;d.classList.add('ouch')}},320);
   setTimeout(()=>{[$('flash'),$('room')].forEach((e,i)=>{const k=i?'thud':'on';e.classList.remove(k);void e.offsetWidth;e.classList.add(k)})},470);
   setTimeout(()=>{pen.classList.remove('poke');$('flash').classList.remove('on');$('room').classList.remove('thud')},1700)}
  if((l.k==='bad'||l.k==='dup')&&l.id===ME.id){const i=$('inp');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake');setTimeout(()=>i.classList.remove('shake'),400)}}
 $('dock').hidden=!play||!me||!me.lives;const inp=$('inp');
 // the box stays usable between turns (a phone keeps its keyboard up, and you may type ahead); only Send waits for the pencil
 if(!$('dock').hidden){$('send').disabled=!mine;$('dock').classList.toggle('mine',mine);inp.placeholder=mine?'Type an answer':'Get one ready…';
  if(mine&&!wasTurn){try{inp.focus({preventScroll:true})}catch(e){}if(inp.value){typing={id:ME.id,x:inp.value.slice(0,40)};Net.send(T(),{t:'type',id:ME.id,x:typing.x});drawSay()}}}
 wasTurn=mine;
 const h=$('hint'),tp=player(S.turn);h.hidden=!play;h.classList.toggle('mine',mine);
 if(play)h.textContent=!me?'A round is on. You will get a desk in the next one.':!me.lives?'You are out. Watch how it ends.':mine?'Your turn! Type one and send it.':tp?'The pencil is at '+first(tp.name)+'’s desk.':''}
function drawRooms(){const e=$('rooms');if(!e||room)return;const t=document.createElement('div');t.innerHTML=homeHtml();const n=t.querySelector('#rooms');if(n&&n.innerHTML!==e.innerHTML)e.innerHTML=n.innerHTML}
function drawSound(){const b=$('sfxbtn'),on=!(window.Sfx&&Sfx.muted());b.innerHTML='<svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="icons.svg#i-volume'+(on?'':'-off')+'"/></svg>';b.setAttribute('aria-label',on?'Sound is on. Turn sound off':'Sound is off. Turn sound on')}

// ---- taps ----
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.id==='host')enter(rid(4),true);
 else if(b.dataset.room)enter(b.dataset.room,false);
 else if(b.id==='home'||b.id==='leave'){if(room)Net.send(T(),{t:'leave',id:ME.id});location.href='popquiz.html'+(LOCALNET?'?local=1&name='+encodeURIComponent(ME.name):'')}
 else if(b.id==='signin')Auth.signIn();
 else if(b.id==='sfxbtn'){if(window.Sfx){Sfx.unlock();Sfx.toggle()}drawSound()}
 else if(b.id==='copy'){const u=new URL('popquiz.html?r='+room,location.href).href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Invite link copied'),()=>toast('Share this code: '+room,4000))}
 else if(!isHost||!S)return;
 else if(b.id==='start')hostStart();
 else if(b.id==='again')hostAgain();
 else if(b.dataset.lives&&S.phase==='lobby'){S.opts.lives=+b.dataset.lives;push()}});
document.addEventListener('change',e=>{if(!isHost||!S||S.phase!=='lobby')return;
 if(e.target.id==='ocourse'&&DATA.courses[e.target.value]){S.opts.course=e.target.value;push()}
 else if(e.target.id==='oopen'){S.opts.open=e.target.checked;if(!S.opts.open)Net.send(LOBBY,{t:'gone',code:room});push()}});
document.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='dock'){const i=$('inp');if(S&&S.turn===ME.id&&i.value.trim()){answer(i.value);i.value=''}try{i.focus({preventScroll:true})}catch(x){}}
 else if(e.target.id==='joinf'){const c=$('code').value.toUpperCase().replace(/[^A-Z]/g,''),er=$('jerr');if(c.length!==4){er.textContent='A room code has 4 letters.';er.hidden=false;return}enter(c,false)}});
$('inp').addEventListener('input',()=>{if(!S||S.turn!==ME.id)return;const x=$('inp').value.slice(0,40);typing={id:ME.id,x};drawSay();
 const t=now();if(t-lastType>150){lastType=t;Net.send(T(),{t:'type',id:ME.id,x})}});
addEventListener('pagehide',()=>{if(room&&ME)Net.send(T(),{t:'leave',id:ME.id})});
addEventListener('resize',()=>{if(room&&S&&ME)draw()});

// ---- start ----
function myId(){let v='';try{v=sessionStorage.getItem('popquiz_id')||''}catch(e){}if(!/^[A-Z]{10}$/.test(v)){v=rid(10);try{sessionStorage.setItem('popquiz_id',v)}catch(e){}}return v}
(async()=>{
 let list=[];try{list=await (await fetch('courses.json')).json()}catch(e){}
 CLOUD=(list.find(x=>x.cloud&&x.cloud.url)||{}).cloud||null;
 try{const d=await (await fetch('popquiz/prompts.json')).json();if(d&&d.courses)DATA=d}catch(e){}
 const v=$('view');
 if(!courseIds().length){v.innerHTML='<div class="card"><p class="empty">Pop Quiz could not be loaded. Check your connection and reload.</p></div>';return}
 let who=null;
 if(LOCALNET)who={name:Q.get('name')||'Tester',av:'g',url:''};
 else{if(!CLOUD){v.innerHTML='<div class="card"><p class="empty">Pop Quiz could not be loaded. Check your connection and reload.</p></div>';return}
  Auth.cloud=CLOUD;let msg='';try{await Auth.finish()}catch(e){msg=e.message}
  if(Auth.ses()){await Auth.token();if(Auth.ses()){await Profile.refresh();who=Profile.me()}}
  if(!who){v.innerHTML='<div class="card"><h2>Sign in to play</h2><p>Pop Quiz shows your class name and picture at your desk, so it needs your account.</p><button class="btn primary wide" id="signin" type="button">'+(Auth.ended()?'Sign in again':'Sign in with Google')+'</button>'+(msg?'<p class="err">'+esc(msg)+'</p>':'')+'</div>';return}}
 ME=clean({id:myId(),name:who.name,av:who.av,url:who.url});$('pencil').innerHTML=PEN;drawSound();
 Net.open(LOBBY,m=>{if(!m||typeof m!=='object'||room)return;const c=String(m.code||'');if(!/^[A-Z]{4}$/.test(c))return;
  if(m.t==='room')rooms[c]={host:first(String(m.host||'').slice(0,24)),n:Math.max(1,Math.min(MAXP,+m.n||1)),at:now()};else if(m.t==='gone')delete rooms[c];drawRooms()});
 setInterval(tick,250);setInterval(()=>{if(!room)drawRooms()},3000);
 const r=(Q.get('r')||'').toUpperCase();
 if(/^[A-Z]{4}$/.test(r))enter(r,false);else draw();
})();
</script>

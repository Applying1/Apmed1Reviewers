 </linearGradient>
 <radialGradient id="sh" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity=".16"/>
  <stop offset="0.65" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity=".05"/>
  <stop offset="1" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity="0"/>
 </radialGradient>
 <filter id="dp" x="-20%" y="-15%" width="140%" height="145%">
  <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#1e1b4b" flood-opacity=".18"/>
 </filter>
</defs>
<ellipse cx="80" cy="120" rx="44" ry="10" fill="url(#sh)"/>
<g filter="url(#dp)"><g transform="translate(3.8,8.8) scale(0.87)">
<!-- Tall pinnate frond behind -->
 <path d="M62 106 C60 74 68 44 84 22" fill="none" stroke="url(#gd)" stroke-width="4.5" stroke-linecap="round"/>
 <ellipse cx="56" cy="76" rx="12" ry="5" transform="rotate(-25 56 76)" fill="url(#gm)"/>
 <ellipse cx="78" cy="78" rx="12" ry="5" transform="rotate(25 78 78)" fill="url(#gm)"/>
 <ellipse cx="60" cy="58" rx="11" ry="4.5" transform="rotate(-25 60 58)" fill="url(#gm)"/>
 <ellipse cx="80" cy="60" rx="11" ry="4.5" transform="rotate(25 80 60)" fill="url(#gm)"/>
 <ellipse cx="66" cy="42" rx="9" ry="4" transform="rotate(-20 66 42)" fill="url(#gl)"/>
 <ellipse cx="84" cy="44" rx="9" ry="4" transform="rotate(20 84 44)" fill="url(#gl)"/>
 <!-- Coiled fern fiddlehead (crosier) on right -->
 <path d="M92 106 C94 82 98 58 112 52 C124 46 130 60 122 68 C114 74 104 66 110 58" fill="none" stroke="url(#gx)" stroke-width="7" stroke-linecap="round"/>
 <path d="M92 106 C94 82 98 58 112 52" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".45"/>
</g></g>

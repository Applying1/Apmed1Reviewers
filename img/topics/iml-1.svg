<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140">
<defs>
 <linearGradient id="gl" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gl0,#f5f3ff)"/>
  <stop offset="1" stop-color="var(--ic-gl1,#c4b5fd)"/>
 </linearGradient>
 <linearGradient id="gm" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gm0,#c4b5fd)"/>
  <stop offset="1" stop-color="var(--ic-gm1,#6366f1)"/>
 </linearGradient>
 <linearGradient id="gd" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gd0,#818cf8)"/>
  <stop offset="1" stop-color="var(--ic-gd1,#3730a3)"/>
 </linearGradient>
 <linearGradient id="gx" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gx0,#4f46e5)"/>
  <stop offset="1" stop-color="var(--ic-gx1,#1e1b4b)"/>
 </linearGradient>
 <radialGradient id="sh" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity=".16"/>
  <stop offset="0.65" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity=".05"/>
  <stop offset="1" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity="0"/>
 </radialGradient>
 <filter id="dp" x="-20%" y="-15%" width="140%" height="145%">
  <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#1e1b4b" flood-opacity=".18"/>
 </filter>
</defs>
<ellipse cx="80" cy="120" rx="44" ry="10" fill="url(#sh)"/>
<g filter="url(#dp)"><g transform="translate(9.0,7.8) scale(0.88)">
<!-- Classical Ionic column behind left -->
 <rect x="40" y="28" width="28" height="68" rx="4" fill="url(#gl)"/>
 <line x1="48" y1="32" x2="48" y2="92" stroke="url(#gm)" stroke-width="2" stroke-linecap="round" opacity=".55"/>
 <line x1="54" y1="32" x2="54" y2="92" stroke="url(#gm)" stroke-width="2" stroke-linecap="round" opacity=".55"/>
 <line x1="60" y1="32" x2="60" y2="92" stroke="url(#gm)" stroke-width="2" stroke-linecap="round" opacity=".55"/>
 <rect x="35" y="22" width="38" height="8" rx="4" fill="url(#gm)"/>
 <circle cx="38" cy="26" r="5" fill="url(#gl)"/><circle cx="38" cy="26" r="2" fill="url(#gd)"/>
 <circle cx="70" cy="26" r="5" fill="url(#gl)"/><circle cx="70" cy="26" r="2" fill="url(#gd)"/>
 <rect x="35" y="94" width="38" height="8" rx="3.5" fill="url(#gm)"/>
 <!-- Herb sprig rising from mortar -->
 <path d="M84 68 C82 52 90 38 98 30" fill="none" stroke="url(#gd)" stroke-width="3" stroke-linecap="round"/>
 <path d="M86 56 C76 52 74 44 82 42 C88 42 88 50 86 56 Z" fill="url(#gm)"/>
 <path d="M90 46 C100 42 104 34 96 32 C90 32 90 40 90 46 Z" fill="url(#gm)"/>
 <!-- Pestle tilted right -->
 <path d="M98 68 L116 40 C119 35 126 39 123 45 L106 72 Z" fill="url(#gd)"/>
 <ellipse cx="118" cy="41" rx="3" ry="1.8" transform="rotate(-32 118 41)" fill="#fff" opacity=".45"/>
 <!-- Mortar bowl in front -->
 <path d="M62 68 H124 C124 94 110 106 93 106 C76 106 62 94 62 68 Z" fill="url(#gm)"/>
 <rect x="58" y="63" width="70" height="8" rx="4" fill="url(#gl)"/>
 <rect x="76" y="103" width="34" height="6" rx="3" fill="url(#gd)"/>
 <path d="M70 76 C70 90 78 97 90 99" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".5"/>
</g></g>
</svg>

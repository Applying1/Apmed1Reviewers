<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140">
<defs>
 <linearGradient id="gl" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gl0,#f5f3ff)"/>
  <stop offset="1" stop-color="var(--ic-gl1,#c4b5fd)"/>
 </linearGradient>
 <linearGradient id="gm" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gm0,#c4b5fd)"/>
  <stop offset="1" stop-color="var(--ic-gm1,#6366f1)"/>
 </linearGradient>
 <linearGradient id="gd" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gd0,#818cf8)"/>
  <stop offset="1" stop-color="var(--ic-gd1,#3730a3)"/>
 </linearGradient>
 <linearGradient id="gx" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gx0,#4f46e5)"/>
  <stop offset="1" stop-color="var(--ic-gx1,#1e1b4b)"/>
 </linearGradient>
 <radialGradient id="sh" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity=".16"/>
  <stop offset="0.65" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity=".05"/>
  <stop offset="1" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity="0"/>
 </radialGradient>
 <filter id="dp" x="-20%" y="-15%" width="140%" height="145%">
  <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#1e1b4b" flood-opacity=".18"/>
 </filter>
</defs>
<ellipse cx="80" cy="120" rx="44" ry="10" fill="url(#sh)"/>
<g filter="url(#dp)"><g transform="translate(12.9,6.8) scale(0.87)">
<!-- Tilted sculpted leaf blade -->
 <path d="M40 98 C34 62 58 28 118 24 C116 80 86 106 40 98 Z" fill="url(#gm)"/>
 <path d="M46 92 C44 64 64 38 108 32" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".45"/>
 <!-- Petiole & midrib vein -->
 <path d="M30 108 C54 84 82 56 112 28" fill="none" stroke="url(#gd)" stroke-width="5" stroke-linecap="round"/>
 <!-- Lateral veins -->
 <path d="M62 76 C58 60 62 50 70 42" fill="none" stroke="url(#gl)" stroke-width="3" stroke-linecap="round"/>
 <path d="M78 60 C76 48 80 40 88 34" fill="none" stroke="url(#gl)" stroke-width="2.8" stroke-linecap="round"/>
 <path d="M66 72 C80 74 92 70 102 62" fill="none" stroke="url(#gl)" stroke-width="3" stroke-linecap="round"/>
 <path d="M82 56 C94 58 102 54 110 48" fill="none" stroke="url(#gl)" stroke-width="2.8" stroke-linecap="round"/>
 <!-- Dew droplet on right -->
 <path d="M116 76 C116 76 106 90 106 96 A10 10 0 1 0 126 96 C126 90 116 76 116 76 Z" fill="url(#gl)"/>
 <circle cx="112" cy="94" r="3" fill="#fff" opacity=".65"/>
</g></g>
</svg>

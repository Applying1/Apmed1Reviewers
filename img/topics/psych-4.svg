<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140">
<defs>
 <linearGradient id="gl" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gl0,#f5f3ff)"/>
  <stop offset="1" stop-color="var(--ic-gl1,#c4b5fd)"/>
 </linearGradient>
 <linearGradient id="gm" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gm0,#c4b5fd)"/>
  <stop offset="1" stop-color="var(--ic-gm1,#6366f1)"/>
 </linearGradient>
 <linearGradient id="gd" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gd0,#818cf8)"/>
  <stop offset="1" stop-color="var(--ic-gd1,#3730a3)"/>
 </linearGradient>
 <linearGradient id="gx" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gx0,#4f46e5)"/>
  <stop offset="1" stop-color="var(--ic-gx1,#1e1b4b)"/>
 </linearGradient>
 <radialGradient id="sh" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity=".16"/>
  <stop offset="0.65" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity=".05"/>
  <stop offset="1" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity="0"/>
 </radialGradient>
 <filter id="dp" x="-20%" y="-15%" width="140%" height="145%">
  <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#1e1b4b" flood-opacity=".18"/>
 </filter>
</defs>
<ellipse cx="80" cy="120" rx="44" ry="10" fill="url(#sh)"/>
<g filter="url(#dp)"><g transform="translate(16.3,11.4) scale(0.80)">
<!-- Almond eye shape -->
 <path d="M28 68 C48 38 112 38 132 68 C112 98 48 98 28 68 Z" fill="url(#gl)" stroke="url(#gd)" stroke-width="5" stroke-linejoin="round"/>
 <!-- Iris & pupil -->
 <circle cx="80" cy="68" r="20" fill="url(#gm)"/>
 <circle cx="80" cy="68" r="10" fill="url(#gx)"/>
 <circle cx="73" cy="61" r="4.5" fill="#fff" opacity=".8"/>
 <circle cx="85" cy="73" r="2" fill="#fff" opacity=".5"/>
</g></g>
</svg>

 <circle cx="74" cy="68" r="36" fill="url(#gd)"/>
 <circle cx="74" cy="68" r="24" fill="url(#gl)"/>
 <circle cx="74" cy="68" r="12" fill="url(#gx)"/>
 <!-- Arrow hitting bullseye -->
 <line x1="74" y1="68" x2="122" y2="28" stroke="url(#gx)" stroke-width="5" stroke-linecap="round"/>
 <polygon points="116,24 128,22 124,34" fill="url(#gm)"/>
</g></g>

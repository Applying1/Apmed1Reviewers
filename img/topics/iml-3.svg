<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140">
<defs>
 <linearGradient id="gl" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gl0,#f5f3ff)"/>
  <stop offset="1" stop-color="var(--ic-gl1,#c4b5fd)"/>
 </linearGradient>
 <linearGradient id="gm" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gm0,#c4b5fd)"/>
  <stop offset="1" stop-color="var(--ic-gm1,#6366f1)"/>
 </linearGradient>
 <linearGradient id="gd" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gd0,#818cf8)"/>
  <stop offset="1" stop-color="var(--ic-gd1,#3730a3)"/>
 </linearGradient>
 <linearGradient id="gx" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gx0,#4f46e5)"/>
  <stop offset="1" stop-color="var(--ic-gx1,#1e1b4b)"/>
 </linearGradient>
 <radialGradient id="sh" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity=".16"/>
  <stop offset="0.65" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity=".05"/>
  <stop offset="1" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity="0"/>
 </radialGradient>
 <filter id="dp" x="-20%" y="-15%" width="140%" height="145%">
  <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#1e1b4b" flood-opacity=".18"/>
 </filter>
</defs>
<ellipse cx="80" cy="120" rx="44" ry="10" fill="url(#sh)"/>
<g filter="url(#dp)"><g transform="translate(9.3,12.1) scale(0.85)">
<!-- Microscope base & pillar -->
 <path d="M36 102 H92 C95 102 97 106 94 108 H34 C31 106 33 102 36 102 Z" fill="url(#gx)"/>
 <rect x="56" y="76" width="12" height="26" rx="4" fill="url(#gd)"/>
 <!-- Curved arm -->
 <path d="M62 80 C84 80 92 62 84 44" fill="none" stroke="url(#gm)" stroke-width="9" stroke-linecap="round"/>
 <!-- Stage -->
 <rect x="40" y="70" width="38" height="6" rx="3" fill="url(#gx)"/>
 <!-- Tilted optical tube -->
 <g transform="rotate(-22 64 48)">
  <rect x="54" y="22" width="16" height="38" rx="5" fill="url(#gd)"/>
  <rect x="51" y="18" width="22" height="6" rx="3" fill="url(#gx)"/>
  <rect x="57" y="58" width="10" height="8" rx="3" fill="url(#gm)"/>
  <rect x="57" y="26" width="4" height="26" rx="2" fill="#fff" opacity=".45"/>
 </g>
 <circle cx="78" cy="60" r="6" fill="url(#gl)"/><circle cx="78" cy="60" r="2.5" fill="url(#gd)"/>
 <!-- Petri dish with bacterial colonies in foreground right -->
 <ellipse cx="112" cy="94" rx="22" ry="11" fill="url(#gd)"/>
 <ellipse cx="112" cy="90" rx="22" ry="11" fill="url(#gl)"/>
 <circle cx="104" cy="89" r="3.5" fill="url(#gd)"/>
 <circle cx="116" cy="86" r="2.8" fill="url(#gm)"/>
 <circle cx="119" cy="93" r="3.2" fill="url(#gx)"/>
 <circle cx="109" cy="94" r="2.2" fill="url(#gm)"/>
</g></g>
</svg>

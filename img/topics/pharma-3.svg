 <path d="M66 18 H94 V34 C112 40 118 58 104 66 H56 C42 58 48 40 66 34 Z" fill="url(#gm)"/>
 <circle cx="70" cy="50" r="5" fill="url(#gl)"/>
 <circle cx="90" cy="48" r="5" fill="url(#gl)"/>
 <!-- Neurotransmitter spheres crossing cleft -->
 <circle cx="64" cy="78" r="4.5" fill="url(#gx)"/>
 <circle cx="80" cy="74" r="5" fill="url(#gx)"/>
 <circle cx="96" cy="78" r="4.5" fill="url(#gx)"/>
 <!-- Postsynaptic receptor cups at bottom -->
 <path d="M36 92 H56 C56 100 68 100 68 92 H74 C74 100 86 100 86 92 H92 C92 100 104 100 104 92 H124 V108 H36 Z" fill="url(#gd)"/>
</g></g>

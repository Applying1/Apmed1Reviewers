<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140">
<defs>
 <linearGradient id="gl" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gl0,#f5f3ff)"/>
  <stop offset="1" stop-color="var(--ic-gl1,#c4b5fd)"/>
 </linearGradient>
 <linearGradient id="gm" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gm0,#c4b5fd)"/>
  <stop offset="1" stop-color="var(--ic-gm1,#6366f1)"/>
 </linearGradient>
 <linearGradient id="gd" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gd0,#818cf8)"/>
  <stop offset="1" stop-color="var(--ic-gd1,#3730a3)"/>
 </linearGradient>
 <linearGradient id="gx" x1="0.2" y1="0.08" x2="0.85" y2="0.95">
  <stop offset="0" stop-color="var(--ic-gx0,#4f46e5)"/>
  <stop offset="1" stop-color="var(--ic-gx1,#1e1b4b)"/>
 </linearGradient>
 <radialGradient id="sh" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity=".16"/>
  <stop offset="0.65" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity=".05"/>
  <stop offset="1" stop-color="var(--ic-gx1,#1e1b4b)" stop-opacity="0"/>
 </radialGradient>
 <filter id="dp" x="-20%" y="-15%" width="140%" height="145%">
  <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#1e1b4b" flood-opacity=".18"/>
 </filter>
</defs>
<ellipse cx="80" cy="120" rx="44" ry="10" fill="url(#sh)"/>
<g filter="url(#dp)"><g transform="translate(14.5,14.8) scale(0.82)">
<!-- Soil mound horizon -->
 <ellipse cx="80" cy="46" rx="46" ry="12" fill="url(#gl)"/>
 <path d="M34 46 Q80 56 126 46" fill="none" stroke="url(#gm)" stroke-width="3" stroke-linecap="round"/>
 <!-- Green shoot sprout at top -->
 <path d="M80 46 V24" stroke="url(#gd)" stroke-width="5" stroke-linecap="round"/>
 <path d="M80 34 C66 32 60 22 70 18 C78 18 80 26 80 34 Z" fill="url(#gm)"/>
 <path d="M80 30 C94 28 100 18 90 14 C82 14 80 22 80 30 Z" fill="url(#gd)"/>
 <!-- Central taproot tapering down -->
 <path d="M72 46 C73 72 76 94 80 112 C84 94 87 72 88 46 Z" fill="url(#gd)"/>
 <path d="M76 50 C76 70 78 88 80 104" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>
 <!-- Lateral roots -->
 <path d="M75 60 C60 64 48 74 42 84" fill="none" stroke="url(#gm)" stroke-width="5" stroke-linecap="round"/>
 <path d="M85 66 C100 70 112 80 118 90" fill="none" stroke="url(#gm)" stroke-width="5" stroke-linecap="round"/>
 <path d="M77 82 C64 86 56 94 50 102" fill="none" stroke="url(#gm)" stroke-width="4" stroke-linecap="round"/>
 <path d="M83 86 C96 90 104 96 110 104" fill="none" stroke="url(#gm)" stroke-width="4" stroke-linecap="round"/>
</g></g>
</svg>

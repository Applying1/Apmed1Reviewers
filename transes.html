<script>
// Reads the PDF inside the page (no download, works in the installed app and offline once opened).
const q=new URLSearchParams(location.search),file=q.get('f')||'',title=q.get('t')||'Transes',course=q.get('c')||'';

let pdf=null,scale=1,pages=[],obs=null;

}
async function draw(p){

   const eoc=document.createElement('div');eoc.className='endOfContent';tl.appendChild(eoc);
   tl.addEventListener('mousedown',()=>tl.classList.add('selecting'))}catch(e){}}catch(e){}

// Word exports justified text one word at a time; join the words of a line so the selection highlight is one smooth band.
function joinLines(tc){const out=[];let cur=null;
 for(const it of tc.items){if(it.str===undefined){out.push(it);continue}
  const h=Math.hypot(it.transform[2],it.transform[3])||it.height||10,x=it.transform[4],y=it.transform[5];
  if(cur&&!cur.hasEOL&&Math.abs(y-cur.transform[5])<h*0.3&&Math.abs(h-cur.h)<h*0.2){const gap=x-(cur.transform[4]+cur.width);
   if(gap>-h*0.5&&gap<Math.min(h*2.5,22)){const sp=gap>h*0.15&&!/\s$/.test(cur.str)&&!/^\s/.test(it.str)?' ':'';
    cur.str+=sp+it.str;cur.width=x+it.width-cur.transform[4];cur.hasEOL=it.hasEOL;continue}}
  if(cur)out.push(cur);cur=Object.assign({},it,{h})}

addEventListener('mouseup',()=>document.querySelectorAll('.textLayer.selecting').forEach(e=>e.classList.remove('selecting')));
// Keep the same spot when the page width changes (zoom, sidebar, rotate)
function keepSpot(fn){const i=curPage(),el=pages[i]&&pages[i].el,off=el?(scrollY+barH()-el.offsetTop)/el.offsetHeight:0;fn();if(el)scrollTo(0,el.offsetTop+off*el.offsetHeight-barH())}

// ---- Contents: the PDF's own bookmarks, or "Lesson / Chapter" title lines found in the text

function tidy(t){t=String(t||'').replace(/[^\p{L}\p{N}?)]+$/u,'').replace(/^[^\p{L}\p{N}]+/u,'').replace(/\s+/g,' ').trim();
 if(t.length>3&&t===t.toUpperCase())t=t.toLowerCase().replace(/(^|[\s(—-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase())
  .replace(/(?!^)\b(And|Of|The|In|To|For|On|A|An|As|At|By|Or|Vs)\b/g,w=>w.toLowerCase());

async function destOf(d){try{if(typeof d==='string')d=await pdf.getDestination(d);if(!d)return null;const r=d[0];

async function pageChapterNum(n){try{const tc=await (await pdf.getPage(n)).getTextContent(),s=tc.items.slice(0,30).map(x=>x.str).join(' ');

async function buildToc(){

 if(o&&o.length){
  for(const it of o){const d=await destOf(it.dest);if(!d)continue;const s=split(it.title);
   if(!s.num&&!/summary/i.test(s.name))s.num=await pageChapterNum(d.page)||await pageChapterNum(d.page+1);
   const kids=[];for(const k of it.items||[]){const kd=await destOf(k.dest);if(kd)kids.push(Object.assign({name:tidy(k.title)},kd))}
   toc.push(Object.assign({},s,d,{kids}))}

  // no bookmarks: a new "Lesson n: ..." / "Chapter n: ..." line near the top of a page starts a chapter
  let last='';
  for(let n=1;n<=pdf.numPages;n++){let tc;try{tc=await (await pdf.getPage(n)).getTextContent()}catch(e){continue}
   const txt=tc.items.slice(0,25).map(x=>x.str.trim()).filter(Boolean).join(' | ');
   const m=txt.match(/\b(?:LESSON|CHAPTER|UNIT|TOPIC)\s*(\d{1,2})\s*[:.–-]\s*([^|]{3,70})/i);
   if(m&&m[1]!==last){last=m[1];toc.push({num:m[1],name:tidy(m[2]),page:n,y:null,kids:[]})}}
 }
 if(toc.length<2){toc=[];return}
 toc.sort((a,b)=>a.page-b.page);
 document.getElementById('toc').innerHTML='<div class="th">Contents</div>'+toc.map((c,i)=>'<div class="ch" data-i="'+i+'">'+
  '<div class="row" role="button" tabindex="0" onclick="go('+i+')" onkeydown="if(event.key===\'Enter\')go('+i+')">'+
  '<span class="num">'+(c.num||'•')+'</span><span class="ct">'+esc(c.name)+'</span><span class="pgn">p. '+c.page+'</span>'+
  (c.kids.length?'<button class="tw" onclick="event.stopPropagation();this.closest(\'.ch\').classList.toggle(\'exp\')" aria-label="Show sections"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>':'')+
  '</div>'+(c.kids.length?'<div class="secs">'+c.kids.map((k,j)=>'<button onclick="go('+i+','+j+')"><span>'+esc(k.name)+'</span><span class="pgn">'+k.page+'</span></button>').join('')+'</div>':'')+'</div>').join('');
 document.getElementById('tocbtn').hidden=false;
 drawTabs();let want=-1;try{const v=localStorage.getItem('transes_tab_'+file);if(v!=null)want=+v}catch(e){}

 lastCh=-2;track();
}
function jump(page,y){const el=pages[page-1]&&pages[page-1].el;if(!el)return;if(el.hidden){setTab(chapterOf(page),page,y);return}
 const off=y==null?0:Math.max(0,Math.min(.95,1-y/ptH))*el.offsetHeight;scrollTo(0,Math.max(0,el.offsetTop+off-barH()-10))}
function go(i,j){const c=toc[i],k=j==null?c:c.kids[j];if(tab>=0&&tab!==i){setTab(i,k.page,k.y);if(!wide())toggleToc(false);return}jump(k.page,k.y);if(!wide())toggleToc(false);setTimeout(track,60)}
// ---- Chapter tabs
let tab=-1;
const chapterOf=pg=>{let ci=0;for(let i=0;i<toc.length;i++)if(toc[i].page<=pg)ci=i;return ci};
function tabRange(i){return [toc[i].page,i+1<toc.length?toc[i+1].page-1:pages.length]}
const tabLabel=c=>{const m=String(c.name).match(/summary of (?:chapter|lesson)\s*(\d+)/i);return m?'Ch <b>'+m[1]+'</b> summary':(c.num?'<b>'+esc(c.num)+'</b> · ':'')+esc(c.name)};
function drawTabs(){const t=document.getElementById('tabs');if(toc.length<2){t.hidden=true;return}
 t.innerHTML='<button role="tab" data-t="-1" onclick="setTab(-1)">All</button>'+toc.map((c,i)=>'<button role="tab" data-t="'+i+'" onclick="setTab('+i+')" title="'+esc((c.num?'Chapter '+c.num+': ':'')+c.name)+'">'+tabLabel(c)+'</button>').join('');
 t.hidden=false;document.documentElement.style.setProperty('--tabh',t.offsetHeight+'px');markTab()}
function markTab(){document.querySelectorAll('#tabs button').forEach(b=>{const on=+b.dataset.t===tab;b.classList.toggle('on',on);b.setAttribute('aria-selected',on);if(on)b.scrollIntoView({block:'nearest',inline:'center'})})}
// Show one chapter (or all with -1); optionally land on a page inside it.
function setTab(i,page,y){const pg=curPage()+1;tab=i;const r=i>=0?tabRange(i):[1,pages.length];
 pages.forEach((p,k)=>{p.el.hidden=k+1<r[0]||k+1>r[1]});
 const end=document.getElementById('chend');
 if(i>=0){const nx=toc[i+1];end.innerHTML='<span>End of <b>'+(toc[i].num?'Chapter '+esc(toc[i].num):esc(toc[i].name))+'</b></span>'+(nx?'<button class="btn" onclick="setTab('+(i+1)+');scrollTo(0,0)">Next: '+(nx.num?'Ch '+esc(nx.num)+' · ':'')+esc(nx.name)+' →</button>':'');end.hidden=false}else end.hidden=true;
 try{localStorage.setItem('transes_tab_'+file,String(i))}catch(e){}
 markTab();layout();
 const to=page!=null?page:i>=0?r[0]:pg;const el=pages[to-1]&&pages[to-1].el;
 if(el){const off=y==null?0:Math.max(0,Math.min(.95,1-y/ptH))*el.offsetHeight;scrollTo(0,page==null&&i>=0?0:Math.max(0,el.offsetTop+off-barH()-10))}
 lastCh=-2;setTimeout(track,60)}
// the chapter you're in: shown under the title and highlighted in Contents; the page is remembered
let lastCh=-1;
function track(){if(!pages.length)return;const pg=curPage()+1;let ci=-1;for(let i=0;i<toc.length;i++)if(toc[i].page<=pg)ci=i;
 const c=toc[ci];let where='p. '+pg+' of '+pages.length;if(tab>=0){const r=tabRange(tab);where='p. '+(pg-r[0]+1)+' of '+(r[1]-r[0]+1)+' in this chapter'}
 sub.textContent=(c?(c.num?'Ch '+c.num+' · ':'')+c.name+' · ':'')+where;
 if(ci!==lastCh){lastCh=ci;document.querySelectorAll('.ch').forEach(e=>{const on=+e.dataset.i===ci;e.classList.toggle('cur',on);if(on)e.classList.add('exp')})}
 try{localStorage.setItem('transes_at_'+file,String(pg))}catch(e){}}
addEventListener('scroll',()=>{if(!window.__tk)window.__tk=requestAnimationFrame(()=>{window.__tk=0;track()})},{passive:true});
addEventListener('keydown',e=>{if(e.key==='Escape')toggleToc(false)});

// ---- Search: page text from pdf.js; a match can span text pieces; highlights are placed in page units so they follow zoom
let texts=[],hits=[],hitAt=-1,ptW=612;
async function pageText(n){if(texts[n])return texts[n];const tc=await (await pdf.getPage(n)).getTextContent();let str='';const items=[];
 for(const it of tc.items){if(!it.str)continue;if(str&&!/\s$/.test(str))str+=' ';items.push({s:str.length,str:it.str,t:it.transform,w:it.width,h:it.height||Math.hypot(it.transform[2],it.transform[3])});str+=it.str}
 return texts[n]={str:str.toLowerCase(),items}}
function openSearch(){const b=document.getElementById('sbar');b.hidden=false;const q=document.getElementById('sq');q.focus();q.select();if(q.value)runSearch()}
function closeSearch(){document.getElementById('sbar').hidden=true;hits=[];hitAt=-1;document.getElementById('scount').textContent='';pages.forEach(paintHits)}
async function runSearch(){const q=document.getElementById('sq').value.trim().toLowerCase().replace(/\s+/g,' '),cnt=document.getElementById('scount');
 hits=[];hitAt=-1;if(q.length<2){cnt.textContent='';pages.forEach(paintHits);return}
 cnt.textContent='Searching…';const mine=q;
 for(let n=1;n<=pages.length;n++){const t=await pageText(n);if(document.getElementById('sq').value.trim().toLowerCase().replace(/\s+/g,' ')!==mine)return;
  let i=t.str.indexOf(q);while(i>=0){hits.push({n,s:i,e:i+q.length});i=t.str.indexOf(q,i+1)}}
 pages.forEach(paintHits);
 if(!hits.length){cnt.textContent='No matches';return}
 // start from the first match at or after the page you're on
 const here=curPage()+1;hitAt=Math.max(0,hits.findIndex(h=>h.n>=here));stepHit(0)}
function stepHit(d){if(!hits.length)return;hitAt=(hitAt+d+hits.length)%hits.length;const h=hits[hitAt],p=pages[h.n-1];if(p.el.hidden)setTab(chapterOf(h.n),h.n);
 pages.forEach(paintHits);
 const box=hitBoxes(h)[0],el=p.el,y=el.offsetTop+(box?box.top/100*el.offsetHeight:0);
 scrollTo({top:Math.max(0,y-barH()-document.getElementById('sbar').offsetHeight-70),behavior:'smooth'});
 let ci=-1;for(let i=0;i<toc.length;i++)if(toc[i].page<=h.n)ci=i;const c=toc[ci];
 document.getElementById('scount').textContent=(hitAt+1)+' of '+hits.length+' · p. '+h.n+(c&&c.num?' · Ch '+c.num:'')}
// boxes (in % of the page) for one match
function hitBoxes(h){const t=texts[h.n];if(!t)return [];const out=[],H=ptH,W=ptW;
 for(const it of t.items){const a=Math.max(h.s,it.s),b=Math.min(h.e,it.s+it.str.length);if(a>=b)continue;
  const len=it.str.length||1,x0=it.t[4]+it.w*(a-it.s)/len,x1=it.t[4]+it.w*(b-it.s)/len,y=it.t[5],hh=it.h*1.15;
  out.push({left:x0/W*100,width:(x1-x0)/W*100,top:(H-y-hh*.85)/H*100,height:hh/H*100})}
 return out}
function paintHits(p){if(!p||!p.el)return;p.el.querySelectorAll('.hl').forEach(e=>e.remove());if(!hits.length)return;
 hits.forEach((h,i)=>{if(h.n!==p.n)return;for(const b of hitBoxes(h)){const d=document.createElement('div');d.className='hl'+(i===hitAt?' cur':'');
  d.style.cssText='left:'+b.left+'%;top:'+b.top+'%;width:'+b.width+'%;height:'+b.height+'%';p.el.appendChild(d)}})}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'&&pdf){e.preventDefault();openSearch()}});

(async function(){
 if(!ok||!window.pdfjsLib){box.innerHTML='<p class="msg">'+(ok?'The PDF reader could not load. Check your connection and try again.':'This file could not be found.')+'</p>';sub.textContent='';return}
 pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 try{const buf=await (await fetch(file)).arrayBuffer();pdf=await pdfjsLib.getDocument({data:buf}).promise}
 catch(e){box.innerHTML='<p class="msg">The transes could not be opened. Check your connection and try again.</p>';sub.textContent='';return}
 sub.textContent=pdf.numPages+' pages';box.innerHTML='';
 document.documentElement.style.setProperty('--barh',barH()+'px');
 const first=await pdf.getPage(1),v=first.getViewport({scale:1}),ratio=v.height/v.width;ptH=v.height;ptW=v.width;document.getElementById('sbtn').hidden=false;
 obs=new IntersectionObserver(es=>{for(const e of es){const p=pages[+e.target.dataset.i];p.visible=e.isIntersecting;if(p.visible)draw(p)}},{rootMargin:'800px 0px'});
 for(let i=0;i<pdf.numPages;i++){const el=document.createElement('div');el.className='pg';el.dataset.i=i;box.appendChild(el);pages.push({n:i+1,el,ratio,done:0});obs.observe(el)}
 layout();
 // pick up where you left off
 let at=0;try{at=+localStorage.getItem('transes_at_'+file)||0}catch(e){}
 if(at>1&&at<=pages.length)jump(at,null);
 track();
 buildToc();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>

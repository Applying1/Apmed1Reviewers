<link rel="stylesheet" href="ui.css">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:22px 16px 64px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--mute);font-size:14px;font-weight:600;padding:6px 10px 6px 6px;border-radius:10px}
.back:hover{color:var(--text);background:var(--raised)}
h1{font:600 clamp(24px,3vw,30px)/1.2 var(--serif);margin:16px 0 4px}
h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:24px 0 8px}
.sub{margin:0;color:var(--mute);font-size:14px}
.tabs{margin:16px 0 4px}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px #0000001a}
.seg b{display:inline-block;min-width:18px;margin-left:4px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:7px 13px;font-weight:600;font-size:13.5px;border:1px solid var(--line2);background:var(--surface);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}@media (max-width:620px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px}.kpi .k{font-size:12.5px;color:var(--mute);font-weight:600}.kpi .v{font:600 22px/1.2 var(--serif);margin-top:2px}
.kpi.fund{border-color:color-mix(in srgb,var(--good) 40%,transparent);background:color-mix(in srgb,var(--good) 8%,transparent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row .sp{flex:1}
.ord .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.ord .h b{font-size:15px}.mute{color:var(--mute);font-size:13px}
.ord ul{margin:8px 0;padding-left:18px;font-size:14px}
.st{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--raised);color:var(--mute)}
.st.paid,.st.ready{background:var(--accent-soft);color:var(--accent)}.st.done{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}.st.cancelled{color:var(--bad)}
.inp,textarea.inp,select.inp{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:14.5px;outline:0}
.inp:focus{border-color:var(--accent)}
label.f{display:block;margin-top:10px;font-size:13px;font-weight:600;color:var(--mute)}label.f .inp{margin-top:4px;color:var(--text)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.it{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.it.off{opacity:.55}
.it .pic{aspect-ratio:1;background:var(--raised);display:grid;place-items:center;color:var(--faint);font-size:12px}.it .pic img{width:100%;height:100%;object-fit:contain}
.it .ib{padding:8px 10px;font-size:13px}.it .ib b{display:block;font-size:13.5px}
.it .ib button{margin-top:6px;width:100%}
.prt{width:100%;border-collapse:collapse;font-size:14px}.prt td,.prt th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}.prt td.n,.prt th.n{text-align:right;font-variant-numeric:tabular-nums}
.msg{min-height:1.2em;font-size:13.5px;margin:8px 0 0}.msg:empty{display:none}.msg.bad{color:var(--bad)}.msg.ok{color:var(--good)}
.modal{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:flex-end;justify-content:center}@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}@media (min-width:640px){.sheet{border-radius:20px}}
.sheet h3{font:600 20px/1.2 var(--serif);margin:0 0 6px}
.prev{width:120px;height:120px;border-radius:12px;background:var(--raised);display:grid;place-items:center;overflow:hidden;color:var(--faint);font-size:12px;margin-top:8px}.prev img{width:100%;height:100%;object-fit:contain}
.empty{color:var(--mute);text-align:center;padding:30px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
</style></head><body>
<main>
 <a class="back" href="shop.html"><svg class="i" width="16" height="16" aria-hidden="true"><use href="icons.svg#i-chevron-left"/></svg>The shop</a>
 <h1>Manage the shop</h1>
 <p class="sub" id="sub">Loading…</p>
 <div class="tabs"><span class="seg" id="tabs" role="group" aria-label="Show" hidden></span></div>
 <div id="body"></div>
</main>
<div class="modal" id="modal" hidden onclick="if(event.target===this)$('modal').hidden=true"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="auth.js"></script>
<script src="notify-core.js"></script>
<script src="push-client.js"></script>
<script>
/* The seller's page (supabase_shop.sql). Only shop managers get anything (shop_is_manager, checked by the database on every
   call): the seller, and the site owner, who can also add or remove managers. Orders: mark paid / ready / picked up (the
   buyer gets a notification), print list (how many of each sticker to make), CSV. Stickers: catalogs + photos (resized to
   800 px WebP here, uploaded to the public "shop" bucket). Settings: open/closed, deadline, how to pay, pickup. */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=c=>'₱'+(c/100).toLocaleString('en-US',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2});
const img=p=>p?Auth.base()+'/storage/v1/object/public/shop/'+p.split('/').map(encodeURIComponent).join('/'):'';
const LBL={placed:'Waiting',paid:'Paid',ready:'Ready',done:'Picked up',cancelled:'Cancelled'};
let A=null,TAB=location.hash.slice(1)||'orders',OF='placed';
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
async function reload(){A=await Auth.rpc('shop_admin_get',{},true);draw()}
function go(t){TAB=t;history.replaceState(null,'','#'+t);draw()}
function draw(){const w=A.orders.filter(o=>o.status==='placed').length,t=$('tabs');t.hidden=false;
 t.innerHTML=[['orders','Orders'],['stickers','Stickers'],['settings','Settings']].concat(A.owner?[['managers','Managers']]:[]).map(([k,l])=>'<button aria-pressed="'+(TAB===k)+'" onclick="go(\''+k+'\')">'+l+(k==='orders'&&w?'<b>'+w+'</b>':'')+'</button>').join('');
 ({orders:drawOrders,stickers:drawStickers,settings:drawSettings,managers:drawManagers}[TAB]||drawOrders)()}

/* ---------- Orders ---------- */
function drawOrders(){const live=A.orders.filter(o=>o.status!=='cancelled'),paid=live.filter(o=>o.status!=='placed'),sum=(l,k)=>l.reduce((a,o)=>a+o[k],0);
 const list=A.orders.filter(o=>OF==='all'||o.status===OF),cnt=s=>A.orders.filter(o=>o.status===s).length;
 const print={};live.forEach(o=>(o.items||[]).forEach(x=>{const k=x.catalog+' · '+x.name;print[k]=(print[k]||0)+x.qty}));
 $('body').innerHTML='<div class="kpis"><div class="kpi"><div class="k">Orders</div><div class="v">'+live.length+'</div></div><div class="kpi"><div class="k">Waiting for payment</div><div class="v">'+peso(sum(live.filter(o=>o.status==='placed'),'total_cents'))+'</div></div>'+
  '<div class="kpi"><div class="k">Paid</div><div class="v">'+peso(sum(paid,'total_cents'))+'</div></div><div class="kpi fund"><div class="k">Class fund (paid)</div><div class="v">'+peso(sum(paid,'fund_cents'))+'</div></div></div>'+
  '<div class="row" style="margin-top:16px"><span class="seg" role="group" aria-label="Status">'+[['placed','Waiting'],['paid','Paid'],['ready','Ready'],['done','Picked up'],['cancelled','Cancelled'],['all','All']].map(([k,l])=>'<button aria-pressed="'+(OF===k)+'" onclick="OF=\''+k+'\';drawOrders()">'+l+(k!=='all'&&cnt(k)?' ('+cnt(k)+')':'')+'</button>').join('')+'</span>'+
  '<span class="sp"></span><button class="btn" onclick="reload()">Refresh</button><button class="btn" onclick="csv()">Download CSV</button></div>'+
  (list.length?list.map(o=>'<div class="card ord"><div class="h"><b>#'+o.id+' '+esc(o.buyer)+'</b><span class="st '+esc(o.status)+'">'+esc(LBL[o.status])+'</span><span class="mute">'+new Date(o.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</span></div>'+
   '<div class="mute">'+contact(o.contact)+(o.email?' · '+esc(o.email):'')+'</div>'+
   '<ul>'+(o.items||[]).map(x=>'<li>'+x.qty+' × '+esc(x.name)+' <span class="mute">('+esc(x.catalog)+')</span></li>').join('')+'</ul>'+
   '<div class="h"><b>'+peso(o.total_cents)+'</b>'+(o.fund_cents?'<span class="mute">'+peso(o.fund_cents)+' to the class fund</span>':'')+(o.pay_ref?'<span class="mute">GCash ref: '+esc(o.pay_ref)+'</span>':'')+'</div>'+
   (o.note?'<p class="mute" style="margin:6px 0 0">Note: '+esc(o.note)+'</p>':'')+
   '<div class="row" style="margin-top:10px"><input class="inp" style="flex:1;min-width:160px" id="n'+o.id+'" maxlength="300" placeholder="Note to the buyer (optional)" value="'+esc(o.seller_note)+'">'+
   ({placed:[['paid','Mark paid'],['cancelled','Cancel']],paid:[['ready','Ready for pickup']],ready:[['done','Picked up']],done:[],cancelled:[['placed','Reopen']]}[o.status]||[]).map(([s,l])=>'<button class="btn'+(s==='cancelled'?' bad':s==='placed'?'':' primary')+'" onclick="setStatus('+o.id+',\''+s+'\')">'+l+'</button>').join('')+'</div></div>').join('')
   :'<p class="empty">No orders here.</p>')+
  '<h2>Print list (orders not cancelled)</h2><div class="card">'+(Object.keys(print).length?'<table class="prt"><tr><th>Sticker</th><th class="n">How many</th></tr>'+Object.entries(print).sort().map(([k,n])=>'<tr><td>'+esc(k)+'</td><td class="n">'+n+'</td></tr>').join('')+'</table>':'<p class="mute" style="margin:0">Nothing ordered yet.</p>')+'</div>'}
function contact(c){c=String(c||'');if(/^https?:\/\//i.test(c))return '<a href="'+esc(c)+'" target="_blank" rel="noopener">'+esc(c.replace(/^https?:\/\/(www\.)?/,''))+'</a>';return esc(c)}
async function setStatus(id,s){try{await Auth.rpc('shop_admin_status',{p_id:id,p_status:s,p_note:$('n'+id).value.trim()},true);toast(s==='paid'?'Marked paid. The buyer gets a notification.':s==='ready'?'Marked ready. The buyer gets a notification.':'Saved.');await reload()}catch(e){toast('Couldn\'t save: '+e.message)}}
function csv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',rows=[['order','date','buyer','email','contact','status','catalog','sticker','qty','price','line total','class fund','gcash ref','note']];
 A.orders.forEach(o=>(o.items||[]).forEach(x=>rows.push([o.id,o.created_at.slice(0,16).replace('T',' '),o.buyer,o.email,o.contact,o.status,x.catalog,x.name,x.qty,x.price/100,x.qty*x.price/100,x.fund?'yes':'',o.pay_ref,o.note])));
 const b=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sticker-orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}

/* ---------- Stickers ---------- */
function drawStickers(){const cats=A.catalogs;
 $('body').innerHTML='<div class="row" style="margin-top:14px"><span class="mute">Catalogs show in this order. A sticker with a stock number sells out by itself.</span><span class="sp"></span><button class="btn primary" onclick="editCat()">New catalog</button></div>'+
  (cats.length?cats.map(c=>{const its=A.items.filter(i=>i.catalog_id===c.id);return '<div class="card"><div class="row"><b style="font-size:16px">'+esc(c.name)+'</b>'+(c.to_fund?'<span class="st done">Class fund</span>':'')+(c.visible?'':'<span class="st">Hidden</span>')+
   '<span class="sp"></span><button class="btn" onclick="editCat('+c.id+')">Edit</button><button class="btn" onclick="editItem(null,'+c.id+')">Add sticker</button><label class="btn" style="cursor:pointer">Add many photos<input type="file" accept="image/*" multiple hidden onchange="bulk('+c.id+',this)"></label></div>'+
   (c.blurb?'<p class="mute" style="margin:6px 0 0">'+esc(c.blurb)+'</p>':'')+
   (its.length?'<div class="grid">'+its.map(i=>'<div class="it'+(i.active?'':' off')+'"><div class="pic">'+(i.image?'<img src="'+esc(img(i.image))+'" alt="" loading="lazy">':'No photo')+'</div><div class="ib"><b>'+esc(i.name)+'</b>'+peso(i.price_cents)+' · '+(i.stock==null?i.sold+' sold':Math.max(0,i.stock-i.sold)+' of '+i.stock+' left')+(i.active?'':' · hidden')+'<button class="btn" onclick="editItem('+i.id+')">Edit</button></div></div>').join('')+'</div>'
    :'<p class="mute">No stickers yet. Tap <b>Add many photos</b> to add a whole set at once (named after the files), then fix names and prices.</p>')+'</div>'}).join('')
  :'<p class="empty">No catalogs yet. Start with <b>New catalog</b> (for example: When in Med).</p>')}
function sheet(h){$('sheet').innerHTML=h;$('modal').hidden=false}
function editCat(id){const c=A.catalogs.find(x=>x.id===id)||{name:'',blurb:'',to_fund:false,visible:true,sort:''};
 sheet('<h3>'+(id?'Edit catalog':'New catalog')+'</h3><label class="f">Name<input class="inp" id="cn" maxlength="80" value="'+esc(c.name)+'"></label>'+
  '<label class="f">Description (optional)<textarea class="inp" id="cb" maxlength="500" rows="2">'+esc(c.blurb)+'</textarea></label>'+
  '<label class="chk"><input type="checkbox" id="cf"'+(c.to_fund?' checked':'')+'> Proceeds go to the class fund</label><label class="chk"><input type="checkbox" id="cv"'+(c.visible?' checked':'')+'> Show in the shop</label>'+
  '<label class="f">Order (1 = first)<input class="inp" id="cs" inputmode="numeric" value="'+esc(c.sort)+'"></label><p class="msg bad" id="em"></p>'+
  '<div class="row" style="margin-top:14px">'+(id?'<button class="btn bad" onclick="saveCat('+id+',true)">Delete</button>':'')+'<span class="sp"></span><button class="btn" onclick="$(\'modal\').hidden=true">Cancel</button><button class="btn primary" onclick="saveCat('+(id||'null')+')">Save</button></div>')}
async function saveCat(id,del){if(del&&!confirm('Delete this catalog and its stickers? Past orders keep their lines.'))return;
 try{await Auth.rpc('shop_admin_catalog',{p:del?{id,delete:true}:{id,name:$('cn').value,blurb:$('cb').value,to_fund:$('cf').checked,visible:$('cv').checked,sort:$('cs').value?+$('cs').value:null}},true);$('modal').hidden=true;await reload()}catch(e){$('em').textContent=e.message}}
let PIC=null;
function editItem(id,cat){const i=A.items.find(x=>x.id===id)||{name:'',price_cents:500,stock:null,active:true,image:null,catalog_id:cat,sort:''};PIC=i.image;
 sheet('<h3>'+(id?'Edit sticker':'New sticker')+'</h3><div class="row" style="align-items:flex-start;gap:14px"><div class="prev" id="pv">'+(i.image?'<img src="'+esc(img(i.image))+'" alt="">':'No photo')+'</div>'+
  '<div style="flex:1;min-width:150px"><label class="btn" style="cursor:pointer;margin-top:8px">Choose photo<input type="file" accept="image/*" hidden onchange="pickPhoto(this)"></label><p class="mute">Square photos look best. It\'s resized to 800 px before uploading.</p></div></div>'+
  '<label class="f">Name<input class="inp" id="in" maxlength="80" value="'+esc(i.name)+'"></label>'+
  '<div class="row"><label class="f" style="flex:1">Price (₱)<input class="inp" id="ip" inputmode="decimal" value="'+(i.price_cents/100)+'"></label><label class="f" style="flex:1">Stock (empty = no limit)<input class="inp" id="is" inputmode="numeric" value="'+(i.stock==null?'':i.stock)+'"></label></div>'+
  '<label class="f">Catalog<select class="inp" id="ic">'+A.catalogs.map(c=>'<option value="'+c.id+'"'+(c.id===i.catalog_id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label>'+
  '<label class="chk"><input type="checkbox" id="ia"'+(i.active?' checked':'')+'> Show in the shop</label><p class="msg bad" id="em"></p>'+
  '<div class="row" style="margin-top:14px">'+(id?'<button class="btn bad" onclick="saveItem('+id+',true)">Delete</button>':'')+'<span class="sp"></span><button class="btn" onclick="$(\'modal\').hidden=true">Cancel</button><button class="btn primary" id="isave" onclick="saveItem('+(id||'null')+')">Save</button></div>')}
// resize to at most 800 px and encode as WebP (JPEG where WebP isn't supported), then upload to the "shop" bucket
async function shrink(file){const bmp=await createImageBitmap(file),k=Math.min(1,800/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
 c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);let b=await new Promise(r=>c.toBlob(r,'image/webp',.86));if(!b||b.type!=='image/webp')b=await new Promise(r=>c.toBlob(r,'image/jpeg',.88));return b}
async function upload(file){const b=await shrink(file),ext=b.type==='image/webp'?'webp':'jpg',path='items/'+crypto.randomUUID()+'.'+ext,tok=await Auth.token();
 const r=await fetch(Auth.base()+'/storage/v1/object/shop/'+path,{method:'POST',headers:{apikey:Auth.cloud.key,Authorization:'Bearer '+tok,'Content-Type':b.type,'x-upsert':'false'},body:b});
 if(!r.ok){let m='';try{m=(await r.json()).message}catch(e){}throw new Error('upload failed'+(m?': '+m:''))}return path}
async function pickPhoto(inp){const f=inp.files[0];if(!f)return;$('pv').textContent='Uploading…';$('isave').disabled=true;
 try{PIC=await upload(f);$('pv').innerHTML='<img src="'+esc(img(PIC))+'" alt="">'}catch(e){$('pv').textContent='Failed';$('em').textContent=e.message}$('isave').disabled=false}
async function saveItem(id,del){if(del&&!confirm('Delete this sticker? If someone already ordered it, it\'s hidden instead.'))return;
 const price=Math.round(parseFloat($('ip')?$('ip').value:'0')*100);
 try{await Auth.rpc('shop_admin_item',{p:del?{id,delete:true}:{id,catalog:+$('ic').value,name:$('in').value,price:isNaN(price)?500:price,stock:$('is').value.trim(),image:PIC||'',active:$('ia').checked}},true);$('modal').hidden=true;await reload()}catch(e){$('em').textContent=e.message}}
async function bulk(cat,inp){const files=[...inp.files];if(!files.length)return;let n=0;
 for(const f of files){toast('Uploading '+(++n)+' of '+files.length+'…');try{const path=await upload(f),name=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim().slice(0,80)||'Sticker';
  await Auth.rpc('shop_admin_item',{p:{catalog:cat,name,price:500,image:path}},true)}catch(e){toast('Couldn\'t add '+f.name+': '+e.message);await new Promise(r=>setTimeout(r,1500))}}
 toast('Added '+files.length+' sticker'+(files.length===1?'':'s')+'. Check their names and prices.');await reload()}

/* ---------- Settings ---------- */
function drawSettings(){const s=A.settings,dl=s.deadline?new Date(s.deadline):null,loc=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
 $('body').innerHTML='<div class="card"><label class="chk" style="margin-top:0;font-weight:600"><input type="checkbox" id="so"'+(s.open?' checked':'')+'> The shop is open for orders</label>'+
  '<label class="chk" style="font-weight:600"><input type="checkbox" id="sl"'+(s.launched?' checked':'')+'> Launched: everyone can see the shop</label>'+
  '<p class="mute" style="margin:2px 0 0 26px">Until then, only managers can see it; classmates see a locked "Coming soon" tile.</p>'+
  '<label class="f">Orders close at (optional)<input class="inp" type="datetime-local" id="sd" value="'+(dl?loc(dl):'')+'"></label>'+
  '<label class="f">Title<input class="inp" id="st" maxlength="80" value="'+esc(s.title)+'"></label>'+
  '<label class="f">Intro (shown at the top)<textarea class="inp" id="si" rows="4" maxlength="2000" placeholder="For example: A small sticker launch to share my art :3 Each sticker is ₱5.">'+esc(s.intro)+'</textarea></label>'+
  '<label class="f">How to pay: your GCash number and name, or cash<textarea class="inp" id="sp" rows="3" maxlength="600" placeholder="For example: GCash 0917 123 4567 (your name), then type the reference number in your order. Or cash when you pick up.">'+esc(s.pay_note)+'</textarea></label>'+
  '<label class="f">Pickup: where and when buyers get their stickers<textarea class="inp" id="sk" rows="2" maxlength="600" placeholder="For example: Room 204 after class, Tue and Thu. I\'ll message you when yours are ready.">'+esc(s.pickup_note)+'</textarea></label>'+
  '<label class="f">Most of one sticker per order<input class="inp" id="sm" inputmode="numeric" value="'+s.max_qty+'"></label>'+
  '<p class="msg" id="sm2"></p><div class="row" style="margin-top:12px"><span class="sp"></span><a class="btn" href="shop.html" target="_blank">See the shop</a><button class="btn primary" onclick="saveSettings()">Save</button></div></div>'+
  (Push.supported()?'<div class="card row"><div style="flex:1"><b>Order alerts on this device</b><p class="mute" style="margin:2px 0 0">A notification for each new order.</p></div><button class="btn" id="alb" onclick="alerts()">'+(Push.attOn()?'On':'Turn on')+'</button></div>':'')}
async function saveSettings(){const d=$('sd').value;
 try{await Auth.rpc('shop_admin_settings',{p:{open:$('so').checked,launched:$('sl').checked,deadline:d?new Date(d).toISOString():'',title:$('st').value,intro:$('si').value,pay_note:$('sp').value,pickup_note:$('sk').value,max_qty:+$('sm').value||50}},true);
  await reload();$('sm2').className='msg ok';$('sm2').textContent='Saved.'}catch(e){$('sm2').className='msg bad';$('sm2').textContent=e.message}}
async function alerts(){const b=$('alb');b.disabled=true;try{await Push.attSet(!Push.attOn());toast(Push.attOn()?'Order alerts are on for this device.':'Order alerts are off.')}catch(e){toast(e.message==='blocked'?'Notifications are blocked for this site in your browser settings.':'Couldn\'t change it.')}b.disabled=false;b.textContent=Push.attOn()?'On':'Turn on'}

/* ---------- Managers (site owner only) ---------- */
function drawManagers(){$('body').innerHTML='<div class="card"><p class="mute" style="margin:0 0 10px">Managers can add stickers, change settings and handle orders. You (the site owner) always can.</p>'+
  (A.managers.length?A.managers.map(m=>'<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span style="flex:1">'+esc(m.name||'(no name)')+' <span class="mute">'+esc(m.email)+'</span></span><button class="btn bad" onclick="mgr(\''+esc(m.email)+'\',false)">Remove</button></div>').join(''):'<p class="mute">No other managers.</p>')+
  '<div class="row" style="margin-top:12px"><input class="inp" style="flex:1;min-width:200px" id="me" type="email" placeholder="Their Google email (they must have signed in once)"><button class="btn primary" onclick="mgr($(\'me\').value,true)">Add</button></div><p class="msg bad" id="mm"></p></div>'}
async function mgr(email,add){if(!add&&!confirm('Remove '+email+' as a manager?'))return;try{await Auth.rpc('shop_admin_manager',{p_email:email,p_add:add},true);await reload()}catch(e){$('mm').textContent=e.message}}

(async function(){
 try{const cl=await (await fetch('courses.json')).json(),c=cl.find(x=>x.cloud&&x.cloud.url);if(c)Auth.cloud=c.cloud}catch(e){}
 if(!Auth.cloud){$('sub').textContent='The online features aren\'t set up here.';return}
 if(!Auth.ses()){$('sub').innerHTML='Sign in with Google first. <a class="btn primary" href="./?signin=1" style="margin-left:6px">Sign in</a>';return}
 Push.init(Auth.cloud);
 try{A=await Auth.rpc('shop_admin_get',{},true)}catch(e){$('sub').textContent=/not allowed/.test(e.message)?'This page is only for the shop\'s managers.':'Couldn\'t load. Check your connection and try again.';return}
 $('sub').textContent='Only managers see this page. Buyers pay you directly; mark their orders here.';draw();Push.attRefresh();
})();
</script>
<script src="update.js" defer></script>
</body></html>

<style>
*{box-sizing:border-box}
[hidden]{display:none!important}

.st.paid,.st.ready{background:var(--accent-soft);color:var(--accent)}.st.done{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}.st.cancelled{color:var(--bad)}
.inp,textarea.inp,select.inp{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:14.5px;outline:0}
.inp:focus{border-color:var(--accent)}

.it{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}

<main>
 <a class="back" href="shop.html"><svg class="i" width="16" height="16" aria-hidden="true"><use href="icons.svg#i-chevron-left"/></svg>The shop</a>
 <div class="hero"><h1>Manage the shop 🛍️</h1>
 <p class="sub" id="sub">Loading…</p>
 <div class="row" id="herow" hidden><span class="pill" id="state"></span><span class="sp"></span><a class="btn" href="shop.html" target="_blank">👀 See the shop</a></div></div>
 <div class="tabs"><span class="seg" id="tabs" role="group" aria-label="Show" hidden></span></div>
 <div id="body"></div>
</main>
<div class="modal" id="modal" hidden onclick="if(event.target===this)$('modal').hidden=true"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="auth.js"></script>
<script src="notify-core.js"></script>

<script>
/* The seller's page (supabase_shop.sql). Only shop managers get anything (shop_is_manager, checked by the database on every
   call): the seller, and the site owner, who can also add or remove managers. Orders: mark paid / ready / picked up (the
   buyer gets a notification), print list (how many of each sticker to make), CSV. Stickers: catalogs + photos (resized to
   800 px WebP here, uploaded to the public "shop" bucket). Settings: open/closed, deadline, how to pay, pickup. */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=c=>'₱'+(c/100).toLocaleString('en-US',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2});
/* our own confirm popup (the same one shop.html uses, instead of the browser's confirm box) */
function ask(title,msg,o){o=o||{};return new Promise(res=>{
 const m=document.createElement('div');m.className='modal dlgwrap';
 m.innerHTML='<div class="sheet dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlgt"><h3 id="dlgt">'+esc(title)+'</h3><p>'+esc(msg||'')+'</p><div class="dbtns">'+(o.cancel===null?'':'<button class="btn" data-v="0">'+esc(o.cancel||'Keep it')+'</button>')+'<button class="btn primary'+(o.danger===false?'':' danger')+'" data-v="1">'+esc(o.ok||'OK')+'</button></div></div>';
 const done=v=>{document.removeEventListener('keydown',key);m.remove();res(v)},key=e=>{if(e.key==='Escape')done(false)};
 m.onclick=e=>{if(e.target===m)done(false);const b=e.target.closest('button[data-v]');if(b)done(b.dataset.v==='1')};
 document.addEventListener('keydown',key);document.body.appendChild(m);(m.querySelector('[data-v="0"]')||m.querySelector('[data-v="1"]')).focus()})}
const img=p=>p?Auth.base()+'/storage/v1/object/public/shop/'+p.split('/').map(encodeURIComponent).join('/'):'';
const LBL={held:'Guest: check',placed:'Waiting',paid:'Paid',ready:'Ready',done:'Picked up',cancelled:'Cancelled'};
let A=null,TAB=location.hash.slice(1)||'orders',OF='placed';
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
async function reload(){A=await Auth.rpc('shop_admin_get',{},true);draw()}
function go(t){TAB=t;history.replaceState(null,'','#'+t);draw()}
function draw(){$('herow').hidden=false;const sp=$('state');sp.className='pill'+(A.settings.open?' on':'');sp.textContent=A.settings.open?'🟢 Open for orders':'⏸️ Orders are closed';const w=A.orders.filter(o=>o.status==='placed'||o.status==='held').length,t=$('tabs');t.hidden=false;
 t.innerHTML=[['orders','🧾 Orders'],['stickers','🎨 Stickers'],['settings','⚙️ Settings']].concat(A.owner?[['coupons','🎟 Coupons'],['managers','👥 Managers']]:[]).map(([k,l])=>'<button aria-pressed="'+(TAB===k)+'" onclick="go(\''+k+'\')">'+l+(k==='orders'&&w?'<b>'+w+'</b>':'')+'</button>').join('');
 ({orders:drawOrders,stickers:drawStickers,settings:drawSettings,managers:drawManagers,coupons:drawCoupons}[TAB]||drawOrders)()}

/* ---------- Orders ---------- */
function drawOrders(){const live=A.orders.filter(o=>o.status!=='cancelled'&&o.status!=='held'),paid=live.filter(o=>o.status!=='placed'),sum=(l,k)=>l.reduce((a,o)=>a+o[k],0);
 const list=A.orders.filter(o=>OF==='all'||o.status===OF),cnt=s=>A.orders.filter(o=>o.status===s).length;
 const print={};live.forEach(o=>(o.items||[]).forEach(x=>{const k=x.catalog+' · '+x.name;print[k]=(print[k]||0)+x.qty}));
 $('body').innerHTML='<div class="kpis"><div class="kpi"><div class="k">🧾 Orders</div><div class="v">'+live.length+'</div></div><div class="kpi"><div class="k">⏳ Waiting for payment</div><div class="v">'+peso(sum(live.filter(o=>o.status==='placed'),'total_cents'))+'</div></div>'+
  '<div class="kpi"><div class="k">💸 Paid</div><div class="v">'+peso(sum(paid,'total_cents'))+'</div></div>'+(sum(live,'sponsor_cents')?'<div class="kpi"><div class="k">🎟 Coupons (the site owner pays you)</div><div class="v">'+peso(sum(live,'sponsor_cents'))+'</div></div>':'')+'<div class="kpi fund"><div class="k">♡ Class fund (paid)</div><div class="v">'+peso(sum(paid,'fund_cents'))+'</div></div></div>'+
  '<div class="row" style="margin-top:16px"><span class="seg" role="group" aria-label="Status">'+(cnt('held')?[['held','Guests to check']]:[]).concat([['placed','Waiting'],['paid','Paid'],['ready','Ready'],['done','Picked up'],['cancelled','Cancelled'],['pick','Pickup'],['all','All']]).map(([k,l])=>'<button aria-pressed="'+(OF===k)+'" onclick="OF=\''+k+'\';drawOrders()">'+l+(k!=='all'&&cnt(k)?' ('+cnt(k)+')':'')+'</button>').join('')+'</span>'+
  '<span class="sp"></span><button class="btn" onclick="reload()">Refresh</button><button class="btn" onclick="csv()">Download CSV</button></div>'+
  (OF==='pick'?pickView():list.length?list.map(o=>'<div class="card ord s-'+esc(o.status)+'"><div class="h"><b>#'+o.id+' '+esc(o.buyer)+'</b><span class="st '+esc(o.status)+'">'+esc(LBL[o.status])+'</span>'+(o.guest?'<span class="st">No sign-in</span>':'')+'<span class="mute">'+new Date(o.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'</span></div>'+
   '<div class="mute">'+contact(o.contact)+(o.email?' · '+esc(o.email):'')+(o.school?' · '+esc(o.school):'')+'</div>'+
   '<ul>'+(o.items||[]).map(x=>'<li>'+x.qty+' × '+esc(x.name)+' <span class="mute">('+esc(x.catalog)+')</span></li>').join('')+'</ul>'+
   '<div class="h"><b>'+peso(o.total_cents)+'</b>'+(o.discount_cents?'<span class="mute">after '+esc((o.deals||[]).map(d=>d.name+(d.n>1?' ×'+d.n:'')).join(', ')||'a deal')+' (−'+peso(o.discount_cents)+')</span>':'')+(o.coupon?'<span class="mute">🎟 '+esc(o.coupon)+': the site owner pays you '+peso(o.sponsor_cents)+'</span>':'')+(o.fund_cents?'<span class="mute">'+peso(o.fund_cents)+' to the class fund</span>':'')+'<span class="mute"><b>'+(o.pay_method==='cash'?'Cash':'GCash')+'</b></span>'+(o.pay_ref?'<span class="mute">GCash ref: '+esc(o.pay_ref)+'</span>':'')+'</div>'+
   (o.note?'<p class="mute" style="margin:6px 0 0">Note: '+esc(o.note)+'</p>':'')+
   '<div class="row" style="margin-top:10px"><input class="inp" style="flex:1;min-width:160px" id="n'+o.id+'" maxlength="300" placeholder="Note to the buyer (optional)" value="'+esc(o.seller_note)+'">'+
   (o.status==='held'?'<p class="mute" style="margin:6px 0 0;flex-basis:100%">Ordered without signing in. Open their profile link above to check who it is, then Accept (it then holds the stickers) or Cancel.</p>':'')+({held:[['accept','Accept'],['cancelled','Cancel']],placed:[['paid','Mark paid'],['cancelled','Cancel']],paid:[['ready','Ready for pickup']],ready:[['done','Picked up']],done:[],cancelled:[['placed','Reopen']]}[o.status]||[]).map(([s,l])=>'<button class="btn'+(s==='cancelled'?' bad':s==='placed'?'':' primary')+'" onclick="setStatus('+o.id+',\''+s+'\')">'+l+'</button>').join('')+'</div></div>').join('')
   :'<p class="empty">🎈 No orders here yet.</p>')+
  '<h2>🖨️ What to make (print list)</h2><div class="card">'+(Object.keys(print).length?'<table class="prt"><tr><th>Sticker</th><th class="n">How many</th></tr>'+Object.entries(print).sort().map(([k,n])=>'<tr><td>'+esc(k)+'</td><td class="n">'+n+'</td></tr>').join('')+'</table>':'<p class="mute" style="margin:0">Nothing ordered yet.</p>')+'</div>'}
/* Pickup view (Orders -> Pickup): paid and ready orders grouped by school, with what to bring and one-tap steps. Cash orders that are
   still waiting show greyed so the seller can mark them paid when the money is handed over. */
let PK=[];

 const r=await fetch(Auth.base()+'/storage/v1/object/shop/'+path,{method:'POST',headers:{apikey:Auth.cloud.key,Authorization:'Bearer '+tok,'Content-Type':b.type,'x-upsert':'false'},body:b});

  (Push.supported()?'<div class="card row"><div style="flex:1"><b>Order alerts on this device</b><p class="mute" style="margin:2px 0 0">A notification for each new order.</p></div><button class="btn" id="alb" onclick="alerts()">'+(Push.attOn()?'On':'Turn on')+'</button></div>':'')}
async function saveSettings(){const d=$('sd').value,gv=$('sg').value.trim(),goal=gv===''?'':Math.round(parseFloat(gv)*100);
 if(goal!==''&&(isNaN(goal)||goal<0)){$('sm2').className='msg bad';$('sm2').textContent='Type the goal as a number, like 1000.';return}
 try{await Auth.rpc('shop_admin_settings',{p:{open:$('so').checked,launched:$('sl').checked,guest_ok:$('sgu').checked,deadline:d?new Date(d).toISOString():'',title:$('st').value,intro:$('si').value,pay_note:$('sp').value,pickup_note:$('sk').value,pickup_places:$('spl').value,max_qty:+$('sm').value||50,item_note:$('sn').value,pay_qr:QR,fund_goal:goal,pickup_days:[...document.querySelectorAll('.pd')].reduce((a,i)=>{if(i.value.trim())a[i.dataset.school]=i.value.trim();return a},{})}},true);
  await reload();$('sm2').className='msg ok';$('sm2').textContent='Saved.'}catch(e){$('sm2').className='msg bad';$('sm2').textContent=e.message}}
async function alerts(){const b=$('alb');b.disabled=true;try{await Push.attSet(!Push.attOn());toast(Push.attOn()?'Order alerts are on for this device.':'Order alerts are off.')}catch(e){toast(e.message==='blocked'?'Notifications are blocked for this site in your browser settings.':'Couldn\'t change it.')}b.disabled=false;b.textContent=Push.attOn()?'On':'Turn on'}

/* ---------- Managers (site owner only) ---------- */
/* ---------- Coupons (site owner only; supabase_shop_coupons.sql) ---------- */
async function drawCoupons(p){$('body').innerHTML='<p class="empty">Loading…</p>';let C;
 try{C=await Auth.rpc('shop_coupon_admin',{p:p||{}},true)}catch(e){$('body').innerHTML='<p class="empty">'+esc(e.message||'Couldn\'t load.')+'</p>';return}
 const c=C.cfg||{};if(p&&p.draw)toast(C.drawn?C.drawn+' golden coupon'+(C.drawn>1?'s':'')+' given out.':'Nobody qualified this week (4+ days with 20+ answers).');
 $('body').innerHTML='<div class="kpis"><div class="kpi"><div class="k">🎟 Starter coupons claimed</div><div class="v">'+C.taken+' of '+c.starter_cap+'</div></div><div class="kpi"><div class="k">💸 You owe the seller</div><div class="v">'+peso(C.owed)+'</div></div></div>'+
  '<div class="card" style="margin-top:14px"><p class="mute" style="margin:0 0 10px">Starter: the first people to answer '+c.starter_need+' questions with '+c.starter_run+' right in a row get 2 coupons (2 = one bundle free). Golden: every Sunday at 8 PM, people who studied 4+ days that week (20+ answers a day) can win one (every bundle free); more answers = better odds, nobody wins twice in 2 weeks. Only you see this tab.</p>'+
  '<label class="row"><input type="checkbox" id="ce"'+(c.enabled?' checked':'')+'> Coupons are on</label>'+
  '<div class="row" style="margin-top:8px"><label>Starter coupons for the first <input class="inp" id="cc" type="number" min="0" max="500" style="width:80px" value="'+c.starter_cap+'"> people</label></div>'+
  '<div class="row" style="margin-top:8px"><label>Golden coupons each Sunday <input class="inp" id="cw" type="number" min="0" max="20" style="width:80px" value="'+c.golden_per_week+'"></label></div>'+
  '<div class="row" style="margin-top:12px"><button class="btn primary" onclick="drawCoupons({enabled:$(\'ce\').checked,cap:+$(\'cc\').value,per_week:+$(\'cw\').value})">Save</button><button class="btn" onclick="drawNow()">Draw golden coupons now</button></div>'+
  (c.last_draw?'<p class="mute" style="margin:8px 0 0">Last draw: week of '+esc(c.last_draw)+'</p>':'')+'</div>'+
  '<h2>Who has coupons</h2><div class="card">'+((C.holders||[]).length?(C.holders||[]).map(h=>'<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span style="flex:1">'+esc(h.name)+' <span class="mute">'+esc(h.email)+'</span></span><span class="mute">'+[h.golden?h.golden+' golden':'',h.basic?h.basic+' coupon'+(h.basic>1?'s':''):'',h.used?h.used+' used':''].filter(Boolean).join(' · ')+'</span></div>').join(''):'<p class="mute" style="margin:0">Nobody yet.</p>')+'</div>'}
async function drawNow(){if(!await ask('Draw golden coupons now?','Winners get a notification. This counts as this week\'s draw.',{ok:'Draw',danger:false}))return;drawCoupons({draw:true})}
function drawManagers(){$('body').innerHTML='<div class="card"><p class="mute" style="margin:0 0 10px">Managers can add stickers, change settings and handle orders. You (the site owner) always can.</p>'+
  (A.managers.length?A.managers.map(m=>'<div class="row" style="padding:6px 0;border-bottom:1px solid var(--line)"><span style="flex:1">'+esc(m.name||'(no name)')+' <span class="mute">'+esc(m.email)+'</span></span><button class="btn bad" onclick="mgr(\''+esc(m.email)+'\',false)">Remove</button></div>').join(''):'<p class="mute">No other managers.</p>')+
  '<div class="row" style="margin-top:12px"><input class="inp" style="flex:1;min-width:200px" id="me" type="email" placeholder="Their Google email (they must have signed in once)"><button class="btn primary" onclick="mgr($(\'me\').value,true)">Add</button></div><p class="msg bad" id="mm"></p></div>'}
async function mgr(email,add){if(!add&&!await ask('Remove this manager?',email+' will no longer see Manage the shop.',{ok:'Yes, remove'}))return;try{await Auth.rpc('shop_admin_manager',{p_email:email,p_add:add},true);await reload()}catch(e){$('mm').textContent=e.message}}

(async function(){
 try{const cl=await (await fetch('courses.json')).json(),c=cl.find(x=>x.cloud&&x.cloud.url);if(c)Auth.cloud=c.cloud}catch(e){}
 if(!Auth.cloud){$('sub').textContent='The online features aren\'t set up here.';return}
 if(!Auth.ses()){$('sub').innerHTML='Sign in with Google first. <a class="btn primary" href="./?signin=1" style="margin-left:6px">Sign in</a>';return}
 Push.init(Auth.cloud);
 try{A=await Auth.rpc('shop_admin_get',{},true)}catch(e){$('sub').textContent=/not allowed/.test(e.message)?'This page is only for the shop\'s managers.':'Couldn\'t load. Check your connection and try again.';return}
 $('sub').textContent='Hi! Only managers see this page. Buyers pay you directly; mark their orders here as they come in.';draw();Push.attRefresh();
})();
</script>

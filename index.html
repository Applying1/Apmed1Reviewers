<script>try{const t=localStorage.getItem('reviewer_theme')||localStorage.getItem('psych_theme');if(t)document.documentElement.dataset.theme=t;const p=localStorage.getItem('reviewer_palette');if(p)document.documentElement.dataset.palette=p}catch(e){}</script><script>(function(){const m=document.querySelector('meta[name=theme-color]');if(!m)return;const f=()=>{if(document.body)m.content=getComputedStyle(document.body).backgroundColor},g=()=>{f();setTimeout(f,350)};addEventListener('DOMContentLoaded',f);new MutationObserver(g).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','data-palette']});matchMedia('(prefers-color-scheme: dark)').addEventListener('change',g)})()</script>
<link rel="stylesheet" href="ui.css">
<style>
/* APMed '33 palette (chosen in a course's Personalize → Appearance) */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:40px 24px 64px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:40px;height:40px;border-radius:12px;box-shadow:0 2px 8px color-mix(in oklab,var(--accent) 35%,transparent)}
.brand b{display:block;font-size:16px}
.brand span{color:var(--mute);font-size:13px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .acts{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:8px 14px;font-weight:600;font-size:14px;border:1px solid var(--line2);background:var(--surface);text-decoration:none;transition:background .15s}
.btn:hover{background:var(--raised)}
.btn.bell{position:relative;padding:8px 11px}.bdot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font:700 10.5px/18px var(--sans);text-align:center;box-shadow:0 0 0 2px var(--bg)}.bdot[hidden]{display:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
h1{font:600 clamp(26px,3.2vw,34px)/1.2 var(--serif);letter-spacing:-.4px;margin:36px 0 22px}
.lede{color:var(--mute);margin:0 0 26px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.course{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;transition:transform .18s var(--ease),box-shadow .18s,border-color .18s}
.course:hover{transform:translateY(-3px);border-color:var(--accent-line);box-shadow:0 10px 28px color-mix(in oklab,var(--accent) 14%,transparent)}
.art{aspect-ratio:16/9;background:radial-gradient(120% 120% at 0 0,color-mix(in oklab,var(--accent) 18%,var(--surface)),var(--surface) 70%);display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
.art img{width:100%;height:100%;object-fit:cover}
.art b{font:600 56px/1 var(--serif);color:var(--accent);opacity:.4}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.body .t{font:600 18px/1.3 var(--serif)}
.body .s{color:var(--mute);font-size:13.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--raised);color:var(--mute)}
.tag.exam{background:var(--accent-soft);color:var(--accent)}
/* Courses without a reviewer yet: shown, but not clickable */
.course.soon{cursor:default}
.course.soon:hover{transform:none;border-color:var(--line);box-shadow:var(--shadow)}
.course.soon .art img{filter:saturate(.55);opacity:.7}
.course.soon .t{color:var(--mute)}
.tag.soon{background:var(--raised);color:var(--faint)}
.prog{margin-top:auto;padding-top:12px}
.track{height:6px;border-radius:9px;background:var(--raised);overflow:hidden}
.fill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.note{margin-top:28px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--mute);font-size:13.5px}
.note b{color:var(--text)}
.empty{color:var(--faint)}
/* A quiet thank-you to the class at the bottom of the page */
.class{margin:56px auto 0;max-width:460px;text-align:center}
.class .pics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.class img{width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block}
.class img:first-child{transform:rotate(-1.5deg)}.class img:last-child{transform:rotate(1.5deg)}
.class p{margin:14px 0 0;color:var(--faint);font-size:13.5px}
.class p.legal{margin-top:22px;font-size:12.5px}.class p.legal a{color:var(--faint)}
/* Sync dialog: one code links every course on this device with another device */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:#0f172a66}
.modal[hidden]{display:none}
.modal .box{width:100%;max-width:440px;max-height:90vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:20px 22px 22px}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mhead h2{flex:1;margin:0;font:600 20px/1.3 var(--serif)}
.mx{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--mute)}
.mx:hover{background:var(--raised);color:var(--text)}
.modal p{color:var(--mute);font-size:14px;margin:8px 0}
.modal p b{color:var(--text)}
.codebox{margin:10px 0;padding:12px;border-radius:12px;background:var(--raised);border:1px solid var(--line);font:600 22px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;text-align:center;color:var(--text)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1;justify-content:center}
.lbl{display:block;margin-top:14px;font-size:13.5px;font-weight:600}
.code{flex:2;min-width:0;font:600 16px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1px;text-transform:uppercase;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--text);outline:0}
.code:focus{border-color:var(--accent)}
.modal p.msg{color:var(--bad);margin-top:10px}
.modal p.msg.ok{color:var(--good)}
.modal p.msg:empty{display:none}
/* One-time spotlight: features people miss */
.spot{display:flex;gap:14px;padding:14px;margin-top:12px;border:1px solid var(--line2);border-radius:14px;background:var(--bg)}
.spot .ic{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--surface);border:1px solid var(--line)}
.spot h3{margin:0;font-size:15.5px}.spot p{margin:4px 0 10px!important}.spot .ok{color:var(--good);font-size:13.5px;font-weight:600}
.spotfoot{display:flex;justify-content:flex-end;margin-top:16px}
.note.inst{text-align:center}
/* Next class, from the timetable */
.upnext{display:flex;align-items:center;gap:12px;margin:0 0 18px;padding:11px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-decoration:none;box-shadow:var(--shadow)}
.upnext[hidden]{display:none}
.upnext:hover{border-color:var(--line2)}
.upnext .bar{flex:none;align-self:stretch;width:4px;border-radius:9px;background:oklch(.6 .13 var(--h))}
.upnext .w{flex:1;min-width:0}
.upnext .l{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mute)}
.upnext .l.live{color:#e11d48}
.upnext b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext .s{display:block;color:var(--mute);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext .go{flex:none;color:var(--accent);font-size:13.5px;font-weight:600}
/* Test countdown (exams, evals and quizzes from the timetable) */
.tests{margin:0 0 18px;padding:14px 16px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tests[hidden]{display:none}
.tests h2{display:flex;align-items:center;gap:8px;font:700 12px/1 var(--sans);letter-spacing:.5px;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
.tests h2 a{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none}
.trow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.trow:first-of-type{border-top:0}
.trow .bar{flex:none;align-self:stretch;width:4px;border-radius:9px;background:oklch(.6 .13 var(--h))}
.trow .w{flex:1;min-width:0}
.trow b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .s{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .cd{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.trow .cd b{font:700 19px/1.1 var(--serif);color:var(--text)}
.trow .cd span{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.trow.first .cd b{font-size:23px;color:var(--accent)}
.trow.soon .cd b{color:#e11d48}
.tests:not(.open) .trow.more{display:none}
.tmore{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px 0 8px;font:600 13.5px var(--sans);color:var(--accent);cursor:pointer}
.tmore svg{transition:transform .2s}.tests.open .tmore svg{transform:rotate(180deg)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:14px}
/* Google sign-in */
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px;padding:11px 16px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:#1f1f1f;font:600 15px/1.2 var(--sans)}
.gbtn:hover{background:#f4f4f4}
.gbtn:disabled{opacity:.6}
.or{display:flex;align-items:center;gap:10px;margin:18px 0 4px;color:var(--faint);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.who{display:flex;align-items:center;gap:12px;margin:12px 0 4px;padding:12px;border-radius:14px;background:var(--raised);border:1px solid var(--line)}
.who img,.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none;background:var(--accent-soft)}
.av{display:grid;place-items:center;font-weight:700;font-size:18px;color:var(--accent)}
.who b{display:block;font-size:15px}
.who span{display:block;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.who>div{min-width:0}
details.alt{margin-top:16px}
details.alt summary{cursor:pointer;color:var(--mute);font-size:13.5px;font-weight:600}
#syncbtn img{width:20px;height:20px;border-radius:50%;object-fit:cover;margin:-3px 0}
.top .acts .btn{white-space:nowrap}
#syncbtn{min-width:0;max-width:200px}#syncbtn .nm{overflow:hidden;text-overflow:ellipsis}
#theme svg{flex:none}
/* One-time offer to try the APMed '33 colors */
.try{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 18px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--accent-line)}
.try[hidden]{display:none}
.try .sw{flex:none;display:flex;gap:3px}.try .sw i{width:14px;height:14px;border-radius:50%;border:1px solid #0002}
.try p{flex:1;min-width:180px;margin:0;font-size:14px;color:var(--mute)}.try p b{color:var(--text)}
.try .row{margin:0;flex-wrap:nowrap}.try .row .btn{flex:none}
@media (max-width:520px){main{padding:24px 16px 48px}.top .acts{margin-left:0;width:100%;flex-wrap:nowrap}
 .top .acts>.btn{flex:none}#syncbtn{flex:0 1 auto;max-width:none}#theme .tl{display:none}#theme{padding:8px 11px}
 .upnext .go{display:none}.upnext .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main>
 <div class="top">
  <div class="brand"><img src="icons/icon-192.png" alt="" width="40" height="40"><div><b>APMed '33 Reviewers</b><span>Practice, notes and matching</span></div></div>
  <div class="acts"><a class="btn bell" id="bell" href="notifications.html" aria-label="Notifications" title="Notifications"><svg class="i" width="17" height="17" aria-hidden="true"><use href="icons.svg#i-bell"/></svg><span class="bdot" id="bdot" hidden></span></a><a class="btn" href="schedule.html"><svg class="i" width="16" height="16" aria-hidden="true"><use href="icons.svg#i-calendar"/></svg>Timetable</a><button class="btn" id="syncbtn" onclick="openSync()" hidden>Sign in</button><button class="btn" id="theme" onclick="toggleTheme()">Theme</button></div>
 </div>
 <h1 id="hi">Pick a course</h1>
 <a class="upnext" id="upnext" href="schedule.html" hidden></a>
 <section class="tests" id="tests" hidden aria-label="Tests coming up"></section>
 <div class="try" id="try" hidden></div>
 <div class="grid" id="list"><p class="empty">Loading courses…</p></div>
 <p class="note inst" id="install" hidden>Use this like an app, even offline. <button class="linkbtn" id="installbtn">Install app</button></p>
 <p class="note" id="ios" hidden><b>On iPhone:</b> tap the Share button in Safari, then <b>Add to Home Screen</b> to use this like an app.</p>
 <div class="class"><p class="legal"><a href="privacy.html">Privacy &amp; terms</a></p></div>
</main>
<div class="modal" id="sync" hidden onclick="if(event.target===this)closeSync()"><div class="box" role="dialog" aria-modal="true" aria-labelledby="synch">
 <div class="mhead"><h2 id="synch">Sync your progress</h2><button class="mx" onclick="closeSync()" aria-label="Close"><svg class="i" width="14" height="14" aria-hidden="true"><use href="icons.svg#i-x"/></svg></button></div>
 <div id="syncbody"></div>
</div></div>
<div class="modal" id="spot" hidden onclick="if(event.target===this)closeSpot()"><div class="box" role="dialog" aria-modal="true" aria-labelledby="spoth">
 <div class="mhead"><h2 id="spoth">2 features you might have missed</h2><button class="mx" onclick="closeSpot()" aria-label="Close"><svg class="i" width="14" height="14" aria-hidden="true"><use href="icons.svg#i-x"/></svg></button></div>
 <div id="spotbody"></div>
</div></div>

<script src="dialog.js"></script>
<script src="notify-core.js"></script>
<script src="reminders-core.js"></script>
<script src="push-client.js"></script>
<script>Notify.load().then(f=>{const n=Notify.prefs().ddot===false?0:Notify.unread(f),d=document.getElementById('bdot');if(n){d.textContent=n>9?'9+':n;d.hidden=false;document.getElementById('bell').setAttribute('aria-label','Notifications, '+n+' new')}})</script>
<script>
// Links shared on Facebook/Messenger get ?fbclid=... added; drop it so the address stays clean when copied again.
if(/[?&](fbclid|utm_[a-z]+|gclid)=/.test(location.search))history.replaceState(null,'',location.pathname);
const ic=(n,c)=>'<svg class="i'+(c?' '+c:'')+'" aria-hidden="true"><use href="icons.svg#i-'+n+'"/></svg>';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// The course's next test, e.g. "Midterm · in 4 days" (from courses.json, set by activeExam).
function examTag(e){if(!e)return '';let w='';if(e.date){const t=new Date();t.setHours(0,0,0,0);const n=Math.round((new Date(e.date+'T00:00')-t)/864e5);w=n<0?'':n===0?' · today':n===1?' · tomorrow':' · in '+n+' days'}return '<span class="tag exam">'+esc(e.name)+w+'</span>'}
function ago(t){const d=Math.floor((Date.now()-t)/864e5);return d<=0?'today':d===1?'yesterday':d+' days ago'}
function summary(key){try{return JSON.parse(localStorage.getItem(key+'_summary'))}catch(e){return null}}
function name(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.endsWith('_summary'))continue;const v=JSON.parse(localStorage.getItem(k));if(v&&v.name)return v.name}}catch(e){}return ''}
(async function(){
 const n=name();if(n)document.getElementById('hi').textContent='Hi, '+n+'. Pick a course';
 let list;
 try{list=await (await fetch('courses.json')).json()}
 catch(e){document.getElementById('list').innerHTML='<p class="empty">Courses could not be loaded. Check your connection and reload.</p>';return}
 CLOUD=(list.find(c=>c.cloud&&c.cloud.url)||{}).cloud||null;document.getElementById('syncbtn').hidden=!CLOUD;
 if(CLOUD&&window.Push){Push.init(CLOUD);setTimeout(()=>Push.heal(),1500)}
 if(CLOUD){drawSyncBtn();finishSignIn().then(done=>{const q=new URLSearchParams(location.search);if(done)return;
  if(q.has('signin')){history.replaceState(null,'',location.pathname);signIn()}else if(q.has('sync')){history.replaceState(null,'',location.pathname);openSync()}else setTimeout(spotlight,700)})}
 const art=c=>'<span class="art">'+(c.image?'<img src="'+esc(c.image)+'" alt="" loading="lazy">':'<b>'+esc(c.title.charAt(0))+'</b>')+'</span>';
 document.getElementById('list').innerHTML=list.map(c=>{
  if(c.soon)return '<div class="course soon" aria-disabled="true">'+art(c)+'<span class="body"><span class="t">'+esc(c.title)+'</span><span class="tags"><span class="tag soon">Not available yet</span></span></span></div>';
  if(c.notesOnly)return '<a class="course" href="reviewer.html?course='+encodeURIComponent(c.id)+'">'+art(c)+'<span class="body"><span class="t">'+esc(c.title)+'</span><span class="tags"><span class="tag exam">Notes &amp; transes</span><span class="tag soon">Questions coming soon</span></span></span></a>';
  const s=summary(c.storageKey),pct=s&&s.t?Math.round(100*s.m/s.t):0;
  return '<a class="course" href="reviewer.html?course='+encodeURIComponent(c.id)+'">'+
   '<span class="art">'+(c.image?'<img src="'+esc(c.image)+'" alt="" loading="lazy">':'<b>'+esc(c.title.charAt(0))+'</b>')+'</span>'+
   '<span class="body"><span class="t">'+esc(c.title)+'</span>'+
   (c.exam?'<span class="tags">'+examTag(c.exam)+'</span>':'')+
   '<span class="prog"><span class="track" style="display:block"><span class="fill" style="display:block;width:'+pct+'%"></span></span><span class="meta"><span>'+(s?(s.scope&&!(c.exam&&c.exam.name===s.scope)?esc(s.scope)+': ':'')+pct+'% mastered':'Not started')+'</span><span>'+(s?'studied '+ago(s.at):'')+'</span></span></span></span></a>'}).join('');
})();
// Offer the APMed '33 colors once (until the person picks Try it or No thanks). Same setting as Personalize → Appearance → Colors.
function setPal(p){const d=document.documentElement;try{if(p){d.dataset.palette=p;localStorage.setItem('reviewer_palette',p)}else{delete d.dataset.palette;localStorage.removeItem('reviewer_palette')}}catch(e){}}
function tryBox(step){const b=document.getElementById('try');try{if(step==='ask'&&(localStorage.getItem('reviewer_palette')||localStorage.getItem('reviewer_palette_asked')))return}catch(e){return}
 if(step!=='ask')try{localStorage.setItem('reviewer_palette_asked','1')}catch(e){}
 if(step==='done'||step==='no'){b.hidden=true;return}
 const sw='<span class="sw" aria-hidden="true"><i style="background:#f5eedb"></i><i style="background:#1d7a80"></i><i style="background:#e3a21a"></i></span>';
 b.innerHTML=step==='ask'
  ?sw+'<p><b>New: APMed \'33 colors.</b> Cream, teal and mustard, from the batch logo. Want to try them?</p><span class="row"><button class="btn primary" onclick="setPal(\'apmed\');tryBox(\'tried\')">Try it</button><button class="btn" onclick="tryBox(\'no\')">No thanks</button></span>'
  :sw+'<p><b>Like it?</b> You can change it any time in a course\'s Personalize → Appearance → Colors.</p><span class="row"><button class="btn primary" onclick="tryBox(\'done\')">Keep it</button><button class="btn" onclick="setPal(null);tryBox(\'done\')">Switch back</button></span>';
 b.hidden=false}
tryBox('ask');
// Shown once to everyone (new and returning): Sign in & sync, and Discuss, which are easy to miss.
const SPOT_KEY='reviewer_spot_sync_discuss';
function spotlight(){try{if(localStorage.getItem(SPOT_KEY))return;localStorage.setItem(SPOT_KEY,'1')}catch(e){return}
 if(!document.getElementById('sync').hidden)return;const a=getAcc();
 document.getElementById('spotbody').innerHTML=
  '<div class="spot"><span class="ic" aria-hidden="true">☁️</span><div><h3>Sign in to sync your progress</h3><p>Sign in with Google once and your progress follows you to your phone, laptop and any browser. Switch devices without starting over, and nothing is lost if you clear your browser.</p>'+
   (a?'<span class="ok">✓ You&#39;re signed in, so your progress already syncs.</span>':'<button class="btn primary" onclick="closeSpot();signIn()">Sign in with Google</button>')+'</div></div>'+
  '<div class="spot"><span class="ic" aria-hidden="true">💬</span><div><h3>Discuss any question</h3><p>In <b>Intro to Psychology</b>, tap <b>Discuss this question</b> under any question to ask classmates or explain an answer. It opens beside the question, so you keep your place.</p><a class="btn" href="reviewer.html?course=psych">Open Psychology</a></div></div>'+
  '<div class="spotfoot"><button class="btn" onclick="closeSpot()">Got it</button></div>';
 document.getElementById('spot').hidden=false}

// Next class (or the one going on now), from schedule.json
(async function(){try{await Sched.load();const c=Sched.upNext();if(!c)return;const e=document.getElementById('upnext');
 e.style.setProperty('--h',+c.subj.hue||260);
 e.innerHTML='<span class="bar"></span><span class="w"><span class="l'+(c.now?' live':'')+'">'+(c.now?'Now · until '+Sched.time(c.end):'Next class · '+Sched.when(c.date)+', '+Sched.time(c.start))+'</span><b>'+esc(c.subj.name)+(c.kind?' · '+esc(c.kind):'')+'</b><span class="s">'+esc(c.topic||c.teacher||'')+'</span></span><span class="go">Timetable →</span>';
 e.hidden=false}catch(err){}})();
// Test countdown: the next exams, evals and quizzes on the timetable (next 14 days), ticking every second.
(async function(){try{await Sched.load();const box=document.getElementById('tests');let list=[];
 const pick=()=>{const now=new Date();list=Remind.list(3,now).filter(a=>a.from-now<14*864e5).slice(0,4)};
 const left=ms=>{const s=Math.max(0,Math.floor(ms/1e3)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60,p=n=>String(n).padStart(2,'0');
  return d>=1?d+'d '+h+'h '+p(m)+'m':h>=1?h+'h '+p(m)+'m '+p(x)+'s':m+'m '+p(x)+'s'};
 const draw=()=>{pick();if(!list.length){box.hidden=true;return}
  box.innerHTML='<h2>'+ic('hourglass')+' Tests coming up<a href="notifications.html#settings">Reminders →</a></h2>'+list.map((a,i)=>{const c=a.subj.course;
   return '<a class="trow'+(i?' more':' first')+'" style="--h:'+(+a.subj.hue||260)+'" href="'+(c?'reviewer.html?course='+encodeURIComponent(c):'schedule.html')+'"><span class="bar"></span><span class="w"><b>'+esc(a.subj.name)+'</b><span class="s">'+esc(Sched.when(a.date))+', '+esc(Sched.time(a.start))+' · '+esc(a.label)+'</span></span><span class="cd"><b data-at="'+(+a.from)+'"></b><span>'+(c?'Review now →':'Timetable →')+'</span></span></a>'}).join('');
  const n=list.length-1;if(n>0)box.insertAdjacentHTML('beforeend','<button class="tmore" aria-expanded="false" onclick="testsToggle()"><span></span><svg class="i" width="14" height="14"><use href="icons.svg#i-chevron-down"/></svg></button>');
  testsOpen(OPEN());box.hidden=false;tick()};
 // collapsed by default: only the nearest test; the choice is remembered on this device
 const OPEN=()=>{try{return localStorage.getItem('reviewer_tests_open')==='1'}catch(e){return false}};
 window.testsToggle=()=>testsOpen(!box.classList.contains('open'));
 window.testsOpen=o=>{box.classList.toggle('open',o);try{localStorage.setItem('reviewer_tests_open',o?'1':'0')}catch(e){}const b=box.querySelector('.tmore');if(b){const n=list.length-1;b.setAttribute('aria-expanded',o);b.firstChild.textContent=o?'Show less':'Show '+n+' more test'+(n>1?'s':'')}};
 const tick=()=>{const now=Date.now();let gone=false;box.querySelectorAll('[data-at]').forEach(b=>{const ms=+b.dataset.at-now;if(ms<=0)gone=true;b.textContent=left(ms);b.closest('.trow').classList.toggle('soon',ms<864e5)});if(gone)draw()};
 draw();setInterval(tick,1000)}catch(err){}})();
// Install: Android/desktop Chrome offer a prompt; iPhone needs Share → Add to Home Screen.
// The browser only offers the prompt while the app isn't installed, so after an uninstall the link comes back by itself.
// Anything but a normal browser tab (standalone, minimal-ui, window controls overlay) is the installed app.
const standalone=!matchMedia('(display-mode: browser)').matches||navigator.standalone;
let deferred=null,installed=standalone;try{localStorage.removeItem('reviewer_installed')}catch(e){}
const markInstalled=()=>{installed=true;document.getElementById('install').hidden=true};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!installed)document.getElementById('install').hidden=false});
addEventListener('appinstalled',markInstalled);
if(navigator.getInstalledRelatedApps)navigator.getInstalledRelatedApps().then(a=>{if(a.length)markInstalled()}).catch(()=>{});
document.getElementById('installbtn').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;markInstalled()};
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone)document.getElementById('ios').hidden=false;
function curTheme(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
// a sun or moon; the words show next to it on wider screens
function drawTheme(){const b=document.getElementById('theme'),dark=curTheme()==='dark',l=dark?'Light mode':'Dark mode';b.title=l;b.setAttribute('aria-label',l);
 b.innerHTML=ic(dark?'sun':'moon')+'<span class="tl">'+l+'</span>'}
function toggleTheme(){const t=curTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('reviewer_theme',t)}catch(e){}drawTheme()}
drawTheme();
// Sync (optional cloud): the same code the courses use ("reviewer_sync"), so linking here covers every course.
// Progress itself moves when each course is opened; this only stores the code.
const SYNC_KEY='reviewer_sync';let CLOUD=null;
const $=id=>document.getElementById(id);
function getCode(){try{return (JSON.parse(localStorage.getItem(SYNC_KEY))||{}).code||''}catch(e){return ''}}
function setCode(c){try{c?localStorage.setItem(SYNC_KEY,JSON.stringify({code:c})):localStorage.removeItem(SYNC_KEY)}catch(e){}}
const spaced=c=>c.replace(/(.{4})(?=.)/g,'$1 ');
function rpc(fn,body){const h={'Content-Type':'application/json',apikey:CLOUD.key};if(/^eyJ/.test(CLOUD.key))h.Authorization='Bearer '+CLOUD.key;
 return fetch(CLOUD.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body)}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})}
function openSync(){drawSync();$('sync').hidden=false}
function closeSync(){$('sync').hidden=true}
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sync').hidden)closeSync()});
// ---- Sign in with Google (Supabase Auth). The account gets one sync code; signing in gives this device that code.
const ACC_KEY='reviewer_account';
function getAcc(){try{return JSON.parse(localStorage.getItem(ACC_KEY))||null}catch(e){return null}}
const G='<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>';
function avatar(a,cls){return a&&a.avatar?'<img'+(cls?' class="'+cls+'"':'')+' src="'+esc(a.avatar)+'" alt="" referrerpolicy="no-referrer">':'<div class="av">'+esc(((a&&(a.name||a.email))||'?').charAt(0).toUpperCase())+'</div>'}
function drawSyncBtn(){const a=getAcc(),b=$('syncbtn');if(!b)return;b.innerHTML=a?(a.avatar?'<img src="'+esc(a.avatar)+'" alt="" referrerpolicy="no-referrer">':'')+'<span class="nm">'+esc((a.name||a.email||'Account').split(' ')[0])+'</span>':'Sign in'}
function signIn(){if(!CLOUD)return;const back=location.origin+location.pathname;
 location.href=CLOUD.url.replace(/\/+$/,'')+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(back)}
// Back from Google: the token arrives in the address (#access_token=...). Use it once to get the account's code and name.
async function finishSignIn(){const h=new URLSearchParams(location.hash.slice(1));
 if(!h.get('access_token')&&!h.get('error'))return false;
 history.replaceState(null,'',location.pathname);
 if(h.get('error')){openSync();drawSync('Sign-in was cancelled or failed. '+(h.get('error_description')||'').replace(/\+/g,' '));return true}
 const tok=h.get('access_token'),base=CLOUD.url.replace(/\/+$/,''),hd={'Content-Type':'application/json',apikey:CLOUD.key,Authorization:'Bearer '+tok};
 openSync();$('syncbody').innerHTML='<p>Signing you in…</p>';
 try{localStorage.setItem('reviewer_session',JSON.stringify({access:tok,refresh:h.get('refresh_token'),exp:Date.now()+(+h.get('expires_in')||3600)*1000-60000}))}catch(e){}
 try{
  const code=await fetch(base+'/rest/v1/rpc/account_code',{method:'POST',headers:hd,body:JSON.stringify({p_code:getCode()||null})}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
  const u=await fetch(base+'/auth/v1/user',{headers:hd}).then(r=>r.ok?r.json():{});
  const m=u.user_metadata||{};
  if(!/^[A-Z0-9]{12}$/.test(code||''))throw new Error('no code');
  const was=getCode();setCode(code);
  try{localStorage.setItem(ACC_KEY,JSON.stringify({name:m.full_name||m.name||'',email:u.email||m.email||'',avatar:m.avatar_url||m.picture||'',at:Date.now()}))}catch(e){}
  drawSyncBtn();drawSync(was&&was!==code?'Signed in. Open your courses and your progress here is combined with your account.':'Signed in. Your progress now follows you on every device where you sign in.',true)
 }catch(e){drawSync('Could not finish signing in. Check your connection and try again.')}
 return true}
function signOut(sure){if(sure!==true){ask('Your progress stays here, but it stops syncing until you sign in again.',{title:'Sign out on this device?',ok:'Sign out',danger:1}).then(y=>{if(y)signOut(true)});return}
 try{localStorage.removeItem(ACC_KEY);localStorage.removeItem('reviewer_session')}catch(e){}setCode('');drawSyncBtn();drawSync('Signed out.',true)}
function drawSync(msg,ok){const c=getCode(),a=getAcc(),b=$('syncbody');$('synch').textContent=a&&c?'Your account':'Sign in to sync';const note='<p class="msg'+(ok?' ok':'')+'" id="syncmsg">'+(msg||'')+'</p>';
 if(a&&c){b.innerHTML='<div class="who">'+avatar(a)+'<div><b>'+esc(a.name||'Signed in')+'</b><span>'+esc(a.email||'')+'</span></div></div>'+
  '<p>Your progress in every course syncs to this account. Sign in with the same Google account on your other devices.</p>'+note+
  '<div class="row"><button class="btn" onclick="signOut()">Sign out</button></div>';return}
 b.innerHTML='<p>Keep the same progress on your phone and laptop, for every course at once.</p>'+
  '<button class="gbtn" onclick="this.disabled=true;signIn()">'+G+'Sign in with Google</button>'+
  (c?note+'<details class="alt" open><summary>Or keep using your sync code</summary><p>This device syncs with this code:</p><div class="codebox">'+spaced(c)+'</div>'+
    '<p>Signing in keeps everything already synced under this code.</p><div class="row"><button class="btn" onclick="copyCode()">Copy code</button><button class="btn" onclick="stopSync()">Stop syncing here</button></div></details>'
  :note+'<details class="alt"><summary>Use a sync code instead</summary>'+
    '<label class="lbl" for="codein">Have a code from your other device?</label><div class="row"><input class="code" id="codein" maxlength="16" placeholder="ABCD EFGH JKLM" autocomplete="off" autocapitalize="characters" spellcheck="false" onkeydown="if(event.key===\'Enter\')linkSync()"><button class="btn primary" id="linkbtn" onclick="linkSync()">Link</button></div>'+
    '<p>No code yet? <button class="linkbtn" onclick="startSync()">Make a new code</button></p></details>')}
function linkSync(){const v=($('codein').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(v.length!==12){drawSync('A sync code has 12 letters and numbers.');$('codein').value=v;return}
 $('linkbtn').disabled=true;$('linkbtn').textContent='Checking…';
 rpc('sync_known',{p_code:v}).then(ok=>{if(!ok){drawSync('Nothing is saved under that code yet. Check it, or open a course on the other device first.');$('codein').value=v;return}
  setCode(v);drawSync('Linked. Open your courses and their progress from both devices is combined.',true)})
 .catch(()=>{drawSync('Could not check the code. Check your connection and try again.');$('codein').value=v})}
function startSync(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=new Uint8Array(12);crypto.getRandomValues(r);setCode(Array.from(r,x=>A[x%32]).join(''));
 drawSync('Your progress uploads each time you open a course on this device.',true)}
function copyCode(){const c=getCode();(navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(c):Promise.reject()).then(()=>drawSync('Copied.',true),()=>copyBox(c))}
function stopSync(sure){if(sure!==true){ask('Your progress stays here, and the other device keeps its own.',{title:'Stop syncing this device?',ok:'Stop syncing',danger:1}).then(y=>{if(y)stopSync(true)});return}setCode('');try{localStorage.removeItem(ACC_KEY)}catch(e){}drawSyncBtn();drawSync()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>

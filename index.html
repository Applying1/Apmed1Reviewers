<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Reviewers</title>
<meta name="description" content="Practice questions, notes and matching sets for our courses.">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('reviewer_theme')||localStorage.getItem('psych_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
 --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --serif:"Source Serif 4","Iowan Old Style",Charter,Georgia,serif;
 --ease:cubic-bezier(.2,.7,.2,1);
 color-scheme:light;
 --bg:#f6f4ef;--surface:#fff;--raised:#f3f0e9;--line:#e8e3d9;--line2:#d8d1c4;
 --text:#1d1b18;--mute:#5f5a51;--faint:#8e877b;
 --accent:#4f46e5;--accent-ink:#fff;--accent-soft:#eeeefd;--accent-line:#c4c3f6;--accent-2:#7c3aed;--good:#1d8657;
 --shadow:0 1px 2px #1018280a,0 1px 3px #1018280f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 color-scheme:dark;--bg:#0f1117;--surface:#181b25;--raised:#1f2330;--line:#272b38;--line2:#383d4e;
 --text:#ecebf2;--mute:#a09fb0;--faint:#6f6e80;--accent:#a5a8ff;--accent-ink:#14153a;--accent-soft:#25264a;--accent-line:#4a4c8f;--accent-2:#c4a5ff;--good:#4fd3a1;--shadow:0 1px 2px #0006}}
:root[data-theme="dark"]{
 color-scheme:dark;--bg:#0f1117;--surface:#181b25;--raised:#1f2330;--line:#272b38;--line2:#383d4e;
 --text:#ecebf2;--mute:#a09fb0;--faint:#6f6e80;--accent:#a5a8ff;--accent-ink:#14153a;--accent-soft:#25264a;--accent-line:#4a4c8f;--accent-2:#c4a5ff;--good:#4fd3a1;--shadow:0 1px 2px #0006}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1000px;margin:0 auto;padding:40px 24px 64px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:40px;height:40px;border-radius:12px;box-shadow:0 2px 8px color-mix(in oklab,var(--accent) 35%,transparent)}
.brand b{display:block;font-size:16px}
.brand span{color:var(--mute);font-size:13px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .acts{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:8px 14px;font-weight:600;font-size:14px;border:1px solid var(--line2);background:var(--surface);text-decoration:none;transition:background .15s}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
h1{font:600 clamp(26px,3.2vw,34px)/1.2 var(--serif);letter-spacing:-.4px;margin:36px 0 6px}
.lede{color:var(--mute);margin:0 0 26px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.course{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;transition:transform .18s var(--ease),box-shadow .18s,border-color .18s}
.course:hover{transform:translateY(-3px);border-color:var(--accent-line);box-shadow:0 10px 28px color-mix(in oklab,var(--accent) 14%,transparent)}
.art{aspect-ratio:16/9;background:radial-gradient(120% 120% at 0 0,color-mix(in oklab,var(--accent) 18%,var(--surface)),var(--surface) 70%);display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
.art img{width:100%;height:100%;object-fit:cover}
.art b{font:600 56px/1 var(--serif);color:var(--accent);opacity:.4}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.body .t{font:600 18px/1.3 var(--serif)}
.body .s{color:var(--mute);font-size:13.5px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--raised);color:var(--mute)}
.tag.exam{background:var(--accent-soft);color:var(--accent)}
.prog{margin-top:auto;padding-top:12px}
.track{height:6px;border-radius:9px;background:var(--raised);overflow:hidden}
.fill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.note{margin-top:28px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--mute);font-size:13.5px}
.note b{color:var(--text)}
.empty{color:var(--faint)}
@media (max-width:520px){main{padding:24px 16px 48px}.top .acts{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main>
 <div class="top">
  <div class="brand"><img src="icons/icon-192.png" alt="" width="40" height="40"><div><b>Study Reviewers</b><span>Practice, notes and matching</span></div></div>
  <div class="acts"><button class="btn primary" id="install" hidden>Install app</button><button class="btn" id="theme" onclick="toggleTheme()">Theme</button></div>
 </div>
 <h1 id="hi">Pick a course</h1>
 <p class="lede">Your progress saves in this browser, so use the same browser each time. Courses work offline once you've opened this page.</p>
 <div class="grid" id="list"><p class="empty">Loading courses…</p></div>
 <p class="note" id="ios" hidden><b>On iPhone:</b> tap the Share button in Safari, then <b>Add to Home Screen</b> to use this like an app.</p>
</main>
<script>
// Links shared on Facebook/Messenger get ?fbclid=... added; drop it so the address stays clean when copied again.
if(/[?&](fbclid|utm_[a-z]+|gclid)=/.test(location.search))history.replaceState(null,'',location.pathname);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// The course's next test, e.g. "Midterm · in 4 days" (from courses.json, set by activeExam).
function examTag(e){if(!e)return '';let w='';if(e.date){const t=new Date();t.setHours(0,0,0,0);const n=Math.round((new Date(e.date+'T00:00')-t)/864e5);w=n<0?'':n===0?' · today':n===1?' · tomorrow':' · in '+n+' days'}return '<span class="tag exam">'+esc(e.name)+w+'</span>'}
function ago(t){const d=Math.floor((Date.now()-t)/864e5);return d<=0?'today':d===1?'yesterday':d+' days ago'}
function summary(key){try{return JSON.parse(localStorage.getItem(key+'_summary'))}catch(e){return null}}
function name(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.endsWith('_summary'))continue;const v=JSON.parse(localStorage.getItem(k));if(v&&v.name)return v.name}}catch(e){}return ''}
(async function(){
 const n=name();if(n)document.getElementById('hi').textContent='Hi, '+n+'. Pick a course';
 let list;
 try{list=await (await fetch('courses.json')).json()}
 catch(e){document.getElementById('list').innerHTML='<p class="empty">Courses could not be loaded. Check your connection and reload.</p>';return}
 document.getElementById('list').innerHTML=list.map(c=>{const s=summary(c.storageKey),pct=s&&s.t?Math.round(100*s.m/s.t):0;
  return '<a class="course" href="reviewer.html?course='+encodeURIComponent(c.id)+'">'+
   '<span class="art">'+(c.image?'<img src="'+esc(c.image)+'" alt="" loading="lazy">':'<b>'+esc(c.title.charAt(0))+'</b>')+'</span>'+
   '<span class="body"><span class="t">'+esc(c.title)+'</span><span class="s">'+esc(c.scope)+' · '+c.count+' '+esc(c.itemWord)+'s</span>'+
   (c.exam||c.extras.length?'<span class="tags">'+examTag(c.exam)+c.extras.map(x=>'<span class="tag">+ '+esc(x)+'</span>').join('')+'</span>':'')+
   '<span class="prog"><span class="track" style="display:block"><span class="fill" style="display:block;width:'+pct+'%"></span></span><span class="meta"><span>'+(s?(s.scope&&!(c.exam&&c.exam.name===s.scope)?esc(s.scope)+': ':'')+pct+'% mastered':'Not started')+'</span><span>'+(s?'studied '+ago(s.at):'')+'</span></span></span></span></a>'}).join('');
})();
// Install: Android/desktop Chrome offer a prompt; iPhone needs Share → Add to Home Screen.
let deferred=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('install').hidden=false});
document.getElementById('install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;document.getElementById('install').hidden=true};
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone)document.getElementById('ios').hidden=false;
function curTheme(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function drawTheme(){document.getElementById('theme').textContent=curTheme()==='dark'?'Light mode':'Dark mode'}
function toggleTheme(){const t=curTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('reviewer_theme',t)}catch(e){}drawTheme()}
drawTheme();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>

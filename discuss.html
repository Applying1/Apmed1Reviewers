<script>
const $=id=>document.getElementById(id);

// Google can't show its sign-in inside a frame: in the panel, sign in in the whole window and come back here, then to the course.

let posts=[],oldest=null,poll=null,busy=false;
const G='<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>';
function ago(t){const s=(Date.now()-new Date(t))/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400)return Math.floor(s/3600)+' h ago';
 const d=new Date(t);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+(s>31536000?', '+d.getFullYear():'')}
function linkify(s){return esc(s).replace(/\bhttps?:\/\/[^\s<]+[^\s<.,;:!?)\]'"]/g,u=>'<a href="'+u+'" target="_blank" rel="noopener nofollow">'+u+'</a>')}
// the avatar and name open the poster's card (display name, Google account name for signed-in viewers, Moderator)
function body(p){let h=linkify(p.body);const ns=(p.mention_names||[]).filter(Boolean).sort((a,b)=>b.length-a.length);ns.forEach((n,i)=>{h=h.split('@'+esc(n)).join('\u0000'+i+'\u0001')});
 return h.replace(/\u0000(\d+)\u0001/g,(m,i)=>'<span class="ment">@'+esc(ns[+i])+'</span>')}
function quote(p){if(!p.reply_to)return '';return '<button class="rq" onclick="jump('+p.reply_to+')">↩ <b>'+esc(p.reply_author||'A post')+'</b> '+esc(p.reply_body||'')+'</button>'}
function postHTML(p){return '<div class="post'+(p.pinged?' pinged':'')+(p.announce?' ann':'')+'" id="p'+p.id+'"><button class="avb" onclick="who('+p.id+')" aria-label="About '+esc(p.author)+'">'+Profile.html({av:p.av,url:p.avatar,name:p.author},36)+'</button>'+
 '<div class="pb"><div class="ph"><span class="who"><button class="nmb" onclick="who('+p.id+')">'+esc(p.author)+'</button>'+(p.announce?'<span class="tag">Announcement</span>':p.is_mod?'<span class="mod">Moderator</span>':'')+'<time datetime="'+esc(p.created_at)+'" title="'+esc(new Date(p.created_at).toLocaleString())+'">'+ago(p.created_at)+'</time></span>'+
 (p.can_delete?'<button class="del" onclick="del('+p.id+')">Delete</button>':'')+'</div>'+quote(p)+'<div class="tx">'+body(p)+'</div>'+
 (Auth.ses()&&(!p.mine||CANPIN)?'<div class="acts">'+(p.mine?'':'<button onclick="replyTo('+p.id+')">Reply</button>')+(CANPIN?'<button onclick="pin('+p.id+','+!p.pinned+')">'+(p.pinned?'Unpin':'Pin')+'</button>':'')+'</div>':'')+'</div></div>'}
// the class secretary pins or unpins any post (pinned posts sit in the box at the top, for everyone)
async function pin(id,on){try{await Auth.rpc('discussion_pin',{p_id:id,p_on:on},true);pingOthers();await load();if(on)scrollTo({top:0,behavior:'smooth'})}catch(e){tell(e.message||'Could not change the pin.')}}
function jump(id){const e=$('p'+id);if(!e){tell('That post is further up. Tap Show earlier posts.');return}e.scrollIntoView({block:'center',behavior:'smooth'});e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')}
function drawList(stick){const L=$('list'),atEnd=innerHeight+scrollY>=document.body.scrollHeight-80,pinned=new Set(PINS.map(p=>p.id)),shown=posts.filter(p=>!pinned.has(p.id));
 $('pins').hidden=!PINS.length;$('pins').innerHTML=PINS.length?'<h2>📌 Pinned</h2>'+PINS.map(postHTML).join(''):'';
 L.innerHTML=shown.length?shown.map(postHTML).join(''):PINS.length?'<p class="empty">No other posts yet.</p>':'<p class="empty">'+(qid?'No posts about this question yet. Ask or explain it here!':'No posts yet. Start the conversation!')+'</p>';
 if(stick||atEnd)scrollTo(0,document.body.scrollHeight)}
async function load(first){if(busy)return;busy=true;
 try{const [rows,pins]=await Promise.all([Auth.rpc('discussion_list',{p_thread:thread,p_before:null},true),Auth.rpc('discussion_list',{p_thread:thread,p_before:null,p_pins:true},true).catch(()=>[])]);
  const fresh=rows.slice().reverse(),psig=JSON.stringify((pins||[]).filter(p=>p.pinned).map(p=>[p.id,p.author,p.av])),pinsChanged=psig!==JSON.stringify(PINS.map(p=>[p.id,p.author,p.av]));PINS=(pins||[]).filter(p=>p.pinned);
  // keep earlier pages already loaded
  const ids=new Set(fresh.map(p=>p.id)),older=posts.filter(p=>!ids.has(p.id)&&p.id<(fresh[0]?fresh[0].id:Infinity));
  const sig=l=>JSON.stringify(l.map(p=>[p.id,p.can_delete,p.author,p.av,p.avatar,p.pinned])),changed=sig(older.concat(fresh))!==sig(posts)||pinsChanged;
  posts=older.concat(fresh);if(first){oldest=fresh.length?fresh[0].id:null;$('more').hidden=rows.length<100}
  if(first||changed)drawList(first);
  else document.querySelectorAll('.post time').forEach(t=>t.textContent=ago(t.getAttribute('datetime')));
 }catch(e){if(first)$('list').innerHTML='<p class="empty">The discussion could not be loaded. Check your connection and reload.</p>'}

async function loadMore(){if(oldest==null)return;$('more').disabled=true;
 try{const rows=await Auth.rpc('discussion_list',{p_thread:thread,p_before:oldest},true),h=document.body.scrollHeight;
  posts=rows.slice().reverse().concat(posts);oldest=rows.length?rows[rows.length-1].id:oldest;$('more').hidden=rows.length<100;
  drawList(false);scrollTo(0,scrollY+document.body.scrollHeight-h)}catch(e){}
 $('more').disabled=false}
async function send(){const t=$('msg'),b=t.value.trim(),btn=$('sendbtn');if(!b)return;
 btn.disabled=true;$('note').textContent='';$('note').className='';
 const ments=MENT.filter(m=>b.includes('@'+m.name)).map(m=>m.id);
 const ann=GENERAL&&CANPIN&&$('annchk')&&$('annchk').checked;
 if(ann){btn.disabled=true;const go=await ask('It is pinned at the top of General, shown as a banner on everyone\u2019s home page, and sent as a push notification to every phone that has them on.',{title:'Post this announcement?',ok:'Announce'});btn.disabled=false;if(!go)return;
  btn.disabled=true;try{await Auth.rpc('discussion_announce',{p_body:b},true);t.value='';$('annchk').checked=false;annHint();grow();pingOthers();await load();scrollTo({top:0,behavior:'smooth'})}catch(e){tell(e.message||'Could not post the announcement.')}btn.disabled=false;return}
 try{await Auth.rpc('discussion_post',Object.assign({p_thread:thread,p_body:b},REPLY?{p_reply_to:REPLY.id}:{},ments.length?{p_mentions:ments}:{}),true);t.value='';MENT=[];REPLY=null;drawChip();grow();pingOthers();await load();drawList(true)}
 catch(e){$('note').textContent=/JWT|sign in|401/i.test(e.message)?'Your sign-in expired. Sign in again to post.':e.message;$('note').className='err';
  if(!(await Auth.token())){drawDock()}}
 btn.disabled=false;t.focus()}
function who(id){const p=posts.find(x=>x.id===id);if(p)Profile.card(p,editMe)}
function editMe(){Profile.edit().then(a=>{if(a){drawDock();load(true)}})}
async function del(id){if(!await ask('This cannot be undone.',{title:'Delete this post?',ok:'Delete',danger:1}))return;
 try{await Auth.rpc('discussion_delete',{p_id:id},true);posts=posts.filter(p=>p.id!==id);drawList(false);pingOthers()}catch(e){tell('Could not delete it. Try again.')}}
// Live: others viewing this thread reload at once; the course pages hear about it too (pop-ups, red dots)
function pingOthers(){if(!window.Live)return;Live.ping('discuss:'+thread);Live.ping('course:'+course,{thread})}
// ---- replies and @mentions: REPLY = the post being answered; MENT = people picked from the @ list (sent only if still in the text)
let REPLY=null,MENT=[],PEOPLE=null,MQ=null,MSEL=0;
function replyTo(id){const p=posts.find(x=>x.id===id);if(!p)return;REPLY={id,author:p.author,body:p.body};drawChip();const t=$('msg');if(t)t.focus()}
function drawChip(){const c=$('rchip');if(!c)return;c.hidden=!REPLY;if(REPLY)c.innerHTML='<span>Replying to <b>'+esc(REPLY.author)+'</b> · '+esc(String(REPLY.body).slice(0,80))+'</span><button onclick="REPLY=null;drawChip()" aria-label="Cancel the reply">×</button>'}
async function people(){if(PEOPLE)return PEOPLE;try{PEOPLE=await Auth.rpc('discussion_people',{},true)||[]}catch(e){PEOPLE=[]}return PEOPLE}
function mentionAt(){const t=$('msg');if(!t)return null;const pre=t.value.slice(0,t.selectionStart),m=pre.match(/(^|\s)@([^\s@]{0,24}(?: [^\s@]{0,24})?)$/);return m?{q:m[2],at:pre.length-m[2].length-1}:null}
async function mentionList(){const box=$('mlist'),m=mentionAt();if(!box)return;if(!m){box.hidden=true;MQ=null;return}
 const all=await people(),q=m.q.toLowerCase(),hit=all.filter(x=>!q||x.name.toLowerCase().split(/\s+/).some(w=>w.startsWith(q))||x.name.toLowerCase().startsWith(q)).slice(0,8);
 MQ={at:m.at,len:m.q.length+1,hit};MSEL=Math.min(MSEL,Math.max(0,hit.length-1));box.hidden=false;
 box.innerHTML=hit.length?hit.map((x,i)=>'<button type="button" class="'+(i===MSEL?'on':'')+'" onmousedown="event.preventDefault()" onclick="pickMention('+i+')">'+Profile.html({av:x.av,url:x.avatar,name:x.name},26)+esc(x.name)+'</button>').join(''):'<p>No classmate by that name.</p>'}
function pickMention(i){const t=$('msg'),x=MQ&&MQ.hit[i];if(!t||!x)return;const v=t.value,ins='@'+x.name+' ';
 t.value=v.slice(0,MQ.at)+ins+v.slice(MQ.at+MQ.len);const pos=MQ.at+ins.length;t.setSelectionRange(pos,pos);if(!MENT.some(m=>m.id===x.id))MENT.push({id:x.id,name:x.name});

function mentionKey(e){if(!MQ||$('mlist').hidden||!MQ.hit.length)return false;

function annHint(){const c=$('annchk'),b=$('sendbtn');if(b)b.textContent=c&&c.checked?'Announce':'Post'}
function drawDock(msg){const a=Auth.acc(),d=$('dock');if(!msg&&Auth.ended())msg='Your sign-in ended on this device. Sign in again to post.';

(async function(){
 if(!/^[a-z0-9_-]{1,40}$/.test(course)||(qid&&!/^[a-z0-9_.-]{1,60}$/.test(qid))){$('list').innerHTML='<p class="empty">This discussion could not be found.</p>';return}
 $('back').href=GENERAL?'./':'reviewer.html?course='+encodeURIComponent(course);
 if(GENERAL){$('back').textContent='← All courses';$('ttl').textContent='General discussion';document.title='General discussion · APMed \'33';
  $('lede').textContent='For the whole class: anything that isn\u2019t about one course. Posts show your display name and picture, and classmates can tap them to see your Google account name, so keep it kind.'}
 if(qid){$('back').textContent='← Back to practice';$('back').onclick=e=>{if(history.length>1&&document.referrer.includes('reviewer.html')){e.preventDefault();history.back()}}}
 let list=[];try{list=await (await fetch('courses.json')).json()}catch(e){}
 const c=list.find(x=>x.id===course),cl=(list.find(x=>x.cloud&&x.cloud.url)||{}).cloud;
 if(c){$('ttl').textContent=qid?'Question discussion':c.title+' discussion';document.title=(qid?'Question':c.title)+' discussion · APMed \'33'}
 if(qid){$('lede').textContent='Talk about this one: why the answer is right, how to remember it, what confused you.';
  try{const d=await (await fetch('courses/'+course+'.json')).json(),it=(d.bank||[]).find(x=>String(x.id).toLowerCase()===qid);
   if(it){const q=it.q||it.term,ans=it.q?it.a:it.definition;
    $('qbox').innerHTML='<div class="qcard"><div class="k">'+esc(it.section||'')+(c?' · '+esc(c.title):'')+'</div><div class="q">'+esc(q)+'</div>'+
    '<details><summary>'+(it.q?'Show the answer':'Show the meaning')+'</summary><p><b>'+esc(ans||'')+'</b></p>'+(it.why?'<p>'+esc(it.why)+'</p>':'')+'</details>'+
    '<a class="all" href="discuss.html?c='+encodeURIComponent(course)+(EMBED?'&embed=1':'')+'">All '+esc(c?c.title:'course')+' discussion →</a></div>'}}catch(e){}}
 if(!cl){$('list').innerHTML='<p class="empty">The discussion could not be loaded. Check your connection and reload.</p>';return}
 Auth.cloud=cl;
 let msg='',done=null;try{done=await Auth.finish()}catch(e){msg=e.message}
 // signed in from the panel: go back to the course, which reopens the panel
 const ret=Q.get('return');if(done&&ret){try{const u=new URL(ret);if(u.origin===location.origin){location.replace(u.href);return}}catch(e){}}
 if(Auth.ses()){await Auth.token();if(Auth.ses()){await Profile.refresh();try{CANPIN=(await Auth.rpc('discussion_can_pin',{},true))===true}catch(e){}}}
 drawDock(msg);
 await load(true);
 const hp=location.hash.match(/^#p(\d+)$/);if(hp)setTimeout(()=>jump(+hp[1]),300);
 // instant via Realtime; the slow check is only a backup for sleeping phones and dropped connections
 if(window.Live)Live.listen(cl,'discuss:'+thread,()=>load(),()=>load());
 poll=setInterval(()=>{if(document.visibilityState==='visible')load()},60000);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');

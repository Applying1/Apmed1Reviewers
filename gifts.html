<style>
/* Gift exchange with codenames (supabase_gifts.sql). SECRET: this page only ever receives codename + wishlist (gift_state),
   never a name, roll, picture or time, and it saves nothing on the device. Keep it that way. */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{max-width:640px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--mute);font-size:14px;font-weight:600;padding:6px 10px 6px 6px;border-radius:10px}
.back:hover{color:var(--text);background:var(--raised)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:9px 16px;font-weight:600;font-size:14.5px;border:1px solid var(--line2);background:var(--surface);text-decoration:none;transition:background .15s;color:var(--text)}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.6;cursor:default}

/* header */
.hero{text-align:center;margin:14px 0 22px}
.hero .ico{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line,transparent)}
h1{font:600 30px/1.15 var(--serif);letter-spacing:-.3px;margin:12px 0 6px}
.sub{margin:0 auto;max-width:400px;color:var(--mute);font-size:14.5px}

.card{margin:0 0 14px;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.card p{margin:0 0 12px;color:var(--mute);font-size:14px}
.card p:last-child{margin-bottom:0}
.err{color:var(--bad,#c0392b)!important}
.empty{color:var(--faint);font-size:14px;text-align:center;padding:22px 12px;margin:0}

/* your codename: a gift tag */
.tag{padding:0;overflow:hidden}
.taghead{display:flex;align-items:center;gap:10px;padding:11px 18px;background:var(--accent-soft);border-bottom:1px dashed var(--accent-line,var(--line2))}
.taghead::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--bg);border:1px solid var(--accent-line,var(--line2));flex:none}
.taghead b{font:700 11.5px/1 var(--sans);letter-spacing:.7px;text-transform:uppercase;color:var(--accent)}
.taghead span{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mute)}
.tagbody{padding:18px}
.cname{font:600 28px/1.2 var(--serif);overflow-wrap:anywhere;margin:0 0 12px}

/* bunot bunot: waiting banner, draw box + animation, and sticky pinned giftee card */
.waitcard{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:16px;background:var(--accent-soft);border:1px solid var(--accent-line,var(--line2));margin:0 0 14px}
.waitcard .wico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface);color:var(--accent);flex:none}
.waitcard b{display:block;font-size:14px;color:var(--text)}
.waitcard p{margin:1px 0 0!important;font-size:13px!important;color:var(--mute)!important}

.bunot-card{text-align:center;padding:22px 18px 20px;border:1.5px solid var(--accent-line,var(--accent));background:linear-gradient(180deg,var(--accent-soft) 0%,var(--surface) 62%);overflow:hidden;position:relative}
.bstage{position:relative;height:132px;display:grid;place-items:end center;margin:0 auto 14px;width:220px;perspective:500px}
.gbox{position:relative;width:88px;height:74px;z-index:2;transform-origin:50% 100%}
.gbase{position:absolute;bottom:0;left:4px;right:4px;height:54px;border-radius:0 0 12px 12px;background:var(--accent);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14)}
.gbase::before{content:"";position:absolute;inset:0;margin:auto;width:14px;height:100%;background:rgba(255,255,255,.32)}
.glid{position:absolute;top:4px;left:0;right:0;height:20px;border-radius:7px;background:var(--accent);filter:brightness(1.08);box-shadow:0 3px 0 rgba(0,0,0,.12);transform-origin:15% 100%;transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
.glid::before{content:"";position:absolute;inset:0;margin:auto;width:14px;height:100%;background:rgba(255,255,255,.38)}
.glid::after{content:"";position:absolute;top:-11px;left:50%;width:28px;height:12px;margin-left:-14px;border:3px solid var(--accent);border-bottom:0;border-radius:12px 12px 0 0}
.gslip{position:absolute;bottom:22px;left:50%;width:184px;margin-left:-92px;padding:10px 12px;border-radius:11px;background:var(--surface);border:1.5px solid var(--accent);box-shadow:0 10px 24px rgba(0,0,0,.16);z-index:3;opacity:0;transform:translateY(26px) scaleY(.25) rotateX(-70deg);transform-origin:50% 100%;transition:transform .5s cubic-bezier(.2,.85,.25,1.15),opacity .3s ease;pointer-events:none}
.gslip small{display:block;font:700 10px/1 var(--sans);letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.gslip b{display:block;font:600 19px/1.2 var(--serif);color:var(--accent);overflow-wrap:anywhere}
.bconf{position:absolute;inset:0;pointer-events:none;z-index:4}
.bconf i{position:absolute;left:50%;bottom:48px;width:7px;height:7px;border-radius:2px;background:var(--c,var(--accent));opacity:0}
@keyframes bwobble{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-7deg) scale(1.04,.96)}40%{transform:rotate(7deg) scale(1.05,.95)}60%{transform:rotate(-5deg) scale(.98,1.03)}80%{transform:rotate(4deg) scale(1.02,.98)}}
@keyframes bpop{0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx,0),var(--dy,-60px)) scale(1) rotate(220deg)}}
.bunot-card.opening .gbox{animation:bwobble .52s ease-in-out}
.bunot-card.opening .glid,.bunot-card.revealed .glid{transform:translateY(-34px) rotate(-18deg)}
.bunot-card.revealed .gslip{opacity:1;transform:translateY(-22px) scaleY(1) rotateX(0)}
.bunot-card.revealed .bconf i{animation:bpop .75s cubic-bezier(.15,.85,.35,1) forwards}
.btitle{display:block;font:600 22px/1.2 var(--serif);margin:0 0 6px;color:var(--text)}
.bunot-card>p{max-width:420px;margin:0 auto 14px}
.bunot-btn{max-width:260px;margin:0 auto;font-size:15.5px;padding:11px 20px;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 32%,transparent)}

.pincard{position:sticky;top:8px;z-index:10;padding:0;overflow:hidden;border:1.5px solid var(--accent);box-shadow:0 8px 26px rgba(0,0,0,.12)}
.pinhead{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--accent);color:var(--accent-ink)}
.pinhead b{font:700 11.5px/1 var(--sans);letter-spacing:.65px;text-transform:uppercase}
.pintog{margin-left:auto;display:inline-flex;align-items:center;gap:4px;border:0;background:rgba(255,255,255,.16);color:inherit;font:600 12px/1 var(--sans);padding:5px 9px;border-radius:99px}
.pintog:hover{background:rgba(255,255,255,.25)}
.pinbody{padding:14px 16px;background:var(--surface)}
.pinwho{display:flex;align-items:center;gap:12px;min-width:0}
.pinwho .mono{grid-row:auto;width:40px;height:40px;font-size:16px;flex:none}
.pinwho .lab{margin:0 0 2px}
.pincname{font:600 23px/1.15 var(--serif);color:var(--text);overflow-wrap:anywhere}
.pinwish{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line2)}
.pincard.compact .pinbody{padding:10px 14px}
.pincard.compact .pincname{font-size:18px}
.pincard.compact .pinwho .mono{width:32px;height:32px;font-size:13.5px}
.grow.giftee{background:color-mix(in srgb,var(--good,#16a34a) 10%,var(--surface))}
.you.giftee-tag{background:var(--good,#16a34a);color:#fff}
/* anonymous chat (supabase_gift_chat.sql): two rows + an overlay panel. It shows message text and the day only:
   never a name, a codename of the giver, a clock time or a "seen" mark, and nothing is saved on the device. */
.chatcard{padding:6px}
.chathead{display:block;font:700 11.5px/1 var(--sans);letter-spacing:.65px;text-transform:uppercase;color:var(--faint);padding:12px 12px 6px}
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border:0;border-radius:13px;background:none}
.crow:hover{background:var(--raised)}
.crow .cico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.crow .ctxt{min-width:0;flex:1}
.crow b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.crow small{display:block;font-size:12.5px;line-height:1.35;color:var(--mute)}
.crow>svg{color:var(--faint)}
.cbadge{min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--bad,#c0392b);color:#fff;font:700 12px/22px var(--sans);text-align:center;flex:none}
.chatbox{position:fixed;top:0;left:0;right:0;height:100%;z-index:60;display:flex;align-items:stretch;justify-content:center;background:rgba(0,0,0,.45)}
.chatpane{display:flex;flex-direction:column;width:100%;max-width:560px;min-height:0;background:var(--bg)}
.chattop{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.chatname{min-width:0;flex:1}
.chatname b{display:block;font:600 18px/1.25 var(--serif);overflow-wrap:anywhere}
.chatname small{display:block;font-size:12.5px;color:var(--mute)}
.chatx{width:38px;height:38px;border-radius:11px;border:0;background:none;display:grid;place-items:center;color:var(--mute);flex:none}
.chatx:hover{background:var(--raised);color:var(--text)}
.chatlist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 8px;display:flex;flex-direction:column;gap:6px}
.chatlist .empty{margin:auto}
.cday{align-self:center;margin:8px 0 2px;font:700 11px/1 var(--sans);letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}
.cmsg{max-width:82%;padding:8px 12px;border-radius:16px 16px 16px 5px;background:var(--surface);border:1px solid var(--line);font-size:15px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-start}
.cmsg.me{align-self:flex-end;border-radius:16px 16px 5px 16px;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#chatmsg{padding:0 16px 6px}
.chatform{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.chatform textarea{flex:1;min-width:0;min-height:44px;max-height:120px;resize:none;padding:10px 12px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);color:var(--text);font:inherit;font-size:16px;line-height:1.4}
.chatform textarea:focus{outline:0;border-color:var(--accent)}
.chatform .btn{height:44px}
@media (min-width:600px){
 .chatbox{align-items:center;padding:24px}
 .chatpane{height:min(680px,100%);border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.3)}
}
.lab{display:block;font:700 11px/1 var(--sans);letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin:0 0 5px}
.gw{font-size:14.5px;color:var(--text);overflow-wrap:anywhere}
.gw p{margin:0 0 3px;color:inherit;font-size:inherit}.gw p:last-child{margin-bottom:0}.gw ul{margin:2px 0 4px;padding-left:19px}.gw li{margin:1px 0}.gw li::marker{color:var(--faint)}
.wlink{color:var(--accent);font-weight:600;text-decoration:none;overflow-wrap:anywhere}.wlink:hover{text-decoration:underline}
.gw.none{color:var(--faint)}
.tagbody>.gw{margin:0 0 16px}
.acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.msg{margin:0!important;font-size:13.5px!important;color:var(--mute)!important}
.msg:empty{display:none}
.msg.bad{color:var(--bad)!important}
.msg.ok{color:var(--good)!important;font-weight:600}

/* form */
.gform label{display:block;margin:0 0 6px;font-size:13px;font-weight:600;color:var(--text)}
.gform input,.gform textarea{display:block;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--text);font:inherit;font-size:16px;transition:border-color .15s,box-shadow .15s}
.gform input:focus,.gform textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gform #cn{font:600 20px/1.3 var(--serif)}
.gform textarea{min-height:108px;resize:vertical;line-height:1.45}
.gform input:disabled{opacity:.6}
.field{margin:0 0 16px}
.hint{display:flex;justify-content:space-between;gap:12px;margin:6px 0 0!important;font-size:12.5px!important;color:var(--faint)!important}
.hint .n{font-variant-numeric:tabular-nums;white-space:nowrap}
.who{margin:0 0 16px;padding:14px;border-radius:14px;background:var(--raised);border:1px solid var(--line)}
.who p{margin:0 0 12px!important;font-size:13px!important;color:var(--mute)!important}
.who .two{display:grid;grid-template-columns:110px 1fr;gap:10px}
.who .field{margin:0}
.note{margin:6px 0 0!important;font-size:12.5px!important;color:var(--mute)!important}

/* the table */
.lhead{display:flex;align-items:baseline;gap:10px;margin:26px 2px 8px}
.lhead h2{margin:0;font:600 19px/1.2 var(--serif)}
.lhead span{margin-left:auto;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:99px;background:var(--raised);overflow:hidden;margin:0 2px 12px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s var(--ease,ease)}
.find{position:relative;margin:0 0 10px}
.find svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.find input{width:100%;padding:9px 12px 9px 36px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:16px}
.find input:focus{outline:0;border-color:var(--accent)}
.list{border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.cols{display:none}
.grow{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:12px;row-gap:3px;padding:13px 16px;border-top:1px solid var(--line);min-width:0}
.grow:first-of-type{border-top:0}
.grow.me{background:var(--accent-soft)}
.mono{grid-row:1/3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 15px/1 var(--sans);background:hsl(var(--h) 70% 50%/.15);color:color-mix(in srgb,hsl(var(--h) 65% 45%) 72%,var(--text))}
.gname{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0;align-self:end}
.gname b{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.you{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.grow .gw{grid-column:2;font-size:14px;color:var(--mute)}
.grow .gw.none{color:var(--faint);font-style:italic}
.nomatch{border-top:0}
.ownerlink{margin:18px 0 0;font-size:13px;text-align:center}
.ownerlink a{color:var(--accent);font-weight:600;text-decoration:none}
.ownerlink a:hover{text-decoration:underline}
@media (min-width:600px){
 .cols{display:grid;grid-template-columns:36px 190px minmax(0,1fr);column-gap:12px;padding:9px 16px;background:var(--raised);font:700 11px/1 var(--sans);letter-spacing:.6px;text-transform:uppercase;color:var(--faint)}
 .cols span:first-child{grid-column:2}
 .grow{grid-template-columns:36px 190px minmax(0,1fr);align-items:center}
 .mono{grid-row:auto}
 .gname{align-self:center}
 .grow .gw{grid-column:3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<main>
 <div class="top"><a class="back" href="./"><svg class="i" width="16" height="16" aria-hidden="true"><use href="icons.svg#i-chevron-left"/></svg>All courses</a></div>
 <header class="hero">
  <span class="ico"><svg class="i" width="26" height="26" aria-hidden="true"><use href="icons.svg#i-gift"/></svg></span>
  <h1>Gift exchange</h1>
  <p class="sub" id="sub">Pick a codename and write your wishlist. Nobody can see who is behind a codename.</p>
 </header>
 <div id="view"><p class="empty">Loading…</p></div>
</main>
<script src="auth.js"></script>
<script src="giftfmt.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,z)=>'<svg class="i" width="'+(z||16)+'" height="'+(z||16)+'" aria-hidden="true"><use href="icons.svg#i-'+n+'"/></svg>';
const REPLIES={
 'slow down':'Too many tries. Wait a minute.',
 'long':'Keep the wishlist under 1,000 characters.',
 'bad_name':'Use 2 to 24 letters, numbers or spaces for the codename.',
 'mismatch':'That roll number and last name don’t match the class list. Check both.',
 'taken':'That student already has a codename from another account. Sign in with that account, or message the class secretary.',
 'locked':'Codenames are locked.',
 'has_name':'Your codename can’t contain your own name. Pick something that doesn’t give you away.',
 'name_used':'That codename is taken. Pick another one.'
};
const DRAW_ERR={
 'closed':'Bunot bunot isn’t open right now.',
 'not_yet':'Your roll batch isn’t open yet.',
 'no_roll':'Save your codename first so the draw knows your roll.',
 'slow_down':'Too many tries. Wait a minute.'
};
const CONF_PTS=[[-74,-62,'#f59e0b'],[-52,-84,'#ec4899'],[-28,-74,'#10b981'],[-8,-88,'#3b82f6'],[14,-82,'#8b5cf6'],[36,-72,'#f97316'],[58,-80,'#14b8a6'],[76,-58,'#eab308'],[-64,-34,'#6366f1'],[64,-36,'#ef4444']];
let STATE=null,EDIT=false,NOTICE='',PIN_OPEN=true,DRAWING=false;
// circle color + letter come from the codename text only, so they say nothing about the person
const hue=s=>{let h=0;for(const c of String(s).toLowerCase())h=(h*31+c.charCodeAt(0))%360;return h};
const first=s=>(String(s).match(/[A-Za-z0-9]/)||['?'])[0].toUpperCase();

function signedOut(msg){
 $('view').innerHTML='<div class="card"><p>Sign in with Google to join the gift exchange.</p>'+
  '<button class="btn primary wide" onclick="Auth.signIn(location.href)">Sign in with Google</button>'+
  (msg?'<p class="err" style="margin-top:10px">'+esc(msg)+'</p>':'')+'</div>';
}

function formHtml(s){
 const m=s.mine||{},locked=!!s.locked,need=!s.linked&&!s.mine;
 let h='<form id="gform" class="gform" autocomplete="off">';
 h+='<div class="field"><label for="cn">Codename</label><input id="cn" type="text" maxlength="24" placeholder="e.g. Midnight Mango" value="'+esc(m.codename||'')+'" autocomplete="off" autocapitalize="words" spellcheck="false"'+(locked?' disabled':'')+'>'+
  (locked?'<p class="note">Codenames are locked. You can still edit your wishlist.</p>'
         :'<p class="hint"><span>Don’t use your name, nickname or anything that gives you away.</span></p>')+'</div>';
 h+='<div class="field"><label for="wl">Wishlist</label><textarea id="wl" rows="4" maxlength="1000" placeholder="A few things you’d love to get">'+esc(m.wishlist||'')+'</textarea>'+
  '<p class="hint"><span>One item per line makes a neat list. Links work. Everyone sees what you write.</span><span class="n" id="wcnt">'+String((m.wishlist||'').length)+'/1000</span></p></div>';
 if(need){
  h+='<div class="who"><p>Your account isn’t linked to the class list yet. Saving also sends a link request to the class secretary. You don’t have to wait for it.</p>'+
   '<div class="two"><div class="field"><label for="roll">Roll number</label><input id="roll" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off"></div>'+
   '<div class="field"><label for="last">Last name</label><input id="last" type="text" maxlength="40" autocomplete="family-name"></div></div></div>';
 }
 h+='<div class="acts"><button class="btn primary" id="gsave" type="submit">Save</button>';
 if(s.mine)h+='<button class="btn" type="button" data-act="cancel">Cancel</button>';
 return h+'<p class="msg" id="gmsg" role="status"></p></div></form>';
}

function bunotHtml(s){
 const d=s.draw;
 if(!d||!d.status||d.status==='off')return '';
 const thru=+d.open_through||0;
 if(d.status==='waiting'){
  return '<section class="waitcard" aria-label="Bunot bunot status"><span class="wico">'+ic('hourglass',18)+'</span><div>'+
   '<b>'+(thru>0?'Bunot bunot is open for rolls 1–'+thru+'.':'Bunot bunot is ready.')+'</b>'+
   '<p>'+(thru>0?'Your roll batch will open soon. Hang tight!':'Waiting for the first batch of rolls to open.')+'</p></div></section>';
 }
 if(d.status==='ready'){
  return '<section class="card bunot-card" id="bunot-card">'+
   '<div class="bstage" aria-hidden="true">'+
    '<div class="bconf">'+CONF_PTS.map(p=>'<i style="--dx:'+p[0]+'px;--dy:'+p[1]+'px;--c:'+p[2]+'"></i>').join('')+'</div>'+
    '<div class="gslip"><small>You drew</small><b id="bslip-name">…</b></div>'+
    '<div class="gbox"><div class="glid"></div><div class="gbase"></div></div>'+
   '</div>'+
   '<b class="btitle">Your turn for Bunot bunot!</b>'+
   '<p>Rolls 1–'+thru+' are open. Tap below to draw one classmate’s codename for the gift exchange.</p>'+
   '<button class="btn primary wide bunot-btn" type="button" id="bunot-btn" data-act="bunot">'+ic('sparkles',17)+'Bunot!</button>'+
   '<p class="msg" id="bmsg" role="status" style="margin-top:10px!important"></p></section>';
 }
 if(d.status==='drawn'&&d.target&&d.target.c){
  const tc=d.target.c,row=(s.rows||[]).find(r=>r.c===tc),tw=row&&row.w!=null?row.w:(d.target.w||'');
  return '<section class="card pincard'+(PIN_OPEN?'':' compact')+'" id="pincard" aria-label="Your giftee">'+
   '<div class="pinhead">'+ic('pin',14)+'<b>Your giftee · Bunot bunot</b>'+
    '<button class="pintog" type="button" data-act="pintog" aria-expanded="'+(PIN_OPEN?'true':'false')+'">'+(PIN_OPEN?'Compact'+ic('chevron-up',14):'Wishlist'+ic('chevron-down',14))+'</button>'+
   '</div>'+
   '<div class="pinbody">'+
    '<div class="pinwho"><span class="mono" style="--h:'+hue(tc)+'" aria-hidden="true">'+esc(first(tc))+'</span>'+
     '<div><span class="lab">You’re giving to</span><div class="pincname">'+esc(tc)+'</div></div></div>'+
    (PIN_OPEN?'<div class="pinwish"><span class="lab">Their wishlist</span>'+(tw?'<div class="gw">'+GiftFmt.html(tw)+'</div>':'<div class="gw none">No wishlist yet — check back later</div>')+'</div>':'')+
   '</div></section>';
 }
 return '';
}

// ---------- anonymous chat ----------
// Side 'giftee' = the codename I drew. Side 'santa' = whoever drew me (this page never learns who that is).
const CHAT_ERR={empty:'Type a message first.',long:'Keep it under 500 characters.',slow_down:'Too many messages. Wait a minute.',closed:'This chat isn’t open right now.'};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let CHAT=null,CHAT_T=0,UNREAD_T=0;
const manilaDay=()=>new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
function dayLabel(d){
 const p=String(d||'').split('-').map(Number),q=manilaDay().split('-').map(Number);
 if(p.length!==3||!p[0]||!p[1]||!p[2])return '';
 const k=Math.round((Date.UTC(q[0],q[1]-1,q[2])-Date.UTC(p[0],p[1]-1,p[2]))/864e5);
 return k<=0?'Today':k===1?'Yesterday':MONTHS[p[1]-1]+' '+p[2];
}
function chatTitle(side){const t=STATE&&STATE.draw&&STATE.draw.target;return side==='giftee'?'Your giftee'+(t&&t.c?' · '+t.c:''):'Your Secret Santa'}
function chatHtml(s){
 const c=s.chat;
 if(!c||(c.giftee==null&&c.santa==null))return '';
 const row=(side,icon,sub)=>{const n=+c[side]||0;
  return '<button class="crow" type="button" data-act="chat" data-side="'+side+'"><span class="cico">'+ic(icon,18)+'</span>'+
   '<span class="ctxt"><b>'+esc(chatTitle(side))+'</b><small>'+sub+'</small></span>'+
   '<span class="cbadge" data-side="'+side+'"'+(n?'':' hidden')+'>'+n+'</span>'+ic('chevron-right',16)+'</button>'};
 return '<section class="card chatcard" id="chatcard" aria-label="Messages"><span class="chathead">Messages · anonymous</span>'+
  (c.giftee!=null?row('giftee','gift','Ask about their wishlist. They won’t know who you are.'):'')+
  (c.santa!=null?row('santa','sparkles','The classmate who drew you. Their name stays hidden.'):'')+'</section>';
}
function paintBadges(){
 const c=STATE&&STATE.chat;if(!c)return;
 document.querySelectorAll('.cbadge').forEach(b=>{const n=+c[b.dataset.side]||0;b.textContent=n;b.hidden=!n});
}
function fitChat(){
 const b=$('chatbox'),v=window.visualViewport;
 if(!b||b.hidden||!v)return;
 b.style.height=v.height+'px';b.style.top=v.offsetTop+'px';
}
function chatBox(){
 let b=$('chatbox');if(b)return b;
 b=document.createElement('div');b.id='chatbox';b.className='chatbox';b.hidden=true;
 b.setAttribute('role','dialog');b.setAttribute('aria-modal','true');b.setAttribute('aria-labelledby','chattitle');
 b.innerHTML='<div class="chatpane"><div class="chattop"><div class="chatname"><b id="chattitle"></b><small id="chatnote"></small></div>'+
  '<button class="chatx" type="button" id="chatclose" aria-label="Close the chat">'+ic('x',18)+'</button></div>'+
  '<div class="chatlist" id="chatlist" aria-live="polite"></div><p class="msg bad" id="chatmsg" role="status"></p>'+
  '<form class="chatform" id="chatform"><textarea id="chatin" rows="1" maxlength="500" placeholder="Write a message" aria-label="Message"></textarea>'+
  '<button class="btn primary" id="chatsend" type="submit">Send</button></form></div>';
 document.body.appendChild(b);
 b.addEventListener('click',e=>{if(e.target===b||e.target.closest('#chatclose'))closeChat()});
 $('chatform').addEventListener('submit',e=>{e.preventDefault();sendChat()});
 const inp=$('chatin');
 inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(120,inp.scrollHeight+2)+'px'});
 // Enter sends with a keyboard; on a phone Enter adds a line and the Send button sends
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&window.matchMedia('(pointer:fine)').matches){e.preventDefault();sendChat()}});
 return b;
}
function chatNote(t){const L=$('chatlist');if(!L)return;L.textContent='';const p=document.createElement('p');p.className='empty cempty';p.textContent=t;L.appendChild(p)}
// own=true: a message I just sent, shown before the next fetch; it must not move the fetch cursor past unseen replies
function addMsgs(list,own){
 const L=$('chatlist');if(!CHAT||!L)return;
 let n=0;
 for(const m of list||[]){
  if(!m)continue;
  if(!own&&m.id>CHAT.last)CHAT.last=m.id;
  if(CHAT.ids.has(m.id))continue;
  CHAT.ids.add(m.id);
  const e=L.querySelector('.cempty');if(e)e.remove();
  if(m.d&&m.d!==CHAT.day){CHAT.day=m.d;const lab=dayLabel(m.d);if(lab){const s=document.createElement('div');s.className='cday';s.textContent=lab;L.appendChild(s)}}
  const d=document.createElement('div');d.className='cmsg'+(m.me?' me':'');d.textContent=m.b==null?'':String(m.b);L.appendChild(d);n++;
 }
 if(n)L.scrollTop=L.scrollHeight;
}
async function pullChat(){
 const c=CHAT;if(!c||c.busy)return;
 c.busy=true;
 let r=null,fail=false;
 try{r=await Auth.rpc('gift_chat_open',{p_side:c.side,p_after:c.last},true)}catch(e){fail=true}
 c.busy=false;
 if(CHAT!==c)return;
 if(r&&r.ok){addMsgs(r.msgs);if(!c.loaded){c.loaded=true;if(!c.ids.size)chatNote('No messages yet. Say hi!')}}
 else if(!c.loaded)chatNote(!fail&&r&&r.err==='closed'?CHAT_ERR.closed:'Couldn’t load the chat. Check your connection.');
 if(c.again){c.again=false;pullChat()}
}
function openChat(side){
 if(!STATE||!STATE.chat||STATE.chat[side]==null||CHAT)return;
 const b=chatBox();
 CHAT={side,last:0,ids:new Set(),day:'',busy:false,loaded:false,again:false,from:document.activeElement};
 $('chattitle').textContent=chatTitle(side);
 $('chatnote').textContent=side==='giftee'?'Anonymous chat. Don’t share anything that gives you away.':'Anonymous chat. Your Secret Santa’s name stays hidden.';
 $('chatmsg').textContent='';$('chatin').value='';$('chatin').style.height='';$('chatsend').disabled=false;
 chatNote('Loading…');
 b.hidden=false;document.documentElement.style.overflow='hidden';fitChat();
 STATE.chat[side]=0;paintBadges();
 pullChat();
 clearInterval(CHAT_T);CHAT_T=setInterval(()=>{if(document.visibilityState==='visible')pullChat()},8000);
 if(window.matchMedia('(pointer:fine)').matches)$('chatin').focus({preventScroll:true});
}
function closeChat(){
 const b=$('chatbox'),c=CHAT;
 if(!b||b.hidden)return;
 clearInterval(CHAT_T);CHAT_T=0;CHAT=null;
 b.hidden=true;b.style.height='';b.style.top='';document.documentElement.style.overflow='';
 $('chatlist').textContent='';
 if(c&&STATE&&STATE.chat&&STATE.chat[c.side]!=null){STATE.chat[c.side]=0;paintBadges()}
 if(c&&c.from&&document.contains(c.from)&&c.from.focus)c.from.focus({preventScroll:true});
}
async function sendChat(){
 const c=CHAT,inp=$('chatin'),btn=$('chatsend'),msg=$('chatmsg');
 if(!c||!inp||!btn||btn.disabled)return;
 const t=inp.value.trim();
 if(!t){msg.textContent=CHAT_ERR.empty;return}
 btn.disabled=true;msg.textContent='';
 let r=null;
 try{r=await Auth.rpc('gift_chat_send',{p_side:c.side,p_body:t},true)}catch(e){}
 btn.disabled=false;
 if(CHAT!==c)return;
 if(r&&r.ok){
  inp.value='';inp.style.height='';
  addMsgs([{id:r.id,me:true,b:t,d:manilaDay()}],true);
  if(c.busy)c.again=true;else pullChat();
 }else msg.textContent=(r&&CHAT_ERR[r.err])||'Couldn’t send. Check your connection.';
}
// While the chat is closed, refresh only the unread badges (never draw(): it would wipe a half-typed wishlist).
function watchUnread(){
 if(UNREAD_T)return;
 UNREAD_T=setInterval(async()=>{
  if(CHAT||document.visibilityState!=='visible'||!STATE||!STATE.chat)return;
  try{const u=await Auth.rpc('gift_chat_unread',{},true);if(u&&typeof u==='object'&&STATE&&STATE.chat&&!CHAT){STATE.chat=u;paintBadges()}}catch(e){}
 },45000);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&CHAT)closeChat()});
if(window.visualViewport){visualViewport.addEventListener('resize',fitChat);visualViewport.addEventListener('scroll',fitChat)}

function draw(){
 if(!STATE)return;
 const s=STATE,rows=s.rows||[],total=s.total||0,tc=s.draw&&s.draw.status==='drawn'&&s.draw.target?s.draw.target.c:'';
 let h=bunotHtml(s)+chatHtml(s);
 h+='<section class="card tag"><div class="taghead"><b>Your codename</b><span>'+ic('lock',13)+'Only you see this card</span></div><div class="tagbody">';
 if(s.locked&&!s.mine){
  h+='<p>Codenames are closed. Message the class secretary.</p>';
 }else if(s.mine&&!EDIT){
  h+='<div class="cname">'+esc(s.mine.codename)+'</div><span class="lab">Wishlist</span>';
  h+=s.mine.wishlist?'<div class="gw">'+GiftFmt.html(s.mine.wishlist)+'</div>':'<div class="gw none">No wishlist yet</div>';
  h+='<div class="acts"><button class="btn" type="button" data-act="edit">'+ic('pencil',15)+'Edit</button>'+(NOTICE?'<p class="msg ok" role="status">'+esc(NOTICE)+'</p>':'')+'</div>';
 }else{
  h+=formHtml(s);
 }
 h+='</div></section>';
 h+='<div class="lhead"><h2>Codenames and wishlists</h2><span>'+rows.length+' of '+total+' in</span></div>';
 if(!s.can_see){
  h+='<div class="list"><p class="empty">Make your codename to see everyone’s wishlist.</p></div>';
 }else if(!rows.length){
  h+='<div class="list"><p class="empty">No codenames yet.</p></div>';
 }else{
  h+='<div class="bar" aria-hidden="true"><i style="width:'+(total?Math.min(100,Math.round(rows.length/total*100)):0)+'%"></i></div>';
  if(rows.length>8)h+='<div class="find">'+ic('search',16)+'<input id="gq" type="search" placeholder="Find a codename" aria-label="Find a codename" autocomplete="off"></div>';
  h+='<div class="list"><div class="cols" aria-hidden="true"><span>Codename</span><span>Wishlist</span></div>'+
   rows.map(r=>{const isT=tc&&r.c===tc;return '<div class="grow'+(r.me?' me':'')+(isT?' giftee':'')+'"><span class="mono" style="--h:'+hue(r.c)+'" aria-hidden="true">'+esc(first(r.c))+'</span><div class="gname"><b>'+esc(r.c)+'</b>'+(r.me?'<span class="you">You</span>':'')+(isT?'<span class="you giftee-tag">Your giftee</span>':'')+'</div>'+
   (r.w?'<div class="gw">'+GiftFmt.html(r.w)+'</div>':'<div class="gw none">No wishlist yet</div>')+'</div>'}).join('')+
   '<p class="empty nomatch" id="gnone" hidden>No codename matches.</p></div>';
 }
 if(s.owner)h+='<p class="ownerlink"><a href="giftadmin.html">Review names (only you)</a></p>';
 $('view').innerHTML=h;
 const c=$('wcnt'),wl=$('wl');
 if(c&&wl)c.textContent=wl.value.length+'/1000';
}

function showFormMsg(t,bad){const m=$('gmsg');if(!m)return;m.textContent=t;m.className='msg'+(bad?' bad':'');}

const wait=ms=>new Promise(r=>setTimeout(r,ms));

async function doBunot(){
 if(!STATE||DRAWING)return;
 const card=$('bunot-card'),btn=$('bunot-btn'),msg=$('bmsg'),slip=$('bslip-name');
 if(!card||!btn)return;
 DRAWING=true;btn.disabled=true;btn.textContent='Drawing…';
 if(msg){msg.textContent='';msg.className='msg'}
 const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
 card.classList.add('opening');
 let res=null,err=false;
 const rpcP=Auth.rpc('gift_draw',{},true).then(r=>{res=r},()=>{err=true});
 await Promise.all([rpcP,wait(reduced?40:680)]);
 if(err||!res||res.err||!res.c){
  card.classList.remove('opening','revealed');
  btn.disabled=false;btn.innerHTML=ic('sparkles',17)+'Bunot!';
  if(msg){msg.textContent=(res&&DRAW_ERR[res.err])||'Couldn’t draw. Check your connection.';msg.className='msg bad'}
  DRAWING=false;
  return;
 }
 if(slip)slip.textContent=res.c;
 card.classList.add('revealed');
 await wait(reduced?60:900);
 STATE.draw={status:'drawn',open_through:(STATE.draw&&STATE.draw.open_through)||0,target:{c:res.c,w:res.w||''}};
 try{const st=await Auth.rpc('gift_state',{},true);if(st&&st.draw)STATE=st}catch(e){}
 DRAWING=false;PIN_OPEN=true;
 draw();
}

async function save(){
 if(!STATE)return;
 const cn=$('cn'),wl=$('wl'),btn=$('gsave');
 if(!cn||!wl||!btn||btn.disabled)return;
 const need=!STATE.linked&&!STATE.mine;
 const rollEl=$('roll'),lastEl=$('last');
 const roll=need?parseInt(rollEl?rollEl.value:'',10):null;
 const last=need?(lastEl?lastEl.value.trim():''):null;
 if(cn.value.trim().length<2){showFormMsg('Type a codename first.',true);return}
 if(need&&(!roll||last.length<3)){showFormMsg('Type your roll number and last name.',true);return}
 btn.disabled=true;btn.textContent='Saving…';
 let r;
 try{
  r=await Auth.rpc('gift_save',{p_codename:cn.value,p_wishlist:wl.value,p_roll:need?roll:null,p_last:need?last:null},true);
 }catch(e){
  showFormMsg('Couldn’t save. Check your connection.',true);
  btn.disabled=false;btn.textContent='Save';
  return;
 }
 if(r==='ok'){
  try{STATE=await Auth.rpc('gift_state',{},true)}catch(e){}
  EDIT=false;NOTICE='Saved.';
  draw();
  return;
 }
 showFormMsg(REPLIES[r]||'Couldn’t save. Check your connection.',true);
 btn.disabled=false;btn.textContent='Save';
}

$('view').addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');
 if(!b)return;
 if(b.dataset.act==='edit'){EDIT=true;NOTICE='';draw();const w=$('wl');if(w)w.focus({preventScroll:true})}
 else if(b.dataset.act==='cancel'){EDIT=false;draw()}
 else if(b.dataset.act==='retry'){boot()}
 else if(b.dataset.act==='bunot'){doBunot()}
 else if(b.dataset.act==='pintog'){PIN_OPEN=!PIN_OPEN;draw()}
 else if(b.dataset.act==='chat'){openChat(b.dataset.side)}
});
$('view').addEventListener('input',e=>{
 if(e.target.id==='wl'){const c=$('wcnt');if(c)c.textContent=e.target.value.length+'/1000'}
 if(e.target.id==='gq'){const q=e.target.value.trim().toLowerCase();let n=0;
  document.querySelectorAll('.list .grow').forEach(r=>{const hit=!q||r.querySelector('.gname b').textContent.toLowerCase().includes(q);r.hidden=!hit;if(hit)n++});
  const g=$('gnone');if(g)g.hidden=n>0}
});
$('view').addEventListener('submit',e=>{if(e.target.id==='gform'){e.preventDefault();save()}});

async function boot(){
 try{const cl=await (await fetch('courses.json')).json();const c=cl.find(x=>x.cloud&&x.cloud.url);if(c)Auth.cloud=c.cloud}catch(e){}
 if(!Auth.cloud){$('view').innerHTML='<div class="card"><p>The gift exchange needs the class cloud, which isn’t set up here.</p></div>';return}
 let msg='';try{await Auth.finish()}catch(e){msg=e.message}
 if(!Auth.ses()){signedOut(msg);return}
 try{STATE=await Auth.rpc('gift_state',{},true)}catch(e){
  const m=String(e&&e.message||'');
  if(/sign in/i.test(m)){signedOut();return}
  $('view').innerHTML='<div class="card"><p class="err">Couldn’t load the gift exchange. Check your connection.</p><button class="btn" type="button" data-act="retry">Try again</button></div>';
  return;
 }
 draw();
 watchUnread();
}
boot();
</script>
</body></html>

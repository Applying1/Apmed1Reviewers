<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifications · APMed '33</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('reviewer_theme')||localStorage.getItem('psych_theme');if(t)document.documentElement.dataset.theme=t;const p=localStorage.getItem('reviewer_palette');if(p)document.documentElement.dataset.palette=p}catch(e){}</script>
<link rel="stylesheet" href="ui.css">
<style>
:root{--serif:"Source Serif 4",Georgia,serif;--good:#15803d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--good:#4ade80}}
:root[data-theme="dark"]{--good:#4ade80}
:root[data-palette="apmed"]{--accent-ink:#fff}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
main{max-width:680px;margin:0 auto;padding:22px 16px 80px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:14px;font-weight:600;text-decoration:none}.back:hover{color:var(--text)}
h1{font:600 30px/1.2 var(--serif);margin:18px 0 14px;letter-spacing:-.3px}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:13px;background:var(--surface);width:max-content;margin:0 0 18px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute)}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--text)}
.bar{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}.bar .n{color:var(--mute);font-size:14px}.bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:8px 14px;font-weight:600;font-size:14px;border:1px solid var(--line2);background:var(--surface);text-decoration:none;color:var(--text)}
.btn:hover{background:var(--raised)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.btn:disabled{opacity:.5;cursor:default}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.item:first-child{border-top:0}a.item:hover{background:var(--raised)}
.ic{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:17px}
.ib{flex:1;min-width:0}.ib b{display:block;font-size:15px}.ib p{margin:2px 0 4px;color:var(--mute);font-size:14px}
.meta{font-size:12.5px;color:var(--faint)}.meta i{font-style:normal;color:var(--mute)}
.new{flex:none;align-self:center;width:9px;height:9px;border-radius:50%;background:#d34247}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 18px;margin:0 0 14px}
.sec h2{font:600 17px/1.3 var(--serif);margin:14px 0 2px}.sec .d{margin:0 0 6px;color:var(--mute);font-size:13.5px}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.sec h2+.d+.row,.sec h2+.row{border-top:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:14.5px;font-weight:600}.row .t span{display:block;color:var(--mute);font-size:13px}
.sw{flex:none;position:relative;width:42px;height:24px;border-radius:12px;border:0;background:var(--line2);transition:background .15s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px #0003}
.sw[aria-checked="true"]{background:var(--accent)}.sw[aria-checked="true"]::after{transform:translateX(18px)}
.sw:disabled{opacity:.45}
.pstat{font-size:13.5px;color:var(--mute);margin:4px 0 12px}.pstat b{color:var(--text)}
.ok{color:var(--good)}
.opt{padding:12px 0;border-top:1px solid var(--line)}.opt>b{display:block;font-size:14.5px;font-weight:600;margin:0 0 8px}.opt>span{display:block;color:var(--mute);font-size:12.5px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;color:var(--mute)}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text);font-weight:600}
.up{list-style:none;margin:0;padding:0}.up li{padding:8px 0;border-top:1px dashed var(--line)}.up li:first-child{border-top:0}
.up b{font-size:14px}.up .s{display:block;color:var(--mute);font-size:13px}.up .w{display:block;font-size:12.5px;color:var(--faint);margin-top:2px}.up .w.on{color:var(--accent)}
</style></head><body>
<main>
 <a class="back" href="index.html">← All courses</a>
 <h1>Notifications</h1>
 <div class="tabs" role="tablist" aria-label="Notifications">
  <button role="tab" id="t-feed" aria-selected="true" onclick="tab('feed')">Updates</button>
  <button role="tab" id="t-set" aria-selected="false" onclick="tab('settings')">Settings</button>
 </div>
 <section id="feed"></section>
 <section id="settings" hidden></section>
</main>
<script src="dialog.js"></script>
<script src="notify-core.js"></script>
<script src="schedule-core.js"></script>
<script src="reminders-core.js"></script>
<script src="push-client.js"></script>
<script>
const $=id=>document.getElementById(id),esc=Notify.esc;
const ic=(n,c)=>'<svg class="i'+(c?' '+c:'')+'" aria-hidden="true"><use href="icons.svg#i-'+n+'"/></svg>';
const ICON={course:ic('book-open'),content:ic('pencil'),transes:ic('file-text'),schedule:ic('calendar-days'),feature:ic('sparkles')};
let COURSES={},READ0=0;
function tab(t){const s=t==='settings';$('feed').hidden=s;$('settings').hidden=!s;$('t-feed').setAttribute('aria-selected',!s);$('t-set').setAttribute('aria-selected',s);
 history.replaceState(null,'',s?'#settings':location.pathname+location.search);if(s)drawSettings();else drawFeed()}
function drawFeed(){Notify.load().then(f=>{const items=Notify.shown(f),hidden=f.length-items.length;
 $('feed').innerHTML='<div class="bar"><span class="n">'+(items.filter(u=>u.id>READ0).length?'<b>'+items.filter(u=>u.id>READ0).length+' new</b> since your last visit':'You\'re all caught up')+'</span><span class="sp"></span>'+(hidden?'<span class="n">'+hidden+' hidden by your settings</span>':'')+'</div>'+
  '<div class="list">'+(items.length?items.map(u=>{const c=u.course&&COURSES[u.course];const tag=c?c.title:Notify.TYPES[u.type]?Notify.TYPES[u.type][0].replace(/^New /,'').replace(/^./,x=>x.toUpperCase()):'';
   const inner='<span class="ic" aria-hidden="true">'+(ICON[u.type]||'•')+'</span><span class="ib"><b>'+esc(u.title)+'</b><p>'+esc(u.text)+'</p><span class="meta">'+esc(Notify.when(u.date))+(tag?' · <i>'+esc(tag)+'</i>':'')+'</span></span>'+(u.id>READ0?'<span class="new" aria-label="New"></span>':'');
   return u.link?'<a class="item" href="'+esc(u.link)+'">'+inner+'</a>':'<div class="item">'+inner+'</div>'}).join(''):'<p class="empty">Nothing here yet.</p>')+'</div>';
 Notify.markRead(f)})}
const sw=(on,fn,label,dis)=>'<button class="sw" role="switch" aria-checked="'+!!on+'" aria-label="'+esc(label)+'" onclick="'+fn+'"'+(dis?' disabled':'')+'></button>';
const row=(t,d,ctl)=>'<div class="row"><div class="t"><b>'+t+'</b><span>'+d+'</span></div>'+ctl+'</div>';
function flip(path){const p=Notify.prefs(),cur=path.startsWith('types.')?p.types[path.slice(6)]!==false:p[path]!==false;Notify.setPref(path,!cur);drawSettings()}
function drawSettings(){const p=Notify.prefs();
 $('settings').innerHTML=
  '<div class="sec"><h2>What you hear about</h2><p class="d">Turned-off types are hidden from Updates, the red dots and push notifications.</p>'+
  Object.entries(Notify.TYPES).map(([k,[t,d]])=>row(esc(t),esc(d),sw(p.types[k]!==false,"flip('types."+k+"')",t))).join('')+'</div>'+
  '<div class="sec" id="remsec"></div>'+
  '<div class="sec"><h2>Inside a course</h2>'+
  row('Update pop-ups','A one-time pop-up when something new arrives for the course you have open.',sw(p.pop!==false,"flip('pop')",'Update pop-ups'))+
  row('New comment pop-ups','A pop-up when a classmate comments in the course you have open (never during a mock exam, never your own).',sw(p.dpop!==false,"flip('dpop')",'New comment pop-ups'))+
  row('Unread dots','Red dots on Discussion and Notifications for things you haven\'t opened yet.',sw(p.ddot!==false,"flip('ddot')",'Unread dots'))+'</div>'+
  '<div class="sec" id="pushsec"><h2>On this device</h2><p class="d">Push notifications reach you even when the site is closed.</p><div id="pushbody"><p class="pstat">Checking…</p></div></div>';
 drawRem();Push.draw($('pushbody'))}
// ---------- exam reminders ----------
const chip=(on,fn,label)=>'<button aria-pressed="'+!!on+'" onclick="'+fn+'">'+esc(label)+'</button>';
const hourTxt=h=>h===12?'12 noon':(h%12||12)+(h<12?' AM':' PM');
function remSet(ch){Remind.set(ch);drawRem()}
function remDay(d){const r=Remind.prefs(),has=r.days.includes(d);if(has&&r.days.length===1)return tell('Keep at least one, or switch reminders off.',{title:'Reminders'});remSet({days:has?r.days.filter(x=>x!==d):r.days.concat(d)})}
function remKind(k){const r=Remind.prefs(),has=r.kinds.includes(k);if(has&&r.kinds.length===1)return tell('Keep at least one, or switch reminders off.',{title:'Reminders'});remSet({kinds:has?r.kinds.filter(x=>x!==k):r.kinds.concat(k)})}
function remSubj(s){const r=Remind.prefs();remSet({off:r.off.includes(s)?r.off.filter(x=>x!==s):r.off.concat(s)})}
async function remTest(b){b.disabled=true;b.textContent='Sending…';try{await Push.testRem();b.textContent='Sent. Check your notifications'}catch(e){b.textContent='Turn on notifications below first';b.disabled=false}}
function drawRem(){const el=$('remsec');if(!el)return;const r=Remind.prefs();
 let h='<h2>Exam reminders</h2><p class="d">A push notification before the exams, evals and quizzes on the timetable. Works on devices where notifications are turned on (below).</p>'+
  row('Remind me','Pick when, what and for which subjects.',sw(r.on,'remSet({on:'+!r.on+'})','Exam reminders'));
 if(r.on&&Sched.data){
  const subs=Object.entries(Sched.data.subjects||{});
  h+='<div class="opt"><b>When</b><div class="chips">'+Remind.DAYS.map(([d,t])=>chip(r.days.includes(d),'remDay('+d+')',t)).join('')+'</div><span>Pick as many as you like.</span></div>'+
   '<div class="opt"><b>At</b><div class="chips">'+Remind.HOURS.map(([v,t])=>chip(r.hour===v,'remSet({hour:'+v+'})',t)).join('')+'</div><span>For the reminders before the day itself. "Morning of" always comes at 6 AM.</span></div>'+
   '<div class="opt"><b>For</b><div class="chips">'+Object.entries(Remind.KINDS).map(([k,t])=>chip(r.kinds.includes(k),"remKind('"+k+"')",t)).join('')+'</div></div>'+
   '<div class="opt"><b>Subjects</b><div class="chips">'+subs.map(([id,s])=>chip(!r.off.includes(id),"remSubj('"+id+"')",s.name)).join('')+'</div><span>Tap a subject to mute its reminders.</span></div>';
  const up=Remind.list(4).slice(0,8);
  h+='<div class="opt"><b>Coming up</b>'+(up.length?'<ul class="up">'+up.map(a=>{const ok=Remind.wants(r,a),ms=ok?Remind.moments(r,a):[];
    return '<li><b>'+esc(a.subj.name)+'</b><span class="s">'+esc(a.label)+' · '+esc(Sched.when(a.date))+', '+esc(Sched.time(a.start))+'</span><span class="w'+(ms.length?' on':'')+'">'+
     (!ok?'No reminder (muted in your settings)':ms.length?ic('bell')+' '+ms.map(m=>esc(Sched.when(m)+', '+hourTxt(m.getHours()))).join(' · '):'No reminder left before it')+'</span></li>'}).join('')+'</ul>':'<span>No exams, evals or quizzes on the timetable in the next 4 weeks.</span>')+
   '<span>From the class timetable. Dates change when the timetable does.</span></div>'+
   '<div class="opt"><button class="btn" onclick="remTest(this)">Send a test reminder</button></div>';
 }
 el.innerHTML=h}
// The back link returns to the page you came from (a course, the timetable, the discussion), not always to the course list.
function backLink(){const el=document.querySelector('.back');let r=null;
 try{const u=new URL(document.referrer);if(u.origin===location.origin&&!/notifications\.html$/.test(u.pathname))r=u.href}catch(e){}
 try{if(r)sessionStorage.setItem('reviewer_notify_from',r);else r=sessionStorage.getItem('reviewer_notify_from')}catch(e){}
 if(!r)return;const u=new URL(r),pg=u.pathname.split('/').pop(),id=u.searchParams.get('course');
 const label=pg==='reviewer.html'&&id?((COURSES[id]||{}).title||'the course'):pg==='schedule.html'?'the timetable':pg==='discuss.html'?'the discussion':'';
 if(!label)return;el.href=r;el.textContent='← Back to '+label}
(async()=>{let list=[];try{list=await (await fetch('courses.json')).json()}catch(e){}
 try{await Sched.load()}catch(e){}
 list.forEach(c=>COURSES[c.id]=c);backLink();Push.init((list.find(x=>x.cloud&&x.cloud.url)||{}).cloud);Push.heal().then(()=>{if(!$('settings').hidden)drawSettings()});
 READ0=Notify.readUpTo();tab(location.hash==='#settings'?'settings':'feed')})();
</script>
</body></html>

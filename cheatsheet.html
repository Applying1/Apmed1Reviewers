<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheat sheet · APMed '33</title>
<meta name="description" content="Every identification answer in a course, grouped by topic, with a search box and a quiz-me switch.">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('reviewer_theme')||localStorage.getItem('psych_theme');if(t)document.documentElement.dataset.theme=t;const p=localStorage.getItem('reviewer_palette');if(p)document.documentElement.dataset.palette=p}catch(e){}</script><script>(function(){const m=document.querySelector('meta[name=theme-color]');if(!m)return;const f=()=>{if(document.body)m.content=getComputedStyle(document.body).backgroundColor},g=()=>{f();setTimeout(f,350)};addEventListener('DOMContentLoaded',f);new MutationObserver(g).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','data-palette']});matchMedia('(prefers-color-scheme: dark)').addEventListener('change',g)})()</script>
<link rel="stylesheet" href="ui.css">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:26px 20px 64px}
.back{display:inline-flex;align-items:center;gap:5px;margin:0 0 24px;color:var(--mute);font-size:13.5px;font-weight:600;text-decoration:none}
.back:hover{color:var(--text)}
h1{font:600 clamp(26px,6vw,32px)/1.2 var(--serif);letter-spacing:-.4px;margin:0 0 2px}
.sub{margin:0 0 20px;color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 11px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:600;color:var(--mute)}
.chip:hover{background:var(--raised);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
#q{flex:1 1 160px;min-width:0;padding:8px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);color:var(--text);font-size:14px;outline:0}
#q:focus{border-color:var(--accent)}
.switch{position:relative;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--mute);cursor:pointer;user-select:none;-webkit-user-select:none}
.switch input{position:absolute;left:0;top:0;width:18px;height:18px;margin:0;opacity:0}
.track{flex:none;position:relative;pointer-events:none;width:34px;height:20px;border-radius:99px;background:var(--line2);transition:background .15s}
.track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px #0002;transition:transform .15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(14px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:13px;background:var(--surface);margin:0 0 6px}
.tab{flex:1;min-width:0;padding:7px 3px;border:0;border-radius:10px;background:none;font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab:hover{color:var(--text)}
.tab b{margin-left:5px;font-size:11.5px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--text)}
.tab[aria-selected="true"] b{color:var(--accent)}
.topic{font:600 18px/1.3 var(--serif);margin:24px 0 2px}
.sec{font-size:12px;font-weight:700;letter-spacing:.45px;text-transform:uppercase;color:var(--faint);margin:14px 0 4px}
.entry{padding:10px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.ans{line-height:1.45;overflow-wrap:anywhere}
.ans b{font-weight:700}
.stmt u,.stmt .orig{text-decoration:underline;text-underline-offset:2px}
.alt{color:var(--faint);font-size:12.5px}
.clue{margin:2px 0 0;color:var(--mute);font-size:13.5px}
.fig{margin:2px 0 8px}
.fig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.stmt{margin:0;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.stmt mark{background:var(--accent-soft);color:var(--text);border-radius:3px;padding:0 2px;font-weight:600}
.wrong{color:var(--faint)}
.orig{display:none;text-decoration:underline;text-underline-offset:2px}
.badge{display:inline-block;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:10.5px;font-weight:700;letter-spacing:.35px;text-transform:uppercase;vertical-align:1px}
.pill{display:none;align-items:center;padding:2px 10px;border:1px dashed var(--line2);border-radius:99px;background:var(--surface);color:var(--mute);font-size:12px;font-weight:600;vertical-align:1px}
.pill:hover{color:var(--text);border-color:var(--accent-line)}
body.quizme #list .entry:not(.revealed) .answer{display:none}
body.quizme #list .entry:not(.revealed) .pill{display:inline-flex}
body.quizme #list .entry:not(.revealed) .orig{display:inline}
body.quizme #list .entry.revealed .pill{display:none}
.empty{padding:28px 16px;text-align:center;color:var(--faint);border:1px dashed var(--line2);border-radius:14px}
.msg{padding:32px 8px;text-align:center;color:var(--mute)}
@media (max-width:520px){main{padding:18px 16px 48px}.back{margin-bottom:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<main>
 <a class="back" id="back" href="reviewer.html?course=chem">← Back to the course</a>
 <h1>Cheat sheet</h1>
 <p class="sub" id="sub"></p>
 <div class="chips" id="chips" role="group" aria-label="Test"></div>
 <div class="tools">
  <input id="q" type="search" placeholder="Search answers and clues" autocomplete="off" aria-label="Search answers and clues">
  <label class="switch"><input type="checkbox" id="quiz"><span class="track" aria-hidden="true"></span>Quiz me</label>
 </div>
 <div class="tabs" id="tabs" role="tablist" aria-label="Answer type"></div>
 <div id="list"><p class="msg">Loading…</p></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// case- and accent-insensitive (the combining low line used for underlines is dropped too)
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const KIND=['recall','naming','statement'];
const TABS=[{k:'recall',n:'Identification'},{k:'naming',n:'Naming'},{k:'statement',n:'Modified T/F'}];
const LS='reviewer_cheatsheet';
const cm=location.search.match(/[?&]course=([^&]+)/);
const CID=(cm?decodeURIComponent(cm[1]):'chem').replace(/[^a-z0-9_-]/gi,'')||'chem';
$('back').href='reviewer.html?course='+encodeURIComponent(CID);

let saved={};try{saved=JSON.parse(localStorage.getItem(LS))||{}}catch(e){saved={}}
let CONFIG={},BANK=[],MOLS={},EXT=[],LISTS={recall:[],naming:[],statement:[]};
let exam='all',tab=KIND.includes(saved.tab)?saved.tab:'recall',quiz=!!saved.quiz,query='';
function persist(){try{localStorage.setItem(LS,JSON.stringify({tab:tab,quiz:quiz}))}catch(e){}}

function buildLists(){
 LISTS={recall:[],naming:[],statement:[]};
 const e=EXT.find(x=>x.id===exam)||null;
 const chs=e&&e.chapters?e.chapters.map(String):null;
 const secs=e&&e.sections?e.sections.map(String):null;
 const OPT=CONFIG.optionalSections||{},seen=new Set();
 for(const it of BANK){
  if(!it||it.type!=='id'||!KIND.includes(it.kind))continue;
  const sec=String(it.section||''),o=OPT[sec];
  if(o&&o.on===false&&!o.exam)continue;                       // not taught and not an exam item
  if(chs&&!chs.includes(sec.split('-')[0]))continue;
  if(!chs&&secs&&!secs.includes(sec))continue;
  const key=String(it.q||'')+'\u0000'+String(it.a||'');       // exact duplicate clue+answer
  if(seen.has(key))continue;
  seen.add(key);
  LISTS[it.kind].push(it);
 }
}
function renderChips(){
 $('chips').innerHTML=EXT.map(e=>'<button type="button" class="chip" data-exam="'+esc(e.id)+'" aria-pressed="'+(e.id===exam)+'">'+esc(e.name)+'</button>').join('')
  +'<button type="button" class="chip" data-exam="all" aria-pressed="'+(exam==='all')+'">All chapters</button>';
}
function renderTabs(){
 $('tabs').innerHTML=TABS.map(t=>'<button type="button" class="tab" data-tab="'+t.k+'" role="tab" aria-selected="'+(t.k===tab)+'">'+t.n+'<b>'+LISTS[t.k].length+'</b></button>').join('');
}
function secCmp(a,b){
 const A=String(a).split('-'),B=String(b).split('-');
 return (+A[0]||0)-(+B[0]||0)||(+A[1]||0)-(+B[1]||0)||String(a).localeCompare(String(b));
}
function match(it){
 const q=norm(query).trim();
 if(!q)return true;
 return norm([it.a,it.q,(it.alt||[]).join(' ')].filter(Boolean).join(' \u0000 ')).includes(q);
}
function recallHTML(it){
 const alts=(it.alt||[]).filter(Boolean);
 return '<div class="entry">'
  +'<div class="ans"><span class="answer"><b>'+esc(it.a)+'</b>'+(alts.length?' <span class="alt">also: '+esc(alts.join(', '))+'</span>':'')+'</span>'
  +'<button class="pill" type="button">tap to show</button></div>'
  +(it.q?'<p class="clue">'+esc(it.q)+'</p>':'')+'</div>';
}
function namingHTML(it){
 const svg=MOLS[it.fig],ok=typeof svg==='string'&&/^\s*<svg[\s>]/i.test(svg);
 return '<div class="entry">'
  +(ok?'<div class="fig">'+svg+'</div>':'')
  +'<div class="ans"><span class="answer"><b>'+esc(it.a)+'</b></span>'
  +'<button class="pill" type="button">tap to show</button></div></div>';
}
function statementHTML(it){
 const s=String(it.q||'').replace(/^Modified true or false:\s*/i,'');
 const m=/((?:[^\s\u0332]\u0332)+(?: (?:[^\s\u0332]\u0332)+)*)/.exec(s);
 const clean=t=>String(t||'').replace(/\u0332/g,'');
 const truth=String(it.a==null?'':it.a).trim().toLowerCase()==='true';
 if(truth){
  return '<div class="entry"><p class="stmt">'+esc(clean(s))+' <span class="spot">'
   +'<span class="badge answer">True</span><button class="pill" type="button">tap to show</button></span></p></div>';
 }
 const before=m?esc(clean(s.slice(0,m.index))):esc(clean(s));
 const wrong=m?clean(m[0]):'';
 const after=m?esc(clean(s.slice(m.index+m[0].length))):'';
 const spot='<span class="spot">'
  +(m?'<span class="orig">'+esc(wrong)+'</span>':'')
  +'<span class="fix answer">'+(m?'<s class="wrong">'+esc(wrong)+'</s> ':'')+'<mark>'+esc(it.a)+'</mark></span>'
  +'<button class="pill" type="button">tap to show</button></span>';
 return '<div class="entry"><p class="stmt">'+before+spot+after+'</p></div>';
}
function fixSvgs(){
 document.querySelectorAll('#list .fig svg').forEach(svg=>{
  const w=+(svg.getAttribute('data-w')||0);
  if(w>0)svg.style.width=w+'px';
  svg.style.maxWidth='100%';
  svg.style.height='auto';
 });
}
function renderBody(){
 const items=LISTS[tab].filter(match);
 if(!items.length){
  $('list').innerHTML='<div class="empty">'+(query?'No matches.':'Nothing in this tab yet.')+'</div>';
  return;
 }
 const byCh=new Map();
 for(const it of items){
  const ch=String(it.section||'').split('-')[0],sec=String(it.section||'');
  if(!byCh.has(ch))byCh.set(ch,new Map());
  const g=byCh.get(ch);
  if(!g.has(sec))g.set(sec,[]);
  g.get(sec).push(it);
 }
 let html='';
 const chs=[...byCh.keys()].sort((a,b)=>(+a||0)-(+b||0)||String(a).localeCompare(String(b)));
 for(const ch of chs){
  html+='<h2 class="topic">Topic '+esc(ch)+': '+esc((CONFIG.chapters||{})[ch]||'')+'</h2>';
  const secs=[...byCh.get(ch).keys()].sort(secCmp);
  for(const sec of secs){
   const arr=byCh.get(ch).get(sec);
   if(tab!=='statement')arr.sort((x,y)=>String(x.a||'').localeCompare(String(y.a||''),undefined,{sensitivity:'base',numeric:true}));
   html+='<h3 class="sec">'+esc((CONFIG.sections||{})[sec]||sec)+'</h3>';
   html+=arr.map(it=>tab==='recall'?recallHTML(it):tab==='naming'?namingHTML(it):statementHTML(it)).join('');
  }
 }
 $('list').innerHTML=html;
 fixSvgs();
}
$('chips').addEventListener('click',e=>{
 const b=e.target.closest('.chip');if(!b)return;
 exam=b.dataset.exam;buildLists();renderChips();renderTabs();renderBody();
});
$('tabs').addEventListener('click',e=>{
 const b=e.target.closest('.tab');if(!b)return;
 tab=b.dataset.tab;persist();renderTabs();renderBody();
});
$('q').addEventListener('input',e=>{query=e.target.value;renderBody()});
$('quiz').addEventListener('change',e=>{
 quiz=!!e.target.checked;persist();
 document.body.classList.toggle('quizme',quiz);
 if(quiz)document.querySelectorAll('#list .entry.revealed').forEach(el=>el.classList.remove('revealed'));
});
$('list').addEventListener('click',e=>{
 const p=e.target.closest('.pill');if(!p)return;
 const entry=p.closest('.entry');if(entry)entry.classList.add('revealed');
});
(async function(){
 let d;
 try{d=await (await fetch('courses/'+encodeURIComponent(CID)+'.json')).json()}
 catch(e){
  $('list').innerHTML='<div class="empty">The cheat sheet could not be loaded. Check your connection and reload.</div>';
  return;
 }
 CONFIG=d&&d.config||{};BANK=Array.isArray(d&&d.bank)?d.bank:[];MOLS=(d&&d.mols)||{};
 EXT=(CONFIG.exams||[]).filter(e=>e&&e.id&&e.name);
 exam=EXT.some(e=>e.id===CONFIG.activeExam)?CONFIG.activeExam:(EXT[0]?EXT[0].id:'all');
 document.title='Cheat sheet · '+(CONFIG.title||CID);
 $('sub').textContent=CONFIG.title||'';
 $('quiz').checked=quiz;
 document.body.classList.toggle('quizme',quiz);
 buildLists();renderChips();renderTabs();renderBody();
})();
</script>
<script src="themefx.js" defer></script><script src="sound.js" defer></script><script src="update.js" defer></script>
</body></html>

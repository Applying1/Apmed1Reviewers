<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moderator Queue</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('reviewer_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="dialog.js" defer></script>
<script src="auth.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:860px;margin:0 auto;padding:32px 16px 64px}
h1{font:600 28px/1.2 var(--serif);letter-spacing:-.4px;margin:0}
.sub{color:var(--mute);margin:6px 0 0}
.top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:7px 13px;font-weight:600;font-size:13.5px;border:1px solid var(--line2);background:var(--surface);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.good{color:var(--good)}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:14px}
.login{max-width:420px;margin:60px auto 0}
.login p{color:var(--mute);margin:8px 0 16px;font-size:14px}
.inp,textarea.inp,select.inp{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;font-size:14px;outline:0}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;line-height:1.45}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mute);margin-top:10px}
.msg{color:var(--bad);font-size:13.5px;margin:10px 0 0}
.msg:empty{display:none}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:20px}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 11px;font-size:13.5px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px #0000001a}
.seg b{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11.5px}
.bar select{width:auto;max-width:100%}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mute)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--raised);color:var(--mute)}
.tag.q{background:var(--accent-soft);color:var(--accent)}
.tag.k{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.tag.r{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.tag.approved,.tag.resolved{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.tag.rejected{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}
.f{display:block;margin-top:12px;font-size:13px;font-weight:600}
.f>span{display:block;margin-bottom:4px}
.f em{font-style:normal;font-weight:400;color:var(--mute);margin-left:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.warn{margin-top:12px;padding:9px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--text);font-size:13px}
.quote{margin-top:12px;padding:11px 13px;border-radius:10px;background:var(--raised);border:1px solid var(--line);font-size:14px}
.quote small{display:block;color:var(--mute);font-size:12px;margin-bottom:4px}
.quote ul{margin:6px 0 0;padding-left:20px}
.quote li.ok{color:var(--good);font-weight:600}
.note{margin-top:12px;font-size:14.5px}
.acts2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.acts2 .sp{flex:1}
.empty{color:var(--mute);text-align:center;padding:40px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:9;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.help{margin-top:14px;font-size:13.5px;color:var(--mute)}
.help summary{cursor:pointer;font-weight:600;color:var(--text)}
.help li{margin:4px 0}
.cnt{display:inline-block;margin-left:6px;padding:0 7px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:12px}
.ah{font-size:15px;margin:22px 0 8px}.arow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;margin-bottom:8px}.arow p{margin:2px 0 0}
.mute{color:var(--faint)}.warnt{color:var(--bad)}.ulist{font-size:13.5px;color:var(--mute);line-height:1.8}
.lrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) auto;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}.lrow .sub{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:620px){.lrow{grid-template-columns:1fr auto}.lrow .sub{grid-column:1/-1;grid-row:2}}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.owner{margin-top:18px}.oh{display:flex;gap:12px;align-items:center}.oh .sub{margin:0;font-size:13.5px}
.oic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.owner .acts2 .cnt{margin-left:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px}
.stat b{font:600 24px/1.1 var(--serif);color:var(--accent)}.stat span{font-size:12.5px;color:var(--mute);font-weight:600}
.stat.zero b{color:var(--faint)}.stat:hover{border-color:var(--line2)}.stat.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.steps{margin:0;padding-left:22px}.steps li{margin:0 0 14px;font-size:14.5px}.steps li:last-child{margin:0}
pre.code{margin:10px 0 8px;padding:12px;border-radius:10px;background:var(--raised);border:1px solid var(--line);font:12.5px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto}
.urlrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.urlrow .inp{flex:1 1 240px;width:auto}
.cbox{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:16px;z-index:10}.cbox .card{width:min(560px,100%);margin:0}.cbox textarea{margin-top:10px;font:12.5px ui-monospace,Consolas,monospace}
.newpill{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:8;border:0;border-radius:99px;padding:8px 16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13.5px;box-shadow:0 4px 14px #0003}
.newpill[hidden]{display:none}
@media (max-width:480px){.stat{padding:9px 10px}.stat b{font-size:20px}.top .acts{margin-left:0}}
</style></head><body>
<main id="app"><p class="empty">Loading…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<button class="newpill" id="newpill" hidden onclick="load()"></button>
<script>
/* Moderator queue for class contributions (see supabase_contrib.sql). Only someone with a moderator passphrase sees anything:
   the database checks the passphrase on every call. The passphrase stays in this browser (this tab, or this device if remembered). */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PASS_KEY='reviewer_mod_pass';
let CLOUD=null,COURSES=[],BYKEY={},DATA={},ME=null,PASS='',ROWS=[],tab='pending',courseF='',kindF='',busy=false,ATT=null,SYNC=null,view='queue',NEWN=0;
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},2600)}
function rpc(fn,body){const h={'Content-Type':'application/json',apikey:CLOUD.key};if(/^eyJ/.test(CLOUD.key))h.Authorization='Bearer '+CLOUD.key;
 return fetch(CLOUD.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body)})
  .then(r=>r.text().then(t=>{if(!r.ok){let m='';try{m=JSON.parse(t).message||''}catch(e){}throw new Error(m||'error '+r.status)}return t?JSON.parse(t):null}))}
function ago(t){const s=(Date.now()-Date.parse(t))/1000;return s<90?'just now':s<5400?Math.round(s/60)+' min ago':s<129600?Math.round(s/3600)+' h ago':Math.round(s/86400)+' days ago'}
function copy(text,msg){(navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast(msg),()=>copyBox(text))}
// no clipboard (http, old browser): show the text selected, ready for Ctrl+C / long-press Copy
function copyBox(text){const d=document.createElement('div');d.className='cbox';d.innerHTML='<div class="card"><b>Copy this</b><textarea class="inp" rows="10" readonly></textarea><div class="acts2"><span class="sp"></span><button class="btn primary">Done</button></div></div>';
 d.querySelector('textarea').value=text;d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d);d.querySelector('textarea').select()}

async function course(key){const c=BYKEY[key];if(!c)return null;if(DATA[key])return DATA[key];
 const d=await fetch('courses/'+c.id+'.json').then(r=>r.json());
 const all=[d.bank||[]].concat((d.variants||[]).map(v=>v.items||[])).flat(),n={};
 (d.bank||[]).forEach(x=>{const k=(x.d||[]).length;if(k)n[k]=(n[k]||0)+1});
 DATA[key]={title:c.title,cfg:d.config,byId:Object.fromEntries(all.map(x=>[x.id,x])),bank:d.bank||[],nd:Math.min(4,Math.max(2,+Object.keys(n).sort((a,b)=>n[b]-n[a])[0]||3))};
 return DATA[key]}

async function boot(){
 try{COURSES=await fetch('courses.json').then(r=>r.json());BYKEY=Object.fromEntries(COURSES.map(c=>[c.storageKey,c]));
  const first=await fetch('courses/'+COURSES[0].id+'.json').then(r=>r.json());CLOUD=first.config.cloud}catch(e){}
 if(!CLOUD||!CLOUD.url){$('app').innerHTML='<p class="empty">The class cloud is not set up for these reviewers.</p>';return}
 if(location.hash==='#sync')view='sync';else if(location.hash==='#links')view='att';
 try{PASS=sessionStorage.getItem(PASS_KEY)||localStorage.getItem(PASS_KEY)||''}catch(e){}
 if(PASS&&await signIn(PASS,true))return;
 await attLoad();
 if(ATT&&view!=='queue')return draw();
 drawLogin()}
function drawLogin(err){document.title='Moderator';view='queue';
 $('app').innerHTML=(ATT?'<div class="top"><div><h1>Moderator</h1><p class="sub">Your owner tools work without the passphrase.</p></div><div class="acts"><a class="btn" href="./">Home</a></div></div>'+ownerPanel():'')+
  '<div class="card login"'+(ATT?' style="margin-top:22px"':'')+'>'+(ATT?'<h2 class="ah" style="margin-top:0">Question queue</h2>':'<h1>Moderator</h1>')+'<p>Review the questions, flashcards and problem reports classmates send from the reviewers. Sign in with your moderator passphrase.</p>'+
  '<input class="inp" id="pass" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase">'+
  '<label class="chk"><input type="checkbox" id="remember"> Stay signed in on this device</label>'+
  '<p class="msg" id="lmsg">'+esc(err||'')+'</p><div class="acts2"><span class="sp"></span><a class="btn" href="./">Back to reviewers</a><button class="btn primary" id="go">Sign in</button></div></div>';
 const go=async()=>{const p=$('pass').value;if(!p)return;$('go').disabled=true;if(!await signIn(p,false,$('remember').checked))$('go').disabled=false};
 $('go').onclick=go;$('pass').onkeydown=e=>{if(e.key==='Enter')go()};$('pass').focus()}
async function signIn(p,quiet,remember){let r=null;
 try{r=await rpc('contrib_mod_login',{p_pass:p})}
 catch(e){if(quiet)return false;$('lmsg').textContent=/locked/.test(e.message)?'Too many wrong passphrases. Wait 15 minutes, then try again.':'Could not reach the database. Check your connection.';return false}
 if(!r){if(quiet){try{sessionStorage.removeItem(PASS_KEY);localStorage.removeItem(PASS_KEY)}catch(e){}return false}$('lmsg').textContent='That passphrase is not right.';return false}
 ME=r;PASS=p;try{sessionStorage.setItem(PASS_KEY,p);if(remember)localStorage.setItem(PASS_KEY,p)}catch(e){}
 await load();return true}
function signOut(){try{sessionStorage.removeItem(PASS_KEY);localStorage.removeItem(PASS_KEY)}catch(e){}PASS='';ME=null;drawLogin()}
async function load(){try{ROWS=await rpc('contrib_mod_list',{p_pass:PASS,p_status:'all'})||[]}catch(e){toast('Could not load the queue.');ROWS=ROWS||[]}
 await Promise.all([...new Set(ROWS.map(r=>r.course))].map(k=>course(k).catch(()=>null)));await attLoad();$('newpill').hidden=true;draw()}
// while the page is open (and on coming back to it): new items show a "N new" button instead of redrawing over edits
async function poll(){if(!ME||busy||document.hidden||view!=='queue')return;let rows=null,links=linkN();
 try{rows=await rpc('contrib_mod_list',{p_pass:PASS,p_status:'all'})}catch(e){return}
 if(ATT)try{const a=await Auth.rpc('att_admin_list',{},true);links=(a.requests||[]).filter(r=>r.status==='pending').length}catch(e){}
 const known=new Set(ROWS.map(r=>r.id)),n=(rows||[]).filter(r=>!known.has(r.id)&&isOpen(r)).length+Math.max(0,links-linkN());
 if(n){NEWN=n;const b=$('newpill');b.textContent=n+' new · Show';b.hidden=false;document.title='('+n+' new) Moderator'}}
setInterval(poll,120000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});

/* ---------- Attendance links (supabase_attendance.sql): only when this browser is also signed in with the site owner's
   Google account (att_admin_list refuses everyone else, so other moderators never see this). Students send a request from
   My attendance (roll number + last name, checked against the tracker); approve it here. */
async function attLoad(){ATT=null;SYNC=null;if(!Auth.ses())return;Auth.cloud=Auth.cloud||CLOUD;
 try{ATT=await Auth.rpc('att_admin_list',{},true)}catch(e){ATT=null;return}
 try{SYNC=await Auth.rpc('att_sync_info',{},true)}catch(e){SYNC=null}}
const linkN=()=>ATT?(ATT.requests||[]).filter(r=>r.status==='pending').length:0;
const back=()=>{view='queue';history.replaceState(null,'',location.pathname);ME?draw():drawLogin()};
// owner tools (site owner's Google account only): attendance update + links + class day, shown on top of the queue
function ownerPanel(){if(!ATT)return '';const n=linkN(),s=SYNC||{},bad=s.note&&!/^ok/.test(s.note);
 return '<section class="card owner"><div class="oh"><span class="oic"><svg class="i" width="18" height="18" aria-hidden="true"><use href="icons.svg#i-calendar-days"/></svg></span><div><b>Attendance</b><p class="sub">Tracker imported '+(ATT.imported?esc(ago(ATT.imported)):'never')+
  (s.ready?' · '+(s.auto?'checks the sheet every hour':'hourly check off'):' · not automatic yet')+'</p></div></div>'+
  (bad?'<div class="warn">Last check '+esc(ago(s.sync_at))+': '+esc(s.note)+'</div>':'')+
  '<div class="acts2">'+(s.ready?'<button class="btn primary" id="syncbtn" onclick="attSync(this)"><svg class="i" width="15" height="15" aria-hidden="true"><use href="icons.svg#i-rotate-cw"/></svg>Update attendance now</button>':'<button class="btn primary" onclick="go(\'sync\')">Set up one-tap update</button>')+
  '<button class="btn" onclick="go(\'att\')">Link requests'+(n?'<b class="cnt">'+n+'</b>':'')+'</button><a class="btn" href="classday.html">Class day</a><a class="btn" href="takeattendance.html">Take attendance</a>'+
  (s.ready?'<span class="sp"></span><button class="link" onclick="go(\'sync\')">Update settings</button>':'')+'</div></section>'}
function go(v){view=v;history.replaceState(null,'',location.pathname+(v==='sync'?'#sync':v==='att'?'#links':''));draw();scrollTo(0,0)}
async function attSync(btn){if(btn){btn.disabled=true;btn.lastChild.textContent='Updating…'}let r=null;
 try{const tok=await Auth.token();if(!tok)throw new Error('signin');
  const res=await fetch(CLOUD.url.replace(/\/+$/,'')+'/functions/v1/attsync',{method:'POST',headers:{'Content-Type':'application/json',apikey:CLOUD.key,Authorization:'Bearer '+tok},body:'{}'});
  r=await res.json().catch(()=>({error:'server '+res.status}))}
 catch(e){r={error:e.message==='signin'?'signin':'offline'}}
 const why={signin:'Your Google sign-in ended. Sign in again on the home page.',offline:'Could not reach the server. Check your connection.','not set up':'Set up the one-tap update first.',
  key:'The key in the Apps Script does not match. Copy the code again (Update settings).',access:'The Web app is not open to “Anyone”. Deploy it again with Who has access: Anyone.',
  empty:'The sheet sent no rows. Is the tab still called Sheet1?',import:'The sheet layout changed: '+(r&&r.detail||'')}[r&&r.error];
 if(r&&r.ok)toast('Attendance updated: '+r.students+' students'+(r.latest?', latest day '+r.latest:'')+'.'+(r.mismatches?' '+r.mismatches+' totals do not match the days, check the sheet.':''));
 else await tell(why||('Could not update: '+((r&&r.error)||'unknown')),{title:'Attendance not updated'});
 await attLoad();draw()}
// one-time setup: an Apps Script in the tracker answers with the sheet's values when asked with this key
function drawSync(){if(!ATT||!SYNC){view='queue';return ME?draw():drawLogin()}document.title='Attendance update';const s=SYNC;
 $('app').innerHTML='<div class="top"><div><h1>One-tap attendance</h1><p class="sub">Connect the tracker once. Then <b>Update attendance now</b> reads it in a few seconds, and the site also checks it every hour.</p></div>'+
  '<div class="acts"><button class="btn" onclick="back()">Back</button></div></div>'+
  '<div class="card"><ol class="steps">'+
  '<li>Open the attendance tracker sheet, then <b>Extensions → Apps Script</b>.</li>'+
  '<li>Delete what is in the editor, paste this code, and press <b>Save</b>.<pre class="code" id="gas">'+esc(gasCode(s.key))+'</pre><button class="btn" onclick="copy(gasCode(SYNC.key),\'Code copied.\')"><svg class="i" width="15" height="15" aria-hidden="true"><use href="icons.svg#i-copy"/></svg>Copy code</button></li>'+
  '<li><b>Deploy → New deployment</b>, pick the type <b>Web app</b> (gear icon). Execute as: <b>Me</b>. Who has access: <b>Anyone</b>. Press Deploy and allow access with your Google account (if Google warns that the app isn\'t verified: Advanced → Go to the project; it is your own script).</li>'+
  '<li>Copy the <b>Web app URL</b> (it ends in <code>/exec</code>) and paste it here:'+
  '<div class="urlrow"><input class="inp" id="gurl" placeholder="'+(s.ready?'Saved. Paste a new URL to replace it':'https://script.google.com/macros/s/…/exec')+'" aria-label="Web app URL"><button class="btn primary" onclick="syncSave()">Save and test</button></div></li></ol>'+
  '<label class="chk"><input type="checkbox" id="gauto"'+(s.auto?' checked':'')+' onchange="syncAuto(this.checked)"> Also check the sheet every hour</label>'+
  (s.sync_at?'<p class="help">Last check '+esc(ago(s.sync_at))+': '+esc(s.note||'')+'</p>':'')+'</div>'+
  '<details class="help card"><summary>Is this safe?</summary><ul><li>The script only answers when the request carries the key in the code above. The key is kept in the database where only you (and the update function) can read it.</li>'+
  '<li>It sends what the update needs: the tracker\'s names and attendance marks, to this site\'s database, which already holds them.</li>'+
  '<li>To switch it off: in Apps Script, <b>Deploy → Manage deployments → Archive</b>. Changing the code? Deploy a <b>new version</b> of the same deployment so the URL stays.</li></ul></details>'}
function gasCode(key){return "// APMed '33: lets the site read this attendance tracker when the owner taps \"Update attendance\".\n"+
 "// Deploy as a Web app: Execute as Me, Who has access: Anyone. It only answers requests that carry this key.\n"+
 "const KEY = '"+key+"';\n"+
 "function doGet(e) {\n"+
 "  const out = o => ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n"+
 "  if (!e || !e.parameter || e.parameter.key !== KEY) return out({ error: 'key' });\n"+
 "  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Sheet1');\n"+
 "  const rows = Math.min(Math.max(sh.getLastRow() - 2, 1), 58), cols = Math.max(sh.getLastColumn() - 1, 1);\n"+
 "  return out({ values: sh.getRange(3, 2, rows, cols).getDisplayValues() });   // B3 onward, like the Sheets connector\n"+
 "}\n"}
async function syncSave(){const u=$('gurl').value.trim();if(!u)return toast('Paste the Web app URL first.');
 try{await Auth.rpc('att_sync_set',{p_url:u,p_auto:null},true)}catch(e){return tell(e.message,{title:'Not saved'})}
 await attLoad();toast('Saved. Testing…');view='queue';history.replaceState(null,'',location.pathname);await attSync()}
async function syncAuto(on){try{await Auth.rpc('att_sync_set',{p_url:null,p_auto:on},true);toast(on?'The site checks the sheet every hour.':'Hourly check off. Use the button.')}catch(e){toast('Could not save: '+e.message)}await attLoad()}
function drawAtt(){if(!ATT){view='queue';return ME?draw():drawLogin()}document.title='Attendance links';
 const pend=ATT.requests.filter(r=>r.status==='pending'),rej=ATT.requests.filter(r=>r.status!=='pending'),who=x=>esc(x.google||'(no name)')+(x.email?' <span class="mute">'+esc(x.email)+'</span>':'');
 $('app').innerHTML='<div class="top"><div><h1>Attendance links</h1><p class="sub">Which Google account sees which student\'s attendance. Tracker imported '+(ATT.imported?esc(ago(ATT.imported)):'never')+'.</p></div>'+
  '<div class="acts"><button class="btn" onclick="attLoad().then(draw)">Refresh</button><button class="btn" onclick="back()">Back</button></div></div>'+
  '<h2 class="ah">Requests'+(pend.length?' <b class="cnt">'+pend.length+'</b>':'')+'</h2>'+
  (pend.length?pend.map(r=>'<div class="card arow"><div><b>#'+r.roll+' '+esc(r.student)+'</b><p class="sub">'+who(r)+' · '+esc(ago(r.at))+(r.already?' · <span class="warnt">already linked to '+r.already+' account'+(r.already>1?'s':'')+'</span>':'')+'</p></div><div class="acts"><button class="btn" onclick="attDecide(\''+r.user+'\',false)">Reject</button><button class="btn primary" onclick="attDecide(\''+r.user+'\',true)">Approve</button></div></div>').join(''):'<p class="empty">No requests waiting.</p>')+
  (rej.length?'<details class="card"><summary>Rejected ('+rej.length+')</summary>'+rej.map(r=>'<p>#'+r.roll+' '+esc(r.student)+' · '+who(r)+'</p>').join('')+'</details>':'')+
  '<h2 class="ah">Not linked yet ('+ATT.unlinked.length+')</h2><p class="sub">Ask them to open <b>My attendance</b> from the home page while signed in and send a request.</p><p class="ulist">'+ATT.unlinked.map(x=>'#'+x.roll+' '+esc(x.student)).join(' · ')+'</p>'+
  '<h2 class="ah">Linked ('+ATT.links.length+' accounts)</h2>'+ATT.links.map(l=>'<div class="lrow"><span><b>#'+l.roll+'</b> '+esc(l.student)+'</span><span class="sub">'+who(l)+'</span><button class="link" onclick="attUnlink(\''+l.user+'\',\''+esc(l.student).replace(/'/g,'')+'\')">Unlink</button></div>').join('')}
async function attDecide(u,ok){try{await Auth.rpc('att_admin_decide',{p_user:u,p_ok:ok},true);toast(ok?'Linked. They see their attendance now.':'Rejected.')}catch(e){toast('Could not save: '+e.message)}await attLoad();draw()}
async function attUnlink(u,name){if(!await ask('They will no longer see attendance on this account.',{title:'Unlink '+name+'?',ok:'Unlink',danger:1}))return;
 try{await Auth.rpc('att_admin_unlink',{p_user:u},true);toast('Unlinked.')}catch(e){toast('Could not unlink: '+e.message)}await attLoad();draw()}
const isOpen=r=>r.status==='pending';
const inTab=r=>tab==='pending'?isOpen(r):tab==='approved'?r.status==='approved':tab==='done'?r.status==='rejected'||r.status==='resolved':true;
const KINDS=[['question','Questions'],['report','Reports'],['card','Flashcards']];
function draw(){if(view==='att')return drawAtt();if(view==='sync')return drawSync();if(!ME)return drawLogin();NEWN=0;
 const mine=ROWS.filter(r=>(!courseF||r.course===courseF)&&(!kindF||r.kind===kindF)),n=t=>{const k=tab;tab=t;const c=mine.filter(inTab).length;tab=k;return c};
 const keys=[...new Set(ROWS.map(r=>r.course))],list=mine.filter(inTab),wait=k=>ROWS.filter(r=>isOpen(r)&&r.kind===k&&(!courseF||r.course===courseF)).length;
 const total=ROWS.filter(isOpen).length+linkN();document.title=(total?'('+total+') ':'')+'Moderator';
 $('app').innerHTML='<div class="top"><div><h1>Moderator</h1><p class="sub">Signed in as <b>'+esc(ME.name)+'</b>'+(ME.courses?' · '+ME.courses.map(k=>esc((BYKEY[k]||{}).title||k)).join(', '):' · all courses')+'</p></div>'+
  '<div class="acts"><a class="btn" href="./">Home</a><button class="btn" onclick="load()" aria-label="Refresh"><svg class="i" width="15" height="15" aria-hidden="true"><use href="icons.svg#i-rotate-cw"/></svg></button><button class="btn" onclick="signOut()">Sign out</button></div></div>'+
  ownerPanel()+
  '<div class="stats" role="group" aria-label="Waiting by kind">'+KINDS.map(([k,l])=>{const c=wait(k);return '<button class="stat'+(kindF===k?' on':'')+(c?'':' zero')+'" aria-pressed="'+(kindF===k)+'" onclick="kindF=kindF===\''+k+'\'?\'\':\''+k+'\';tab=\'pending\';draw()"><b>'+c+'</b><span>'+l+' waiting</span></button>'}).join('')+'</div>'+
  '<div class="bar"><span class="seg" role="group" aria-label="Show">'+[['pending','Waiting'],['approved','Added'],['done','Closed'],['all','All']].map(([k,l])=>'<button aria-pressed="'+(tab===k)+'" onclick="tab=\''+k+'\';draw()">'+l+(k==='pending'&&n(k)?'<b>'+n(k)+'</b>':'')+'</button>').join('')+'</span>'+
  (kindF?'<button class="link" onclick="kindF=\'\';draw()">Show every kind</button>':'')+
  (keys.length>1?'<select class="inp" aria-label="Course" onchange="courseF=this.value;draw()"><option value="">All courses</option>'+keys.map(k=>'<option value="'+esc(k)+'"'+(k===courseF?' selected':'')+'>'+esc((BYKEY[k]||{}).title||k)+'</option>').join('')+'</select>':'')+
  (tab==='pending'&&list.some(r=>r.kind==='report')?'<button class="link" style="margin-left:auto" onclick="copyReports()">Copy open reports</button>':'')+'</div>'+
  (list.length?list.map(card).join(''):'<p class="empty">'+(tab==='pending'?'Nothing waiting. Nice.':'Nothing here yet.')+'</p>')+
  '<details class="help card"><summary>How moderating works</summary><ul>'+
  '<li><b>Questions:</b> fix anything you like before approving (wording, topic, choices, explanation). <b>Approve</b> adds it to Main for everyone as a Class question; students get it the next time they open the reviewer.</li>'+
  '<li><b>Not added</b> with a short note tells the student why (for example: not in the exam, already in the reviewer, answer is wrong).</li>'+
  '<li><b>Added</b> questions can still be edited (Save changes) or taken out again.</li>'+
  '<li><b>Reports</b> point at a question that may be wrong. Class questions can be fixed right here; for the built-in questions, use <b>Copy open reports</b> and paste them to Claude, then mark them Fixed.</li>'+
  '<li>“Sent from this device: N” counts everything one device has sent, to spot spam.</li>'+
  (ATT?'<li><b>Alerts (only you):</b> a new question, report, flashcard or link request sends one push to your devices with Attendance alerts on (at most one every 15 minutes). The home page Moderator tile shows the count.</li>':'')+'</ul></details>'}

// a flashcard a student suggested from their own cards (flashcards v100): approved cards join everyone's deck
function flashCard(r,head){const c=DATA[r.course],d=r.data||{},ed=r.status!=='rejected',v=Object.assign({ch:d.ch,topic:d.topic,front:d.front,back:d.back,by:d.name},r.status==='approved'?r.item||{}:{}),chs=c?c.cfg.chapters||{}:{};
 const ro=ed?'':' readonly';
 return '<article class="card" id="r'+r.id+'">'+head+
  '<div class="grid2"><label class="f"><span>Chapter<em>decides which decks it joins</em></span><select class="inp" data-k="ch"'+(ed?'':' disabled')+'>'+Object.keys(chs).map(k=>'<option value="'+esc(k)+'"'+(k===String(v.ch)?' selected':'')+'>'+esc(k+' '+chs[k])+'</option>').join('')+(String(v.ch) in chs?'':'<option selected value="'+esc(v.ch||'')+'">'+esc(v.ch||'none')+'</option>')+'</select></label>'+
  '<label class="f"><span>Topic<em>optional, shown above the card</em></span><input class="inp" data-k="topic" maxlength="120" value="'+esc(v.topic||'')+'"'+ro+'></label></div>'+
  '<label class="f"><span>Front<em>{{c1::word}} makes a fill-in-the-blank card</em></span><textarea class="inp" rows="2" data-k="front"'+ro+'>'+esc(v.front||'')+'</textarea></label>'+
  '<label class="f"><span>Back</span><textarea class="inp" rows="2" data-k="back"'+ro+'>'+esc(v.back||'')+'</textarea></label>'+
  '<label class="f"><span>Credit as<em>blank = “a classmate”</em></span><input class="inp" data-k="by" maxlength="40" value="'+esc(v.by||'')+'"'+ro+'></label>'+
  noteField(r)+'<div class="acts2">'+
  (r.status==='pending'?'<button class="btn bad" onclick="decide('+r.id+',\'rejected\')">Not added</button><span class="sp"></span><button class="btn primary" onclick="decide('+r.id+',\'approved\')">Approve</button>':
   r.status==='approved'?'<button class="btn bad" onclick="decide('+r.id+',\'rejected\')">Take it out</button><span class="sp"></span><button class="btn primary" onclick="decide('+r.id+',\'approved\')">Save changes</button>':
   '<span class="sp"></span><button class="btn" onclick="decide('+r.id+',\'pending\')">Back to waiting</button>')+'</div></article>'}
function card(r){const c=DATA[r.course],d=r.data||{},it=r.item||{},q=r.kind==='question',ed=q&&r.status!=='rejected';
 const fk=r.kind==='card',head='<div class="meta"><span class="tag '+(fk?'k':q?'q':'r')+'">'+(fk?'Flashcard':q?'Question':'Report')+'</span>'+(r.status!=='pending'?'<span class="tag '+esc(r.status)+'">'+esc({approved:'Added',rejected:q||fk?'Not added':'No change',resolved:'Fixed'}[r.status]||r.status)+'</span>':'')+
  '<span>'+esc(c?c.title:r.course)+'</span><span>·</span><span>'+esc(d.name?'from '+d.name:'no name')+'</span><span>·</span><span>'+ago(r.created_at)+'</span>'+(r.same_sender>3?'<span>· Sent from this device: '+r.same_sender+'</span>':'')+
  (r.reviewed_by?'<span>· '+esc(r.reviewed_by)+' '+ago(r.reviewed_at)+'</span>':'')+'</div>';
 if(fk)return flashCard(r,head);
 if(q){const v=Object.assign({section:d.section,q:d.q,a:d.a,d:d.d||[],why:d.why,hint:'',by:d.name},r.status==='approved'?it:{}),nd=c?c.nd:3,secs=c?c.cfg.sections:{};
  const ds=Array.from({length:Math.max(nd,(v.d||[]).length)},(_,i)=>(v.d||[])[i]||''),sim=c&&similar(c,v.q,'cc_'+r.id);
  return '<article class="card" id="r'+r.id+'">'+head+
   '<label class="f"><span>Topic</span><select class="inp" data-k="section"'+(ed?'':' disabled')+'>'+Object.keys(secs).map(k=>'<option value="'+esc(k)+'"'+(k===v.section?' selected':'')+'>'+esc(k+' '+secs[k])+'</option>').join('')+(v.section in secs?'':'<option selected value="'+esc(v.section)+'">'+esc(v.section)+' (unknown)</option>')+'</select></label>'+
   '<label class="f"><span>Question</span><textarea class="inp" rows="3" data-k="q"'+(ed?'':' readonly')+'>'+esc(v.q)+'</textarea></label>'+
   (sim?'<div class="warn">Close to an existing question ('+esc(sim.id)+'): “'+esc(sim.q)+'”</div>':'')+
   '<label class="f"><span>Right answer</span><input class="inp" data-k="a" value="'+esc(v.a)+'"'+(ed?'':' readonly')+'></label>'+
   '<div class="f"><span>Wrong choices</span><div class="grid2">'+ds.map(x=>'<input class="inp" data-k="d" value="'+esc(x)+'"'+(ed?'':' readonly')+' aria-label="Wrong choice">').join('')+'</div></div>'+
   '<label class="f"><span>Explanation<em>shown after answering</em></span><textarea class="inp" rows="2" data-k="why"'+(ed?'':' readonly')+'>'+esc(v.why)+'</textarea></label>'+
   '<div class="grid2"><label class="f"><span>Hint<em>optional</em></span><input class="inp" data-k="hint" value="'+esc(v.hint)+'"'+(ed?'':' readonly')+'></label>'+
   '<label class="f"><span>Credit as<em>blank = “a classmate”</em></span><input class="inp" data-k="by" maxlength="40" value="'+esc(v.by)+'"'+(ed?'':' readonly')+'></label></div>'+
   noteField(r)+'<div class="acts2">'+
   (r.status==='pending'?'<button class="btn bad" onclick="decide('+r.id+',\'rejected\')">Not added</button><span class="sp"></span><button class="btn primary" onclick="decide('+r.id+',\'approved\')">Approve</button>':
    r.status==='approved'?'<button class="btn bad" onclick="decide('+r.id+',\'rejected\')">Take it out</button><span class="sp"></span><button class="btn primary" onclick="decide('+r.id+',\'approved\')">Save changes</button>':
    '<span class="sp"></span><button class="btn" onclick="decide('+r.id+',\'pending\')">Back to waiting</button>')+'</div></article>'}
 const cur=c&&c.byId[d.qid],choices=cur?[cur.a].concat(cur.d||[]):[];
 return '<article class="card" id="r'+r.id+'">'+head+
  '<p class="note">“'+esc(d.note)+'”</p>'+
  '<div class="quote"><small>'+esc(d.section+' · '+d.qid)+(cur?'':' · not found in the current version')+'</small>'+esc(cur?cur.q||cur.term:d.q)+
   (cur&&choices.length>1?'<ul>'+choices.map((x,i)=>'<li'+(i?'':' class="ok"')+'>'+esc(String(x).startsWith('@m:')?'(structure '+x.slice(3)+')':x)+(i?'':' ✓')+'</li>').join('')+'</ul>':d.key?'<br><small style="margin:6px 0 0">Answer key: '+esc(d.key)+'</small>':'')+
   (cur&&cur.why?'<small style="margin:8px 0 0">Explanation: '+esc(cur.why)+'</small>':'')+'</div>'+
  noteField(r)+'<div class="acts2">'+
  (/^cc_\d+$/.test(d.qid)?'<button class="link" onclick="openClass(\''+esc(d.qid)+'\')">Edit that class question</button>':'<button class="link" onclick="copyReports('+r.id+')">Copy for Claude</button>')+'<span class="sp"></span>'+
  (r.status==='pending'?'<button class="btn" onclick="decide('+r.id+',\'rejected\')">No change needed</button><button class="btn primary" onclick="decide('+r.id+',\'resolved\')">Fixed</button>':
   '<button class="btn" onclick="decide('+r.id+',\'pending\')">Reopen</button>')+'</div></article>'}
function noteField(r){return '<label class="f"><span>Note to the student<em>optional, they see it under Your suggestions</em></span><input class="inp" data-k="note" maxlength="500" value="'+esc(r.mod_note||'')+'" placeholder="'+(r.kind==='question'?'For example: thanks, reworded a little':'For example: fixed, thanks!')+'"></label>'}

const norm=t=>String(t||'').toLowerCase().replace(/[^a-z0-9À-ɏͰ-Ͽ]+/g,' ').trim();
function similar(c,q,self){const w=new Set(norm(q).split(' ').filter(x=>x.length>2));if(w.size<3)return null;let best=null,bs=0;
 const pool=c.bank.concat(ROWS.filter(r=>r.course!==undefined&&r.status==='approved'&&r.item&&DATA[r.course]===c).map(r=>r.item));
 pool.forEach(x=>{if(!x.q||x.id===self)return;const v=new Set(norm(x.q).split(' ').filter(y=>y.length>2));let n=0;w.forEach(y=>{if(v.has(y))n++});const s=n/Math.max(1,new Set([...w,...v]).size);if(s>bs){bs=s;best=x}});
 return bs>=.6?best:null}
function openClass(qid){const id=+qid.slice(3);tab='all';courseF='';draw();const el=$('r'+id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.style.outline='2px solid var(--accent)'}}

async function decide(id,status){if(busy)return;const r=ROWS.find(x=>x.id===id),el=$('r'+id);if(!r||!el)return;
 const val=k=>{const e=el.querySelector('[data-k="'+k+'"]');return e?e.value.trim():''};let item=null;
 if(status==='approved'&&r.kind==='card'){item={ch:val('ch'),topic:val('topic'),front:val('front'),back:val('back'),by:val('by')};
  if(item.front.length<3||(!item.back&&!/\{\{c\d+::/.test(item.front))){toast('A card needs a front, and a back unless it has a {{c1::blank}}.');return}}
 else if(status==='approved'){const d=[...el.querySelectorAll('[data-k="d"]')].map(e=>e.value.trim()).filter(Boolean);
  item={section:val('section'),q:val('q'),a:val('a'),d,why:val('why'),hint:val('hint'),by:val('by')};
  const low=[item.a].concat(d).map(x=>x.toLowerCase().replace(/\s+/g,' '));
  if(!item.q||!item.a||!d.length){toast('A question needs the question, the right answer and wrong choices.');return}
  if(new Set(low).size<low.length){toast('Two choices are the same.');return}}
 busy=true;el.querySelectorAll('button').forEach(b=>b.disabled=true);
 try{const ok=await rpc('contrib_mod_decide',{p_pass:PASS,p_id:id,p_status:status,p_item:item,p_note:val('note')});
  if(ok===false){busy=false;signOut();return}
  Object.assign(r,{status,mod_note:val('note')||null,reviewed_by:status==='pending'?null:ME.name,reviewed_at:status==='pending'?null:new Date().toISOString()},item?{item:Object.assign(item,{id:'cc_'+id})}:{});
  toast({approved:'Added. Students get it the next time they open the reviewer.',rejected:r.kind!=='report'?'Marked as not added.':'Closed: no change needed.',resolved:'Marked as fixed.',pending:'Moved back to waiting.'}[status])}
 catch(e){toast('Could not save: '+e.message)}
 busy=false;draw()}

function copyReports(one){const list=ROWS.filter(r=>r.kind==='report'&&(one?r.id===one:r.status==='pending'&&(!courseF||r.course===courseF)));if(!list.length)return;
 copy('Problem reports from the reviewers (please check and fix in the question bank):\n\n'+list.map(r=>{const d=r.data||{},c=DATA[r.course];
  return '- '+(c?c.title:r.course)+' · '+d.section+' · '+d.qid+'\n  Question: '+d.q+(d.key?'\n  Answer key: '+d.key:'')+'\n  Report: '+d.note+(d.name?' ('+d.name+')':'')}).join('\n\n'),
  list.length>1?list.length+' reports copied.':'Report copied.')}
boot();
</script></body></html>

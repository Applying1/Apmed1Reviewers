<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;scrollbar-gutter:stable}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Global Top Header Bar */
.top{display:flex;align-items:center;background:color-mix(in oklab,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex:none;padding:0}
.top-inbox-cell{display:flex;align-items:center;padding:10px 14px}
.top-chat-cell{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--mute);font-size:14px;font-weight:600;padding:6px 10px 6px 6px;border-radius:10px;transition:background .15s}
.back:hover{color:var(--text);background:var(--raised)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:8px 14px;font-weight:600;font-size:13.5px;border:1px solid var(--line2);background:var(--surface);text-decoration:none;transition:background .15s,filter .15s}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:9px;gap:4px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}

.card{margin:24px auto;padding:20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);max-width:540px}
.card h2{display:flex;align-items:center;gap:7px;margin:0 0 8px;font:700 13px/1 var(--sans);letter-spacing:.5px;text-transform:uppercase;color:var(--mute)}
.card p{margin:0 0 12px;color:var(--mute);font-size:14px}
.err{margin:8px 0 0;color:var(--bad,#c0392b);font-size:13.5px}
.empty{color:var(--faint);font-size:14px;text-align:center;padding:24px 0}

/* Status dots with safe margins so 3px outer halo is never clipped */
.dot{flex:none;width:9px;height:9px;border-radius:50%;display:inline-block;margin:3px 3px 3px 4px}
.dot.studying{background:var(--good,#22a06b);box-shadow:0 0 0 3px color-mix(in oklab,var(--good,#22a06b) 24%,transparent)}
.dot.here{background:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 22%,transparent)}
.dot.offline{background:var(--line2)}

/* Partner header in chat */
.phead{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
#partnerAv{flex:none;display:flex;align-items:center;justify-content:center}
.pinfo{min-width:0;flex:1}
.pname{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstatus{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0 1px 2px}

/* Main Split Container */
#mainWrap{flex:1;display:flex;min-height:0;height:100%;overflow:hidden;position:relative}

/* Left Sidebar (Conversations & Classmate Search) */
#inboxWrap{width:360px;flex:none;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);min-height:0;height:100%;overflow:hidden;position:relative}
.inbox-top{padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:none}
.inbox-title{margin:0;font:800 18px/1.2 var(--sans);letter-spacing:-.3px;display:flex;align-items:center;gap:7px}
.inbox-sub{margin:2px 0 0;color:var(--mute);font-size:12px}
.inbox-search{position:relative;margin-top:10px}
.inbox-search input{width:100%;padding:7px 10px 7px 30px;border-radius:10px;border:1px solid var(--line2);background:var(--raised);font-size:13px;outline:0;transition:border-color .15s}
.inbox-search input:focus{border-color:var(--accent);background:var(--surface)}
.inbox-search .s-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;display:flex}
.clist{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0;scrollbar-gutter:stable}

/* Right Chat Area */
#chatWrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden;background:var(--bg);position:relative}
.stream{flex:1;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0;scrollbar-gutter:stable;padding:14px 18px}
.dsep{text-align:center;margin:12px 0 6px;position:relative}
.dsep span{font-size:12px;font-weight:600;color:var(--faint);background:var(--raised);padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.msg{display:flex;flex-direction:column;max-width:80%;position:relative;animation:fadeIn .16s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.them{align-self:flex-start;align-items:flex-start}
.bubble{padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 2px #0000000a}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.them .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble a{color:inherit;text-decoration:underline}
.mfoot{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--faint);margin-top:3px;padding:0 2px}
.mfoot .read{color:var(--accent);font-weight:600}
.msg .mdel{opacity:0;border:0;background:none;padding:2px 4px;color:var(--faint);font-size:11px;cursor:pointer;border-radius:4px;transition:opacity .15s}
.msg:hover .mdel{opacity:1}
.msg.sending{opacity:.6}

/* In-pane Composer dock */
.dock{background:color-mix(in oklab,var(--bg) 95%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px;flex:none}
.din{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px}
.din textarea{flex:1;min-height:42px;max-height:120px;resize:none;padding:9px 12px;border-radius:13px;border:1.5px solid var(--line2);background:var(--surface);outline:0;font-size:14.5px;line-height:1.4}
.din textarea:focus{border-color:var(--accent)}
.sendbtn{flex:none;width:42px;height:42px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:filter .15s,transform .1s}
.sendbtn:hover:not(:disabled){filter:brightness(1.08)}
.sendbtn:active:not(:disabled){transform:scale(.95)}
.sendbtn:disabled{opacity:.4;cursor:default}

/* Conversation Row Cards */
.crow{flex:none;min-height:56px;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid transparent;text-decoration:none;transition:background .15s,border-color .15s;cursor:pointer}
.crow:hover{background:var(--raised);border-color:var(--line)}
.crow.active{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 1px 3px #00000008}
.crow .cw{flex:1;min-width:0}
.crow-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.crow b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow time{font-size:11.5px;color:var(--faint);flex:none}
.crow-bot{display:flex;align-items:center;gap:8px}
.crow-prev{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;flex:none}

/* Section divider in search */
.csec{font:700 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.5px;color:var(--faint);padding:8px 6px 2px}

.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;pointer-events:none;transition:.25s var(--ease);z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Responsive media queries */
@media (max-width:719px){
 #inboxWrap{width:100%;border-right:none}
 .top-inbox-cell{display:contents}
 .top-chat-cell{display:contents}
 .top{padding:10px 16px;gap:10px}
 body.in-chat #inboxWrap{display:none!important}
 body:not(.in-chat) #chatWrap{display:none!important}
 body:not(.in-chat) #partnerHead{display:none!important}
 body:not(.in-chat) #duelBtn{display:none!important}
 body.in-chat #backTxt{display:inline}
}
@media (min-width:720px){
 #inboxWrap{display:flex!important}
 #chatWrap{display:flex!important}
 .top-inbox-cell{width:360px;flex:none;border-right:1px solid var(--line);box-sizing:border-box}
 .top-chat-cell{flex:1;min-width:0}
 body.in-chat #backTxt{display:inline!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

 <div class="top-inbox-cell">
  <a class="back" id="backBtn" href="classlist.html"><svg class="i" width="16" height="16" aria-hidden="true"><use href="icons.svg#i-chevron-left"/></svg><span id="backTxt">Class list</span></a>

 <div id="inboxWrap">

     <svg class="i" width="24" height="24" aria-hidden="true"><use href="icons.svg#i-message-circle"/></svg>
    </div>

   </div>

 </div>

<script src="auth.js"></script>
<script src="profile.js"></script>
<script src="update.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>'<svg class="i" width="16" height="16" aria-hidden="true"><use href="icons.svg#i-'+n+'"/></svg>';
function toast(t,ms){const e=$('toast');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms||2400)}

const Q=new URLSearchParams(location.search);
let PARTNER_ID=Q.get('with')||'',PARTNER_NAME=Q.get('to')||'';
let COURSES=[],MESSAGES=[],ALL_CLASSMATES=[],CONVERSATIONS=[];
let POLL_TIMER=null,IS_SENDING=false,LAST_CONVS_HASH='',LAST_SEARCH='';

function timeAgo(t){
 if(!t)return '';
 const s=Math.max(0,Math.floor((Date.now()-new Date(t))/1000));
 if(s<60)return 'just now';
 if(s<3600)return Math.floor(s/60)+'m ago';
 if(s<86400)return Math.floor(s/3600)+'h ago';
 const d=new Date(t),now=new Date();
 const isYesterday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1).toDateString()===d.toDateString();
 if(isYesterday)return 'yesterday';
 const sameYear=now.getFullYear()===d.getFullYear();
 return d.toLocaleDateString(undefined,sameYear?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'});
}

function timeClock(t){
 if(!t)return '';
 return new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
}

function linkify(s){
 return esc(s).replace(/\bhttps?:\/\/[^\s<]+[^\s<.,;:!?)\]'"]/g,u=>'<a href="'+u+'" target="_blank" rel="noopener nofollow">'+u+'</a>');
}

function avHtml(name,av,url,sz){
 return window.Profile?Profile.html({av:av||'g',url:url||'',name:name||'Classmate'},sz||36):'';
}

function signedOut(msg){
 $('mainWrap').innerHTML='<div class="card"><h2>'+ic('users')+' Sign in to message classmates</h2>'+
  '<p>Direct messages are only for signed-in classmates whose attendance is linked.</p>'+
  '<button class="btn primary wide" onclick="Auth.signIn(location.href)">Sign in with Google</button>'+
  (msg?'<p class="err">'+esc(msg)+'</p>':'')+'</div>';
}

function unlinked(msg){
 $('mainWrap').innerHTML='<div class="card"><h2>'+ic('users')+' Link your attendance first</h2>'+
  '<p>'+(msg?esc(msg):'Link your Google account to your name on the attendance sheet to send direct messages.')+'</p>'+
  '<a class="btn primary wide" href="attendance.html">Go to My attendance</a></div>';
}

/* -------------------- INBOX / CONVERSATIONS -------------------- */
async function loadInbox(quiet){
 try{
  const [convs, classList] = await Promise.all([
   Auth.rpc('dm_conversations',{},true).catch(()=>[]),
   ALL_CLASSMATES.length ? Promise.resolve(ALL_CLASSMATES) : Auth.rpc('class_list',{},true).catch(()=>[])
  ]);
  if(Array.isArray(classList)&&classList.length) ALL_CLASSMATES=classList;

  const convsArray = Array.isArray(convs) ? convs : [];
  CONVERSATIONS = convsArray;

  // Don't re-render sidebar if data hasn't changed and no active filter query
  const hash = JSON.stringify(convsArray) + '|' + (PARTNER_ID||'') + '|' + LAST_SEARCH;
  if(hash === LAST_CONVS_HASH && quiet) return;
  LAST_CONVS_HASH = hash;

  renderSidebarList();
 }catch(e){
  if(!quiet) $('convList').innerHTML='<p class="err">'+esc(e.message||'Could not load conversations.')+'</p>';
 }
}

function renderSidebarList(){
 const list=$('convList');
 const q=(LAST_SEARCH||'').trim().toLowerCase();
 let html='';

 let filteredConvs = CONVERSATIONS;
 if(q){
  filteredConvs = CONVERSATIONS.filter(c => (c.name||'').toLowerCase().includes(q) || (c.last_message||'').toLowerCase().includes(q));
 }

 if(filteredConvs.length){
  html += filteredConvs.map(c=>{
   const stateCls=esc(c.state||'offline');
   const isActive = (c.id === PARTNER_ID);
   return '<a class="crow '+(isActive?'active':'')+'" href="dm.html?with='+encodeURIComponent(c.id)+'&to='+encodeURIComponent(c.name)+'" onclick="onConvoClick(event,\''+esc(c.id)+'\',\''+esc(c.name)+'\')">'+
    '<div style="position:relative;flex:none">'+avHtml(c.name,c.av,c.avatar,40)+'<i class="dot '+stateCls+'" style="position:absolute;bottom:-2px;right:-2px;border:2px solid var(--surface)"></i></div>'+
    '<div class="cw">'+
     '<div class="crow-top"><b>'+esc(c.name)+'</b><time>'+timeAgo(c.last_at)+'</time></div>'+
     '<div class="crow-bot">'+
      '<span class="crow-prev">'+(c.last_mine?'You: ':'')+esc(c.last_message)+'</span>'+
      (c.unread_count>0?'<span class="badge">'+c.unread_count+'</span>':'')+
     '</div>'+
    '</div>'+
   '</a>';
  }).join('');
 }

 // If searching or no convos, show matching classmates from ALL_CLASSMATES
 if(q || !CONVERSATIONS.length){
  const existingIds = new Set(CONVERSATIONS.map(c=>c.id));
  const classmates = ALL_CLASSMATES.filter(cm => !cm.me && !existingIds.has(cm.id) && (!q || cm.name.toLowerCase().includes(q)));
  if(classmates.length){
   html += '<div class="csec">Classmates</div>';
   html += classmates.map(cm => {
    const stCls = esc(cm.state || 'offline');
    let stText = 'Offline';
    if(cm.state==='studying') stText = cm.course ? 'Studying '+cm.course : 'Studying';
    else if(cm.state==='here') stText = 'On the site';
    else if(cm.seen_at) stText = 'Last online '+timeAgo(cm.seen_at);

    const isActive = (cm.id === PARTNER_ID);
    return '<a class="crow '+(isActive?'active':'')+'" href="dm.html?with='+encodeURIComponent(cm.id)+'&to='+encodeURIComponent(cm.name)+'" onclick="onConvoClick(event,\''+esc(cm.id)+'\',\''+esc(cm.name)+'\')">'+
     '<div style="position:relative;flex:none">'+avHtml(cm.name,cm.av,cm.avatar,40)+'<i class="dot '+stCls+'" style="position:absolute;bottom:-2px;right:-2px;border:2px solid var(--surface)"></i></div>'+
     '<div class="cw">'+
      '<div class="crow-top"><b>'+esc(cm.name)+'</b></div>'+
      '<div class="crow-bot"><span class="crow-prev">'+esc(stText)+'</span></div>'+
     '</div>'+
    '</a>';
   }).join('');
  }
 }

 if(!html){
  html = '<p class="empty">No conversations found.</p>';
 }
 list.innerHTML = html;
}

function onConvoClick(e, id, name){
 e.preventDefault();
 selectPartner(id, name);
}

function selectPartner(id, name){
 PARTNER_ID = id;
 PARTNER_NAME = name;
 history.replaceState(null, '', 'dm.html?with='+encodeURIComponent(id)+'&to='+encodeURIComponent(name));
 setupPartnerHeader();
 loadThread();
 renderSidebarList();
}

function handleBack(e){
 if(window.innerWidth < 720 && document.body.classList.contains('in-chat')){
  e.preventDefault();
  document.body.classList.remove('in-chat');
  PARTNER_ID = '';
  PARTNER_NAME = '';
  history.replaceState(null, '', 'dm.html');
  $('partnerHead').hidden = true;
  $('duelBtn').hidden = true;
  $('composerDock').hidden = true;
  $('backTxt').textContent = 'Class list';
  $('backBtn').href = 'classlist.html';
  renderSidebarList();
 }
}

/* -------------------- CHAT THREAD VIEW -------------------- */
function renderMessages(){
 const st=$('stream');
 if(!MESSAGES.length){
  st.innerHTML='<p class="empty">No messages yet. Send a message to start the conversation!</p>';
  return;
 }
 let lastDate='';
 let html='';
 MESSAGES.forEach(m=>{
  const d=new Date(m.created_at).toLocaleDateString();
  if(d!==lastDate){
   const isToday=new Date().toLocaleDateString()===d;
   const dObj=new Date(m.created_at);
   const dateLabel=isToday?'Today':dObj.toLocaleDateString(undefined,{month:'short',day:'numeric'});
   html+='<div class="dsep"><span>'+esc(dateLabel)+'</span></div>';
   lastDate=d;
  }
  const cls=m.mine?'me':'them';
  html+='<div class="msg '+cls+(m.sending?' sending':'')+'" id="m'+m.id+'">'+
   '<div class="bubble">'+linkify(m.body)+'</div>'+
   '<div class="mfoot">'+
    '<span>'+timeClock(m.created_at)+'</span>'+
    (m.mine?(m.read?'<span class="read" title="Seen">✓✓</span>':'<span title="Delivered">✓</span>'):'')+
    (m.mine&&!m.sending?'<button class="mdel" onclick="delMsg('+m.id+')">Delete</button>':'')+
   '</div>'+
  '</div>';
 });
 st.innerHTML=html;
}

function scrollToBottom(smooth){
 const st=$('stream');
 if(!st)return;
 if(smooth) st.scrollTo({top:st.scrollHeight, behavior:'smooth'});
 else st.scrollTop=st.scrollHeight;
}

function isThreadSame(newMsgs, oldMsgs){
 if(newMsgs.length !== oldMsgs.length) return false;
 if(!newMsgs.length) return true;
 if(newMsgs[newMsgs.length-1].id !== oldMsgs[oldMsgs.length-1].id) return false;
 for(let i=0; i<newMsgs.length; i++){
  if(newMsgs[i].read !== oldMsgs[i].read || newMsgs[i].sending !== oldMsgs[i].sending) return false;
 }
 return true;
}

async function loadThread(quiet){
 if(!PARTNER_ID)return;
 try{
  const msgs=await Auth.rpc('dm_thread',{p_with:PARTNER_ID},true);
  if(Array.isArray(msgs)){
   if(isThreadSame(msgs, MESSAGES) && quiet) return;

   const wasNearBottom=(()=>{
    const st=$('stream');
    return st?(st.scrollHeight-st.scrollTop-st.clientHeight<80):true;
   })();
   MESSAGES=msgs;
   renderMessages();
   if(wasNearBottom)scrollToBottom();
  }
 }catch(e){
  if(!quiet)$('stream').innerHTML='<p class="err">'+esc(e.message||'Could not load messages.')+'</p>';
 }
}

async function sendMsg(){
 const inp=$('msgInput');
 const txt=btrim(inp.value);
 if(!txt||IS_SENDING||!PARTNER_ID)return;
 IS_SENDING=true;
 $('sendBtn').disabled=true;

 // Optimistic message append
 const tempId=Date.now();
 const tempMsg={id:tempId,body:txt,created_at:new Date().toISOString(),mine:true,read:false,sending:true};
 MESSAGES.push(tempMsg);
 renderMessages();
 scrollToBottom();
 inp.value='';
 inp.style.height='auto';

 try{
  const res=await Auth.rpc('dm_send',{p_to:PARTNER_ID,p_body:txt},true);
  tempMsg.sending=false;
  if(res&&res.id)tempMsg.id=res.id;
  renderMessages();
  loadInbox(true);
 }catch(e){
  toast(e.message||'Could not send message');
  MESSAGES=MESSAGES.filter(m=>m.id!==tempId);
  renderMessages();
 }finally{
  IS_SENDING=false;
  $('sendBtn').disabled=false;
  inp.focus();
 }
}

async function delMsg(id){
 if(!confirm('Delete this message for yourself?'))return;
 try{
  await Auth.rpc('dm_delete',{p_id:id},true);
  MESSAGES=MESSAGES.filter(m=>m.id!==id);
  renderMessages();
  toast('Message removed');
  loadInbox(true);
 }catch(e){
  toast(e.message||'Could not delete');
 }
}

function btrim(s){return String(s||'').trim()}

/* Setup partner details in header */
async function setupPartnerHeader(){
 document.body.classList.add('in-chat');
 $('composerDock').hidden=false;
 $('partnerHead').hidden=false;
 if(window.innerWidth < 720){
  $('backTxt').textContent='Messages';
  $('backBtn').href='#messages';
 }else{
  $('backTxt').textContent='Class list';
  $('backBtn').href='classlist.html';
 }

 if(PARTNER_NAME){
  $('partnerName').textContent=PARTNER_NAME;
  $('duelBtn').href='duel.html?to='+encodeURIComponent(PARTNER_NAME);
  $('duelBtn').hidden=false;
  $('msgInput').placeholder='Message '+PARTNER_NAME+'…';
 }

 // Fetch class list to get partner's avatar and real live presence / last online
 try{
  let rows = ALL_CLASSMATES;
  if(!rows.length){
   rows=await Auth.rpc('class_list',{},true);
   if(Array.isArray(rows)) ALL_CLASSMATES=rows;
  }
  let p=null;
  if(Array.isArray(rows)){
   if(PARTNER_ID)p=rows.find(r=>r.id===PARTNER_ID);
   if(!p&&PARTNER_NAME)p=rows.find(r=>r.name.toLowerCase()===PARTNER_NAME.toLowerCase());
   if(p){
    PARTNER_ID=p.id;
    PARTNER_NAME=p.name;
    $('partnerName').textContent=p.name;
    $('partnerAv').innerHTML=avHtml(p.name,p.av,p.avatar,36);
    $('duelBtn').href='duel.html?to='+encodeURIComponent(p.name);
    $('duelBtn').hidden=false;
    $('msgInput').placeholder='Message '+p.name+'…';

    const stClass=esc(p.state||'offline');
    let stText='Offline';
    if(p.state==='studying')stText=p.course?'Studying '+p.course:'Studying';
    else if(p.state==='here')stText='On the site';
    else if(p.seen_at)stText='Last online '+timeAgo(p.seen_at);

    $('partnerStatus').innerHTML='<i class="dot '+stClass+'"></i>'+esc(stText);
   }
  }
 }catch(e){}
}

/* Auto-expanding textarea */
function setupInput(){
 const inp=$('msgInput');
 inp.addEventListener('input',()=>{
  inp.style.height='auto';
  inp.style.height=Math.min(120,inp.scrollHeight)+'px';
 });
 inp.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
   e.preventDefault();
   sendMsg();
  }
 });
 $('sendBtn').onclick=sendMsg;

 $('dmSearch').addEventListener('input', e=>{
  LAST_SEARCH = e.target.value;
  renderSidebarList();
 });

 $('backBtn').addEventListener('click', handleBack);
}

/* -------------------- BOOT -------------------- */
async function boot(){
 try{
  const all=await (await fetch('courses.json')).json();
  COURSES=all.filter(c=>!c.soon);
  const cl=all.find(c=>c.cloud&&c.cloud.url);if(cl)Auth.cloud=cl.cloud;
 }catch(e){}
 if(!Auth.cloud){
  $('mainWrap').innerHTML='<div class="card"><p>Direct messages require cloud features, which aren\'t set up here.</p></div>';
  return;
 }

 let msg='';try{await Auth.finish()}catch(e){msg=e.message}
 if(!Auth.ses()){signedOut(msg);return}

 // Verify attendance linked
 try{
  await Auth.rpc('presence_ping',{p_course:null,p_studying:false},true);
 }catch(e){
  const m=String(e&&e.message||'');
  if(/link your attendance/i.test(m)){unlinked(m);return}
 }

 setupInput();
 await loadInbox();

 if(PARTNER_ID||PARTNER_NAME){
  await setupPartnerHeader();
  await loadThread();
  scrollToBottom();
 }

 POLL_TIMER=setInterval(()=>{
  if(document.visibilityState==='visible'&&Auth.ses()){
   loadInbox(true);
   if(PARTNER_ID)loadThread(true);
  }
 },3500);

 document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&Auth.ses()){
   loadInbox(true);
   if(PARTNER_ID)loadThread(true);
  }
 });
}

boot();
</script></body></html>

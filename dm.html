<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Direct Messages · APMed '33</title>
<meta name="description" content="Private direct messages between attendance-linked classmates.">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('reviewer_theme')||localStorage.getItem('psych_theme');if(t)document.documentElement.dataset.theme=t;const p=localStorage.getItem('reviewer_palette');if(p)document.documentElement.dataset.palette=p}catch(e){}</script>
<link rel="stylesheet" href="ui.css">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;scrollbar-gutter:stable}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:inherit}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Global Top Header Bar */
.top{display:flex;align-items:center;background:color-mix(in oklab,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex:none;padding:0}
.top-inbox-cell{display:flex;align-items:center;padding:10px 14px}
.top-chat-cell{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:1;min-width:0}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--mute);font-size:14px;font-weight:600;padding:6px 10px 6px 6px;border-radius:10px;transition:background .15s}
.back:hover{color:var(--text);background:var(--raised)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:8px 14px;font-weight:600;font-size:13.5px;border:1px solid var(--line2);background:var(--surface);text-decoration:none;transition:background .15s,filter .15s}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:9px;gap:4px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}

.card{margin:24px auto;padding:20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);max-width:540px}
.card h2{display:flex;align-items:center;gap:7px;margin:0 0 8px;font:700 13px/1 var(--sans);letter-spacing:.5px;text-transform:uppercase;color:var(--mute)}
.card p{margin:0 0 12px;color:var(--mute);font-size:14px}
.err{margin:8px 0 0;color:var(--bad,#c0392b);font-size:13.5px}
.empty{color:var(--faint);font-size:14px;text-align:center;padding:24px 0}

/* Status dots with safe margins so 3px outer halo is never clipped */
.dot{flex:none;width:9px;height:9px;border-radius:50%;display:inline-block;margin:3px 3px 3px 4px}
.dot.studying{background:var(--good,#22a06b);box-shadow:0 0 0 3px color-mix(in oklab,var(--good,#22a06b) 24%,transparent)}
.dot.here{background:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 22%,transparent)}
.dot.offline{background:var(--line2)}

/* Partner header in chat */
.phead{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
#partnerAv{flex:none;display:flex;align-items:center;justify-content:center}
.pinfo{min-width:0;flex:1}
.pname{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstatus{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0 1px 2px}

/* Main Split Container */
#mainWrap{flex:1;display:flex;min-height:0;height:100%;overflow:hidden;position:relative}

/* Left Sidebar (Conversations & Classmate Search) */
#inboxWrap{width:360px;flex:none;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line);min-height:0;height:100%;overflow:hidden;position:relative}
.inbox-top{padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:none}
.inbox-title{margin:0;font:800 18px/1.2 var(--sans);letter-spacing:-.3px;display:flex;align-items:center;gap:7px}
.inbox-sub{margin:2px 0 0;color:var(--mute);font-size:12px}
.inbox-search{position:relative;margin-top:10px}
.inbox-search input{width:100%;padding:7px 10px 7px 30px;border-radius:10px;border:1px solid var(--line2);background:var(--raised);font-size:13px;outline:0;transition:border-color .15s}
.inbox-search input:focus{border-color:var(--accent);background:var(--surface)}
.inbox-search .s-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;display:flex}
.clist{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:0;scrollbar-gutter:stable}

/* Right Chat Area */
#chatWrap{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden;background:var(--bg);position:relative}
.stream{flex:1;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0;scrollbar-gutter:stable;padding:14px 18px}
.dsep{text-align:center;margin:12px 0 6px;position:relative}
.dsep span{font-size:12px;font-weight:600;color:var(--faint);background:var(--raised);padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.msg{display:flex;flex-direction:column;max-width:80%;position:relative;animation:fadeIn .16s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.them{align-self:flex-start;align-items:flex-start}
.mbody{position:relative;display:inline-flex;align-items:center;max-width:100%}
.msg.me .mbody{justify-content:flex-end}
.bubble{padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 2px #0000000a;user-select:text;-webkit-user-select:text}
.bubble.bubble-stk{user-select:none;-webkit-user-select:none}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.them .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bubble a{color:inherit;text-decoration:underline}
.mfoot{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--faint);margin-top:3px;padding:0 2px;user-select:none;line-height:1}
.msg.me .mfoot{justify-content:flex-end;align-self:flex-end}
.msg.them .mfoot{justify-content:flex-start;align-self:flex-start}
.mfoot .read{color:var(--accent);font-weight:600}
.mfoot .mtime{font-variant-numeric:tabular-nums}
.mact{position:absolute;top:50%;transform:translateY(-50%) scale(.92);display:flex;align-items:center;opacity:0;pointer-events:none;transition:opacity .18s ease .15s,transform .18s ease .15s;z-index:15}
.msg.me .mact{right:100%;padding-right:6px;padding-left:10px}
.msg.them .mact{left:100%;padding-left:6px;padding-right:10px}
.msg:hover .mact,.msg:focus-within .mact,.msg.show-actions .mact,.mact:hover{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1);transition-delay:0s}
.mact-bar{display:inline-flex;align-items:center;gap:3px;padding:3px 4px;border-radius:99px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 3px 10px rgba(0,0,0,.12)}
.mact-btn{width:28px;height:28px;border-radius:99px;border:0;background:transparent;color:var(--mute);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .12s,color .12s,transform .1s}
.mact-btn:hover{background:var(--raised);color:var(--text);transform:scale(1.1)}
.mact-btn:active{transform:scale(.92)}
.mact-btn.del-btn:hover{background:color-mix(in srgb,var(--bad,#ef4444) 14%,var(--surface));color:var(--bad,#ef4444)}
.mact-btn .i{width:15px;height:15px}
.rx-picker{position:fixed;z-index:90;background:var(--surface);border:1px solid var(--line2);border-radius:99px;padding:4px 6px;box-shadow:0 8px 24px rgba(0,0,0,.2),0 2px 6px rgba(0,0,0,.08);display:flex;align-items:center;gap:3px;animation:rxPop .15s ease-out}
@keyframes rxPop{from{opacity:0;transform:scale(.85) translateY(4px)}to{opacity:1;transform:scale(1) translateY(0)}}
.rx-pick-btn{font-size:20px;line-height:1;width:34px;height:34px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .12s}
.rx-pick-btn:hover{transform:scale(1.35)}
.rx-pick-btn:active{transform:scale(.9)}
.m-reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;z-index:2}
.msg.me .m-reactions{justify-content:flex-end}
.msg.them .m-reactions{justify-content:flex-start}
.m-rx-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .12s,border-color .15s,background .15s;user-select:none;line-height:1}
.m-rx-pill:hover{transform:scale(1.08);background:var(--raised)}
.m-rx-pill:active{transform:scale(.92)}
.m-rx-pill.is-mine{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.m-rx-pill .m-rx-em{font-size:13px;line-height:1}
.m-rx-pill .m-rx-cnt{font-size:11px;font-variant-numeric:tabular-nums;opacity:.88}
.mquote{padding:5px 8px;border-radius:8px;margin-bottom:6px;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;max-width:100%;overflow:hidden;transition:opacity .15s}
.mquote:hover{opacity:.88}
.msg.me .mquote{background:rgba(0,0,0,.15);border-left:3px solid var(--accent-ink);color:var(--accent-ink)}
.msg.them .mquote{background:var(--raised);border-left:3px solid var(--accent);color:var(--text)}
.mquote-author{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700}
.mquote-snip{font-size:12.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes flashBubble{0%,100%{outline:2px solid transparent}25%,70%{outline:2.5px solid var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}}
.msg.flashBg .bubble{animation:flashBubble 1.4s ease-out}
.rdock{max-width:760px;margin:0 auto 8px;background:var(--surface);border:1px solid var(--line2);border-left:3.5px solid var(--accent);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:10px;animation:fadeIn .15s ease-out}
.rdock-content{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.rdock-icon{color:var(--accent);display:flex;flex:none}
.rdock-txt{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.rdock-author{font-size:12px;font-weight:700;color:var(--accent)}
.rdock-snip{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdock-cancel{flex:none;width:24px;height:24px;border-radius:50%;border:0;background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center;padding:0;transition:background .15s,color .15s}
.rdock-cancel:hover{background:var(--raised);color:var(--text)}
.msg.sending{opacity:.6}

/* In-pane Composer dock */
.dock{background:color-mix(in oklab,var(--bg) 95%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px;flex:none}
.din{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px}
.din textarea{flex:1;height:42px;min-height:42px;max-height:120px;resize:none;padding:9px 12px;border-radius:13px;border:1.5px solid var(--line2);background:var(--surface);outline:0;font-size:14.5px;line-height:1.4;overflow-y:hidden}
.din textarea::placeholder{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--faint)}
.din textarea:focus{border-color:var(--accent)}
.sendbtn{flex:none;width:42px;height:42px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:filter .15s,transform .1s}
.sendbtn:hover:not(:disabled){filter:brightness(1.08)}
.sendbtn:active:not(:disabled){transform:scale(.95)}
.sendbtn:disabled{opacity:.4;cursor:default}
.din .stkbtn, .din .emojibtn{flex:none;width:42px;height:42px;border-radius:12px}
.msg.is-pure-stk .bubble-stk{background:none!important;border:none!important;box-shadow:none!important;padding:0!important}
.msg.is-pure-stk.me .mfoot{justify-content:flex-end}
.msg.is-pure-stk.them .mfoot{justify-content:flex-start}
/* Duel challenge cards in the thread */
.bubble.bubble-duel{background:none!important;border:none!important;box-shadow:none!important;padding:0!important;color:var(--text)}
.duel-card{display:flex;flex-direction:column;gap:8px;min-width:238px;max-width:320px;padding:13px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line2);box-shadow:0 2px 8px #00000012}
.duel-head{display:flex;align-items:center;gap:9px}
.duel-ic{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line)}
.duel-title{font-size:14.5px;font-weight:800;letter-spacing:-.15px}
.duel-meta{font-size:12.5px;color:var(--mute);line-height:1.4}
.duel-state{font-size:13px;font-weight:700;color:var(--accent)}
.duel-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:2px}
.duel-btn{display:inline-flex;align-items:center;justify-content:center;padding:6px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--raised);color:var(--text);font-size:12.5px;font-weight:700;text-decoration:none;cursor:pointer;line-height:1.2}
.bubble a.duel-btn{text-decoration:none}
.bubble a.duel-link{text-decoration:none}
.bubble a.duel-link:hover{text-decoration:underline}
.duel-btn:hover{background:var(--surface);border-color:var(--accent-line)}
.duel-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.duel-btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.duel-btn.ghost{background:transparent;color:var(--mute)}
.duel-link{font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none}
.duel-link:hover{text-decoration:underline}

/* Shared question and game-result cards */
.bubble.bubble-shared{white-space:normal}
.msg.me .bubble.bubble-shared{color:var(--text)}
.s-card{width:100%;max-width:320px;min-width:0;overflow-wrap:anywhere}
.s-course{font:700 11px/1.3 var(--sans);letter-spacing:.4px;text-transform:uppercase;color:var(--faint)}
.s-stem{font-size:14px;line-height:1.45;font-weight:600;overflow-wrap:anywhere}
.s-choices{display:flex;flex-direction:column;gap:6px}
.s-choice{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:1px solid var(--line2);background:var(--raised);color:var(--text);font-size:13px;line-height:1.35;cursor:pointer;overflow-wrap:anywhere;transition:background .12s,border-color .12s,transform .1s}
.s-choice:hover:not(:disabled){background:var(--surface);border-color:var(--accent-line);transform:translateY(-1px)}
.s-choice:disabled{cursor:default;opacity:1}
.s-choice.correct{background:var(--good-bg,#e7f7ee);border-color:var(--good,#22a06b);color:var(--good,#22a06b);font-weight:700}
.s-choice.wrong{background:var(--bad-bg,#fde8e8);border-color:var(--bad,#c0392b);color:var(--bad,#c0392b);font-weight:700}
.s-answer{font-size:13px;font-weight:700;color:var(--good,#22a06b);line-height:1.4;overflow-wrap:anywhere}
.s-why,.s-why-not{font-size:12.5px;line-height:1.45;color:var(--mute);overflow-wrap:anywhere}
.s-why-not{color:var(--bad,#c0392b)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--good-bg:color-mix(in srgb,var(--good,#4fd3a1) 16%,var(--surface,#181b25));--bad-bg:color-mix(in srgb,var(--bad,#fb923c) 18%,var(--surface,#181b25))}}
:root[data-theme="dark"]{--good-bg:color-mix(in srgb,var(--good,#4fd3a1) 16%,var(--surface,#181b25));--bad-bg:color-mix(in srgb,var(--bad,#fb923c) 18%,var(--surface,#181b25))}
.game-grid{margin:0;padding:9px 10px;border-radius:9px;background:var(--raised);border:1px solid var(--line);font:13px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}
.shared-text{margin-top:2px;padding:9px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line2);font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}

/* Conversation Row Cards */
.crow{flex:none;min-height:56px;display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid transparent;text-decoration:none;transition:background .15s,border-color .15s;cursor:pointer}
.crow:hover{background:var(--raised);border-color:var(--line)}
.crow.active{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 1px 3px #00000008}
.crow .cw{flex:1;min-width:0}
.crow-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.crow b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow time{font-size:11.5px;color:var(--faint);flex:none}
.crow-bot{display:flex;align-items:center;gap:8px}
.crow-prev{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;flex:none}

/* Section divider in search */
.csec{font:700 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.5px;color:var(--faint);padding:8px 6px 2px}

.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;pointer-events:none;transition:.25s var(--ease);z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Responsive media queries */
@media (max-width:719px){
 #inboxWrap{width:100%;border-right:none}
 .top-inbox-cell{display:contents}
 .top-chat-cell{display:contents}
 .top{padding:8px 12px;gap:8px}
 body.in-chat .top .sp{display:none!important}
 .phead{gap:8px;min-width:0;flex:1}
 .pname{font-size:14px;line-height:1.25}
 .pstatus{font-size:11.5px}
 .back{padding:6px 8px 6px 4px;font-size:13px;gap:4px}
 #duelBtn{padding:5px 8px;font-size:12px;gap:4px}
 body.in-chat #inboxWrap{display:none!important}
 body:not(.in-chat) #chatWrap{display:none!important}
 body:not(.in-chat) #partnerHead{display:none!important}
 body:not(.in-chat) #duelBtn{display:none!important}
 body.in-chat #backTxt{display:inline}
 .dock{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
 .din{gap:6px}
 .din textarea{height:40px;min-height:40px;padding:8px 11px;font-size:14px;border-radius:12px;overflow-y:hidden}
 .sendbtn, .din .stkbtn, .din .emojibtn{width:40px;height:40px;border-radius:11px}
 .mact{top:auto;bottom:calc(100% + 4px);transform:translateY(4px) scale(.92)}
 .msg.me .mact{right:0;left:auto;padding:0}
 .msg.them .mact{left:0;right:auto;padding:0}
 .msg:hover .mact,.msg:focus-within .mact,.msg.show-actions .mact,.mact:hover{transform:translateY(0) scale(1)}
}
@media (min-width:720px){
 #inboxWrap{display:flex!important}
 #chatWrap{display:flex!important}
 .top-inbox-cell{width:360px;flex:none;border-right:1px solid var(--line);box-sizing:border-box}
 .top-chat-cell{flex:1;min-width:0}
 body.in-chat #backTxt{display:inline!important}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<header class="top" id="topBar">
 <div class="top-inbox-cell">
  <a class="back" id="backBtn" href="classlist.html"><svg class="i" width="16" height="16" aria-hidden="true"><use href="icons.svg#i-chevron-left"/></svg><span id="backTxt">Class list</span></a>
 </div>
 <div class="top-chat-cell">
  <div class="phead" id="partnerHead" hidden style="cursor:pointer" title="View profile" onclick="openPartnerProfile()">
   <div id="partnerAv"></div>
   <div class="pinfo">
    <span class="pname" id="partnerName"></span>
    <span class="pstatus" id="partnerStatus"><i class="dot offline"></i>Offline</span>
   </div>
  </div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>'<svg class="i" width="16" height="16" aria-hidden="true"><use href="icons.svg#i-'+n+'"/></svg>';
function toast(t,ms){const e=$('toast');if(!e)return;e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms||2400)}

const Q=new URLSearchParams(location.search);
let PARTNER_ID=Q.get('with')||'',PARTNER_NAME=Q.get('to')||'';
let COURSES=[],MESSAGES=[],ALL_CLASSMATES=[],CONVERSATIONS=[],PROFILES={};
let POLL_TIMER=null,IS_SENDING=false,LAST_CONVS_HASH='',LAST_SEARCH='';
let ACTIVE_RX_MSG=null,REPLY_TARGET=null;
const DUELS={},LATER_CODES=new Set(),DUEL_REFRESH_MS=30000;
const DUEL_RE=/^\[duel:([A-Z2-9]{8})\]$/,DUEL_ANY=/\[duel:[A-Z2-9]{8}\]/g;
const SWORDS='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" y1="14" x2="9" y2="18"/><line x1="7" y1="17" x2="4" y2="20"/><line x1="3" y1="19" x2="5" y2="21"/></svg>';

function duelCode(body){const m=String(body==null?'':body).trim().match(DUEL_RE);return m?m[1]:''}
function duelScore(res){return res?String(res).split('').filter(x=>x==='1').length:0}
function duelResult(d){
 if(!d||!d.a||!d.b||!d.a.done||!d.b.done||d.a.res==null||d.b.res==null)return null;
 const sa=duelScore(d.a.res),sb=duelScore(d.b.res);
 let w=sa>sb?'a':sb>sa?'b':'';
 if(!w&&d.a.secs!=null&&d.b.secs!=null)w=d.a.secs<d.b.secs?'a':d.b.secs<d.a.secs?'b':'';
 return {sa,sb,w};
}
function duelMeta(d){
 if(!d)return 'Loading…';
 const c=COURSES.find(x=>x.id===d.course),title=c?c.title:(d.course||'Duel');
 return title+(d.scope?' · '+d.scope:'')+(Array.isArray(d.qids)?' · '+d.qids.length+' questions':'');
}
function duelStateText(d,mine){
 if(!d)return 'Loading…';
 if(d.declined)return 'Declined';
 const r=duelResult(d);
 if(r){
  if(d.me==='a'||d.me==='b'){
   const my=d.me==='a'?r.sa:r.sb,other=d.me==='a'?r.sb:r.sa;
   if(r.w===''||my===other)return 'Draw '+my+'–'+other;
   return (r.w===d.me?'You won ':'You lost ')+my+'–'+other;
  }
  return r.sa+'–'+r.sb;
 }
 if(mine){
  const p=d[d.me==='a'?'b':'a'];
  return p?'Waiting for '+p.name:'Waiting for a classmate';
 }
 if(d.me){
  if(d[d.me]&&!d[d.me].done)return 'Your turn';
  const p=d[d.me==='a'?'b':'a'];
  if(p)return 'Waiting for '+p.name;
 }
 if(!d.me&&d.open)return 'Open challenge';
 return '';
}
function duelActionsHtml(d,code,mine){
 if(!d||d.declined||duelResult(d))return '';
 const href='duel.html?d='+encodeURIComponent(code),c=esc(code);
 if(!mine&&d.me&&d[d.me]&&!d[d.me].done){
  if(LATER_CODES.has(code))return '<div class="duel-actions"><a class="duel-link" href="'+href+'">Play later</a></div>';
  return '<div class="duel-actions">'+
   '<a class="duel-btn primary" href="'+href+'">Accept</a>'+
   '<button class="duel-btn" type="button" data-duel-act="decline" data-duel-code="'+c+'">Decline</button>'+
   '<button class="duel-btn ghost" type="button" data-duel-act="later" data-duel-code="'+c+'">Later</button>'+
  '</div>';
 }
 if(!mine&&!d.me&&d.open){
  return '<div class="duel-actions"><a class="duel-btn primary" href="'+href+'">Accept</a>'+
   '<button class="duel-btn ghost" type="button" data-duel-act="later" data-duel-code="'+c+'">Later</button></div>';
 }
 return '';
}
function duelCardInner(code,mine){
 const d=DUELS[code]&&DUELS[code].view;
 return '<div class="duel-head"><span class="duel-ic">'+SWORDS+'</span><span class="duel-title">Duel challenge</span></div>'+
  '<div class="duel-meta">'+esc(duelMeta(d))+'</div>'+
  (duelStateText(d,mine)?'<div class="duel-state">'+esc(duelStateText(d,mine))+'</div>':'')+
  duelActionsHtml(d,code,mine);
}
function duelCardHtml(m,code){
 const mine=!!m.mine;
 return '<div class="duel-card" data-duel-card="'+esc(code)+'" data-duel-mine="'+(mine?'1':'0')+'">'+duelCardInner(code,mine)+'</div>';
}

/* Shared questions and game results in the thread */
const QTAG_RE=/^\[q:([a-z0-9_-]{1,24}):([\w.:-]{1,60})\]$/;
const GAME_TAG_RE=/^\[game:(crossword|apmeddle|sortit|duel|blitz|clues|thread):([\w-]{1,40})\]$/;
const GAME_META={crossword:{name:'Crossword',icon:'🧩'},apmeddle:{name:"APMed'le",icon:'🔤'},sortit:{name:'Sort It',icon:'🗂️'},blitz:{name:'Blitz',icon:'⚡'},clues:{name:'Three Clues',icon:'🔎'},thread:{name:'Common Thread',icon:'🧵'},duel:{name:'Duel',icon:'⚔️'}};
const COURSE_JSON={},Q_CARDS={};
function splitTagBody(txt){
 const s=String(txt==null?'':txt),nl=s.indexOf('\n');
 return {first:nl<0?s:s.slice(0,nl),rest:nl<0?'':s.slice(nl+1)};
}
function qTagInfo(txt){const p=splitTagBody(txt),m=p.first.match(QTAG_RE);return m?{course:m[1],qid:m[2],rest:p.rest}:null}
function gameTagInfo(txt){const p=splitTagBody(txt),m=p.first.match(GAME_TAG_RE);return m?{game:m[1],code:m[2],rest:p.rest}:null}
function gameLabel(g){return GAME_META[g]?GAME_META[g].name:g}
function plainTextHtml(s){return esc(String(s==null?'':s).replace(/@m:\S+/g,'(structure drawing)'))}
function seedFrom(v){const s=String(v==null?'':v);let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function seededShuffle(a,seed){const out=a.slice();let s=seed>>>0;for(let i=out.length-1;i>0;i--){s=(Math.imul(s,1664525)+1013904223)>>>0;const j=s%(i+1);const x=out[i];out[i]=out[j];out[j]=x}return out}
function courseData(course){
 if(!COURSE_JSON[course]) COURSE_JSON[course]=fetch('courses/'+encodeURIComponent(course)+'.json').then(r=>{if(!r.ok)throw new Error('missing');return r.json()}).catch(()=>null);
 return COURSE_JSON[course];
}
function findCourseItem(data,qid){
 if(!data)return null;
 const list=(Array.isArray(data.bank)?data.bank:[]).concat(...(Array.isArray(data.variants)?data.variants:[]).map(v=>(v&&v.items)||[]));
 return list.find(x=>x&&String(x.id)===String(qid))||null;
}
function questionCardHtml(m,info){
 return '<div class="duel-card s-card q-card" data-mid="'+esc(m.id)+'" data-course="'+esc(info.course)+'" data-qid="'+esc(info.qid)+'">'+
  '<div class="s-loading duel-meta">Loading question…</div></div>';
}
function gameCardHtml(info){
 const meta=GAME_META[info.game]||{name:info.game,icon:'🏆'};
 const lines=String(info.rest||'').replace(/\r\n?/g,'\n').replace(/\n+$/,'');
 const action=info.game==='duel'?'Open duels':info.game==='blitz'?'Play a round':"Play today's";
 return '<div class="duel-card s-card game-card" data-game="'+esc(info.game)+'">'+
  '<div class="duel-head"><span class="duel-ic s-ic">'+meta.icon+'</span><div style="min-width:0"><div class="duel-title">'+esc(meta.name)+' result</div><div class="duel-meta">'+esc(info.code)+'</div></div></div>'+
  (lines?'<pre class="game-grid">'+esc(lines)+'</pre>':'')+
  '<div class="duel-actions"><a class="duel-btn primary" href="'+esc(info.game)+'.html">'+esc(action)+'</a></div>'+
 '</div>';
}
function questionCardInner(mid,data,item,choices){
 const st=Q_CARDS[mid]||{};
 const cfg=(data&&data.config)||{};
 const title=cfg.title||item.course||'Reviewer';
 const topic=(cfg.sections&&cfg.sections[item.section])||item.section||'';
 const stem=item.q?String(item.q):(item.definition?'Which term fits: '+item.definition:'');
 const correct=String(item.a||'');
 const choiceHtml=choices.map((c,i)=>{
  let cls='s-choice';
  if(st.answered){if(c===correct)cls+=' correct';else if(c===st.picked)cls+=' wrong'}
  return '<button type="button" class="'+cls+'" data-mid="'+esc(mid)+'" data-idx="'+i+'" onclick="pickQCard(this)"'+(st.answered?' disabled':'')+'>'+plainTextHtml(c)+'</button>';
 }).join('');
 let feedback='';
 if(st.answered){
  const right=st.picked===correct;
  feedback='<div class="s-answer">Correct answer: <b>'+plainTextHtml(correct)+'</b></div>'+
   (item.why?'<div class="s-why">'+plainTextHtml(item.why)+'</div>':'')+
   (!right&&item.dw&&item.dw[st.picked]?'<div class="s-why-not"><b>Why not your choice:</b> '+plainTextHtml(item.dw[st.picked])+'</div>':'');
 }
 return '<div class="s-course">'+esc(title)+(topic?' · '+esc(topic):'')+'</div>'+
  '<div class="s-stem">'+plainTextHtml(stem)+'</div>'+
  '<div class="s-choices">'+choiceHtml+'</div>'+feedback+
  '<div class="duel-actions"><a class="duel-link" href="reviewer.html?course='+encodeURIComponent(st.course||'')+'">Open '+esc(title)+'</a></div>';
}
function pickQCard(btn){
 const mid=btn&&btn.getAttribute('data-mid'),st=mid&&Q_CARDS[mid];
 if(!st||st.answered)return;
 const idx=Number(btn.getAttribute('data-idx'));
 if(!(idx>=0&&idx<st.choices.length))return;
 st.picked=st.choices[idx];st.answered=true;
 const el=btn.closest('.q-card');
 if(el)el.innerHTML=questionCardInner(mid,st.data,st.item,st.choices);
}
function hydrateQuestionCards(root){
 const scope=root&&root.querySelectorAll?root:document;
 scope.querySelectorAll('.q-card[data-mid]').forEach(el=>{
  const mid=el.getAttribute('data-mid');
  if(!mid)return;
  const st=Q_CARDS[mid];
  if(st&&st.data){el.innerHTML=questionCardInner(mid,st.data,st.item,st.choices);return}
  if(el.getAttribute('data-loading')==='1'||el.getAttribute('data-hydrated')==='1')return;
  el.setAttribute('data-loading','1');
  const course=el.getAttribute('data-course')||'',qid=el.getAttribute('data-qid')||'';
  courseData(course).then(data=>{
   el.removeAttribute('data-loading');
   el.setAttribute('data-hydrated','1');
   const item=findCourseItem(data,qid);
   if(!item){
    const title=data&&data.config&&data.config.title;
    el.innerHTML='<div class="duel-meta">This question is no longer in the reviewer.</div>'+
     (title?'<div class="duel-actions"><a class="duel-link" href="reviewer.html?course='+encodeURIComponent(course)+'">Open '+esc(title)+'</a></div>':'');
    return;
   }
   const choices=seededShuffle([String(item.a)].concat((item.d||[]).map(String)),seedFrom(mid));
   Q_CARDS[mid]={course:course,qid:qid,item:item,choices:choices,data:data,answered:false,picked:''};
   el.innerHTML=questionCardInner(mid,data,item,choices);
  });
 });
}
function updateDuelCards(code){
 document.querySelectorAll('.duel-card[data-duel-card="'+code+'"]').forEach(el=>{
  el.innerHTML=duelCardInner(code,el.getAttribute('data-duel-mine')==='1');
 });
}
function updateAllDuelCards(){
 document.querySelectorAll('.duel-card[data-duel-card]').forEach(el=>{
  const code=el.getAttribute('data-duel-card');
  el.innerHTML=duelCardInner(code,el.getAttribute('data-duel-mine')==='1');
 });
}
async function refreshDuelStates(msgs){
 const now=Date.now(),codes=[...new Set((msgs||[]).map(m=>duelCode(m.body)).filter(Boolean))];
 let changed=false;
 await Promise.all(codes.map(async code=>{
  const c=DUELS[code];
  if(c&&(c.pending||(c.view&&now-c.at<DUEL_REFRESH_MS)))return;
  DUELS[code]={view:c?c.view:null,at:c?c.at:0,pending:true};
  try{
   const d=await Auth.rpc('duel_get',{p_code:code},true);
   if(d&&typeof d==='object'){
    if(!c||JSON.stringify(c.view)!==JSON.stringify(d))changed=true;
    DUELS[code]={view:d,at:Date.now()};
   }else DUELS[code]={view:c?c.view:null,at:now};
  }catch(e){DUELS[code]={view:c?c.view:null,at:now,error:e.message||'Could not load the duel.'}}
 }));
 return changed;
}
async function duelDecline(code){
 if(!code)return;
 document.querySelectorAll('.duel-card[data-duel-card="'+code+'"] [data-duel-act="decline"]').forEach(b=>{b.disabled=true});
 try{
  const d=await Auth.rpc('duel_decline',{p_code:code},true);
  const prev=DUELS[code]&&DUELS[code].view;
  DUELS[code]={view:(d&&typeof d==='object')?d:Object.assign({},prev||{},{declined:true}),at:Date.now()};
  updateDuelCards(code);
  toast('Duel declined');
 }catch(e){
  document.querySelectorAll('.duel-card[data-duel-card="'+code+'"] [data-duel-act="decline"]').forEach(b=>{b.disabled=false});
  toast(e.message||'Could not decline. Try again.');
 }
}
function duelLater(code){
 if(!code)return;
 LATER_CODES.add(code);
 updateDuelCards(code);
}

function timeAgo(t){
 if(!t)return '';
 const s=Math.max(0,Math.floor((Date.now()-new Date(t))/1000));
 if(s<60)return 'just now';
 if(s<3600)return Math.floor(s/60)+'m ago';
 if(s<86400)return Math.floor(s/3600)+'h ago';
 const d=new Date(t),now=new Date();
 const isYesterday=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1).toDateString()===d.toDateString();
 if(isYesterday)return 'yesterday';
 const sameYear=now.getFullYear()===d.getFullYear();
 return d.toLocaleDateString(undefined,sameYear?{month:'short',day:'numeric'}:{month:'short',day:'numeric',year:'numeric'});
}

function timeClock(t){
 if(!t)return '';
 return new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
}

function linkify(s){
 return esc(s).replace(/\bhttps?:\/\/[^\s<]+[^\s<.,;:!?)\]'"]/g,u=>'<a href="'+u+'" target="_blank" rel="noopener nofollow">'+u+'</a>');
}

function avHtml(name,av,url,sz){
 return window.Profile?Profile.html({av:av||'g',url:url||'',name:name||'Classmate'},sz||36):'';
}

function signedOut(msg){
 $('mainWrap').innerHTML='<div class="card"><h2>'+ic('users')+' Sign in to message classmates</h2>'+
  '<p>Direct messages are only for signed-in classmates whose attendance is linked.</p>'+
  '<button class="btn primary wide" onclick="Auth.signIn(location.href)">Sign in with Google</button>'+
  (msg?'<p class="err">'+esc(msg)+'</p>':'')+'</div>';
}

function unlinked(msg){
 $('mainWrap').innerHTML='<div class="card"><h2>'+ic('users')+' Link your attendance first</h2>'+
  '<p>'+(msg?esc(msg):'Link your Google account to your name on the attendance sheet to send direct messages.')+'</p>'+
  '<a class="btn primary wide" href="attendance.html">Go to My attendance</a></div>';
}

/* -------------------- INBOX / CONVERSATIONS -------------------- */
async function loadInbox(quiet){
 if(quiet && window.innerWidth < 720 && document.body.classList.contains('in-chat')) return;
 try{
  const [convs, classList, profs] = await Promise.all([
   Auth.rpc('dm_conversations',{},true).catch(()=>[]),
   ALL_CLASSMATES.length ? Promise.resolve(ALL_CLASSMATES) : Auth.rpc('class_list',{},true).catch(()=>[]),
   Object.keys(PROFILES).length ? Promise.resolve(PROFILES) : Auth.rpc('class_profiles',{},true).catch(()=>({}))
  ]);
  if(Array.isArray(classList)&&classList.length) ALL_CLASSMATES=classList;
  if(profs&&typeof profs==='object') PROFILES=profs;

  const convsArray = Array.isArray(convs) ? convs : [];
  CONVERSATIONS = convsArray;

  // Don't re-render sidebar if data hasn't changed and no active filter query
  const hash = JSON.stringify(convsArray) + '|' + (PARTNER_ID||'') + '|' + LAST_SEARCH;
  if(hash === LAST_CONVS_HASH && quiet) return;
  LAST_CONVS_HASH = hash;

  renderSidebarList();
 }catch(e){
  if(!quiet) $('convList').innerHTML='<p class="err">'+esc(e.message||'Could not load conversations.')+'</p>';
 }
}

function cleanMsgPreview(txt){
 if(!txt)return '';
 let s=String(txt).replace(/^\[reply:[^\]]+\]\s*/,'');
 if(window.Stickers)s=Stickers.cleanSnippet(s);
 const g=gameTagInfo(s);
 if(g)return '🏆 Shared a '+gameLabel(g.game)+' result';
 const q=qTagInfo(s);
 if(q){const rest=q.rest.trim().replace(/[\r\n\t]+/g,' ');return '❓ Shared a question'+(rest?' '+rest:'')}
 return s.replace(DUEL_ANY,'⚔️ Duel challenge');
}

function renderSidebarList(){
 const list=$('convList');
 const q=(LAST_SEARCH||'').trim().toLowerCase();
 let html='';

 let filteredConvs = CONVERSATIONS;
 if(q){
  filteredConvs = CONVERSATIONS.filter(c => (c.name||'').toLowerCase().includes(q) || (c.last_message||'').toLowerCase().includes(q));
 }

 if(filteredConvs.length){
  html += filteredConvs.map(c=>{
   const stateCls=esc(c.state||'offline');
   const isActive = (c.id === PARTNER_ID);
   return '<a class="crow '+(isActive?'active':'')+'" href="dm.html?with='+encodeURIComponent(c.id)+'&to='+encodeURIComponent(c.name)+'" data-id="'+esc(c.id)+'" data-name="'+esc(c.name)+'">'+
    '<div style="position:relative;flex:none">'+avHtml(c.name,c.av,c.avatar,40)+'<i class="dot '+stateCls+'" style="position:absolute;bottom:-2px;right:-2px;border:2px solid var(--surface)"></i></div>'+
    '<div class="cw">'+
     '<div class="crow-top"><b>'+esc(formatDisplayName(c.name))+'</b><time>'+timeAgo(c.last_at)+'</time></div>'+
     '<div class="crow-bot">'+
      '<span class="crow-prev">'+(c.last_mine?'You: ':'')+esc(cleanMsgPreview(c.last_message))+'</span>'+

function getMyUserId(){
 const meRow=ALL_CLASSMATES.find(c=>c.me);
 if(meRow&&meRow.id)return meRow.id;
 try{
  const s=Auth.ses();
  if(s&&s.user&&s.user.id)return s.user.id;
  if(s&&s.access&&s.access.includes('.')){
   const payload=JSON.parse(atob(s.access.split('.')[1]));
   if(payload&&payload.sub)return payload.sub;
  }
 }catch(_){}
 return '';
}

// Reactions arrive as {emoji: {n, me}} (counts only, Nov 4); older replies were {emoji: [account ids]}.
function rxOf(v,myUid){return Array.isArray(v)?{n:v.length,me:!!(myUid&&v.includes(myUid))}:{n:+(v&&v.n)||0,me:!!(v&&v.me)}}
function buildReactionsHtml(m){
 if(!m||!m.reactions)return '';
 const myUid=getMyUserId();
 const entries=Object.entries(m.reactions);
 if(!entries.length)return '';
 let pills='';
 for(const [em,v] of entries){
  const rx=rxOf(v,myUid);
  if(!rx.n)continue;
  const isMine=rx.me;
  pills+='<button class="m-rx-pill '+(isMine?'is-mine':'')+'" type="button" onclick="toggleReaction('+m.id+','+esc(JSON.stringify(em))+')" title="'+(isMine?'Remove reaction':'React with '+esc(em))+'">'+
   '<span class="m-rx-em">'+esc(em)+'</span>'+
   '<span class="m-rx-cnt">'+rx.n+'</span>'+
  '</button>';
 }
 return pills?'<div class="m-reactions">'+pills+'</div>':'';
}

async function toggleReaction(msgId,emoji){
 if(!Auth.ses()||!msgId||!emoji)return;

 if(!msg)return;

 if(!myUid)return;

 if(!msg.reactions||typeof msg.reactions!=='object')msg.reactions={};
 const cur=rxOf(msg.reactions[emoji],myUid),nx=cur.me?{n:cur.n-1,me:false}:{n:cur.n+1,me:true};
 if(nx.n<=0)delete msg.reactions[emoji];
 else msg.reactions[emoji]=nx;

 renderMsgReactionsDom(msgId);

 try{
  const updated=await Auth.rpc('dm_react',{p_msg_id:msgId,p_emoji:emoji},true);
  if(updated&&typeof updated==='object'){
   msg.reactions=updated;
   renderMsgReactionsDom(msgId);

 }catch(err){

  loadThread(true);
 }
}

 const isDuel=!!dcode&&!quoteHtml&&!isQCard&&!isGameCard;
 const stkMatch=window.Stickers?Stickers.parse(bodyText):null;
 const isPure=(stkMatch&&stkMatch.isPure&&!quoteHtml&&!isDuel&&!isQCard&&!isGameCard);

 const actHtml=(!m.sending)?(

   '<div class="mact-bar">'+

 }else if(isGameCard){

 html+='<div class="msg '+cls+(m.sending?' sending':'')+(isPure?' is-pure-stk':'')+'" id="m'+m.id+'" data-id="'+m.id+'">'+

function renderMessages(){

 if(!MESSAGES.length){

 }
 let lastDate='';
 let html='';
 MESSAGES.forEach(m=>{

 });
 st.innerHTML=html;

function scrollToBottom(smooth){
 const st=$('stream');
 if(!st)return;
 if(smooth) st.scrollTo({top:st.scrollHeight, behavior:'smooth'});
 else st.scrollTop=st.scrollHeight;
}

function sortRx(rx){
 if(!rx||typeof rx!=='object') return '';
 const k=Object.keys(rx).sort();
 const o={};
 for(const x of k){
  const u=Array.isArray(rx[x])?[...rx[x]].sort():[];
  if(u.length) o[x]=u;
 }
 return JSON.stringify(o);
}

function isThreadSame(newMsgs, oldMsgs){
 if(newMsgs.length !== oldMsgs.length) return false;
 if(!newMsgs.length) return true;
 for(let i=0; i<newMsgs.length; i++){
  if(newMsgs[i].id !== oldMsgs[i].id) return false;
  if(newMsgs[i].read !== oldMsgs[i].read || newMsgs[i].sending !== oldMsgs[i].sending) return false;
  if(sortRx(newMsgs[i].reactions) !== sortRx(oldMsgs[i].reactions)) return false;
 }
 return true;
}

function updateMessagesIncrementally(newMsgs){
 const st=$('stream');
 if(!st)return;
 const oldMap = new Map(MESSAGES.map(m=>[m.id, m]));
 const newMap = new Map(newMsgs.map(m=>[m.id, m]));

 for(const nm of newMsgs){
  const om = oldMap.get(nm.id);
  if(om){
   if(sortRx(nm.reactions) !== sortRx(om.reactions)){
    om.reactions = nm.reactions;
    renderMsgReactionsDom(nm.id);
   }
   if(nm.read !== om.read && om.mine){
    om.read = nm.read;
    const el = $('m' + nm.id);
    if(el){
     const mfoot = el.querySelector('.mfoot');
     if(mfoot){
      mfoot.innerHTML = '<span class="mtime">'+timeClock(nm.created_at)+'</span>' +
       (nm.read?'<span class="read" title="Seen"><svg class="i" width="14" height="14" aria-hidden="true"><use href="icons.svg#i-check-check"/></svg></span>':'<span title="Delivered"><svg class="i" width="14" height="14" aria-hidden="true"><use href="icons.svg#i-check"/></svg></span>');
     }
    }
   }
  }
 }

 if(newMsgs.length > MESSAGES.length){
  const appended = newMsgs.filter(m => !oldMap.has(m.id));
  if(appended.length){
   const wasNearBottom = (st.scrollHeight - st.scrollTop - st.clientHeight < 80);
   let lastDate = MESSAGES.length ? new Date(MESSAGES[MESSAGES.length-1].created_at).toLocaleDateString() : '';
   let appHtml = '';
   appended.forEach(m=>{
    appHtml += buildSingleMsgHtml(m, lastDate);
    lastDate = new Date(m.created_at).toLocaleDateString();
   });
   st.insertAdjacentHTML('beforeend', appHtml);
   hydrateQuestionCards(st);
   if(wasNearBottom) scrollToBottom(true);
  }
 } else if(newMsgs.length < MESSAGES.length){
  for(const om of MESSAGES){
   if(!newMap.has(om.id)){
    const el = $('m' + om.id);
    if(el) el.remove();
   }
  }
 }

 MESSAGES = newMsgs;
}

async function loadThread(quiet){
 if(!PARTNER_ID)return;
 try{
  const [msgs, rxMap]=await Promise.all([
   Auth.rpc('dm_thread',{p_with:PARTNER_ID},true),
   Auth.rpc('dm_thread_reactions',{p_with:PARTNER_ID},true).catch(()=>({}))
  ]);
  if(Array.isArray(msgs)){
   msgs.forEach(m=>{
    m.reactions=(rxMap&&rxMap[m.id])||{};
   });
   const duelChanged=await refreshDuelStates(msgs);
   if(isThreadSame(msgs, MESSAGES) && quiet){
    if(duelChanged)updateAllDuelCards();
    return;
   }

   if(quiet && MESSAGES.length && $('stream') && $('stream').querySelector('.msg')){
    updateMessagesIncrementally(msgs);
    if(duelChanged)updateAllDuelCards();
    return;
   }

   const wasNearBottom=(()=>{
    const st=$('stream');
    return st?(st.scrollHeight-st.scrollTop-st.clientHeight<80):true;
   })();
   MESSAGES=msgs;
   renderMessages();
   if(wasNearBottom)scrollToBottom();
  }
 }catch(e){
  if(!quiet)$('stream').innerHTML='<p class="err">'+esc(e.message||'Could not load messages.')+'</p>';
 }
}

async function submitMsg(txt){
 if(!txt||IS_SENDING||!PARTNER_ID)return;
 IS_SENDING=true;
 $('sendBtn').disabled=true;

 let fullText=txt;
 if(REPLY_TARGET){
  const author=REPLY_TARGET.author||'Classmate';
  let cleanSnip=cleanMsgPreview(REPLY_TARGET.body).trim().replace(/[\r\n\t:]+/g,' ').slice(0,70);
  const tag='[reply:'+REPLY_TARGET.id+':'+author.replace(/:/g,'')+':'+(cleanSnip||'Message')+']';
  fullText=tag+'\n'+fullText;
  cancelReply();
 }

 // Optimistic message append
 const tempId=Date.now();
 const tempMsg={id:tempId,body:fullText,created_at:new Date().toISOString(),mine:true,read:false,sending:true,reactions:{}};
 MESSAGES.push(tempMsg);
 renderMessages();
 scrollToBottom();

 // Optimistic sidebar conversation update
 if(Array.isArray(CONVERSATIONS)){
  const activeConvo=CONVERSATIONS.find(c=>c.id===PARTNER_ID);
  if(activeConvo){
   activeConvo.last_message=fullText;
   activeConvo.last_mine=true;
   activeConvo.last_at=tempMsg.created_at;
   LAST_CONVS_HASH='';
   renderSidebarList();
  }
 }

 try{
  const res=await Auth.rpc('dm_send',{p_to:PARTNER_ID,p_body:fullText},true);
  tempMsg.sending=false;
  if(res&&res.id)tempMsg.id=res.id;
  renderMessages();
  await loadInbox(true);
 }catch(e){
  toast(e.message||'Could not send message');
  MESSAGES=MESSAGES.filter(m=>m.id!==tempId);
  renderMessages();
 }finally{
  IS_SENDING=false;
  $('sendBtn').disabled=false;
  const inp=$('msgInput');
  if(inp)inp.focus();
  if(window.pollSoon)setTimeout(window.pollSoon,1500);   // a reply often comes right after
 }
}

function btrim(s){return String(s||'').trim()}

function formatDisplayName(name){
 if(!name) return '';
 let s = String(name).trim();
 if(s.includes(',')){
  const parts = s.split(',').map(p=>p.trim());
  if(parts.length >= 2){
   s = parts.slice(1).join(' ') + ' ' + parts[0];
  }
 }
 if(s === s.toUpperCase()){
  s = s.toLowerCase().replace(/(?:^|\s|-)\S/g, c => c.toUpperCase());
 }
 return s;
}

function getFirstName(name){
 const clean = formatDisplayName(name);
 if(!clean) return '';
 const first = clean.split(/\s+/)[0];
 return first || clean;
}

 const inp=$('msgInput');
 inp.addEventListener('input', resizeMsgInput);
 inp.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
   e.preventDefault();
   cancelReply();
   closeRxPicker();
  }else if(e.key==='Enter'&&!e.shiftKey){
   e.preventDefault();
   sendMsg();
  }
 });
 $('sendBtn').onclick=sendMsg;
 if($('stkBtn'))$('stkBtn').onclick=()=>Stickers.togglePicker({anchor:$('stkBtn'),onSelect:sendSticker});
 if($('emojiBtn'))$('emojiBtn').onclick=()=>Emojis.openInsertPicker({anchor:$('emojiBtn'),inputEl:$('msgInput')});

 $('dmSearch').addEventListener('input', e=>{
  LAST_SEARCH = e.target.value;
  renderSidebarList();
 });

 $('backBtn').addEventListener('click', handleBack);
 $('convList').addEventListener('click', e=>{
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button)return;
  const row=e.target.closest('.crow[data-id]');
  if(row)onConvoClick(e,row.dataset.id,row.dataset.name||'');
 });

 const st=$('stream');
 if(st){
  st.addEventListener('scroll', closeRxPicker, {passive:true});

  let pressTimer=null;
  st.addEventListener('touchstart', e=>{
   const msg=e.target.closest('.msg');
   if(!msg||e.target.closest('.mact-btn')||e.target.closest('a')) return;
   clearTimeout(pressTimer);
   // For standalone stickers with no text to select, holding also reveals actions
   if(msg.classList.contains('is-pure-stk')||e.target.closest('.bubble-stk')){
    pressTimer=setTimeout(()=>{
     document.querySelectorAll('.msg.show-actions').forEach(el=>el.classList.remove('show-actions'));
     msg.classList.add('show-actions');
     if(navigator.vibrate) try{ navigator.vibrate(25); }catch(_){}
    }, 450);
   }
  }, {passive:true});
  st.addEventListener('touchmove', ()=>clearTimeout(pressTimer), {passive:true});
  st.addEventListener('touchend', ()=>clearTimeout(pressTimer), {passive:true});
  st.addEventListener('touchcancel', ()=>clearTimeout(pressTimer), {passive:true});

  // Duel card actions (built with data attributes, never user text in a handler)
  st.addEventListener('click', e=>{
   const b=e.target.closest('[data-duel-act]');
   if(!b)return;
   const code=b.getAttribute('data-duel-code')||'',act=b.getAttribute('data-duel-act');
   if(act==='decline')duelDecline(code);
   else if(act==='later')duelLater(code);
  });

  // Tap a message bubble or sticker to toggle actions (react, reply, delete)
  st.addEventListener('click', e=>{
   if(e.target.closest('.mact-btn, .m-rx-pill, .mquote, a, .duel-card')) return;
   const msg=e.target.closest('.msg');
   if(!msg) return;
   const sel=window.getSelection?window.getSelection().toString():'';
   if(sel&&sel.trim().length) return;
   const wasOpen=msg.classList.contains('show-actions');
   document.querySelectorAll('.msg.show-actions').forEach(el=>el.classList.remove('show-actions'));
   if(!wasOpen) msg.classList.add('show-actions');
  });

  document.addEventListener('pointerdown', e=>{
   if(!e.target.closest('#rxPicker, .em-modal, .rx-btn, .emojibtn, .em-rx-more')){
    closeRxPicker();
   }
   if(!e.target.closest('.msg, #rxPicker, .em-modal')){
    document.querySelectorAll('.msg.show-actions').forEach(el=>el.classList.remove('show-actions'));
   }
  });

  window.addEventListener('keydown', e=>{
   if(e.key==='Escape'){
    closeRxPicker();
    cancelReply();
   }
  });
 }
}

/* -------------------- BOOT -------------------- */
async function boot(){
 try{
  const all=await (await fetch('courses.json')).json();
  COURSES=all.filter(c=>!c.soon);
  const cl=all.find(c=>c.cloud&&c.cloud.url);if(cl)Auth.cloud=cl.cloud;
 }catch(e){}
 if(!Auth.cloud){
  $('mainWrap').innerHTML='<div class="card"><p>Direct messages require cloud features, which aren\'t set up here.</p></div>';
  return;
 }

 let msg='';try{await Auth.finish()}catch(e){msg=e.message}
 if(!Auth.ses()){signedOut(msg);return}

 // Verify attendance linked
 try{
  await Auth.rpc('presence_ping',{p_course:null,p_studying:false},true);
 }catch(e){
  const m=String(e&&e.message||'');
  if(/link your attendance/i.test(m)){unlinked(m);return}
 }

 setupInput();
 await loadInbox();

 if(PARTNER_ID||PARTNER_NAME){
  await setupPartnerHeader();
  await loadThread();
  scrollToBottom();
 }

 // New messages: checked every 4 s while something happens, then every 8, 15 and 30 s while the chat is quiet (each check
 // is 2-3 calls). Typing, sending, opening a chat or coming back to the tab makes it quick again (pollSoon).
 let pollBusy = false, POLL_DELAY = 4000, POLL_SIG = '';
 const pollSig = () => MESSAGES.map(m => m.id + (m.read ? 'r' : '') + JSON.stringify(m.reactions || {})).join(',') + '|' + (PARTNER_ID || '') + '|' + LAST_CONVS_HASH;
 window.pollSoon = () => { POLL_DELAY = 0; pollTick(); };   // 0: the next wait is 4 s even if nothing changed
 window.pollNow = () => pollTick(); window.pollDelay = () => POLL_DELAY;   // for tests/test_dm_poll.py
 async function pollTick(){
  clearTimeout(POLL_TIMER);
  if(document.visibilityState==='visible' && Auth.ses() && !pollBusy){
   pollBusy = true;
   try{
    if(PARTNER_ID) await loadThread(true);
    if(window.innerWidth >= 720 || !document.body.classList.contains('in-chat')){
     await loadInbox(true);
    }
   }catch(_){}
   pollBusy = false;
   const sig = pollSig();
   POLL_DELAY = sig !== POLL_SIG || !POLL_DELAY ? 4000 : POLL_DELAY < 8000 ? 8000 : POLL_DELAY < 15000 ? 15000 : 30000;
   POLL_SIG = sig;
  }
  POLL_TIMER = setTimeout(pollTick, POLL_DELAY);
 }
 const mi = $('msgInput');
 if (mi) mi.addEventListener('input', () => { if (POLL_DELAY > 4000) pollSoon(); });

 pollTick();

 document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && Auth.ses()){
   pollSoon();
  }
 });
}

boot();

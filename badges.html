<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badges · APMed '33</title>
<meta name="description" content="Badges for good study habits: practice, fixing mistakes, streaks and the daily games.">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('reviewer_theme')||localStorage.getItem('psych_theme');if(t)document.documentElement.dataset.theme=t;const p=localStorage.getItem('reviewer_palette');if(p)document.documentElement.dataset.palette=p}catch(e){}</script>
<link rel="stylesheet" href="ui.css">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:720px;margin:0 auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:8px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--mute);font-size:14px;font-weight:600;padding:6px 10px 6px 6px;border-radius:10px}
.back:hover{color:var(--text);background:var(--raised)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;padding:8px 14px;font-weight:600;font-size:14px;border:1px solid var(--line2);background:var(--surface);text-decoration:none}
.btn:hover{background:var(--raised)}
h1{font:800 26px/1.15 var(--sans);letter-spacing:-.5px;margin:10px 0 2px;text-align:center}
.sub{margin:0;color:var(--mute);font-size:14px;text-align:center}
.sub b{color:var(--text)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px auto 0;max-width:320px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.note{margin:16px 0 0;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--mute);font-size:14px;text-align:center}
.note a{color:var(--accent);font-weight:600}
h2{margin:22px 0 8px;font:700 13px/1.2 var(--sans);letter-spacing:.3px;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 10px 12px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);text-align:center;min-width:0}
.tile:hover{border-color:var(--accent-line)}
.tile.got{border-color:var(--accent-line)}
.tile .e{font-size:38px;line-height:1.1}
.tile.lock .e{filter:grayscale(1);opacity:.55}
.tile b{font:700 14px/1.25 var(--sans);overflow-wrap:anywhere}
.tile .d{font-size:12.5px;line-height:1.3;color:var(--mute)}
.tile .s{margin-top:6px;font-size:12px;font-weight:600;color:var(--accent)}
.tile.lock .s{color:var(--mute);width:100%}
.pb{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px;width:100%}
.pb i{display:block;height:100%;background:var(--accent-line,var(--accent));border-radius:99px}
.new{position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:1px 7px;border-radius:99px}
.dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.45)}
.dbox{width:min(380px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:22px 20px 18px;box-shadow:0 20px 50px #0004;text-align:center;font-size:14.5px}
.dbox .e{font-size:64px;line-height:1.1}
.dbox.lock .e{filter:grayscale(1);opacity:.55}
.dbox h3{margin:6px 0 2px;font:600 21px/1.3 var(--serif)}
.dbox p{margin:6px 0;color:var(--mute)}
.dbox .hint{color:var(--text)}
.dbox .row2{display:flex;justify-content:center;margin-top:14px}
</style></head><body>
<main>
 <div class="top"><a class="back" href="./"><svg class="i" width="16" height="16" aria-hidden="true"><use href="icons.svg#i-chevron-left"/></svg>All courses</a></div>
 <h1>Your badges</h1>
 <p class="sub" id="count"></p>
 <div class="bar" role="progressbar" aria-label="Badges earned" id="pbar"><i id="pfill" style="width:0"></i></div>
 <div class="note" id="off" hidden>Badge pop-ups are off. <a href="settings.html">Turn them on in Settings</a>.</div>
 <div id="groups"></div>
</main>
<div class="dlg" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dt"><div class="dbox" id="dbox"></div></div>
<script src="auth.js"></script>
<script src="daily.js"></script>
<script src="badges.js"></script>
<script src="dialog.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HINT={answers:'Every question you answer in any course counts.',fixes:'Get a question right after you missed it last time. Practice "Needs work" and your missed questions.',sections:'Master every question in a section (or every section of a lesson).',lessons:'Master every question in a section (or every section of a lesson).',exams:'Finish a mock exam in any course.',streak:'Meet your daily goal (Settings → Daily goal) several days in a row.',cards:'Review flashcards in any course.',focus:'Start "Focus 25 min" on the home page\'s Class card and let it finish.',words:'Play the daily games on the home page.',sorts:'Play the daily games on the home page.',perfect:'Play the daily games on the home page.',crosswords:'Play the daily games on the home page.',duels:'Finish duels with classmates (Duels on the home page).'};
const COUNTER={};Badges.DEFS.forEach(d=>COUNTER[d[0]]=d[5]);
const fmt=ms=>new Date(ms).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const num=n=>n.toLocaleString('en-US');
let LIST=[],SEEN=0,lastFocus=null;
function draw(){
 const got=LIST.filter(b=>b.got).length;
 $('count').innerHTML='<b>'+got+'</b> of '+LIST.length;
 $('pfill').style.width=(100*got/Math.max(1,LIST.length))+'%';$('pbar').setAttribute('aria-valuenow',got);$('pbar').setAttribute('aria-valuemax',LIST.length);
 $('off').hidden=!Badges.isOff();
 const groups=[];LIST.forEach(b=>{let g=groups.find(x=>x[0]===b.group);if(!g)groups.push(g=[b.group,[]]);g[1].push(b)});
 $('groups').innerHTML=groups.map(([n,l])=>'<h2>'+esc(n)+'</h2><div class="grid">'+l.map(b=>
  '<button class="tile '+(b.got?'got':'lock')+'" data-id="'+b.id+'" aria-label="'+esc(b.name+(b.got?', earned':', '+b.have+' of '+b.need))+'">'+
  (b.got&&b.got>SEEN?'<span class="new">New</span>':'')+
  '<span class="e" aria-hidden="true">'+b.icon+'</span><b>'+esc(b.name)+'</b><span class="d">'+esc(b.desc)+'</span>'+
  (b.got?'<span class="s">Earned '+fmt(b.got)+'</span>':'<span class="s">'+num(b.have)+' / '+num(b.need)+'</span><span class="pb"><i style="width:'+(100*b.have/b.need)+'%"></i></span>')+
  '</button>').join('')+'</div>').join('');
}
function openSheet(id){
 const b=LIST.find(x=>x.id===id);if(!b)return;lastFocus=document.activeElement;
 $('dbox').className='dbox'+(b.got?'':' lock');
 $('dbox').innerHTML='<div class="e" aria-hidden="true">'+b.icon+'</div><h3 id="dt">'+esc(b.name)+'</h3><p>'+esc(b.desc)+'</p>'+
  (b.got?'<p><b>Earned '+fmt(b.got)+'</b></p>':'<p><b>'+num(b.have)+' / '+num(b.need)+'</b></p><div class="pb" style="max-width:220px;margin:0 auto"><i style="width:'+(100*b.have/b.need)+'%"></i></div>')+
  '<p class="hint">'+esc(HINT[COUNTER[id]]||'')+'</p><div class="row2"><button class="btn" id="dclose">Close</button></div>';
 $('dlg').hidden=false;$('dclose').focus();$('dclose').onclick=closeSheet;
}
function closeSheet(){$('dlg').hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeSheet()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('dlg').hidden)closeSheet()});
$('groups').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)openSheet(t.dataset.id)});
(async function(){
 try{const c=(await (await fetch('courses.json')).json()).find(c=>c.cloud&&c.cloud.url);if(c)Auth.cloud=c.cloud}catch(e){}
 try{await Badges.check()}catch(e){}
 SEEN=Badges._state().seen;LIST=Badges.list();draw();Badges.seen();
})();
</script>
<script src="update.js" defer></script>
</body></html>

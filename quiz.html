<link rel="stylesheet" href="ui.css">
<style>

.lb b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pod .p1 i{height:130px;background:#e3a21a}.pod .p2 i{height:95px;background:#94a3b8}.pod .p3 i{height:70px;background:#c4743f}
.pod .p1{order:2}.pod .p2{order:1}.pod .p3{order:3}
main,#app,.card{min-width:0}#app>.card:first-child,#app>.qhead:first-child,#app>.two:first-child{margin-top:16px}.card,.stem,.opt,.lob .how{overflow-wrap:anywhere}
@media (max-width:620px){.lob{padding:22px 14px}.lob .eb{letter-spacing:.3px;line-height:1.5}.two{grid-template-columns:1fr}.ch{grid-template-columns:1fr}.opt{min-height:56px}h1{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<main id="main">
 <a class="back" id="back" href="./">← All courses</a>
 <div id="app" aria-live="polite"></div>
</main>
<script src="live.js"></script>
<script>
/* Live quiz. One person hosts (a laptop or a shared screen), everyone else joins on a phone with a 5-character code.
   Everything travels over Supabase Realtime broadcast (live.js): nothing is stored, and the right answer never leaves the
   host's device until the question is over. ?bus=local uses a BroadcastChannel instead (tests: tabs of one browser).
   Messages on "quiz:<CODE>":
     player -> host  hello {pid, name}, ans {pid, i, c}
     host -> all     lobby {title, n, players}, q {i, n, stem, choices, dur, left, math}, got {i, pids},
                     reveal {i, n, correct, why, counts, res: {pid: [points, total, rank, right]}, top, players}, end {board} */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c)=>'<svg class="i'+(c?' '+c:'')+'" aria-hidden="true"><use href="icons.svg#i-'+n+'"/></svg>';
const Q=new URLSearchParams(location.search),LOCAL=Q.get('bus')==='local';
const CODE_ABC='ABCDEFGHJKMNPQRSTUVWXYZ23456789',LETTERS='ABCD';
const rand=n=>{const r=new Uint32Array(1);crypto.getRandomValues(r);return r[0]%n};
const newCode=()=>Array.from({length:5},()=>CODE_ABC[rand(CODE_ABC.length)]).join('');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const cleanName=s=>String(s||'').replace(/[\u0000-\u001f<>]/g,'').replace(/\s+/g,' ').trim().slice(0,16);
const ord=n=>n+(n%100>=11&&n%100<=13?'th':['th','st','nd','rd'][n%10]||'th');
let CLOUD=null,COURSES=[];

// ---- transport: Live (Supabase Realtime broadcast) or, for tests, a BroadcastChannel
const Bus={topic:'',ch:null,
 open(code,on,onOpen){this.topic='quiz:'+code;
  if(LOCAL){this.ch=new BroadcastChannel(this.topic);this.ch.onmessage=e=>on(e.data);setTimeout(()=>onOpen&&onOpen(),30);return}
  Live.listen(CLOUD,this.topic,on,onOpen)},
 send(m){if(LOCAL){this.ch&&this.ch.postMessage(m);return}Live.ping(this.topic,m)}};

// ---- keep the screen on while a quiz runs (where the browser allows it)
let lock=null;async function keepAwake(){try{if('wakeLock' in navigator&&!lock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(H||P))keepAwake()});

// ---- math (KaTeX), loaded only for math courses
let mathReady=null;
function mathLoad(){if(mathReady)return mathReady;const V='0.16.9',B='https://cdnjs.cloudflare.com/ajax/libs/KaTeX/'+V+'/';
 const l=document.createElement('link');l.rel='stylesheet';l.href=B+'katex.min.css';document.head.appendChild(l);
 const add=src=>new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=r;s.onerror=r;document.head.appendChild(s)});
 return mathReady=add(B+'katex.min.js').then(()=>add(B+'contrib/auto-render.min.js'))}
function mathIn(el,on){if(!on)return;mathLoad().then(()=>{try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}catch(e){}})}

// ---- questions from a course file: written multiple choice, plus "which term is this?" from definitions
function pool(d,scope){const isMol=t=>typeof t==='string'&&t.startsWith('@m:'),chOf=s=>String(s).split('-')[0];
 const inScope=x=>scope==='all'||(scope.startsWith('ch:')?chOf(x.section)===scope.slice(3):x.section===scope);
 const bank=(d.bank||[]).filter(x=>!x.extra),out=[],defs=bank.filter(x=>!x.q&&x.definition&&x.term);
 for(const x of bank){if(!inScope(x))continue;
  if(x.q&&Array.isArray(x.d)&&x.d.length&&!x.fig&&!x.wr&&!x.case&&!isMol(x.a)&&!x.d.some(isMol))out.push({stem:x.q,a:x.a,d:x.d.slice(0,3),why:x.why||''})}
 for(const x of defs){if(!inScope(x))continue;const same=[...new Set(defs.filter(y=>chOf(y.section)===chOf(x.section)&&y.term!==x.term).map(y=>y.term))];if(same.length<3)continue;
  out.push({stem:'Which term is this? '+x.definition,a:x.term,d:shuffle(same).slice(0,3),why:x.term+': '+x.definition})}
 return out}
function topics(d){const c=d.config||{},chs=c.chapters||{},secs=c.sections||{},unit=c.unit||'Chapter',all=pool(d,'all');
 const n=s=>pool(d,s).length,opts=[['all','Everything ('+all.length+')']];
 for(const ch of Object.keys(chs)){const k=n('ch:'+ch);if(!k)continue;opts.push(['ch:'+ch,unit+' '+ch+': '+chs[ch]+' ('+k+')']);
  for(const s of Object.keys(secs).filter(s=>s.split('-')[0]===ch)){const m=n(s);if(m)opts.push([s,'  '+s+' '+secs[s]+' ('+m+')'])}}
 return opts}

/* =================================================================== start page */
function start(){P=null;H=null;
 const pre=Q.get('join'),list=COURSES.filter(c=>!c.soon&&!c.notesOnly),cid=Q.get('course');
 $('main').classList.remove('wide');
 $('app').innerHTML='<h1>'+ic('zap')+'Live quiz</h1><p class="lede">One person hosts on a laptop or a shared screen. Everyone else joins on their phone with the code. Fastest right answers score the most. Nothing is saved.</p>'+
  '<div class="two"><section class="card" aria-labelledby="hj"><h2 id="hj">'+ic('users')+'Join a quiz</h2><p class="d">Got a code from the host?</p>'+
   '<label class="f"><span>Code</span><input class="in code" id="jc" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE" value="'+esc((pre||'').toUpperCase().slice(0,5))+'"></label>'+
   '<label class="f"><span>Your first name</span><input class="in" id="jn" maxlength="16" autocomplete="given-name" placeholder="e.g. Bea" value="'+esc(myName())+'"></label>'+
   '<button class="btn primary big" id="jb" onclick="join()">Join</button><p class="msg" id="jm"></p></section>'+
  '<section class="card" aria-labelledby="hh"><h2 id="hh">'+ic('play')+'Host a quiz</h2><p class="d">Pick the questions, then share the code.</p>'+
   '<label class="f"><span>Course</span><select class="in" id="hc" onchange="pickCourse()">'+list.map(c=>'<option value="'+esc(c.id)+'"'+(c.id===cid?' selected':'')+'>'+esc(c.title)+'</option>').join('')+'</select></label>'+
   '<label class="f"><span>Topic</span><select class="in" id="ht"><option>Loading…</option></select></label>'+
   '<div class="f"><span>Questions</span><div class="chips" id="hn">'+[5,10,15,20].map(n=>'<button aria-pressed="'+(n===10)+'" data-v="'+n+'">'+n+'</button>').join('')+'</div></div>'+
   '<div class="f"><span>Time per question</span><div class="chips" id="hs">'+[10,20,30,45,60].map(n=>'<button aria-pressed="'+(n===20)+'" data-v="'+n+'">'+n+' s</button>').join('')+'</div></div>'+
   '<button class="btn primary big" id="hb" onclick="host()">Create quiz</button><p class="msg" id="hm"></p></section></div>';
 for(const g of ['hn','hs'])$(g).onclick=e=>{const b=e.target.closest('button');if(!b)return;$(g).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
 $('jc').addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5)});
 for(const id of ['jc','jn'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter')join()});
 if(cid&&!pre){$('back').href='reviewer.html?course='+encodeURIComponent(cid);const c=COURSES.find(x=>x.id===cid);if(c)$('back').textContent='← Back to '+c.title}
 pickCourse();if(pre)setTimeout(()=>{const n=$('jn');if(n&&!P)n.focus()},50)}
const FILES={};
async function courseFile(id){if(!FILES[id]){const r=await fetch('courses/'+id+'.json');if(!r.ok)throw new Error(r.status);FILES[id]=await r.json()}return FILES[id]}
async function pickCourse(){const id=$('hc').value,t=$('ht');t.innerHTML='<option>Loading…</option>';t.disabled=true;
 try{const d=await courseFile(id);if($('hc').value!==id)return;t.innerHTML=topics(d).map(([v,l])=>'<option value="'+esc(v)+'">'+esc(l).replace(/^  /,'&nbsp;&nbsp;&nbsp;')+'</option>').join('');t.disabled=false}
 catch(e){t.innerHTML='<option>Could not load the course</option>'}}
function myName(){try{const s=JSON.parse(sessionStorage.getItem('quiz_player')||'null');if(s&&s.name)return s.name;const n=localStorage.getItem('reviewer_quiz_name');if(n)return n;
 const a=JSON.parse(localStorage.getItem('reviewer_account')||'null');if(a&&a.name)return cleanName(a.name.split(' ')[0])}catch(e){}return ''}

/* =================================================================== host */
let H=null,hTimer=null,gotT=null;
const hSave=()=>{try{sessionStorage.setItem('quiz_host',JSON.stringify(Object.assign({},H,{at:Date.now()})))}catch(e){}};
async function host(again){const btn=$('hb');let cfg;
 if(again)cfg=again;else{cfg={course:$('hc').value,scope:$('ht').value,n:+$('hn').querySelector('[aria-pressed=true]').dataset.v,dur:+$('hs').querySelector('[aria-pressed=true]').dataset.v};btn.disabled=true;btn.textContent='Creating…'}
 let d;try{d=await courseFile(cfg.course)}catch(e){if(!again){$('hm').textContent='Could not load the course. Check your connection.';btn.disabled=false;btn.textContent='Create quiz'}return}
 const tf=a=>a.length===2&&a.map(x=>String(x).toLowerCase()).sort().join()==='false,true';   // True/False stay in that order
 const qs=shuffle(pool(d,cfg.scope)).slice(0,cfg.n).map(x=>{const all=[x.a].concat(x.d),ch=tf(all)?all.slice().sort((p,q)=>String(q).toLowerCase()<String(p).toLowerCase()?-1:1):shuffle(all);return {stem:x.stem,choices:ch,correct:ch.indexOf(x.a),why:x.why}});
 if(!qs.length){$('hm').textContent='No questions in that topic yet. Pick another.';btn.disabled=false;btn.textContent='Create quiz';return}
 const c=COURSES.find(x=>x.id===cfg.course)||{};
 const keep=again&&H?H.players:{};
 for(const p of Object.values(keep)){p.score=0;p.right=0;p.streak=0}
 H={code:again&&H?H.code:newCode(),cfg,title:c.title||cfg.course,math:!!(d.config||{}).math,qs,i:-1,phase:'lobby',players:keep,answers:{},qStart:0};
 history.replaceState(null,'','quiz.html?host='+H.code+(LOCAL?'&bus=local':''));
 if(!again)Bus.open(H.code,hOn,()=>hLobby(true));else hLobby(true);
 keepAwake();hSave();hDraw()}
function hOn(m){if(!H||!m||typeof m!=='object')return;
 if(m.t==='hello'){const pid=String(m.pid||'').slice(0,24),name=cleanName(m.name);if(!pid||!name)return;
  const p=H.players[pid]||(H.players[pid]={name,score:0,right:0,streak:0});p.name=name;hLobby();hSave();
  if(H.phase==='q')hSendQ();else if(H.phase==='reveal')Bus.send(H.lastReveal);else if(H.phase==='end')Bus.send(H.lastEnd);
  if(H.phase==='lobby')hDraw();else hCount()}
 else if(m.t==='ans'&&H.phase==='q'&&m.i===H.i){const pid=String(m.pid||'');if(!H.players[pid]||H.answers[pid])return;const c=+m.c;if(!(c>=0&&c<H.qs[H.i].choices.length))return;
  H.answers[pid]={c,ms:Date.now()-H.qStart};hCount();clearTimeout(gotT);gotT=setTimeout(()=>Bus.send({t:'got',i:H.i,pids:Object.keys(H.answers)}),250);
  if(Object.keys(H.answers).length>=Object.keys(H.players).length){clearTimeout(hTimer);hTimer=setTimeout(hReveal,700)}}}
function hLobby(){if(!H)return;Bus.send({t:'lobby',title:H.title,n:H.qs.length,players:Object.entries(H.players).map(([pid,p])=>[pid,p.name]),phase:H.phase})}
function hStart(){if(!H||!Object.keys(H.players).length)return;H.i=-1;hNext()}
function hNext(){H.i++;if(H.i>=H.qs.length)return hEnd();H.phase='q';H.answers={};H.qStart=Date.now();hSendQ();hSave();hDraw();clearTimeout(hTimer);hTimer=setTimeout(hReveal,H.cfg.dur*1000+400)}
function hSendQ(){const q=H.qs[H.i];Bus.send({t:'q',i:H.i,n:H.qs.length,stem:q.stem,choices:q.choices,dur:H.cfg.dur*1000,left:Math.max(0,H.cfg.dur*1000-(Date.now()-H.qStart)),math:H.math})}
function hCount(){const el=$('acount');if(el)el.textContent=Object.keys(H.answers).length+' of '+Object.keys(H.players).length+' answered'}
// points: 1000 for an instant right answer down to 500 at the buzzer, +100 per answer in a row after the first (up to +300)
function hReveal(){if(!H||H.phase!=='q')return;clearTimeout(hTimer);const q=H.qs[H.i],dur=H.cfg.dur*1000,counts=q.choices.map(()=>0),gain={};
 for(const [pid,p] of Object.entries(H.players)){const a=H.answers[pid],ok=!!a&&a.c===q.correct;if(a)counts[a.c]++;
  let pts=0;if(ok){p.streak=(p.streak||0)+1;pts=Math.round(1000-500*Math.min(a.ms,dur)/dur)+Math.min(300,100*(p.streak-1));p.right++}else p.streak=0;
  p.score+=pts;gain[pid]=pts}
 const rank=hRank(),res={};rank.forEach(([pid,p],k)=>{res[pid]=[gain[pid],p.score,k+1,H.answers[pid]?(H.answers[pid].c===q.correct?1:0):-1]});
 H.phase='reveal';H.gain=gain;H.counts=counts;
 H.lastReveal={t:'reveal',i:H.i,n:H.qs.length,correct:q.correct,choices:q.choices,stem:q.stem,why:q.why,counts,res,top:rank.slice(0,5).map(([pid,p])=>[p.name,p.score]),players:rank.length,math:H.math};
 Bus.send(H.lastReveal);hSave();hDraw()}
function hRank(){return Object.entries(H.players).sort((a,b)=>b[1].score-a[1].score||b[1].right-a[1].right||a[1].name.localeCompare(b[1].name))}
function hEnd(){clearTimeout(hTimer);H.phase='end';const rank=hRank();H.lastEnd={t:'end',n:H.qs.length,board:rank.map(([pid,p])=>[pid,p.name,p.score,p.right])};Bus.send(H.lastEnd);hSave();hDraw()}
function hDraw(){const a=$('app');$('main').classList.toggle('wide',H.phase!=='lobby');const np=Object.keys(H.players).length;
 if(H.phase==='lobby'){const link=location.origin+location.pathname.replace(/[^/]*$/,'')+'quiz.html?join='+H.code+(LOCAL?'&bus=local':'');
  a.innerHTML='<section class="card lob"><div class="eb">'+esc(H.title)+'<br>'+H.qs.length+' questions · '+H.cfg.dur+'-second timer</div>'+
   '<div class="bigcode" aria-label="Code '+esc(H.code.split('').join(' '))+'">'+esc(H.code)+'</div>'+
   '<p class="how">On the reviewer site, tap <b>Live quiz</b> and type this code. Or send them the invite link.</p>'+
   '<div class="row" style="justify-content:center"><button class="btn" onclick="hCopy(\''+esc(link)+'\',this)">'+ic('copy')+' Copy invite link</button>'+(navigator.share?'<button class="btn" onclick="navigator.share({title:\'Live quiz\',text:\'Join my '+esc(H.title).replace(/'/g,'')+' quiz with code '+H.code+'\',url:\''+esc(link)+'\'}).catch(()=>{})">'+ic('share')+' Share</button>':'')+'</div>'+
   '<div class="ppl" id="ppl">'+(np?Object.values(H.players).map(p=>'<span>'+ic('user')+esc(p.name)+'</span>').join(''):'<span class="none">Waiting for players to join…</span>')+'</div>'+
   '<button class="btn primary big" onclick="hStart()"'+(np?'':' disabled')+'>'+ic('play')+' Start'+(np?' · '+np+' player'+(np>1?'s':''):'')+'</button>'+
   '<p class="note"><button class="btn" style="padding:6px 12px;font-size:13.5px" onclick="hQuit()">Cancel</button></p></section>';return}
 if(H.phase==='q'){const q=H.qs[H.i];
  a.innerHTML='<div class="qhead"><span>Question '+(H.i+1)+' of '+H.qs.length+'</span><span class="sp"></span><span class="cnt" id="acount"></span></div>'+
   '<div class="timer"><i id="tbar"></i></div><p class="stem">'+esc(q.stem)+'</p>'+
   '<div class="ch'+(q.choices.length<3?' one':'')+'">'+q.choices.map((c,k)=>'<div class="opt c'+k+'"><span class="l">'+LETTERS[k]+'</span><span>'+esc(c)+'</span></div>').join('')+'</div>'+
   '<div class="ctl"><button class="btn" onclick="hReveal()">Show answer now</button></div>';
  hCount();bar($('tbar'),H.cfg.dur*1000-(Date.now()-H.qStart),H.cfg.dur*1000);mathIn(a,H.math);return}
 if(H.phase==='reveal'){const q=H.qs[H.i],tot=Math.max(1,H.counts.reduce((x,y)=>x+y,0)),rank=hRank(),last=H.i+1>=H.qs.length;
  a.innerHTML='<div class="qhead"><span>Question '+(H.i+1)+' of '+H.qs.length+'</span><span class="sp"></span><span class="cnt">'+Object.keys(H.answers).length+' of '+np+' answered</span></div>'+
   '<p class="stem">'+esc(q.stem)+'</p><div class="ch'+(q.choices.length<3?' one':'')+'">'+q.choices.map((c,k)=>'<div class="opt c'+k+(k===q.correct?' right':' dim')+'"><span class="l">'+(k===q.correct?'✓':LETTERS[k])+'</span><span>'+esc(c)+'</span><span class="n">'+H.counts[k]+'</span><i class="bar" style="width:'+Math.round(100*H.counts[k]/tot)+'%"></i></div>').join('')+'</div>'+
   (q.why?'<div class="why"><b>Why:</b> '+esc(q.why)+'</div>':'')+
   '<section class="card" style="margin-top:16px"><h2>'+ic('trophy')+'Leaderboard</h2><ol class="lb">'+rank.slice(0,5).map(([pid,p],k)=>'<li><span class="rk">'+(k+1)+'</span><b>'+esc(p.name)+'</b><span class="dl">'+(H.gain[pid]?'+'+H.gain[pid]:'')+'</span><span class="sc">'+p.score+'</span></li>').join('')+'</ol></section>'+
   '<div class="ctl"><button class="btn" onclick="hEnd()">End quiz</button><button class="btn primary" onclick="hNext()">'+(last?'See final results':'Next question')+' '+ic('arrow-right')+'</button></div>';
  mathIn(a,H.math);return}
 const rank=hRank(),pod=rank.slice(0,3);
 a.innerHTML='<h1 style="justify-content:center">'+ic('trophy')+'Final results</h1><div class="pod">'+pod.map(([pid,p],k)=>'<div class="p'+(k+1)+'"><b>'+esc(p.name)+'</b><span>'+p.score+' pts · '+p.right+'/'+H.qs.length+'</span><i>'+(k+1)+'</i></div>').join('')+'</div>'+
  '<section class="card"><ol class="lb">'+rank.map(([pid,p],k)=>'<li><span class="rk">'+(k+1)+'</span><b>'+esc(p.name)+'</b><span class="dl" style="color:var(--mute)">'+p.right+'/'+H.qs.length+'</span><span class="sc">'+p.score+'</span></li>').join('')+'</ol></section>'+
  '<div class="ctl"><button class="btn" onclick="hQuit()">Done</button><button class="btn primary" onclick="host(H.cfg)">'+ic('rotate-cw')+' Play again</button></div>'}
function hCopy(link,b){(navigator.clipboard&&window.isSecureContext?navigator.clipboard.writeText(link):Promise.reject()).then(()=>{b.innerHTML=ic('check')+' Copied'},()=>{prompt('Copy this link:',link)})}
function hQuit(){if(H){Bus.send({t:'end',n:H.qs.length,board:H.phase==='end'?H.lastEnd.board:[],closed:1})}clearTimeout(hTimer);H=null;try{sessionStorage.removeItem('quiz_host')}catch(e){}history.replaceState(null,'','quiz.html'+(LOCAL?'?bus=local':''));start()}
// the timer bar runs on its own (no per-frame work)
function bar(el,left,dur){if(!el)return;el.style.transition='none';el.style.transform='scaleX('+Math.max(0,left/dur)+')';void el.offsetWidth;el.style.transition='transform '+Math.max(0,left)+'ms linear';el.style.transform='scaleX(0)'}

/* =================================================================== player */
let P=null,resend=null;
function join(){const code=($('jc').value||'').toUpperCase(),name=cleanName($('jn').value),m=$('jm');
 if(code.length!==5){m.textContent='The code has 5 letters and numbers.';$('jc').focus();return}
 if(!name){m.textContent='Type your first name.';$('jn').focus();return}
 try{localStorage.setItem('reviewer_quiz_name',name)}catch(e){}
 let pid='';try{const s=JSON.parse(sessionStorage.getItem('quiz_player')||'null');if(s&&s.code===code)pid=s.pid}catch(e){}
 pid=pid||Array.from({length:12},()=>CODE_ABC[rand(CODE_ABC.length)]).join('');
 P={code,pid,name,phase:'joining',score:0,q:null,pick:null};
 try{sessionStorage.setItem('quiz_player',JSON.stringify({code,pid,name}))}catch(e){}
 history.replaceState(null,'','quiz.html?join='+code+(LOCAL?'&bus=local':''));
 $('jb').disabled=true;$('jb').textContent='Joining…';m.textContent='';
 Bus.open(code,pOn,()=>Bus.send({t:'hello',pid,name}));
 clearTimeout(P.t);P.t=setTimeout(()=>{if(P&&P.phase==='joining'){$('jb').disabled=false;$('jb').textContent='Try again';m.textContent='No quiz with that code is open. Check the code, and ask the host to keep the quiz page open.'}},6000);
 keepAwake()}
function pOn(m){if(!P||!m||typeof m!=='object')return;
 if(m.t==='lobby'){const me=(m.players||[]).some(x=>x[0]===P.pid);if(!me)return;P.title=m.title;P.n=m.n;P.count=(m.players||[]).length;if(P.phase==='joining'||P.phase==='lobby'&&m.phase==='lobby'){P.phase='lobby';pDraw()}}
 else if(m.t==='q'){if(P.phase==='joining')P.phase='lobby';if(P.q&&P.q.i===m.i&&P.phase==='q')return;
  P.phase='q';P.q={i:m.i,n:m.n,stem:String(m.stem||''),choices:(m.choices||[]).map(String).slice(0,4),dur:+m.dur||20000,left:+m.left||0,at:Date.now(),math:!!m.math};P.pick=null;P.sent=false;pDraw()}
 else if(m.t==='got'){if(P.phase==='q'&&P.q&&m.i===P.q.i&&(m.pids||[]).includes(P.pid)){P.sent=true;clearTimeout(resend);const s=$('sent');if(s)s.textContent='Answer received ✓'}}
 else if(m.t==='reveal'){if(P.phase==='joining')return;const r=(m.res||{})[P.pid];if(!r)return;
  P.phase='reveal';P.rv=m;P.score=r[1];clearTimeout(resend);pDraw();if(navigator.vibrate)try{navigator.vibrate(r[3]===1?40:[40,60,40])}catch(e){}}
 else if(m.t==='end'){if(P.phase==='joining')return;P.phase='end';P.end=m;clearTimeout(resend);try{sessionStorage.removeItem('quiz_player')}catch(e){}pDraw()}}
function pick(k){if(!P||P.phase!=='q'||P.pick!=null)return;P.pick=k;const send=()=>Bus.send({t:'ans',pid:P.pid,i:P.q.i,c:k});send();
 let tries=0;clearTimeout(resend);const again=()=>{resend=setTimeout(()=>{if(P&&P.phase==='q'&&!P.sent&&tries++<3){send();again()}},1500)};again();pDraw()}
function pDraw(){const a=$('app');$('main').classList.remove('wide');
 if(P.phase==='lobby'){a.innerHTML='<section class="card fb wait"><div class="ic">'+ic('check')+'</div><h2>You\'re in, '+esc(P.name)+'!</h2><p>'+esc(P.title||'')+(P.n?' · '+P.n+' questions':'')+'</p><p>'+(P.count?P.count+' player'+(P.count>1?'s':'')+' so far. ':'')+'Waiting for the host to start…</p><p class="note">Keep this page open.</p></section>';return}
 if(P.phase==='q'){const q=P.q,left=Math.max(0,q.left-(Date.now()-q.at));
  a.innerHTML='<div class="qhead"><span>Question '+(q.i+1)+' of '+q.n+'</span><span class="sp"></span><span class="cnt">'+P.score+' pts</span></div><div class="timer"><i id="tbar"></i></div>'+
   '<p class="stem">'+esc(q.stem)+'</p><div class="ch'+(q.choices.length<3?' one':'')+'">'+q.choices.map((c,k)=>'<button class="opt c'+k+(P.pick==null?'':k===P.pick?' pick':' dim')+'" onclick="pick('+k+')"'+(P.pick==null?'':' disabled')+'><span class="l">'+LETTERS[k]+'</span><span>'+esc(c)+'</span></button>').join('')+'</div>'+
   (P.pick!=null?'<p class="note" id="sent" style="text-align:center">'+(P.sent?'Answer received ✓':'Answer sent…')+'</p>':'');
  bar($('tbar'),left,q.dur);mathIn(a,q.math);return}
 if(P.phase==='reveal'){const m=P.rv,r=m.res[P.pid],ok=r[3]===1,none=r[3]===-1;
  a.innerHTML='<section class="card fb '+(ok?'ok':'no')+'"><div class="ic">'+(ok?ic('check'):ic('x'))+'</div><h2>'+(ok?'Correct!':none?'Time\'s up':'Not quite')+'</h2>'+(ok?'<div class="pts">+'+r[0]+'</div>':'')+
   '<p>You\'re <b>'+ord(r[2])+'</b> of '+m.players+' · <b>'+r[1]+'</b> pts</p>'+
   '<div class="ans">'+(r[3]===0&&P.pick!=null&&m.choices[P.pick]!=null?'<p style="margin:0 0 8px">Your answer: <b>'+esc(m.choices[P.pick])+'</b></p>':'')+'<div class="opt c'+m.correct+' right" style="cursor:default"><span class="l">✓</span><span>'+esc(m.choices[m.correct])+'</span></div>'+(m.why?'<div class="why">'+esc(m.why)+'</div>':'')+'</div><p class="note">Next question soon…</p></section>';
  mathIn(a,m.math);return}
 if(P.phase==='end'){const b=P.end.board||[],me=b.findIndex(x=>x[0]===P.pid);
  if(P.end.closed&&!b.length){a.innerHTML='<section class="card fb wait"><div class="ic">'+ic('x')+'</div><h2>The host closed the quiz</h2><p><button class="btn" onclick="start()">Back</button></p></section>';return}
  a.innerHTML='<section class="card fb ok"><div class="ic">'+ic('trophy')+'</div><h2>'+(me===0?'You won!':me>=0?'You finished '+ord(me+1):'Quiz over')+'</h2>'+(me>=0?'<p><b>'+b[me][2]+'</b> pts · '+b[me][3]+' of '+P.end.n+' right</p>':'')+'</section>'+
   '<section class="card"><h2>'+ic('trophy')+'Final results</h2><ol class="lb">'+b.slice(0,10).map((x,k)=>'<li class="'+(x[0]===P.pid?'me':'')+'"><span class="rk">'+(k+1)+'</span><b>'+esc(x[1])+'</b><span class="sc">'+x[2]+'</span></li>').join('')+'</ol></section>'+
   '<div class="ctl"><button class="btn" onclick="start()">Done</button></div>';return}
 start()}

/* =================================================================== boot */
(async()=>{try{COURSES=await (await fetch('courses.json')).json()}catch(e){COURSES=[]}
 CLOUD=(COURSES.find(c=>c.cloud&&c.cloud.url)||{}).cloud||null;
 if(!CLOUD&&!LOCAL){$('app').innerHTML='<h1>'+ic('zap')+'Live quiz</h1><p class="lede">The live quiz needs a connection. Check your internet and reload.</p>';return}
 // back after a reload: the host gets the quiz back (same code, same players)
 const hc=Q.get('host');if(hc){try{const s=JSON.parse(sessionStorage.getItem('quiz_host')||'null');if(s&&s.code===hc&&Date.now()-s.at<3*3600e3){H=s;Bus.open(H.code,hOn,()=>{hLobby();if(H.phase==='q'){H.qStart=Date.now();hSendQ();clearTimeout(hTimer);hTimer=setTimeout(hReveal,H.cfg.dur*1000+400)}});keepAwake();hDraw();return}}catch(e){}}
 start();
 // a player who reloads rejoins at once
 const jc=Q.get('join');if(jc){try{const s=JSON.parse(sessionStorage.getItem('quiz_player')||'null');if(s&&s.code===jc.toUpperCase()){$('jn').value=s.name;join()}}catch(e){}}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>

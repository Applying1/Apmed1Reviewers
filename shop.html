*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}

main{max-width:900px;margin:0 auto;padding:22px 16px 120px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--mute);font-size:14px;font-weight:600;padding:6px 10px 6px 6px;border-radius:10px}

.tabs{margin:18px 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px #0000001a}
.mgr{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}

.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cat{margin:22px 0 10px}
.cat h2{font:600 20px/1.2 var(--serif);margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.fund{font:700 11px/1.6 var(--sans);letter-spacing:.04em;text-transform:uppercase;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.it{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.it.inc{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-line)}
.pic{position:relative;aspect-ratio:1;background:var(--raised);border:0;padding:0;display:block;width:100%}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:13px}
.sold{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);font-weight:700;color:var(--mute)}
.ib{padding:9px 11px 11px;display:flex;flex-direction:column;gap:6px;flex:1}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.modal{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:flex-end;justify-content:center}

.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}

.sheet h3{font:600 21px/1.2 var(--serif);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:none;font-size:24px;color:var(--faint);line-height:1}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}

.line .n{flex:1;min-width:0}.line .n small{display:block;color:var(--mute)}
.line .qty{margin:0;padding:2px}.line .qty button{width:30px;height:28px;font-size:16px}
.sum{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding:12px 0}
label.f{display:block;margin-top:10px;font-size:13px;font-weight:600;color:var(--mute)}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--bg);font-size:15px}
label.f textarea{resize:vertical;min-height:60px}
.note{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--raised);font-size:13.5px;white-space:pre-line}
.note b{display:block;margin-bottom:2px}
.msg{min-height:1.2em;margin:10px 0 0;font-size:13.5px}.msg:empty{display:none}.msg.bad{color:var(--bad)}.msg.ok{color:var(--good)}
.ord{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.ord .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ord .h b{font-size:15px}.ord .h span{color:var(--mute);font-size:13px}

.st.paid,.st.ready{background:var(--accent-soft);color:var(--accent)}.st.done{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}.st.cancelled{color:var(--bad)}

.zoom{position:fixed;inset:0;z-index:50;background:#000d;display:grid;place-items:center;padding:20px}.zoom img{max-width:100%;max-height:86vh;object-fit:contain;border-radius:12px;background:#fff}
.zoom b{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff;font-size:15px}

" height="4.4" rx="1.2"/><rect x="9.8" y="9.8" width="4.4" height="4.4" rx="1.2"/><rect x="16.1" y="9.8" width="4.4" height="4.4" rx="1.2"/><rect x="3.5" y="16.1" width="4.4" height="4.4" rx="1.2"/><rect x="9.8" y="16.1" width="4.4" height="4.4" rx="1.2"/><rect x="16.1" y="16.1" width="4.4" height="4.4" rx="1.2"/></svg></button></span></div></div>

<script src="auth.js"></script>
<script>
/* The class sticker shop (supabase_shop.sql). Anyone can browse; ordering needs Google sign-in. Prices, stock and the
   class-fund share are checked by the server; the cart stays on this device (localStorage 'reviewer_shop_cart').
   Paying happens outside the site (the seller's GCash or cash): the seller marks orders paid on shop-admin.html. */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=c=>'₱'+(c/100).toLocaleString('en-US',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2});
const CK='reviewer_shop_cart',CT='reviewer_shop_contact',CN='reviewer_shop_name',CF='reviewer_shop_favs';let PM='gcash';
const BADCONTACT=/[\/\\:<>()]|www\.|https?|\.(com|net|org|ph|me|io|ly|link|gl|co|app|xyz|site|online|ink|tk|cc|to|edu|gov|info|biz|shop|store|click)\b/i,BADNAME=/[\/\\:<>@0-9]/;
const LINKRE=/^(https?:\/\/)?(?:www\.|m\.|web\.|mbasic\.)?(facebook\.com|fb\.com|fb\.me|messenger\.com|m\.me|instagram\.com|instagr\.am|ig\.me)\/(profile\.php\?id=\d{5,20}|[A-Za-z0-9._-]{1,60}(?:\/[A-Za-z0-9._-]{1,60}){0,2}\/?(?:\?[A-Za-z0-9=&_.%-]{0,120})?)$/i;
/* what the contact box holds: a plain name/@username, or a proper Messenger/Instagram profile link (the server checks the same rules) */
function contactKind(v){v=String(v||'').trim();const m=LINKRE.exec(v);
 if(m&&v.length<=200){const ig=/instagram|instagr|ig\.me/i.test(m[2]);return {kind:ig?'instagram':'messenger',url:/^https?:/i.test(v)?v:'https://'+v,shown:v.replace(/^https?:\/\/(www\.)?/i,'').replace(/\/$/,''),ig}}
 if(v.length<3||v.length>60||BADCONTACT.test(v))return null;return {kind:'name'}}
function contactCheck(){const el=$('cconf'),i=$('ccontact');if(!el||!i)return;const v=i.value.trim();el.className='conf';el.textContent='';if(!v)return;
 const k=contactKind(v);
 if(!k){if(v.length>=3&&(/[\/:]|\./.test(v))){el.className='conf bad';el.textContent='That isn\'t a Messenger or Instagram profile link. Use your @username, or a link from facebook.com, m.me or instagram.com.'}return}
 if(k.kind==='name'){el.className='conf ok';el.textContent='✓ The seller will look you up as “'+v+'”.';return}
 el.className='conf ok';el.innerHTML='✓ '+(k.ig?'Instagram':'Messenger')+' profile link: <a href="'+esc(k.url)+'" target="_blank" rel="noopener noreferrer">'+esc(k.shown)+'</a> (tap to check it\'s you)'}
function setPM(v){PM=v;drawReview()}
let D=null,CART={},FILTER='all',ORDERS=null,FAV=[],VIEW='grid',CV='sum';
try{const v=localStorage.getItem('reviewer_shop_view');if(v==='list'||v==='grid'||v==='small')VIEW=v}catch(e){}
function setView(v){VIEW=v;try{localStorage.setItem('reviewer_shop_view',v)}catch(e){}applyView()}
function applyView(){const s=$('shop');s.classList.remove('v-list','v-grid','v-small');s.classList.add('v-'+VIEW);for(const k of ['list','grid','small'])$('v-'+k).setAttribute('aria-pressed',VIEW===k)}
function setCV(v){CV=v;drawReview()}
try{const f=JSON.parse(localStorage.getItem(CF));if(Array.isArray(f))FAV=f.filter(x=>Number.isInteger(x))}catch(e){}
function saveFav(){try{localStorage.setItem(CF,JSON.stringify(FAV))}catch(e){}}
const HEART='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.2-9.4C1.6 7.6 3.6 4.5 6.8 4.5c2 0 3.4 1.1 5.2 3 1.8-1.9 3.2-3 5.2-3 3.2 0 5.2 3.1 4 6.6-1.700 4.8-9.200 9.400-9.200 9.400z"/></svg>';
try{CART=JSON.parse(localStorage.getItem(CK))||{}}catch(e){CART={}}
function saveCart(){try{localStorage.setItem(CK,JSON.stringify(CART))}catch(e){}}
const img=p=>p?Auth.base()+'/storage/v1/object/public/shop/'+p.split('/').map(encodeURIComponent).join('/'):'';
const item=id=>D.items.find(i=>i.id===+id);
function tab(t){for(const k of ['shop','cart','orders']){$('t-'+k).setAttribute('aria-pressed',t===k);$(k).hidden=t!==k}
 if(D&&!(D.soon&&!D.manager))$('tools').hidden=t!=='shop';
 history.replaceState(null,'',t==='shop'?'#':'#'+t);drawBar();if(t==='orders')return loadOrders();if(t==='cart')drawReview()}
function cartLines(){return Object.entries(CART).map(([id,q])=>({it:item(id),q})).filter(x=>x.it&&x.q>0)}
function drawBar(){const L=cartLines(),n=L.reduce((a,x)=>a+x.q,0),t=L.reduce((a,x)=>a+x.q*x.it.price,0);
 $('bar').hidden=!n||$('shop').hidden;$('tot').innerHTML=n+' sticker'+(n===1?'':'s')+'<b>'+peso(t)+'</b>';
 $('cartn').textContent=n;$('cartbtn').classList.toggle('has',n>0);$('t-cart').textContent='Cart'+(n?' ('+n+')':'')}
function maxFor(it){const m=D.settings.max_qty||50;return it.left==null?m:Math.min(m,it.left)}
function setQty(id,q){const it=item(id);if(!it)return;q=Math.max(0,Math.min(maxFor(it),q));if(q)CART[id]=q;else delete CART[id];saveCart();
 const c=document.querySelector('[data-id="'+id+'"]');if(c)c.outerHTML=card(it);drawBar();if(!$('cart').hidden)drawReview()}
function toggleFav(id){id=+id;const i=FAV.indexOf(id);if(i<0)FAV.push(id);else FAV.splice(i,1);saveFav();
 if(FILTER==='fav'&&i>=0)FILTER='all';
 const it=item(id),c=document.querySelector('.it[data-id="'+id+'"]');if(c&&it&&FILTER!=='fav')c.outerHTML=card(it);else drawShop();
 drawChips();if(!$('cart').hidden)drawReview()}
const HUES=['#ff9ab5','#86dbb8','#a3b0ff','#ffd27a','#cba6ff','#ffb08a','#8fd3f0'];
const hue=c=>HUES[Math.max(0,D.catalogs.findIndex(x=>x.id===c))%HUES.length],tilt=id=>(((id*37)%7)-3)*1.1;
function card(it){const q=CART[it.id]||0,open=D.settings.open,out=it.left===0,fav=FAV.includes(it.id);
 return '<div class="it'+(q?' inc':'')+'" data-id="'+it.id+'" style="--r:'+tilt(it.id)+'deg;--c:'+hue(it.catalog)+'"><button class="pic" onclick="zoom('+it.id+')" aria-label="See '+esc(it.name)+' bigger">'+(it.image?'<img src="'+esc(img(it.image))+'" alt="" loading="lazy">':'<span class="none">No photo</span>')+(out?'<span class="sold">Sold out</span>':'')+'</button>'+
  '<div class="ib"><div class="top"><b>'+esc(it.name)+'</b>'+'<button class="fav" aria-pressed="'+fav+'" onclick="toggleFav('+it.id+')" aria-label="'+(fav?'Remove '+esc(it.name)+' from favorites':'Add '+esc(it.name)+' to favorites')+'">'+HEART+'</button>'+'</div><div class="pr"><span>'+peso(it.price)+'</span><span>'+(it.left==null?'':out?'':it.left+' left')+'</span></div>'+
  (!open||out?'':q?'<div class="qty"><button onclick="setQty('+it.id+','+(q-1)+')" aria-label="One less">−</button><output>'+q+'</output><button onclick="setQty('+it.id+','+(q+1)+')"'+(q>=maxFor(it)?' disabled':'')+' aria-label="One more">+</button></div>'
   :'<button class="add" onclick="setQty('+it.id+',1)">+ Add</button>')+'</div></div>'}
/* search: names, catalog names and the seller's hidden tags; forgives plurals and a typo or two */
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function words(it){if(!it._w){const cat=(D.catalogs.find(c=>c.id===it.catalog)||{}).name;it._w=norm(it.name+' '+cat+' '+(it.tags||'')).split(' ').filter(Boolean);it._n=norm(it.name)}return it._w}
function tokHit(t,ws){for(const w of ws)if(w.startsWith(t)||(t.length>=3&&w.includes(t)))return true;
 if(t.length>3&&t.endsWith('s')){const s=t.slice(0,-1);for(const w of ws)if(w.startsWith(s))return true}
 if(t.length>=4){const mx=t.length>=7?2:1;for(const w of ws){if(Math.abs(w.length-t.length)<=mx&&lev(t,w)<=mx)return true;if(t.length>=5&&w.length>t.length&&lev(t,w.slice(0,t.length))<=1)return true}}
 return false}
function searchItems(list,q){const ts=norm(q).split(' ').filter(Boolean);if(!ts.length)return list;
 const hit=list.filter(it=>{const ws=words(it);return ts.every(t=>tokHit(t,ws))});
 return hit.sort((a,b)=>ts.every(t=>b._n.includes(t))-ts.every(t=>a._n.includes(t)))}
let QT=0;function onSearch(){clearTimeout(QT);QT=setTimeout(drawShop,120)}
function drawChips(){const cats=D.catalogs.filter(c=>D.items.some(i=>i.catalog===c.id)),favs=FAV.filter(id=>item(id)).length;
 $('chips').innerHTML=cats.length>1||favs?'<div class="chips" role="group" aria-label="Catalogs"><button class="chip" aria-pressed="'+(FILTER==='all')+'" onclick="FILTER=\'all\';drawChips();drawShop()">All</button>'+
  (favs?'<button class="chip favchip" aria-pressed="'+(FILTER==='fav')+'" onclick="FILTER=\'fav\';drawChips();drawShop()">♥ Favorites ('+favs+')</button>':'')+
  cats.map(c=>'<button class="chip" style="--c:'+hue(c.id)+'" aria-pressed="'+(FILTER===c.id)+'" onclick="FILTER='+c.id+';drawChips();drawShop()">'+esc(c.name)+'</button>').join('')+'</div>':''}
function drawShop(){const s=D.settings,cats=D.catalogs.filter(c=>D.items.some(i=>i.catalog===c.id));
 if(!cats.length){$('tools').hidden=true;$('shop').innerHTML='<p class="empty">'+(s.opened?'Stickers are coming soon.':'The shop isn\'t open yet. Check back soon!')+'</p>';return}
 const q=$('q').value.trim();
 if(q||FILTER==='fav'){let list=D.items.filter(i=>FILTER==='all'||(FILTER==='fav'?FAV.includes(i.id):i.catalog===FILTER));list=searchItems(list,q);
  $('shop').innerHTML=list.length?'<p class="rescount">'+list.length+' sticker'+(list.length===1?'':'s')+(q?' for “'+esc(q)+'”':' you hearted')+'</p><div class="grid">'+list.map(card).join('')+'</div>'
   :'<p class="empty">'+(q?'No stickers match “'+esc(q)+'”. Try a character, a song or what it looks like.':'Tap the heart on a sticker to save it here.')+'</p>';return}
 $('shop').innerHTML=cats.filter(c=>FILTER==='all'||FILTER===c.id).map(c=>{const its=D.items.filter(i=>i.catalog===c.id);return '<section class="cat" style="--c:'+hue(c.id)+'"><div class="ch"><h2>'+esc(c.name)+'</h2>'+(c.to_fund?'<span class="fund">♡ class fund</span>':'')+'<span class="n">'+its.length+' sticker'+(its.length===1?'':'s')+'</span>'+(c.blurb?'<p>'+esc(c.blurb)+'</p>':'')+'</div>'+
   '<div class="grid">'+its.map(card).join('')+'</div></section>'}).join('')}
function zoom(id){const it=item(id);if(!it||!it.image)return;const z=document.createElement('div');z.className='zoom';z.innerHTML='<img src="'+esc(img(it.image))+'" alt=""><b>'+esc(it.name)+' · '+peso(it.price)+'</b>';z.onclick=()=>z.remove();document.body.appendChild(z)}
function review(){tab('cart')}
const BASKET='<svg width="46" height="46" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 10h14l-1.6 8.2a2 2 0 0 1-2 1.6H8.6a2 2 0 0 1-2-1.6L5 10z"/><path d="M8.5 10 12 4l3.500 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="14.500" r="1" fill="#fff"/><circle cx="14" cy="14.500" r="1" fill="#fff"/></svg>';
function favPanel(){const open=D.settings.open,L=FAV.map(item).filter(Boolean);
 if(!L.length)return '<div class="cempty"><p>No favorites yet. Tap the heart on a sticker to save it here.</p><button class="btn primary" onclick="tab(\'shop\')">Start Shopping</button></div>';
 return '<h3>♥ Your favorites</h3><div class="favlist">'+L.map(it=>{const q=CART[it.id]||0,out=it.left===0;return '<div class="line">'+(it.image?'<img src="'+esc(img(it.image))+'" alt="">':'')+'<div class="n">'+esc(it.name)+'<small>'+peso(it.price)+(out?' · sold out':'')+'</small></div>'+
  (!open||out?'':q?'<div class="qty"><button onclick="setQty('+it.id+','+(q-1)+')" aria-label="One less">−</button><output>'+q+'</output><button onclick="setQty('+it.id+','+(q+1)+')"'+(q>=maxFor(it)?' disabled':'')+' aria-label="One more">+</button></div>':'<button class="btn mini" onclick="setQty('+it.id+',1)">+ Add</button>')+
  '<button class="fav sm" aria-pressed="true" onclick="toggleFav('+it.id+')" aria-label="Remove from favorites">'+HEART+'</button></div>'}).join('')+'</div>'}
function drawReview(){const L=cartLines(),n=L.reduce((a,x)=>a+x.q,0),t=L.reduce((a,x)=>a+x.q*x.it.price,0),s=D.settings,PL=s.places||[],signed=!!Auth.ses(),favN=FAV.filter(id=>item(id)).length;let ct='',nmv={};try{ct=localStorage.getItem(CT)||'';nmv=JSON.parse(localStorage.getItem(CN)||'{}')||{}}catch(e){}
 const keep=$('ccontact')?{c:$('ccontact').value,n:$('cnote').value,r:$('cref')?$('cref').value:'',f:$('cfirst').value,l:$('clast').value,s:$('cschool').value}:null;
 let h='<h2 class="ctitle">Your Cart</h2><span class="seg wide" role="group" aria-label="Cart sections"><button aria-pressed="'+(CV==='sum')+'" onclick="setCV(\'sum\')">Order Summary'+(n?' ('+n+')':'')+'</button><button aria-pressed="'+(CV==='fav')+'" onclick="setCV(\'fav\')">Favorites'+(favN?' ('+favN+')':'')+'</button></span>';
 if(CV==='fav')h+='<div class="cpanel">'+favPanel()+'</div>';
 else if(!L.length)h+='<div class="cpanel cempty"><div class="bask"><i>0</i>'+BASKET+'</div><p>Your cart is empty</p><button class="btn primary" onclick="tab(\'shop\')">Start Shopping</button></div>';
 else h+='<div class="cpanel cgrid"><div class="cl"><h3>Your stickers</h3><div id="rlines">'+L.map(({it,q})=>'<div class="line">'+(it.image?'<img src="'+esc(img(it.image))+'" alt="">':'')+'<div class="n">'+esc(it.name)+'<small>'+peso(it.price)+' each</small></div>'+
   '<div class="qty"><button onclick="setQty('+it.id+','+(q-1)+')" aria-label="One less">−</button><output>'+q+'</output><button onclick="setQty('+it.id+','+(q+1)+')"'+(q>=maxFor(it)?' disabled':'')+' aria-label="One more">+</button></div></div>').join('')+'</div>'+
   '<div class="sum"><span>Total</span><span>'+peso(t)+'</span></div>'+
   (s.pay_note?'<div class="note"><b>How to pay</b>'+esc(s.pay_note)+'</div>':'')+(s.pickup_note?'<div class="note"><b>Pickup</b>'+esc(s.pickup_note)+'</div>':'')+'</div>'+
   '<div class="cr"><h3>Checkout</h3>'+(!signed?'<p class="msg">Sign in with Google to order, so the seller knows who it\'s from.</p><a class="btn primary" style="width:100%;margin-top:10px" href="./?signin=1">Sign in with Google</a>':
   '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="f" style="margin-top:0">First name<input id="cfirst" maxlength="40" autocomplete="given-name" value="'+esc(keep?keep.f:(nmv.f||''))+'"></label>'+
   '<label class="f" style="margin-top:0">Last name<input id="clast" maxlength="40" autocomplete="family-name" value="'+esc(keep?keep.l:(nmv.l||''))+'"></label></div>'+
   '<label class="f">School (where you\'ll pick up)'+(PL.length?'<select id="cschool"><option value="">Choose your school…</option>'+PL.map(x=>'<option'+(x===(keep?keep.s:(nmv.s||''))?' selected':'')+'>'+esc(x)+'</option>').join('')+'</select>':'<input id="cschool" maxlength="80" autocomplete="organization" placeholder="Your school" value="'+esc(keep?keep.s:(nmv.s||''))+'">')+'</label>'+
   '<label class="f">Messenger or Instagram <span class="opt">(optional)</span><input id="ccontact" maxlength="200" placeholder="@username or your profile link" oninput="contactCheck()" value="'+esc(keep?keep.c:ct)+'"></label><p class="conf" id="cconf"></p>'+
   '<div class="f" style="margin-top:10px;font-size:13px;font-weight:600;color:var(--mute)">How will you pay?<div><span class="seg" role="group" aria-label="Payment method" style="margin-top:4px"><button type="button" aria-pressed="'+(PM==='gcash')+'" onclick="setPM(\'gcash\')">GCash</button><button type="button" aria-pressed="'+(PM==='cash')+'" onclick="setPM(\'cash\')">Cash</button></span></div></div>'+
   (PM==='gcash'?'<label class="f">GCash reference number (if you already paid)<input id="cref" maxlength="30" inputmode="numeric" value="'+esc(keep?keep.r:'')+'"></label>':'<p class="msg" style="margin-top:8px">Pay the seller '+peso(t)+' in cash when you pick up your stickers.</p>')+
   '<label class="f">Note for the seller (optional)<textarea id="cnote" maxlength="500">'+esc(keep?keep.n:'')+'</textarea></label>'+
   '<p class="msg" id="omsg"></p><button class="btn primary" id="place" style="width:100%;margin-top:12px" onclick="place()">Place order · '+peso(t)+'</button>')+'</div></div>';
 $('cart').innerHTML=h;contactCheck()}
async function place(){const b=$('place'),m=$('omsg'),contact=$('ccontact').value.trim(),fn=$('cfirst').value.trim(),ln=$('clast').value.trim(),school=$('cschool').value.trim(),ref=$('cref')?$('cref').value.replace(/\s/g,''):'';
 if(!fn||!ln||BADNAME.test(fn+ln)){m.className='msg bad';m.textContent='Add your first and last name (letters only).';return}
 const ck=contact?contactKind(contact):{kind:'none'};if(!ck){m.className='msg bad';m.textContent='Type your Messenger or Instagram name or @username, or paste your profile link (facebook.com, m.me or instagram.com). You can also leave it empty.';return}
 const PL=D.settings.places||[];if(!school){m.className='msg bad';m.textContent=PL.length?'Choose your school from the list.':'Add your school.';return}
 if(PL.length&&!PL.includes(school)){m.className='msg bad';m.textContent='Choose your school from the list. The seller only does pickup at those places.';return}
 if(!PL.length&&/[<>]|https?:|www\./i.test(school)){m.className='msg bad';m.textContent='Type your school name, not a link.';return}
 if(ref&&!/^[0-9]+$/.test(ref)){m.className='msg bad';m.textContent='The GCash reference number should be digits only.';return}
 b.disabled=true;m.className='msg';m.textContent='Placing your order…';
 try{const id=await Auth.rpc('shop_order',{p_items:cartLines().map(x=>({id:x.it.id,qty:x.q})),p_contact:ck.url||contact,p_note:$('cnote').value.trim(),p_pay_ref:ref,p_first:fn,p_last:ln,p_method:PM,p_school:school},true);
  try{localStorage.setItem(CT,contact);localStorage.setItem(CN,JSON.stringify({f:fn,l:ln,s:school}))}catch(e){}CART={};saveCart();await load();ORDERS=null;await tab('orders');
  const f=$('orders').querySelector('.ord');if(f)f.insertAdjacentHTML('beforebegin','<p class="msg ok">Order #'+id+' placed! The seller will message you. You\'ll see updates here.</p>')}
 catch(e){b.disabled=false;m.className='msg bad';m.textContent=/slow/.test(e.message)?'Too many tries. Wait a minute.':e.message||'Couldn\'t place the order. Check your connection.';load().then(()=>{drawShop();drawBar()})}}
async function loadOrders(){const el=$('orders');
 if(!Auth.ses()){el.innerHTML='<p class="empty">Sign in with Google to see your orders.</p>';return}
 if(!ORDERS){el.innerHTML='<p class="empty">Loading…</p>';try{ORDERS=await Auth.rpc('shop_my_orders',{},true)||[]}catch(e){el.innerHTML='<p class="empty">Couldn\'t load your orders. Check your connection.</p>';return}}
 const LBL={placed:'Waiting for the seller',paid:'Paid',ready:'Ready for pickup',done:'Picked up',cancelled:'Cancelled'};
 el.innerHTML=ORDERS.length?ORDERS.map(o=>'<div class="ord"><div class="h"><b>Order #'+o.id+'</b><span class="st '+esc(o.status)+'">'+esc(LBL[o.status]||o.status)+'</span><span>'+(o.method==='cash'?'Cash':'GCash')+' · '+new Date(o.at).toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</span></div>'+
  '<ul>'+(o.items||[]).map(x=>'<li>'+x.qty+' × '+esc(x.name)+'</li>').join('')+'</ul><div class="h"><b>'+peso(o.total)+'</b>'+(o.seller_note?'<span>Seller: '+esc(o.seller_note)+'</span>':'')+'</div>'+payBox(o)+
  (o.status==='placed'?'<button class="btn" style="margin-top:10px;padding:7px 12px;font-size:13.5px" onclick="cancelOrder('+o.id+')">Cancel this order</button>':'')+'</div>').join(''):'<p class="empty">No orders yet.</p>'}
/* what the buyer still has to do: the amount and the seller's GCash details, and a place to type the reference number after paying */
const PHONE=/(?:\+?63|0)\s?9\d{2}[\s-]?\d{3}[\s-]?\d{4}/;
function payBox(o){if(o.status!=='placed')return '';const s=D.settings,amt=peso(o.total);
 if(o.method==='cash')return '<div class="paybox"><b>Pay '+amt+' in cash when you pick up.</b>'+(s.pickup_note?'<span>'+esc(s.pickup_note)+'</span>':'')+'</div>';
 const num=(PHONE.exec(s.pay_note||'')||[''])[0].replace(/[\s-]/g,'');
 return '<div class="paybox"><b>Pay '+amt+' by GCash</b>'+(s.pay_note?'<span>'+esc(s.pay_note)+'</span>':'<span>The seller will message you her GCash details.</span>')+
  (num?'<button class="btn mini" onclick="copyNum(this,\''+num+'\')">Copy number</button>':'')+
  (o.pay_ref?'<span class="ok">✓ Reference sent: '+esc(o.pay_ref)+'. The seller will mark it paid.</span>'
   :'<div class="refrow"><input id="ref'+o.id+'" inputmode="numeric" maxlength="30" placeholder="GCash reference number" aria-label="GCash reference number"><button class="btn mini" onclick="sendRef('+o.id+')">Send reference</button></div><p class="msg" id="rm'+o.id+'"></p>')+'</div>'}
function copyNum(b,n){const done=()=>{b.textContent='Copied!';setTimeout(()=>b.textContent='Copy number',1800)};
 try{navigator.clipboard.writeText(n).then(done,()=>{b.textContent=n})}catch(e){b.textContent=n}}
async function sendRef(id){const i=$('ref'+id),m=$('rm'+id),v=i.value.replace(/\s/g,'');
 if(!/^[0-9]{6,20}$/.test(v)){m.className='msg bad';m.textContent='The reference number is digits only (6 to 20 numbers).';return}
 m.className='msg';m.textContent='Sending…';
 try{await Auth.rpc('shop_order_ref',{p_id:id,p_ref:v},true);ORDERS=null;await loadOrders()}catch(e){m.className='msg bad';m.textContent=/slow/.test(e.message)?'Too many tries. Wait a minute.':e.message||'Couldn\'t send it. Check your connection.'}}
async function cancelOrder(id){if(!confirm('Cancel order #'+id+'?'))return;try{await Auth.rpc('shop_cancel',{p_id:id},true)}catch(e){alert(e.message)}ORDERS=null;await load();drawChips();drawShop();loadOrders()}
async function load(){D=await Auth.rpc('shop_catalog',{},!!Auth.ses());
 for(const id of Object.keys(CART)){const it=item(id);if(!it||it.left===0)delete CART[id];else if(CART[id]>maxFor(it))CART[id]=maxFor(it)}saveCart()}
(async function(){
 try{const cl=await (await fetch('courses.json')).json(),c=cl.find(x=>x.cloud&&x.cloud.url);if(c)Auth.cloud=c.cloud}catch(e){}
 if(!Auth.cloud){$('shop').innerHTML='<p class="empty">The shop needs the online features, which aren\'t set up here.</p>';return}
 if(Auth.ses())await Auth.token();
 try{await load()}catch(e){$('shop').innerHTML='<p class="empty">Couldn\'t load the shop. Check your connection and try again.</p>';return}
 if(D.soon&&!D.manager){$('state').hidden=false;$('state').textContent='Coming soon';document.querySelector('.tabs').hidden=true;
  $('shop').innerHTML='<p class="empty">Something new is coming soon. Stay tuned!</p>';return}
 if(D.soon)$('intro').insertAdjacentHTML('beforebegin','<p class="note" style="margin-top:10px"><b>Testing mode</b>Only the shop\'s managers can see this until it\'s launched on Manage the shop → Settings.</p>');
 const s=D.settings;$('ttl').textContent=s.title||'Shop';document.title=(s.title||'Shop')+' · APMed \'33';$('intro').textContent=s.intro||'';
 const dl=s.deadline?new Date(s.deadline):null;$('state').hidden=false;$('state').className='state'+(s.open?'':' off');
 $('state').textContent=s.open?(dl?'Open · orders close '+dl.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Open for orders'):(s.opened?'Orders closed':'Not open yet');
 const fc=D.catalogs.filter(c=>c.to_fund&&D.items.some(i=>i.catalog===c.id));if(fc.length){$('fundnote').hidden=false;$('fundnote').textContent='♡ '+fc.map(c=>c.name).join(' & ')+' help the APMed \'33 class fund'}
 $('mgr').hidden=!D.manager;$('tools').hidden=false;applyView();drawChips();drawShop();drawBar();if(location.hash==='#orders')tab('orders');else if(location.hash==='#cart')tab('cart');
})();
</script>

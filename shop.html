*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:900px;margin:0 auto;padding:22px 16px 120px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--mute);font-size:14px;font-weight:600;padding:6px 10px 6px 6px;border-radius:10px}

h1{font:600 clamp(26px,3.4vw,32px)/1.15 var(--serif);letter-spacing:-.3px;margin:16px 0 6px}
.intro{margin:0;color:var(--mute);font-size:14.5px;white-space:pre-line}
.state{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:700;padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.state.off{background:var(--raised);color:var(--mute)}
.tabs{margin:18px 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px #0000001a}
.mgr{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cat{margin:22px 0 10px}
.cat h2{font:600 20px/1.2 var(--serif);margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cat p{margin:3px 0 0;color:var(--mute);font-size:13.5px}
.fund{font:700 11px/1.6 var(--sans);letter-spacing:.04em;text-transform:uppercase;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.it{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.it.inc{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-line)}
.pic{position:relative;aspect-ratio:1;background:var(--raised);border:0;padding:0;display:block;width:100%}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:13px}
.sold{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);font-weight:700;color:var(--mute)}
.ib{padding:9px 11px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
.ib b{font-size:14px;line-height:1.3}
.ib .pr{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mute)}
.ib .pr span:first-child{font-weight:700;color:var(--text);font-size:14.5px}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:auto;background:var(--raised);border-radius:11px;padding:3px}
.qty button{width:36px;height:32px;border:0;border-radius:9px;background:var(--surface);font-size:19px;font-weight:600;line-height:1;box-shadow:0 1px 2px #0000001a}
.qty button:disabled{opacity:.35;cursor:default}
.qty output{font-weight:700;min-width:28px;text-align:center}
.add{margin-top:auto;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:11px;padding:7px;font-weight:700;font-size:14px}
.add:disabled{opacity:.45;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .tot{flex:1;font-size:14px;color:var(--mute)}.bar .tot b{display:block;font-size:18px;color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14.5px;border:1px solid var(--line2);background:var(--surface);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.modal{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:640px){.sheet{border-radius:20px}}
.sheet h3{font:600 21px/1.2 var(--serif);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:none;font-size:24px;color:var(--faint);line-height:1}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.line img{width:42px;height:42px;object-fit:contain;border-radius:8px;background:var(--raised)}
.line .n{flex:1;min-width:0}.line .n small{display:block;color:var(--mute)}
.line .qty{margin:0;padding:2px}.line .qty button{width:30px;height:28px;font-size:16px}
.sum{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding:12px 0}
label.f{display:block;margin-top:10px;font-size:13px;font-weight:600;color:var(--mute)}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--bg);font-size:15px}
label.f textarea{resize:vertical;min-height:60px}
.note{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--raised);font-size:13.5px;white-space:pre-line}
.note b{display:block;margin-bottom:2px}
.msg{min-height:1.2em;margin:10px 0 0;font-size:13.5px}.msg:empty{display:none}.msg.bad{color:var(--bad)}.msg.ok{color:var(--good)}
.ord{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.ord .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ord .h b{font-size:15px}.ord .h span{color:var(--mute);font-size:13px}
.ord ul{margin:8px 0;padding-left:18px;font-size:14px}
.st{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--raised);color:var(--mute)}
.st.paid,.st.ready{background:var(--accent-soft);color:var(--accent)}.st.done{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}.st.cancelled{color:var(--bad)}
.empty{color:var(--mute);text-align:center;padding:36px 10px}
.zoom{position:fixed;inset:0;z-index:50;background:#000d;display:grid;place-items:center;padding:20px}.zoom img{max-width:100%;max-height:86vh;object-fit:contain;border-radius:12px;background:#fff}
.zoom b{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff;font-size:15px}

/* ---- her shop's look: dotted sticker-paper background, a pastel color per catalog, die-cut stickers ---- */

body{background:var(--paper) radial-gradient(var(--dot) 1.3px,transparent 1.5px) 0 0/18px 18px}

const $=id=>document.getElementById(id);

 if(m&&v.length<=200){const ig=/instagram|instagr|ig\.me/i.test(m[2]);return {kind:ig?'instagram':'messenger',url:/^https?:/i.test(v)?v:'https://'+v,shown:v.replace(/^https?:\/\/(www\.)?/i,'').replace(/\/$/,''),ig}}

function contactCheck(){const el=$('cconf'),i=$('ccontact');if(!el||!i)return;const v=i.value.trim();el.className='conf';el.textContent='';if(!v)return;
 const k=contactKind(v);
 if(!k){if(v.length>=3&&(/[\/:]|\./.test(v))){el.className='conf bad';el.textContent='That isn\'t a Messenger or Instagram profile link. Use your @username, or a link from facebook.com, m.me or instagram.com.'}return}
 if(k.kind==='name'){el.className='conf ok';el.textContent='✓ The seller will look you up as “'+v+'”.';return}
 el.className='conf ok';el.innerHTML='✓ '+(k.ig?'Instagram':'Messenger')+' profile link: <a href="'+esc(k.url)+'" target="_blank" rel="noopener noreferrer">'+esc(k.shown)+'</a> (tap to check it\'s you)'}

function renderIntro(txt){const lines=String(txt||'').replace(/\r/g,'').split('\n').map(x=>x.trim());while(lines.length&&!lines[lines.length-1])lines.pop();if(!lines.length)return '';
 let sig='';const last=lines[lines.length-1];if(lines.length>1&&/^[-–—~]\s*\S/.test(last)&&last.length<=40){sig=last.replace(/^[-–—~]\s*/,'');lines.pop()}

async function guestOrders(){const out=[];
 for(const x of guestList()){try{out.push(await Auth.rpc('shop_guest_find',{p_id:x.id,p_code:x.code},false))}catch(e){if(/No order/.test(e.message||''))dropGuest(x.id)}}

const FINDBOX='<div class="gfind"><b>Ordered without signing in?</b><div class="refrow"><input id="fid" inputmode="numeric" maxlength="10" placeholder="Order #" aria-label="Order number" style="max-width:110px"><input id="fcode" maxlength="12" placeholder="Order code" aria-label="Order code" autocapitalize="characters"><button class="btn mini" onclick="findOrder()">Find</button></div><p class="msg" id="fmsg"></p></div>';
async function findOrder(){const id=parseInt($('fid').value,10),code=$('fcode').value.trim(),m=$('fmsg');
 if(!id||code.replace(/[^A-Za-z0-9]/g,'').length!==8){m.className='msg bad';m.textContent='Type the order number and the 8-character code.';return}
 m.className='msg';m.textContent='Looking…';

/* receipt card: a 1080x1350 picture of an order (always light colors) the buyer can send in Messenger; shares on phones, downloads elsewhere */
async function receipt(id){const o=RC[id];if(!o)return;
 try{
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  try{await document.fonts.load('600 40px Fredoka');await document.fonts.ready}catch(e){}
  const F=(w,s)=>w+' '+s+'px Fredoka,system-ui,sans-serif',INK='#1e3a5a',MUTE='#5d7490',PINK='#ff6f9f';
  x.fillStyle='#fff7fa';x.fillRect(0,0,W,H);
  let y=0;
  try{const im=new Image();im.src='img/shop-banner.webp';await im.decode();const h=Math.round(W*im.naturalHeight/im.naturalWidth);x.drawImage(im,0,0,W,h);y=h}catch(e){x.fillStyle='#aed4eb';x.fillRect(0,0,W,240);y=240}
  const fit=(s,w)=>{s=String(s==null?'':s);if(x.measureText(s).width<=w)return s;while(s.length>1&&x.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'};
  const pad=70,right=W-pad,text=(s,px,wt,col,al,yy,xx)=>{x.font=F(wt,px);x.fillStyle=col;x.textAlign=al||'left';x.fillText(fit(s,right-pad-(al==='right'?0:0)),xx==null?(al==='right'?right:pad):xx,yy)};
  y+=70;text(D.settings.title||'Sticker shop',34,500,MUTE,'left',y);
  y+=84;text('Order #'+o.id,78,600,INK,'left',y);
  const when=new Date(o.at).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  y+=50;text(when+(o.buyer?' · '+o.buyer:''),30,500,MUTE,'left',y);
  if(o.school){y+=42;text('Pickup: '+o.school,30,500,MUTE,'left',y)}
  y+=34;x.fillStyle='#ffd3e1';x.fillRect(pad,y,W-2*pad,4);
  // lines: shrink the type when there are many, and say how many are left out
  const items=o.items||[],deals=(o.deals||[]),dl=deals.length&&o.discount,footTop=H-130,reserve=(dl?50:0)+(o.coupon?50:0)+150,avail=footTop-reserve-y-30;
  let fs=Math.max(20,Math.min(36,Math.floor(avail/(Math.max(1,items.length)*1.45)))),maxN=Math.floor(avail/(fs*1.45)),show=items.slice(0,maxN),more=items.length-show.length;
  y+=18;
  show.forEach(it=>{y+=fs*1.45;x.font=F(500,fs);x.fillStyle=INK;x.textAlign='left';x.fillText(fit(it.qty+' × '+it.name,W-2*pad-200),pad,y);x.textAlign='right';x.fillStyle=MUTE;x.fillText(peso(it.qty*it.price),right,y)});
  if(more>0){y+=fs*1.45;x.font=F(500,fs);x.fillStyle=MUTE;x.textAlign='left';x.fillText('+ '+more+' more sticker line'+(more===1?'':'s'),pad,y)}
  if(dl){y+=54;text('🏷 '+deals.map(d=>d.name+(d.n>1?' ×'+d.n:'')).join(', ')+' −'+peso(o.discount),30,500,PINK,'left',y)}
  if(o.coupon){y+=50;text(fit('🎟 '+o.coupon+' −'+peso(o.sponsor||0),W-2*pad),30,500,PINK,'left',y)}
  y+=30;x.fillStyle='#ffd3e1';x.fillRect(pad,y,W-2*pad,4);
  y+=84;text('Total',46,500,INK,'left',y);text(peso(o.total),64,600,INK,'right',y);
  y+=56;text((o.method==='cash'?'Cash':'GCash')+(o.pay_ref?' · ref '+o.pay_ref:''),30,500,MUTE,'left',y);
  const lab=OLBL[o.status]||o.status;x.font=F(600,30);const bw=x.measureText(lab).width+44;x.fillStyle=PINK;x.beginPath();x.roundRect?x.roundRect(right-bw,y-34,bw,50,25):x.rect(right-bw,y-34,bw,50);x.fill();x.fillStyle='#2b1220';x.textAlign='center';x.fillText(lab,right-bw/2,y+2);
  x.textAlign='center';x.font=F(500,28);x.fillStyle=MUTE;x.fillText('apmed33.online/shop.html',W/2,H-60);
  const blob=await new Promise(r=>c.toBlob(r,'image/png')),name='sticker-order-'+o.id+'.png',file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Order #'+o.id})}catch(e){}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)
 }catch(e){await ask("Couldn't make the receipt",'Try again in a moment.',{ok:'OK',cancel:null,danger:false})}}
async function loadOrders(){const el=$('orders'),signed=!!Auth.ses();
 el.innerHTML='<p class="empty">Loading…</p>';
 let mine=[];
 if(signed){if(!ORDERS){try{ORDERS=await Auth.rpc('shop_my_orders',{},true)||[]}catch(e){el.innerHTML='<p class="empty">Couldn\'t load your orders. Check your connection.</p>';return}}mine=ORDERS}
 const gs=guestList().length?await guestOrders():[];
 el.innerHTML=(signed?(mine.length?mine.map(orderHTML).join(''):'<p class="empty">No orders yet.</p>'):'<div class="cpanel" style="margin-top:12px">'+signPanel('orders')+'</div>')+
  (gs.length?'<h3 class="gtitle">Ordered on this device without signing in</h3>'+gs.map(orderHTML).join(''):'')+(signed&&!gs.length?'':FINDBOX)}
/* what the buyer still has to do: the amount and the seller's GCash details, and a place to type the reference number after paying */
const PHONE=/(?:\+?63|0)\s?9\d{2}[\s-]?\d{3}[\s-]?\d{4}/;
function payBox(o){if(o.status!=='placed'&&o.status!=='held')return '';const s=D.settings,amt=peso(o.total);
 if(!o.total)return '<div class="paybox"><b>Nothing to pay 🎟</b><span>Your coupon covers this order. Just pick it up.</span></div>';
 if(o.method==='cash')return '<div class="paybox"><b>Pay '+amt+' in cash when you pick up.</b>'+(s.pickup_note?'<span>'+esc(s.pickup_note)+'</span>':'')+'</div>';
 const num=(PHONE.exec(s.pay_note||'')||[''])[0].replace(/[\s-]/g,'');
 return '<div class="paybox"><b>Pay '+amt+' by GCash</b>'+(s.pay_note?'<span>'+esc(s.pay_note)+'</span>':s.pay_qr?'':'<span>The seller will message you her GCash details.</span>')+(s.pay_qr?'<div class="qrwrap">'+qrHTML()+'</div>':'')+
  (num?'<button class="btn mini" onclick="copyNum(this,\''+num+'\')">Copy number</button>':'')+
  (o.pay_ref?'<span class="ok">✓ Reference sent: '+esc(o.pay_ref)+'. The seller will mark it paid.</span>'
   :'<div class="refrow"><input id="ref'+o.id+'" inputmode="numeric" maxlength="30" placeholder="GCash reference number" aria-label="GCash reference number"><button class="btn mini" onclick="sendRef('+o.id+','+!!o.guest+')">Send reference</button></div><p class="msg" id="rm'+o.id+'"></p>')+'</div>'}
/* right after ordering: a big "Pay now" card with the amount, the seller's GCash note and number, copy button and QR (cash orders skip it) */
function payNow(id){const o=RC[id];if(!o||o.method==='cash'||!o.total)return;const s=D.settings,num=(PHONE.exec(s.pay_note||'')||[''])[0].replace(/[\s-]/g,''),old=$('paynow');if(old)old.remove();
 const m=document.createElement('div');m.className='modal dlgwrap';m.id='paynow';
 m.innerHTML='<div class="sheet paysheet" role="dialog" aria-modal="true" aria-label="Pay for your order"><h3>🎉 Order #'+o.id+' placed</h3>'+
  '<div class="paybig"><span>Send</span><b>'+peso(o.total)+'</b><span>by GCash</span></div>'+
  (s.pay_note?'<div class="paynote">'+esc(s.pay_note)+'</div>':'<p class="mute">The seller will message you her GCash details.</p>')+
  (num?'<button class="btn mini" onclick="copyNum(this,\''+num+'\')">Copy number</button>':'')+
  (s.pay_qr?'<div class="qrwrap" style="align-items:center">'+qrHTML()+'</div>':'')+
  (o.status==='held'?'<p class="mute">The seller checks your profile link first. You can pay now or after she accepts.</p>':'')+
  '<p class="mute">After paying, find this order under <b>My orders</b> and type the GCash reference number so the seller can mark it paid.</p>'+
  '<button class="btn primary" onclick="$(\'paynow\').remove()">Got it</button></div>';
 m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);
 if(!payNow.k){payNow.k=1;document.addEventListener('keydown',e=>{if(e.key==='Escape'){const p=$('paynow');if(p)p.remove()}})}}
function copyNum(b,n){const done=()=>{b.textContent='Copied!';setTimeout(()=>b.textContent='Copy number',1800)};
 try{navigator.clipboard.writeText(n).then(done,()=>{b.textContent=n})}catch(e){b.textContent=n}}
async function sendRef(id,g){const i=$('ref'+id),m=$('rm'+id),v=i.value.replace(/\s/g,'');
 if(!/^[0-9]{6,20}$/.test(v)){m.className='msg bad';m.textContent='The reference number is digits only (6 to 20 numbers).';return}

 try{if(g)await Auth.rpc('shop_guest_ref',{p_id:id,p_code:codeOf(id),p_ref:v},false);else await Auth.rpc('shop_order_ref',{p_id:id,p_ref:v},true);ORDERS=null;await loadOrders()}catch(e){m.className='msg bad';m.textContent=/slow/.test(e.message)?'Too many tries. Wait a minute.':e.message||'Couldn\'t send it. Check your connection.'}}

 (D.bundles||[]).filter(b=>b.catalog==null).forEach(b=>$('fundnote').insertAdjacentHTML('afterend','<span class="dealchip">🏷 '+esc(b.name)+'</span>'));

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class sticker shop · APMed '33</title>
<meta name="description" content="Stickers made by a classmate. Part of the proceeds goes to the APMed '33 class fund.">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('reviewer_theme')||localStorage.getItem('psych_theme');if(t)document.documentElement.dataset.theme=t;const p=localStorage.getItem('reviewer_palette');if(p)document.documentElement.dataset.palette=p}catch(e){}</script>
<link rel="stylesheet" href="ui.css">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:900px;margin:0 auto;padding:22px 16px 120px}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--mute);font-size:14px;font-weight:600;padding:6px 10px 6px 6px;border-radius:10px}
.back:hover{color:var(--text);background:var(--raised)}
h1{font:600 clamp(26px,3.4vw,32px)/1.15 var(--serif);letter-spacing:-.3px;margin:16px 0 6px}
.intro{margin:0;color:var(--mute);font-size:14.5px;white-space:pre-line}
.state{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:700;padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.state.off{background:var(--raised);color:var(--mute)}
.tabs{margin:18px 0 6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px #0000001a}
.mgr{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--accent);text-decoration:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--mute);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cat{margin:22px 0 10px}
.cat h2{font:600 20px/1.2 var(--serif);margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cat p{margin:3px 0 0;color:var(--mute);font-size:13.5px}
.fund{font:700 11px/1.6 var(--sans);letter-spacing:.04em;text-transform:uppercase;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.it{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.it.inc{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-line)}
.pic{position:relative;aspect-ratio:1;background:var(--raised);border:0;padding:0;display:block;width:100%}
.pic img{width:100%;height:100%;object-fit:contain;display:block}
.pic .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:13px}
.sold{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);font-weight:700;color:var(--mute)}
.ib{padding:9px 11px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
.ib b{font-size:14px;line-height:1.3}
.ib .pr{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--mute)}
.ib .pr span:first-child{font-weight:700;color:var(--text);font-size:14.5px}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:auto;background:var(--raised);border-radius:11px;padding:3px}
.qty button{width:36px;height:32px;border:0;border-radius:9px;background:var(--surface);font-size:19px;font-weight:600;line-height:1;box-shadow:0 1px 2px #0000001a}
.qty button:disabled{opacity:.35;cursor:default}
.qty output{font-weight:700;min-width:28px;text-align:center}
.add{margin-top:auto;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:11px;padding:7px;font-weight:700;font-size:14px}
.add:disabled{opacity:.45;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.bar .in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .tot{flex:1;font-size:14px;color:var(--mute)}.bar .tot b{display:block;font-size:18px;color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14.5px;border:1px solid var(--line2);background:var(--surface);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.modal{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:640px){.sheet{border-radius:20px}}
.sheet h3{font:600 21px/1.2 var(--serif);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:none;font-size:24px;color:var(--faint);line-height:1}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.line img{width:42px;height:42px;object-fit:contain;border-radius:8px;background:var(--raised)}
.line .n{flex:1;min-width:0}.line .n small{display:block;color:var(--mute)}
.line .qty{margin:0;padding:2px}.line .qty button{width:30px;height:28px;font-size:16px}
.sum{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding:12px 0}
label.f{display:block;margin-top:10px;font-size:13px;font-weight:600;color:var(--mute)}
label.f input,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:11px;border:1px solid var(--line2);background:var(--bg);font-size:15px}
label.f textarea{resize:vertical;min-height:60px}
.note{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--raised);font-size:13.5px;white-space:pre-line}
.note b{display:block;margin-bottom:2px}
.msg{min-height:1.2em;margin:10px 0 0;font-size:13.5px}.msg:empty{display:none}.msg.bad{color:var(--bad)}.msg.ok{color:var(--good)}
.ord{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.ord .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ord .h b{font-size:15px}.ord .h span{color:var(--mute);font-size:13px}
.ord ul{margin:8px 0;padding-left:18px;font-size:14px}
.st{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--raised);color:var(--mute)}
.st.paid,.st.ready{background:var(--accent-soft);color:var(--accent)}.st.done{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}.st.cancelled{color:var(--bad)}
.empty{color:var(--mute);text-align:center;padding:36px 10px}
.zoom{position:fixed;inset:0;z-index:50;background:#000d;display:grid;place-items:center;padding:20px}.zoom img{max-width:100%;max-height:86vh;object-fit:contain;border-radius:12px;background:#fff}
.zoom b{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#fff;font-size:15px}
</style></head><body>
<main>
 <a class="back" href="./"><svg class="i" width="16" height="16" aria-hidden="true"><use href="icons.svg#i-chevron-left"/></svg>All courses</a>
 <h1 id="ttl">Class sticker shop</h1>
 <p class="intro" id="intro"></p>
 <span class="state off" id="state" hidden></span>
 <div class="tabs"><span class="seg" role="group" aria-label="Show"><button id="t-shop" aria-pressed="true" onclick="tab('shop')">Stickers</button><button id="t-orders" aria-pressed="false" onclick="tab('orders')">My orders</button></span><a class="mgr" id="mgr" href="shop-admin.html" hidden>Manage the shop</a></div>
 <div id="shop"><p class="empty">Loading…</p></div>
 <div id="orders" hidden></div>
</main>
<div class="bar" id="bar" hidden><div class="in"><div class="tot" id="tot"></div><button class="btn primary" onclick="review()">Review order</button></div></div>
<div class="modal" id="modal" hidden onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script src="auth.js"></script>
<script>
/* The class sticker shop (supabase_shop.sql). Anyone can browse; ordering needs Google sign-in. Prices, stock and the
   class-fund share are checked by the server; the cart stays on this device (localStorage 'reviewer_shop_cart').
   Paying happens outside the site (the seller's GCash or cash): the seller marks orders paid on shop-admin.html. */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const peso=c=>'₱'+(c/100).toLocaleString('en-US',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2});
const CK='reviewer_shop_cart',CT='reviewer_shop_contact';
let D=null,CART={},FILTER='all',ORDERS=null;
try{CART=JSON.parse(localStorage.getItem(CK))||{}}catch(e){CART={}}
function saveCart(){try{localStorage.setItem(CK,JSON.stringify(CART))}catch(e){}}
const img=p=>p?Auth.base()+'/storage/v1/object/public/shop/'+p.split('/').map(encodeURIComponent).join('/'):'';
const item=id=>D.items.find(i=>i.id===+id);
function tab(t){$('t-shop').setAttribute('aria-pressed',t==='shop');$('t-orders').setAttribute('aria-pressed',t==='orders');$('shop').hidden=t!=='shop';$('orders').hidden=t!=='orders';
 history.replaceState(null,'',t==='orders'?'#orders':'#');drawBar();if(t==='orders')return loadOrders()}
function cartLines(){return Object.entries(CART).map(([id,q])=>({it:item(id),q})).filter(x=>x.it&&x.q>0)}
function drawBar(){const L=cartLines(),n=L.reduce((a,x)=>a+x.q,0),t=L.reduce((a,x)=>a+x.q*x.it.price,0);
 $('bar').hidden=!n||$('shop').hidden;$('tot').innerHTML=n+' sticker'+(n===1?'':'s')+'<b>'+peso(t)+'</b>'}
function maxFor(it){const m=D.settings.max_qty||50;return it.left==null?m:Math.min(m,it.left)}
function setQty(id,q){const it=item(id);if(!it)return;q=Math.max(0,Math.min(maxFor(it),q));if(q)CART[id]=q;else delete CART[id];saveCart();
 const c=document.querySelector('[data-id="'+id+'"]');if(c)c.outerHTML=card(it);drawBar();if(!$('modal').hidden&&$('rlines'))drawReview()}
function card(it){const q=CART[it.id]||0,open=D.settings.open,out=it.left===0;
 return '<div class="it'+(q?' inc':'')+'" data-id="'+it.id+'"><button class="pic" onclick="zoom('+it.id+')" aria-label="See '+esc(it.name)+' bigger">'+(it.image?'<img src="'+esc(img(it.image))+'" alt="" loading="lazy">':'<span class="none">No photo</span>')+(out?'<span class="sold">Sold out</span>':'')+'</button>'+
  '<div class="ib"><b>'+esc(it.name)+'</b><div class="pr"><span>'+peso(it.price)+'</span><span>'+(it.left==null?'':out?'':it.left+' left')+'</span></div>'+
  (!open||out?'':q?'<div class="qty"><button onclick="setQty('+it.id+','+(q-1)+')" aria-label="One less">−</button><output>'+q+'</output><button onclick="setQty('+it.id+','+(q+1)+')"'+(q>=maxFor(it)?' disabled':'')+' aria-label="One more">+</button></div>'
   :'<button class="add" onclick="setQty('+it.id+',1)">Add</button>')+'</div></div>'}
function drawShop(){const s=D.settings,cats=D.catalogs.filter(c=>D.items.some(i=>i.catalog===c.id));
 if(!cats.length){$('shop').innerHTML='<p class="empty">'+(s.opened?'Stickers are coming soon.':'The shop isn\'t open yet. Check back soon!')+'</p>';return}
 $('shop').innerHTML=(cats.length>1?'<div class="chips" role="group" aria-label="Catalogs"><button class="chip" aria-pressed="'+(FILTER==='all')+'" onclick="FILTER=\'all\';drawShop()">All</button>'+
   cats.map(c=>'<button class="chip" aria-pressed="'+(FILTER===c.id)+'" onclick="FILTER='+c.id+';drawShop()">'+esc(c.name)+'</button>').join('')+'</div>':'')+
  cats.filter(c=>FILTER==='all'||FILTER===c.id).map(c=>'<section class="cat"><h2>'+esc(c.name)+(c.to_fund?'<span class="fund">Class fund</span>':'')+'</h2>'+(c.blurb?'<p>'+esc(c.blurb)+'</p>':'')+'</section>'+
   '<div class="grid">'+D.items.filter(i=>i.catalog===c.id).map(card).join('')+'</div>').join('')}
function zoom(id){const it=item(id);if(!it||!it.image)return;const z=document.createElement('div');z.className='zoom';z.innerHTML='<img src="'+esc(img(it.image))+'" alt=""><b>'+esc(it.name)+' · '+peso(it.price)+'</b>';z.onclick=()=>z.remove();document.body.appendChild(z)}
function closeModal(){$('modal').hidden=true}
function review(){$('modal').hidden=false;drawReview()}
function drawReview(){const L=cartLines(),t=L.reduce((a,x)=>a+x.q*x.it.price,0),s=D.settings,signed=!!Auth.ses();let ct='';try{ct=localStorage.getItem(CT)||''}catch(e){}
 const keep=$('ccontact')?{c:$('ccontact').value,n:$('cnote').value,r:$('cref').value}:null;
 $('sheet').innerHTML='<h3>Your order<button class="x" onclick="closeModal()" aria-label="Close">×</button></h3>'+
  (L.length?'<div id="rlines">'+L.map(({it,q})=>'<div class="line">'+(it.image?'<img src="'+esc(img(it.image))+'" alt="">':'')+'<div class="n">'+esc(it.name)+'<small>'+peso(it.price)+' each</small></div>'+
   '<div class="qty"><button onclick="setQty('+it.id+','+(q-1)+')" aria-label="One less">−</button><output>'+q+'</output><button onclick="setQty('+it.id+','+(q+1)+')"'+(q>=maxFor(it)?' disabled':'')+' aria-label="One more">+</button></div></div>').join('')+'</div>'+
   '<div class="sum"><span>Total</span><span>'+peso(t)+'</span></div>'
   :'<p class="empty">Your cart is empty.</p>')+
  (s.pay_note?'<div class="note"><b>How to pay</b>'+esc(s.pay_note)+'</div>':'')+(s.pickup_note?'<div class="note"><b>Pickup</b>'+esc(s.pickup_note)+'</div>':'')+
  (!signed?'<p class="msg">Sign in with Google to order, so the seller knows who it\'s from.</p><a class="btn primary" style="width:100%;margin-top:10px" href="./?signin=1">Sign in with Google</a>':
   L.length?'<label class="f">Messenger or Instagram (so the seller can reach you)<input id="ccontact" maxlength="200" placeholder="facebook.com/… or @username" value="'+esc(keep?keep.c:ct)+'"></label>'+
   '<label class="f">GCash reference number (if you already paid)<input id="cref" maxlength="80" inputmode="numeric" value="'+esc(keep?keep.r:'')+'"></label>'+
   '<label class="f">Note for the seller (optional)<textarea id="cnote" maxlength="500">'+esc(keep?keep.n:'')+'</textarea></label>'+
   '<p class="msg" id="omsg"></p><button class="btn primary" id="place" style="width:100%;margin-top:12px" onclick="place()">Place order · '+peso(t)+'</button>':'')}
async function place(){const b=$('place'),m=$('omsg'),contact=$('ccontact').value.trim();
 if(contact.length<3){m.className='msg bad';m.textContent='Add your Messenger or Instagram so the seller can reach you.';return}
 b.disabled=true;m.className='msg';m.textContent='Placing your order…';
 try{const id=await Auth.rpc('shop_order',{p_items:cartLines().map(x=>({id:x.it.id,qty:x.q})),p_contact:contact,p_note:$('cnote').value.trim(),p_pay_ref:$('cref').value.trim()},true);
  try{localStorage.setItem(CT,contact)}catch(e){}CART={};saveCart();closeModal();await load();ORDERS=null;await tab('orders');
  const f=$('orders').querySelector('.ord');if(f)f.insertAdjacentHTML('beforebegin','<p class="msg ok">Order #'+id+' placed! The seller will message you. You\'ll see updates here.</p>')}
 catch(e){b.disabled=false;m.className='msg bad';m.textContent=/slow/.test(e.message)?'Too many tries. Wait a minute.':e.message||'Couldn\'t place the order. Check your connection.';load().then(()=>{drawShop();drawBar()})}}
async function loadOrders(){const el=$('orders');
 if(!Auth.ses()){el.innerHTML='<p class="empty">Sign in with Google to see your orders.</p>';return}
 if(!ORDERS){el.innerHTML='<p class="empty">Loading…</p>';try{ORDERS=await Auth.rpc('shop_my_orders',{},true)||[]}catch(e){el.innerHTML='<p class="empty">Couldn\'t load your orders. Check your connection.</p>';return}}
 const LBL={placed:'Waiting for the seller',paid:'Paid',ready:'Ready for pickup',done:'Picked up',cancelled:'Cancelled'};
 el.innerHTML=ORDERS.length?ORDERS.map(o=>'<div class="ord"><div class="h"><b>Order #'+o.id+'</b><span class="st '+esc(o.status)+'">'+esc(LBL[o.status]||o.status)+'</span><span>'+new Date(o.at).toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</span></div>'+
  '<ul>'+(o.items||[]).map(x=>'<li>'+x.qty+' × '+esc(x.name)+'</li>').join('')+'</ul><div class="h"><b>'+peso(o.total)+'</b>'+(o.seller_note?'<span>Seller: '+esc(o.seller_note)+'</span>':'')+'</div>'+
  (o.status==='placed'?'<button class="btn" style="margin-top:10px;padding:7px 12px;font-size:13.5px" onclick="cancelOrder('+o.id+')">Cancel this order</button>':'')+'</div>').join(''):'<p class="empty">No orders yet.</p>'}
async function cancelOrder(id){if(!confirm('Cancel order #'+id+'?'))return;try{await Auth.rpc('shop_cancel',{p_id:id},true)}catch(e){alert(e.message)}ORDERS=null;await load();drawShop();loadOrders()}
async function load(){D=await Auth.rpc('shop_catalog',{},!!Auth.ses());
 for(const id of Object.keys(CART)){const it=item(id);if(!it||it.left===0)delete CART[id];else if(CART[id]>maxFor(it))CART[id]=maxFor(it)}saveCart()}
(async function(){
 try{const cl=await (await fetch('courses.json')).json(),c=cl.find(x=>x.cloud&&x.cloud.url);if(c)Auth.cloud=c.cloud}catch(e){}
 if(!Auth.cloud){$('shop').innerHTML='<p class="empty">The shop needs the online features, which aren\'t set up here.</p>';return}
 if(Auth.ses())await Auth.token();
 try{await load()}catch(e){$('shop').innerHTML='<p class="empty">Couldn\'t load the shop. Check your connection and try again.</p>';return}
 if(D.soon&&!D.manager){$('state').hidden=false;$('state').textContent='Coming soon';document.querySelector('.tabs').hidden=true;
  $('shop').innerHTML='<p class="empty">The class sticker shop opens soon. Watch for the announcement!</p>';return}
 if(D.soon)$('intro').insertAdjacentHTML('beforebegin','<p class="note" style="margin-top:10px"><b>Testing mode</b>Only the shop\'s managers can see this until it\'s launched on Manage the shop → Settings.</p>');
 const s=D.settings;$('ttl').textContent=s.title||'Class sticker shop';document.title=(s.title||'Class sticker shop')+' · APMed \'33';$('intro').textContent=s.intro||'';
 const dl=s.deadline?new Date(s.deadline):null;$('state').hidden=false;$('state').className='state'+(s.open?'':' off');
 $('state').textContent=s.open?(dl?'Open · orders close '+dl.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Open for orders'):(s.opened?'Orders closed':'Not open yet');
 $('mgr').hidden=!D.manager;drawShop();drawBar();if(location.hash==='#orders')tab('orders');
})();
</script>
<script src="update.js" defer></script>
</body></html>
